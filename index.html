<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>URI Demo</title><style>
*{box-sizing:border-box}body{margin:0;background:#eee;color:#171717;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans SC",sans-serif}.app{max-width:560px;margin:auto;min-height:100vh;background:#fff}.top{padding:16px 18px;border-bottom:1px solid #ddd;position:sticky;top:0;background:#fff;z-index:3}.brand{font-size:27px;font-weight:900;letter-spacing:.15em}.money{float:right;font-weight:800}.status{font-size:11px;color:#777;margin-top:5px}.main{padding:16px 16px 95px}h2{margin:8px 0 14px}.card{border:1px solid #ddd;border-radius:13px;padding:15px;margin:10px 0}.dark{background:#171717;color:#fff}.tag{display:inline-block;font-size:10px;padding:4px 7px;background:#eee;border-radius:5px;margin-bottom:7px}.dark .tag{background:#333}.name{font-size:17px;font-weight:800}.price{font-size:20px;font-weight:900;margin-top:7px}.meta{font-size:12px;color:#777;margin-top:5px;line-height:1.55}.dark .meta{color:#bbb}.btn{border:0;border-radius:9px;background:#171717;color:#fff;padding:12px 14px;font-weight:800;cursor:pointer}.ghost{background:#eee;color:#222}.wide{width:100%;margin-top:12px}.nav{position:fixed;bottom:0;width:min(560px,100%);display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid #ddd}.nav button{border:0;background:#fff;padding:14px 3px;font-size:11px}.nav .on{font-weight:900}.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:20px;z-index:9}.box{width:min(460px,100%);max-height:85vh;overflow:auto;background:#fff;border-radius:15px;padding:22px}.row{display:flex;gap:8px;margin-top:15px}.row>*{flex:1}.forecast{font-size:15px;line-height:1.8}.result{font-size:28px;font-weight:900}.tiny{font-size:11px;color:#777}.locked{opacity:.4}.choice{display:flex;gap:8px;flex-wrap:wrap}.choice button{flex:1;min-width:120px}
</style></head><body><div class="app"><header class="top"><span class="brand">URI</span><span class="money" id="money"></span><div class="status" id="status"></div></header><main class="main" id="main"></main><nav class="nav"><button onclick="go('tomorrow')">明日</button><button onclick="go('market')">市场</button><button onclick="go('bag')">包裹</button><button onclick="go('me')">我的</button></nav></div><script>
let page="tomorrow",day=1,money=1000,xp=0,lastRank="-",bought=false,sold=false,txlog=[],changed=0;
let bag=[
{name:"数学の宿題",type:"物品",price:500,desc:"明日提出。まだ終わっていない。"},
{name:"Bと一緒に勉強した記憶",type:"記憶",price:1800,desc:"昨晚和B一起复习数学的记忆。"},
{name:"母からもらった傘",type:"物品",price:700,desc:"妈妈去年买给你的伞。"},
{name:"Cへの小さな嫉妬",type:"感情",price:1200,desc:"你自己也不太愿意承认的感情。"}
];
const days=[
{title:"数学小测",events:["第一节进行数学小测。","B会忘记带作业。","放学后会下雨。","A会收到一封没有署名的信。"],market:[
{name:"明天数学考试的答案",price:2200,effect:"exam",desc:"购买后，你会知道明天小测的答案。"},
{name:"B忘记的作业",price:900,effect:"bhome",desc:"它原本属于B。"},
{name:"明天下午的晴天",price:3000,effect:"sun",desc:"买下后，放学时不会下雨。"},
{name:"那封信的内容",price:1600,effect:"letter",desc:"提前知道明天才会看到的内容。"}]},
{title:"体育课",events:["体育课进行接力测验。","你会在最后一棒摔倒。","B会获得第一名。","C会和你发生争执。"],market:[
{name:"不会受伤的一天",price:2600,effect:"safe",desc:"直到明晚之前，你不会因为意外受伤。"},
{name:"一次顺风",price:1300,effect:"wind",desc:"在最需要的时候吹来。"},
{name:"C没有说出口的话",price:2100,effect:"cword",desc:"这句话原本不属于你。"}]},
{title:"放学以后",events:["A、B、C会一起回家。","途中会遇到以前的同学。","有人会提起一段只有两个人记得的过去。","三个人之间会第一次出现明显的裂痕。"],market:[
{name:"一次道歉的机会",price:2400,effect:"sorry",desc:"只能使用一次。"},
{name:"B对你的信任",price:3600,effect:"trust",desc:"价格正在上涨。"},
{name:"忘掉一件尴尬事情的权利",price:1900,effect:"forget",desc:"由你选择忘掉什么。"}]},
{title:"异常预报",events:["明天，A、B、C将不再是朋友。","发生概率：100%"],market:[
{name:"和好的机会",price:4200,effect:"peace",desc:"不保证结果，只提供一次机会。"},
{name:"一段没有争吵的下午",price:3300,effect:"calm",desc:"下午不会发生争执。"},
{name:"某个人真正的心意",price:5000,effect:"heart",desc:"购买后无法退货。"}]}
];
function lv(){return xp>=420?4:xp>=240?3:xp>=100?2:1}function y(n){return"¥"+n.toLocaleString()}
function go(p){page=p;render()}
function render(){
 moneyEl.textContent=y(money);
 statusEl.textContent="DAY "+day+" · URI Lv."+lv()+" · EXP "+xp+" · 明日評価 "+lastRank+" · 今日 "+(bought?"已买":"可买")+" / "+(sold?"已卖":"可卖");
 document.querySelectorAll(".nav button").forEach((b,i)=>b.classList.toggle("on",["tomorrow","market","bag","me"][i]===page));
 if(page==="tomorrow") renderTomorrow();
 else if(page==="market") market();
 else if(page==="bag") bagPage();
 else me();
}
const mainEl=document.querySelector("#main"),moneyEl=document.querySelector("#money"),statusEl=document.querySelector("#status");
function renderTomorrow(){let d=days[Math.min(day-1,days.length-1)];mainEl.innerHTML='<div class="card dark"><span class="tag">明日予報</span><div class="name">DAY '+day+'｜'+d.title+'</div><div class="forecast">'+d.events.map(x=>"・"+x).join("<br>")+'</div></div><div class="card"><div class="name">今晚你能做什么？</div><div class="meta">每人每天最多买1样、卖1样。交易会改变第二天真实发生的事情。</div><div class="choice"><button class="btn wide" onclick="go(\'bag\')">先看我的包裹</button><button class="btn ghost wide" onclick="go(\'market\')">查看今晚市场</button></div></div>'+(bought&&sold?'<button class="btn wide" onclick="playDay()">结束交易，进入明天</button>':'<div class="tiny">完成买卖后才能进入明天。</div>')}
function market(){let d=days[Math.min(day-1,days.length-1)];mainEl.innerHTML='<h2>今晚市场</h2><div class="tiny">根据明日予報生成。今天只能购买1件。</div>'+d.market.map((x,i)=>'<div class="card '+(bought?"locked":"")+'"><span class="tag">'+x.effect.toUpperCase()+'</span><div class="name">'+x.name+'</div><div class="price">'+y(x.price)+'</div><div class="meta">'+x.desc+'</div><button class="btn wide" '+(bought?"disabled":"")+' onclick="buy('+i+')">购买</button></div>').join("")}
function bagPage(){mainEl.innerHTML='<h2>我的包裹</h2><div class="tiny">“拥有”不只包括物品。今天只能出售1件。</div>'+bag.map((x,i)=>'<div class="card '+(sold?"locked":"")+'"><span class="tag">'+x.type+'</span><div class="name">'+x.name+'</div><div class="price">'+y(x.price)+'</div><div class="meta">'+x.desc+'</div><button class="btn wide" '+(sold?"disabled":"")+' onclick="sell('+i+')">出售</button></div>').join("")}
function me(){mainEl.innerHTML='<h2>我的 URI</h2><div class="card"><div class="name">三层奖励</div><div class="meta">💴 钱：改变明天后的即时奖励，可继续购买。<br>📦 经历资产：成功改变的经历会成为你的新所有物。<br>🔓 URI EXP：提升等级，逐渐开放“能力 / 记忆 / 关系”等交易。</div></div><div class="card"><div class="name">当前状态</div><div class="price">Lv.'+lv()+'</div><div class="meta">EXP '+xp+' · 上次评价 '+lastRank+' · 余额 '+y(money)+'</div></div>'+txlog.map(x=>'<div class="card"><div class="meta">'+x.type+'</div><div class="name">'+x.name+'</div><div class="price">'+x.money+'</div></div>').join("")}
function buy(i){let x=days[Math.min(day-1,days.length-1)].market[i];if(bought)return;if(money<x.price)return pop("余额不足","你需要先卖掉一样属于自己的东西。");money-=x.price;bought=true;changed++;bag.push({name:x.name,type:"購入品",price:Math.floor(x.price*.7),desc:"从URI市场买到。明天它会影响现实。"});txlog.unshift({type:"BUY",name:x.name,money:"-"+y(x.price)});pop("购买成功",x.name+" 已进入你的包裹。")}
function sell(i){if(sold)return;let x=bag[i];bag.splice(i,1);money+=x.price;sold=true;changed++;txlog.unshift({type:"SELL",name:x.name,money:"+"+y(x.price)});let consequence=x.name.includes("Bと")?"<br><br><b>提示：B仍然拥有这段记忆。</b>":"";pop("出售成功","「"+x.name+"」已经不再属于你。"+consequence)}
function playDay(){let d=days[Math.min(day-1,days.length-1)],score=Math.min(96,38+changed*22+day*4);let grade=score>=90?"S":score>=70?"A":score>=50?"B":"C";let cash=grade==="S"?3000:grade==="A"?1800:grade==="B"?900:200;let gain=grade==="S"?160:grade==="A"?110:grade==="B"?65:25;let memories=["一次改变考试结果的经历","一次没有按照预报发生的下午","三个人仍然一起回家的记忆","试图改变友情结局的一天"];let asset=memories[Math.min(day-1,3)];money+=cash;xp+=gain;lastRank=grade;bag.push({name:asset,type:"经历",price:cash,desc:"今天真实发生过，因此现在属于你。"});txlog.unshift({type:"DAY "+day+" REWARD",name:asset,money:"+"+y(cash)});let reality=day===1?"你提前知道了部分答案。考试结束后，B问你：‘昨晚不是说好一起复习吗？’——你却完全不记得。放学时，天空也因为你们的交易发生了细小变化。":day===2?"接力开始。你原本应该摔倒，但昨晚买下的东西改变了那个瞬间。与此同时，另一笔交易让C今天的态度和昨天有一点不同。":day===3?"三个人仍然一起回家，但谈到过去时，你们发现同一件事的记忆已经不完全一致。没人能确定究竟从哪一天开始变的。":"你们已经尽可能改变了明天。但放学后，URI弹出通知：<b>预测正在实现。</b><br><br>到底是预报准确，还是你们为了改变它而做的交易让它发生了？";pop("DAY "+day+" RESULT｜"+grade+" RANK",'<div class="result">'+score+'%</div>未来改变率<br><br>'+reality+'<hr>💴 '+y(cash)+'<br>📦 '+asset+'<br>🔓 EXP +'+gain+'<br><br><button class="btn wide" onclick="nextDay()">领取并查看下一天</button>')}
function nextDay(){closeM();day=Math.min(day+1,4);bought=false;sold=false;changed=0;page="tomorrow";render()}
function pop(t,b){let m=document.createElement("div");m.className="modal";m.id="modal";m.innerHTML='<div class="box"><h2>'+t+'</h2><div class="forecast">'+b+'</div><div class="row"><button class="btn" onclick="closeM()">确定</button></div></div>';document.body.appendChild(m)}function closeM(){document.querySelector("#modal")?.remove();render()}
try{render();setTimeout(()=>pop("URI 已安装","从今晚开始，你每天都可以提前看到<b>明天会发生什么</b>。<br><br>每天每人只能：<br>・出售 1 样属于自己的东西<br>・购买 1 样市场中的东西<br><br>交易会改变真实的明天。"),250);}catch(e){document.querySelector("#main").innerHTML="<div class=\"card\"><div class=\"name\">启动错误</div><div class=\"meta\">"+e.message+"</div></div>"}
window.onerror=function(msg){document.querySelector("#main").innerHTML="<div class=\"card\"><div class=\"name\">加载失败</div><div class=\"meta\">"+msg+"</div></div>"};</script></body></html>

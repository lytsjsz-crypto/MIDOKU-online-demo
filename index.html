<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MIDOKU 序章 Demo</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#11110f;color:#eee;font-family:"Noto Sans SC","PingFang SC",sans-serif}
#app{max-width:1180px;margin:auto;min-height:100vh;padding:20px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.brand{letter-spacing:4px;font-family:Georgia,serif;font-size:24px}.phase{font-size:12px;color:#aaa}
.game{display:grid;grid-template-columns:1.45fr .8fr;gap:14px}.scene,.side{border:1px solid #454238;background:#1a1915;border-radius:18px;overflow:hidden}
.visual{height:410px;position:relative;background:linear-gradient(#77766b 0 45%,#79734e 46% 100%);overflow:hidden}
.sky{position:absolute;inset:0 0 55% 0;background:linear-gradient(#777a78,#b5aa87)}
.grass{position:absolute;left:0;right:0;bottom:0;height:55%;background:repeating-linear-gradient(100deg,#6f7046 0 3px,#7e7b4b 4px 9px)}
.track{position:absolute;bottom:65px;left:-5%;width:110%;height:55px;transform:rotate(-3deg);border-top:8px solid #4b463b;border-bottom:8px solid #4b463b}
.track:after{content:"";position:absolute;inset:8px 0;background:repeating-linear-gradient(90deg,transparent 0 35px,#514b3d 36px 43px,transparent 44px 70px)}
.train{position:absolute;width:430px;height:125px;left:110px;bottom:115px;background:#d2c8a7;border:5px solid #403b32;border-radius:16px 26px 8px 8px;transition:1.4s}
.train.hide{transform:translateX(950px);opacity:0}.window{display:inline-block;width:64px;height:48px;margin:20px 5px;background:#536064;border:4px solid #403b32}
.station{position:absolute;right:110px;bottom:130px;width:180px;height:135px;background:#c5b991;border:4px solid #403b32;transition:1s}.station:before{content:"駅";position:absolute;left:65px;top:40px;font-size:34px;color:#333}.station.hide{opacity:0;filter:blur(12px)}
.npc{position:absolute;left:54%;bottom:120px;width:46px;height:92px;cursor:pointer;display:none}.npc.show{display:block}.head{width:34px;height:34px;border-radius:50%;background:#bca982;margin:auto}.body{width:44px;height:58px;background:#46453d;border-radius:12px 12px 3px 3px}
.map{position:absolute;inset:0;display:none;background:#c9bc92}.map.show{display:block}.road{position:absolute;background:#938461;border-radius:50%;transform:rotate(-10deg)}.zone{position:absolute;border:2px dashed #5b5546;background:#b8aa7eaa;padding:12px;border-radius:45% 55% 42% 58%;text-align:center;color:#28261f;font-weight:700;cursor:pointer}.zone.lock{background:#292821;color:#aaa;border-color:#777;filter:brightness(.65)}.zone.new{animation:pulse 1.1s infinite alternate}@keyframes pulse{to{box-shadow:0 0 0 8px #e7dca744}}
.story{padding:18px 20px 20px;min-height:205px}.story h2{margin:0 0 8px;font-size:20px}.story p{line-height:1.7;color:#d6d1c3;margin:5px 0 15px}.choices{display:flex;gap:8px;flex-wrap:wrap}button{border:0;border-radius:10px;background:#e1d5b2;color:#26231d;padding:10px 15px;font-weight:700;cursor:pointer}.ghost{background:#35332c;color:#ddd}.side{padding:18px}.side h3{margin:0 0 12px;font-size:15px}.log{font-size:13px;color:#bcb6a6;line-height:1.6;max-height:230px;overflow:auto;border-bottom:1px solid #39362e;padding-bottom:12px}.rumor{margin-top:14px;padding:12px;background:#23211c;border-radius:12px;min-height:95px;font-family:serif}.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}.slot{padding:8px 4px;text-align:center;background:#302e27;border-radius:8px;font-size:12px}.slot b{display:block;color:#dfd3ae;margin-bottom:4px}.progress{display:flex;gap:5px;margin-top:18px}.p{height:6px;flex:1;background:#3c3930;border-radius:5px}.p.on{background:#d8cca7}
.cardpick{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.word{background:#343129;padding:12px;border:1px solid #5b5548;border-radius:10px;cursor:pointer}.word.sel{outline:2px solid #e4d6aa;background:#494334}
@media(max-width:800px){.game{grid-template-columns:1fr}.visual{height:330px}.side{order:2}.train{left:20px;transform:scale(.8);transform-origin:left bottom}}

/* V4: exploreable map, visible rumors, gradually unlocked aberrant options */
#mapEffects{position:absolute;z-index:4;right:8px;bottom:8px;max-width:65%;display:flex;gap:3px;justify-content:flex-end;flex-wrap:wrap;pointer-events:none}
.zone.altered{background:#cdb29c!important;border-color:#a46759!important;border-style:solid;box-shadow:0 0 0 2px #e4c0a666}

.map{background:radial-gradient(ellipse at 43% 49%,#d3c89f 0,#b4a881 62%,#8d8468 100%)}
.map:before{content:"";position:absolute;inset:8%;border:1px dashed #82795c;border-radius:47% 55% 50% 40%;opacity:.5;pointer-events:none}
.map:after{content:"言叶町 · 手绘地图";position:absolute;left:16px;bottom:12px;font:12px Georgia,serif;letter-spacing:3px;color:#463f30;pointer-events:none}
.map .road{pointer-events:none;background:#b1a17b;box-shadow:0 0 0 2px #93836133}
.zone{z-index:2;padding:10px 5px!important;width:clamp(70px,16%,120px)!important;height:clamp(58px,19%,82px)!important;display:flex;align-items:center;justify-content:center;line-height:1.3;flex-direction:column;font-size:14px;transition:filter .3s,background .3s;white-space:nowrap}
.zone small{display:block;font-size:10px;font-weight:400;margin-top:4px}.zone:hover:not(.lock){filter:brightness(1.09);background:#e3d5a4}
.zone.lock{cursor:default;filter:brightness(.65)}.zone.current{border-style:solid;background:#ece1b5;box-shadow:0 0 0 4px #fff8de75}.zone.visited{background:#acb89c;box-shadow:0 0 0 2px #e3e0c0}
.zone.new{animation:pulse 1.1s infinite alternate}.map-hud{position:absolute;left:9px;top:9px;z-index:5;border-radius:9px;background:#191913e8;padding:6px 10px;font-size:11px;color:#e1d8b9;pointer-events:none;letter-spacing:1px}
.map-effect{position:relative;left:auto!important;top:auto!important;display:inline-block;z-index:4;border:1px solid #e5d4a8;box-shadow:0 2px 10px #10101066;background:#322f29ee;color:#f0dfc3;border-radius:14px;padding:4px 8px;font-size:10px;pointer-events:none;transform:none;max-width:118px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.story p strong{color:#f4dfb0}.side .goal{margin:12px 0;padding:10px;background:#282721;border:1px solid #474438;border-radius:12px;font-size:12px;line-height:1.75;color:#ded2b3}.goal b{color:#f0d7a7}
.story button:disabled{opacity:.5;cursor:not-allowed}.story .choices{gap:8px}.story .choices button{white-space:normal;text-align:left;line-height:1.5}
.word.odd{border-color:#986c5c;background:#3e2c2b}.word .odd-tag{display:inline-block;font-size:10px;color:#ead6c4;background:#87564b;border-radius:5px;padding:2px 5px;margin-right:5px}.word small{font-size:11px;color:#c2b69d;display:block;margin-top:4px}.word:disabled{opacity:.5;cursor:not-allowed}
.choice-help{margin:8px 0 11px;font-size:12px;color:#cfc4ae;line-height:1.6}.sentence-card{padding:16px;border:1px solid #766b4d;background:#2c2920;border-radius:12px;margin:10px 0 16px;font-size:17px;line-height:1.8}
.sentences{padding:8px 0}.sentence-log{margin:0 0 9px;padding:6px 0;border-top:1px dashed #4a4638;font-size:11px;line-height:1.5;color:#c4bba8}.sentence-log b{color:#e1d3b2}.unlock{border:1px solid #779977;border-radius:8px;background:#25352a;color:#d8e7d8;padding:9px;margin-top:10px;font-size:12px}
.small-pill{display:inline-block;border:1px solid #766c4b;color:#d9cdad;font-size:11px;border-radius:14px;padding:3px 8px;margin:0 5px 7px 0}
.visual.white-tokyo{background:#fafafa}.visual.white-tokyo>*{display:none!important}.visual.white-tokyo:before{content:"东京 / TOKYO";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#dddddd;letter-spacing:5px;font-size:14px;white-space:nowrap}.visual.white-tokyo:after{content:"没有谁能描述的地方";position:absolute;left:50%;top:66%;transform:translateX(-50%);color:#e5e5e5;font-size:11px;white-space:nowrap}
.visual.return-town{background:linear-gradient(145deg,#655f52,#2d2c28)}.visual.return-town:after{content:"你们的话，比你们先回来了。";position:absolute;bottom:20px;right:20px;color:#e1ccab;font-size:14px}
@media(max-width:800px){.visual{height:340px}.zone{font-size:12px!important}.map-hud{font-size:10px}.story{min-height:220px}.scene,.side{border-radius:12px}.cardpick{grid-template-columns:repeat(2,minmax(0,1fr))}.word{font-size:13px;min-height:62px}}
@media(max-width:480px){.visual{height:300px}.zone{font-size:11px!important;width:78px!important;height:55px!important}.zone small{font-size:8px}.story{padding:14px}.side{padding:14px}.map-hud{max-width:80%;white-space:normal}}
</style></head>
<body><div id="app">
<div class="top"><div><div class="brand">未読 / MIDOKU</div><div class="phase">PROLOGUE · 第一阶段序章原型</div></div><button class="ghost" onclick="location.reload()">重新开始</button></div>
<div class="game"><div class="scene"><div class="visual" id="visual">
<div class="sky"></div><div class="grass"></div><div class="track" id="track"></div>
<div class="train" id="train"><span class="window"></span><span class="window"></span><span class="window"></span><span class="window"></span></div>
<div class="station" id="station"></div>
<div class="npc" id="npc" onclick="npcClick()"><div class="head"></div><div class="body"></div></div>
<div class="map" id="map">
<div class="road" style="width:80%;height:23px;left:10%;top:48%;transform:rotate(-11deg)"></div>
<div class="road" style="width:65%;height:18px;left:18%;top:47%;transform:rotate(48deg)"></div>
<div class="road" style="width:56%;height:14px;left:20%;top:48%;transform:rotate(-58deg)"></div>
<div id="mapHud" class="map-hud">已知地点 1 / 7</div>
<button class="zone" id="grassZone" style="left:42%;top:45%" onclick="mapClick('grass')">荒草地</button>
<button class="zone lock" id="schoolZone" style="left:9%;top:20%" onclick="mapClick('school')">迷雾</button>
<button class="zone lock" id="marketZone" style="right:11%;top:24%" onclick="mapClick('market')">迷雾</button>
<button class="zone lock" id="homeZone" style="right:9%;bottom:12%" onclick="mapClick('home')">迷雾</button>
<button class="zone lock" id="riverZone" style="left:14%;bottom:14%" onclick="mapClick('river')">迷雾</button>
<button class="zone lock" id="shrineZone" style="left:43%;top:7%" onclick="mapClick('shrine')">迷雾</button>
<button class="zone lock" id="forestZone" style="right:3%;top:3%" onclick="mapClick('forest')">迷雾</button>
<div id="mapEffects"></div>
</div></div>
<div class="story"><h2 id="title">终点站？</h2><p id="text">电车慢慢停下。窗外没有城市，只有大片荒草和一座小得不像终点站的站台。你们明明记得自己要回东京，却从没见过这一站。</p><div class="choices" id="choices"><button onclick="arrive()">下车看看</button></div></div></div>
<div class="side"><h3>探索记录</h3><div class="log" id="log">17:38　电车抵达陌生站台。</div>
<div class="rumor"><b>这一带流传的话</b><div id="rumorText" style="margin-top:8px;color:#d7cbaa">目前还没有传闻。</div></div>
<div id="wordArea"></div><div class="progress" id="progress"></div></div></div></div>
<script>
let step=0, selected={}, rumorDone=false;
const logs=[];
function setStory(t,x,buttons){title.textContent=t;text.innerHTML=x;choices.innerHTML=buttons||"";progress()}
function addLog(x){logs.push(x);log.innerHTML='17:38　电车抵达陌生站台。<br>'+logs.join("<br>");log.scrollTop=999}
function progress(){let n=Math.min(step,8);progressEl=document.getElementById("progress");progressEl.innerHTML="";for(let i=0;i<8;i++){let d=document.createElement("div");d.className="p"+(i<n?" on":"");progressEl.appendChild(d)}}
function arrive(){step=1;train.classList.add("hide");setStory("陌生的小镇","你们刚踏上荒草地，电车就关上门离开了。<br><br>“……先看看站牌吧。”",'<button onclick="lookBack()">回头看车站</button>');addLog("你们在陌生站台下车。")}
function lookBack(){step=2;station.classList.add("hide");setTimeout(()=>{station.style.display="none";track.style?.setProperty("opacity","0")},900);setStory("车站消失了","刚才还在身后的站台像从来没有存在过一样消失了。铁轨尽头只剩荒草。<br><br>远处似乎站着一个人。",'<button onclick="openMap()">打开地图</button>');addLog("车站与铁轨消失。");}
function openMap(){step=3;map.classList.add("show");setStory("地图解锁：荒草地","现在唯一能够确认的位置只有这里。其他区域仍然被迷雾覆盖。<br><br>荒草地上有一个当地人。",'<button onclick="showNpc()">调查荒草地</button>');addLog("解锁地图板块【荒草地】。")}
function showNpc(){map.classList.remove("show");npc.classList.add("show");setStory("荒草地","一个提着篮子的女人正奇怪地看着你们。点击她进行对话。","");}
function npcClick(){npc.onclick=null;step=4;setStory("陌生女人","“你们几个……从哪儿来的？我以前没见过你们。”<br><br>你们正准备解释刚才发生的事情，但每个人记住的细节似乎不太一样。",'<button onclick="startWords()">试着说明刚才发生的事</button>');addLog("遇到第一名当地居民。她还不知道你们经历了什么。")}
const sets={subject:["我们","其他同学","站台上的乘客","一位同行的朋友"],verb:["坐过","看见过","正在寻找","错过了"],object:["电车","车站","回东京的路","同车的乘客"],time:["刚才","下车之前","电车停下时","天色变暗之前"]};
function startWords(){step=5;setStory("第一次 · 主谓宾游戏","四个人回忆刚才发生的事。每个人记住的东西并不完全一样。<br><br><b>从每一组里选一个词，把大家的碎片重新拼成一句话。</b>","");renderWords()}
function renderWords(){wordArea.innerHTML='<h3 style="margin-top:18px">信息碎片</h3>';for(const [k,arr] of Object.entries(sets)){let box=document.createElement("div");box.innerHTML='<div style="font-size:11px;color:#888;margin:8px 0">'+({subject:"主语",verb:"谓语",object:"宾语",time:"时间"}[k])+'</div>';let grid=document.createElement("div");grid.className="cardpick";arr.forEach(w=>{let d=document.createElement("div");d.className="word";d.textContent=w;d.onclick=()=>{selected[k]=w;[...grid.children].forEach(e=>e.classList.remove("sel"));d.classList.add("sel");checkWords()};grid.appendChild(d)});box.appendChild(grid);wordArea.appendChild(box)}}
function checkWords(){if(Object.keys(selected).length===4&&!document.getElementById("makeBtn")){let b=document.createElement("button");b.id="makeBtn";b.style.marginTop="12px";b.textContent="组成这句话";b.onclick=makeRumor;wordArea.appendChild(b)}}
function makeRumor(){
 step=6;
 let sentence=`${selected.time}，${selected.subject}${selected.verb}${selected.object}。`;
 rumorText.textContent="“"+sentence+"”";
 wordArea.innerHTML="";
 window.firstRumor={...selected,sentence};

 // NPC only reacts to words the players actually selected.
 let reactions=[];
 if(selected.object==="电车") reactions.push("“电车？这里可没有那种东西。”");
 if(selected.object==="车站") reactions.push("“车站？这附近从来没有车站。”");
 if(selected.object==="回东京的路") reactions.push("“东京……我只听过这个名字。你们是从那里来的吗？”");
 if(selected.object==="奇怪的乘客") reactions.push("“奇怪的乘客？可我刚才只看见了你们几个。”");
 if(selected.subject==="没人") reactions.push("“没人？那这句话又是谁看到的呢……”");
 if(selected.subject==="陌生人"||selected.subject==="站台上的人") reactions.push("“你们说的那个人，现在在哪里？”");
 if(selected.verb==="弄丢了") reactions.push("“弄丢了？你们确定原来真的有吗？”");
 if(selected.verb==="等着") reactions.push("“在这种荒草地里等什么呢……”");
 if(selected.time==="午夜") reactions.push("“午夜？现在明明还是白天。是谁这么说的？”");
 if(selected.time==="昨天") reactions.push("“昨天？可你们不是刚刚才到这里吗？”");
 if(selected.time==="很久以前") reactions.push("“很久以前的事，你们怎么会知道？”");
 if(!reactions.length) reactions.push("女人把这句话低声重复了一遍，似乎仍然没有完全听懂。");

 setStory("一句话诞生了",
 `你们七嘴八舌地解释刚才发生的事情，最后留下了这样一句话：<br><br><b>“${sentence}”</b><br><br>${reactions.slice(0,2).join("<br>")}<br><br>女人想了想。<br>“总之，先别一直站在这里。跟我来吧。”`,
 '<button onclick="shop()">跟她去杂货店</button>');
 addLog("第一句话被当地人记住：【"+sentence+"】");
}

function shop(){
 step=7;
 let r=window.firstRumor;
 let daughter="";
 // Daughter repeats ONLY the rumor she actually receives.
 if(r.object==="电车"){
   daughter=`女儿听完后立刻抬起头：<br>“<b>电车</b>？那是什么？你们刚才真的坐过吗？”`;
 } else if(r.object==="车站"){
   daughter=`女儿听完后有些惊讶：<br>“<b>车站</b>？妈妈不是说镇上没有车站吗？”`;
 } else if(r.object==="回东京的路"){
   daughter=`女儿一下凑了过来：<br>“<b>东京</b>？我听过这个名字！那里是什么样的？”`;
 } else if(r.object==="奇怪的乘客"){
   daughter=`女儿压低声音问：<br>“你们说的那个<b>奇怪的乘客</b>，后来去哪儿了？”`;
 }
 setStory("小镇杂货店",
 `女人原来是市场里杂货店的老板。店里还有她的女儿。<br><br>老板把刚才听到的话复述给女儿：<br><b>“${r.sentence}”</b><br><br>${daughter}<br><br>老板看了看天色：<br>“不管怎样，你们今晚暂时回不去了。先听听你们怎么打算吧。”`,
 '<button onclick="townInfo()">询问这个小镇</button>');
 addLog("杂货店老板把第一句话转述给女儿，没有加入新的信息。");
}

let lodging="";
function townInfo(){
 let r=window.firstRumor;
 let tail=r.object==="回东京的路"?'女儿轻声问：“东京……是地方的名字吗？”':r.object==="电车"?'女儿问：“你们说的电车，究竟是什么？”':r.object==="车站"?'女儿问：“车站是什么地方？”':'女儿又问了一遍：“你们刚才说的那件事，是真的吗？”';
 setStory("今晚住在哪里？",`老板没有马上替你们决定住处。<br><br>“天快黑了。店里可以挤出一间空房；我也能去问问学校宿舍能不能收留你们。”<br><br>${tail}<br><br>你们几个人意见不同，决定再用一次<b>主语＋谓语＋宾语＋时间</b>把今晚的打算说清楚。`,'<button onclick="startLodgingWords()">开始第二次主谓宾游戏</button>');
}
function startLodgingWords(){
 step=7; selected={};wordArea.innerHTML='';
 setStory("第二次 · 今晚的去处","这次每个人提出不同的说法。请依次选择主语、谓语、宾语和时间。<br><br><b>句子中的地点决定今晚住在哪里，也决定最先开放的探索区域。</b>","");
 const opts={subject:["我们","几个外来孩子","大家","老板的客人"],verb:["借住在","暂时留在","决定去","请求住进"],object:["杂货店老板家","学校宿舍"],time:["今晚","天黑之前","从今天开始","这一夜"]};
 for(const [key,words] of Object.entries(opts)){
  const h=document.createElement('div');h.style.marginTop='12px';h.textContent=({subject:'主语',verb:'谓语',object:'宾语',time:'时间'})[key];wordArea.appendChild(h);
  const grid=document.createElement('div');grid.className='cardpick';wordArea.appendChild(grid);
  words.forEach(w=>{const el=document.createElement('button');el.className='word';el.textContent=w;el.onclick=()=>{selected[key]=w;[...grid.children].forEach(x=>x.classList.remove('sel'));el.classList.add('sel');const done=Object.keys(selected).length===4;let btn=document.getElementById('lodgingConfirm');if(done&&!btn){btn=document.createElement('button');btn.id='lodgingConfirm';btn.style.marginTop='14px';btn.textContent='确认这句话';btn.onclick=confirmLodging;wordArea.appendChild(btn)}};grid.appendChild(el)});
 }
}
function confirmLodging(){
 lodging=selected.object==='学校宿舍'?'school':'market';
 const sentence=`${selected.time}，${selected.subject}${selected.verb}${selected.object}。`;
 wordArea.innerHTML='';addLog('今晚的决定：【'+sentence+'】');
 const response=lodging==='school'?'老板点点头：“好，我去跟学校的老师说一声。”':'老板笑了：“那就来我家吧。楼上还有间空房。”';

 });
 let msg='你们又来到'+EXP.names[loc]+'。\n\n'+EXP.quests[loc].npc+'记得你们那句话：\n“'+related.sentence+'”';
 if(odd.length)msg+='\n\n这里的异常仍然存在。'+odd.map(e=>e.caption).join('、')+'并没有恢复原状。';
 else msg+='\n\n人们还在讨论这句话。它正在变成小镇的常识。';
 setStory('重新走过 · '+EXP.names[loc],expBr(msg),'<button onclick="EXP.showOverview()">返回地图</button>');
};
EXP.prepareStation=function(){
 EXP.mode='station-decision';EXP.syncMap();EXP.goal();wordArea.innerHTML='';
 const text='你们回到森林深处。人们在树下讨论着不同版本的传闻。\n\n有人拿出纸笔说：“如果这里真的能有一个车站，那是不是也能有一辆去东京的电车？”\n\nMio低声提醒你们：“我们已经看到了，自己说出的话会影响这里。可是我们甚至不知道他们想象的东京是什么样的。”\n\n为了回家，你们要不要告诉镇民：午夜的列车可以去东京？';
 setStory('森林深处 · 一个不该轻易说出的决定',expBr(text),'<button onclick="EXP.questionRail()">先去核实有无铁轨</button><button onclick="EXP.finalWords()">利用传闻，制造午夜电车</button><button class="ghost" onclick="EXP.showOverview()">先不决定，继续探索</button>');
};
EXP.questionRail=function(){
 setStory('核实之后','你们沿着林间走了一圈。泥土上根本没有轨枕，树林也没有被砍开的痕迹。<br><br>眼前没有任何证据能证明午夜真的有电车。<br><br>如果你们现在告诉居民“电车一定会来”，那就是一次有意识的传闻制造。','<button onclick="EXP.finalWords()">还是决定说出那句话</button><button class="ghost" onclick="EXP.showOverview()">继续探索，不说这句话</button>');
};
EXP.finalWords=function(){
 EXP.mode='final-words';EXP.finalChosen={};
 setStory('最后一次造句 · 午夜电车','为了离开小镇，你们开始故意拼出一条还没有人亲眼证实的传闻。<br><br>这一次，你们已经知道，<strong>说出口的话可能会变成现实。</strong>','<button class="ghost" onclick="EXP.prepareStation()">再想一想</button>');
 const opt={subject:['那辆银色电车','大家口中的午夜列车','森林深处的车站','没有司机的末班车'],verb:['会开往','可以抵达','将带我们去','被认为通往'],object:['镇民想象的东京','谁也没亲眼见过的东京','传闻里灯火通明的东京','只有名字的东京'],time:['午夜','所有人相信时','钟声响起以后','在不存在的第十三个小时']};
 wordArea.innerHTML='<h3 style="margin-top:16px">拼出一趟不存在的列车</h3><div class="choice-help">这些词并不是镇民亲眼见过的证据。你们在决定怎样把一条传闻说得可信。</div>';
 for(const [key,label] of Object.entries({subject:'主语',verb:'谓语',object:'宾语',time:'时间'})){
  const h=document.createElement('div');h.style.cssText='font-size:12px;color:#ddd0b4;margin:12px 0 7px';h.textContent=label;wordArea.appendChild(h);
  const div=document.createElement('div');div.className='cardpick';wordArea.appendChild(div);
  opt[key].forEach((val,i)=>{const b=document.createElement('button');b.className='word'+(key==='time'&&i===3?' odd':'');b.innerHTML=(key==='time'&&i===3?'<span class="odd-tag">异端</span>':'')+expEsc(val);
   b.onclick=()=>{EXP.finalChosen[key]=val;[...div.children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');expGet('finalSay').disabled=Object.keys(EXP.finalChosen).length<4};div.appendChild(b)})
 }
 const btn=document.createElement('button');btn.id='finalSay';btn.disabled=true;btn.textContent='让镇民听见这句话';btn.style.marginTop='15px';btn.onclick=EXP.sayFinal;wordArea.appendChild(btn);
};
EXP.sayFinal=function(){
 if(Object.keys(EXP.finalChosen).length!==4)return;
 const c=EXP.finalChosen;EXP.finalStatement=c.time+'，'+c.subject+c.verb+c.object+'。';
 EXP.rumors.push({loc:'forest',sentence:EXP.finalStatement,odd:c.time.includes('第十三'),at:EXP.rumors.length+1});
 if(c.time.includes('第十三')){EXP.effects.push({loc:'forest',x:67,y:15,caption:'第十三个小时'});}
 EXP.mode='station-found';EXP.syncMap();EXP.goal();
 wordArea.innerHTML='<div class="sentence-card">'+expEsc(EXP.finalStatement)+'</div>';
 rumorText.textContent='“'+EXP.finalStatement+'”';
 addLog('有意识地制造了一条关于午夜电车的传闻：'+EXP.finalStatement);
 const msg='你们告诉了围在森林里的居民：\n“'+EXP.finalStatement+'”\n\n最初大家愣了几秒。接着有人说：“我也听过那趟电车！”\n\n另一人接话：“对，我小时候就听人提过东京。”\n\n雾气从树缝里漫出来。先是一块站牌，然后是一排台阶，最后连铁轨都从泥土里冒了出来。\n\n它不是你们原先乘坐的车站。它是小镇上所有人拼凑出的——午夜车站。';
 setStory('午夜车站 · 传闻变成现实',expBr(msg),'<button onclick="EXP.boardTrain()">乘上午夜电车，前往东京</button>');
};
EXP.boardTrain=function(){
 EXP.mode='tokyo';document.querySelector('.phase').textContent='ACT 01 · 东京 / 空白';EXP.syncMap();EXP.goal();wordArea.innerHTML='';
 map.classList.remove('show');visual.classList.add('white-tokyo');
 setStory('终点：东京？','电车终于停下。<br><br>广播说：“终点站，东京。”<br><br>可车门外什么也没有。没有街道、没有人群，也没有人们传说中的高楼。<br><br>这里甚至没有能让你确认方向的地平线。<br><br>小镇的人知道有一个叫“东京”的地方，却不知道真正的东京究竟是什么样。<br><br><strong>传闻可以为列车创造一个目的地，却无法创造人们从未认识过的具体世界。</strong>','<button onclick="EXP.returnTown()">返回言叶町</button>');
};
EXP.returnTown=function(){
 EXP.mode='returned';document.querySelector('.phase').textContent='ACT 02 · 第二阶段 / 序幕';EXP.current='grass';map.classList.add('show');visual.classList.remove('white-tokyo');visual.classList.add('return-town');EXP.syncMap();EXP.goal();
 const anomaly=EXP.effects.length?EXP.effects.map(e=>e.caption).slice(0,3).join('、'):'那些被大家反复讲述的句子';
 setStory('第一阶段结束 · 第二阶段的开始','你们坐着银色电车返回言叶町。<br><br>可是，这座镇子已经不是刚来时的样子了。<br><br>学校、市场、居民家、河边和森林都有人在讲述你们说过的话。<br><br>你们认得出一些变化：<strong>'+expEsc(anomaly)+'</strong>。<br><br>没人记得这些变化最初是从哪里来的。镇民们只说：“这里一直就是这样。”<br><br><strong>第一阶段，你们制造了传闻。第二阶段，你们必须生活在自己制造的传闻里。</strong>','<button onclick="location.reload()">重新开始</button>');
 addLog('第一阶段结束：回到被传闻改变的小镇。');
};
// 保留原 V3 序章，但地图直到选定住处才展开；探索期间才逐渐出现异端。
EXP.syncMap();EXP.goal();

</script></body></html>

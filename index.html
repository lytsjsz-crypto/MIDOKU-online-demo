<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>コトノハ町</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f2e8;color:#24231f;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.wrap{max-width:790px;margin:auto;padding:34px 20px 80px}.head{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid #393832;padding-bottom:10px;margin-bottom:30px}.logo{font:25px Georgia,serif;letter-spacing:.12em}.meta,.place{font-size:11px;color:#77736a;letter-spacing:.11em}.title{font:25px/1.5 Georgia,"Noto Serif SC",serif;margin:8px 0 14px}.story{font-size:15px;line-height:2}.dialogue{font:16px/2 Georgia,"Noto Serif SC",serif;margin:18px 0;padding-left:15px;border-left:2px solid #aaa59a}.choices{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:20px}.choice{border:1px solid #99948a;background:transparent;padding:14px;text-align:left;cursor:pointer;font-size:14px;line-height:1.65;min-height:55px}.choice:hover{background:#282722;color:#fff}.btn{border:1px solid #282722;background:#282722;color:#fff;padding:12px 19px;margin-top:22px;cursor:pointer}.btn.alt{background:transparent;color:#282722}.talk{margin:24px 0}.bubble{padding:10px 0;border-bottom:1px solid #d2cdc2;font:16px/1.75 Georgia,"Noto Serif SC",serif}.bubble b{font:11px sans-serif;color:#77736a;display:block;margin-bottom:3px;font-weight:400}.heard{font:22px/1.75 Georgia,"Noto Serif SC",serif;margin:25px 0;padding:20px 0;border-top:1px solid #aaa59a;border-bottom:1px solid #aaa59a}.end{font-size:16px;line-height:2}.chapter{font:28px/1.7 Georgia,"Noto Serif SC",serif;margin:30px 0}@media(max-width:620px){.choices{grid-template-columns:1fr}.title{font-size:22px}.heard{font-size:20px}}
</style></head><body><main class="wrap"><header class="head"><div class="logo">コトノハ町</div><div class="meta" id="meta">PROTOTYPE 11</div></header><div id="app"></div></main><script>
const S={day:0,tags:new Set()};const $=x=>document.getElementById(x),E=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]||m));
function page(place,title,body,dialogue){$("meta").textContent="DAY "+S.day;$("app").innerHTML='<div class="place">'+place+'</div>'+(title?'<h1 class="title">'+title+'</h1>':'')+'<div class="story">'+body.replace(/\n/g,"<br>")+'</div>'+(dialogue?'<div class="dialogue">'+dialogue.replace(/\n/g,"<br>")+'</div>':'')}
function button(t,fn){$("app").innerHTML+='<button class="btn" id="n">'+t+'</button>';$("n").onclick=fn}
function choose(opts){$("app").innerHTML+='<div class="choices">'+opts.map((o,i)=>'<button class="choice" data-i="'+i+'">'+E(o.t)+'</button>').join("")+'</div>';document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>opts[+b.dataset.i].go())}
function fragments(place,lead,fixed,opts,make,next){page(place,"",lead,"");$("app").innerHTML+='<div class="talk">'+fixed.map(x=>'<div class="bubble"><b>'+x.n+'</b>'+x.t+'</div>').join("")+'</div>';choose(opts.map(o=>({t:o.t,go:()=>{let r=make(o.k,o.t);if(r.tags)r.tags.forEach(x=>S.tags.add(x));$("app").innerHTML='<div class="place">'+place+'</div><div class="talk">'+fixed.map(x=>'<div class="bubble"><b>'+x.n+'</b>'+x.t+'</div>').join("")+'<div class="bubble"><b>你</b>'+E(o.t)+'</div></div><div class="heard">'+r.heard+'</div><div class="dialogue">'+r.react.replace(/\n/g,"<br>")+'</div>';button(r.button||"继续",()=>next(r,o.k))}})))}
function prologue(){S.day=0;page("星期五・放学后","差一点就赶上了。","部活结束得比平时晚。你们四个跑上站台时，平时坐的电车正好关门。\n\n「啊——差一点。」\n\n有人还叼着便利店买的饭团。你摸出Suica。下一班，二十分钟。\n\n「真的假的。」","对面站台停着一辆没见过的银色电车。\n\n「坐这个不也一样？」\n\n四个人跑了进去。\n\n前几站都很正常。后来手机信号只剩一格。\n\n『下一站，终点——コトノハ町。』");button("下车",town)}
function town(){S.day=1;page("镇口・傍晚","站台不见了。","银色电车开进雾里。你们沿原路跑回来，刚才下车的地方只剩草。\n\n路边杂货店的老板探出头。","「你们几个，迷路了？」\n\n「我们刚才从那边的车站——」\n\n老板往你们身后看：「那边哪有车站。」\n\n「……所以你们到底怎么来的？」");button("解释",firstGame)}
function firstGame(){fragments("杂货店门口・傍晚","",[{n:"悠太",t:"「刚才那辆银色的……」"},{n:"Mio",t:"「我们四个下车以后……」"},{n:"葵",t:"「那边现在什么都没有。」"}],[
{t:"「电车开进雾里了。」",k:"fog"},{t:"「站台也不见了。」",k:"station"},{t:"「我Suica真的刷过。」",k:"suica"},{t:"「电车刚才明明还在。」",k:"train"}],k=>{if(k==="fog")return{tags:["fog"],heard:"老板：「……银色电车把你们送下来以后，开进雾里，车站也没了？」",react:"「不是，我说的是——」\n\n「佐藤さん！」老板已经朝街对面抬起手，「你听见没有？」"};if(k==="station")return{tags:["station"],heard:"老板：「……你们一下车，银色电车和整个车站就一起消失了？」",react:"悠太：「电车和站台不是一回事吧。」\n\n老板却已经点了点头。"};if(k==="suica")return{tags:["suica"],heard:"老板：「……你们刷Suica进了一个现在已经不存在的车站？」",react:"Mio：「等一下，谁说是进站——」\n\n街对面的佐藤太太正好看过来。"};return{tags:["train"],heard:"老板：「……你们四个下车以后，那辆银色电车还在，转眼车站就没了？」",react:"葵：「我没说转眼——」\n\n老板「哦」了一声。"}},()=>bakery())}
function bakery(){page("面包店・晚上","","门铃响了一声。老板娘抬头看见你们，装面包的手停了一下。","「啊，你们就是那几个孩子？」\n\nMio：「什么？」\n\n「佐藤さん刚来过呀。」\n\n"+(S.tags.has("suica")?"「说你们刷Suica进了一个不存在的车站。」":S.tags.has("station")?"「说你们一下车，车站就整个消失了。」":S.tags.has("fog")?"「说雾里有一辆会消失的银色电车。」":"「说你们坐一辆银色电车来的，后来车站没了。」")+"\n\nMio看了你一眼。");button("回Mio家",breakfast)}
function breakfast(){S.day=2;page("Mio家・早晨","","桌上是烤吐司、玉子焼き和牛奶。Mio妈妈把果酱推过来。","「听说你们是从旧车站来的？」\n\nMio：「……谁说是旧车站？」\n\n「佐藤太太呀。」\n\nMio转过来。\n\n「你们下车以后，身上到底还剩什么？」");button("想一想",secondGame)}
function secondGame(){fragments("Mio家・早晨","",[{n:"悠太",t:"「书包肯定还在啊。」"},{n:"葵",t:"「我记得下车的时候摸过口袋。」"},{n:"Mio",t:"「可我们没拿什么‘旧车站的东西’吧。」"}],[
{t:"「Suica一直在我这里。」",k:"suica"},{t:"「我书包里多了张黄纸。」",k:"ticket"},{t:"「学生手帳和笔袋都在。」",k:"normal"},{t:"「我只记得便当盒是空的。」",k:"bento"}],k=>{if(k==="ticket")return{tags:["ticket"],heard:"Mio妈妈：「……你们从那个车站带回来一张黄色的纸？」",react:"「不是‘带回来’。」你把纸从书包侧袋抽出来。\n\nMio接过去。纸角上只剩一个模糊的『駅』字。",button:"出门"};if(k==="suica")return{tags:["suica"],heard:"Mio妈妈：「那张Suica，是你们从旧站刷出来的？」",react:"「本来就是我的。」\n\nMio把卡拿过去翻了翻：「记录能查吗？」",button:"出门"};if(k==="normal")return{tags:["normal"],heard:"Mio妈妈：「所以除了平时上学的东西，什么也没多出来？」",react:"「对。」\n\nMio把最后一口牛奶喝完：「那就别把什么都往旧车站上扯。」",button:"去学校"};return{tags:["bento"],heard:"Mio妈妈：「你们从那边回来时，只少了一个饭团？」",react:"葵笑出声：「这也能算线索吗？」\n\n「当然不能。」Mio把吐司塞进她嘴里。",button:"去学校"}},()=>{if(S.tags.has("ticket"))ticketBranch();else if(S.tags.has("suica"))suicaBranch();else school()})}
function ticketBranch(){page("商店街・中午","","一只猫从自行车棚下面钻出来。Mio忽然停住。","「它嘴里那个……」\n\n猫叼着一小片发黄的纸。");choose([{t:"「追它。」",go:()=>thirdGame("cat")},{t:"「可能只是垃圾。」",go:school},{t:"「先看我们手上这张。」",go:()=>thirdGame("paper")}])}
function suicaBranch(){page("旧商场前・中午","","入口旁立着一台落灰的简易读卡机。Mio走过去按了两下。","「居然还亮。」\n\n她看向你口袋。\n\n「要不要刷一下？」");choose([{t:"把Suica贴上去",go:()=>thirdGame("reader")},{t:"「算了。」",go:school}])}
function thirdGame(src){let fixed=src==="cat"?[{n:"悠太",t:"「猫刚才从商店街那边跑来的。」"},{n:"葵",t:"「嘴里叼着黄纸。」"},{n:"Mio",t:"「跟我们那张很像。」"}]:src==="reader"?[{n:"Mio",t:"「屏幕刚才跳了一下。」"},{n:"悠太",t:"「我只看见最后一个『駅』。」"},{n:"葵",t:"「前面的字没看清。」"}]:[{n:"Mio",t:"「纸上只有一个『駅』。」"},{n:"悠太",t:"「边上像被水泡过。」"},{n:"葵",t:"「也可能只是旧收据。」"}];fragments(src==="reader"?"旧商场前":"商店街","",fixed,[
{t:"「会不会是河边捞上来的？」",k:"river"},{t:"「修钟店里好像有这种旧纸。」",k:"clock"},{t:"「森林那边以前有站？」",k:"forest"},{t:"「算了，什么都说明不了。」",k:"stop"}],k=>{if(k==="stop")return{tags:["stop"],heard:"Mio：「嗯。一个『駅』字而已。」",react:"她把纸折好塞回笔记本。\n\n「上学去吧。」",button:"走"};if(k==="river")return{tags:["river"],heard:"旁边推自行车的人：「你们说旧车站的东西是从河边捞上来的？」",react:"「我们说的是‘会不会’——」\n\n那个人已经骑过去了。",button:"走"};if(k==="clock")return{tags:["clock"],heard:"旁边的人：「修钟老人那里有旧车站的纸？」",react:"Mio：「我只是说店里可能有这种旧纸。」\n\n「哦……修钟老人知道啊。」",button:"走"};return{tags:["forest"],heard:"旁边的人：「旧车站以前就在森林那边？」",react:"「我是在问！」\n\n自行车铃响了一声。那个人已经骑远了。",button:"走"}},()=>school())}
function school(){S.day=2;page("町立中学校・放学后","","鞋柜旁贴着文化祭海报。放学铃刚响，几个学生就围了过来。","「你们就是昨天来的？」\n「我听说旧车站又出现了。」\n\nMio：「‘又’是什么意思？」\n\n"+(S.tags.has("river")?"「不是在河边吗？我哥他们已经去看了。」":S.tags.has("clock")?"「修钟店那个爷爷知道吧？大家都这么说。」":S.tags.has("forest")?"「森林那边啊。刚才已经有人骑车过去了。」":"「不知道啊。反正大家都这么说。」"));if(S.tags.has("river"))choose([{t:"去河边",go:river},{t:"不去",go:quiet}]);else if(S.tags.has("clock"))choose([{t:"去修钟店",go:clock},{t:"不去",go:quiet}]);else if(S.tags.has("forest"))choose([{t:"去森林",go:forest},{t:"不去",go:quiet}]);else button("回去",quiet)}
function clock(){S.day=3;page("修钟店・下午","","门一推开，十几只钟同时响着。老人戴着放大镜，头也没抬。","Mio：「有人说你知道旧车站。」\n\n老人：「谁说的？」\n\n你们谁也答不上来。\n\n他看见那张黄纸，手停了一下。");choose([{t:"「你见过这种纸？」",go:()=>{S.tags.add("river");river()}},{t:"「他们说你知道位置。」",go:()=>fourthGame()},{t:"离开",go:quiet}])}
function fourthGame(){fragments("修钟店门口","",[{n:"悠太",t:"「老人刚才看了那张纸。」"},{n:"葵",t:"「他什么地点都没说。」"},{n:"Mio",t:"「只往窗外看了一眼。」"}],[
{t:"「窗外就是河那边。」",k:"river"},{t:"「他看的也可能是森林。」",k:"forest"},{t:"「别猜了，他根本没说。」",k:"stop"}],k=>k==="river"?{tags:["river"],heard:"门口的男生：「所以老人指的是河边？」",react:"「没有人‘指’——」\n\n男生已经回头喊同伴：「河边！」"}:k==="forest"?{tags:["forest"],heard:"门口的男生：「老人刚才是在看森林那边？」",react:"Mio：「也可能只是看窗外。」\n\n「那就是森林啊。」"}:{tags:["stop"],heard:"门口的男生：「……所以老人什么都没说？」",react:"「对。」\n\n这次没人接话。"},()=>{if(S.tags.has("river"))river();else if(S.tags.has("forest"))forest();else quiet()})}
function river(){S.day=4;page("河堤・傍晚","","桥下已经有几个孩子在翻树枝。\n\n「找到了！」\n\n泥里拖出一块生锈铁牌。","上面只剩一个字：『駅』。\n\nMio看着围过来的人。\n\n「谁最开始说要来河边的？」\n\n没人回答。");choose([{t:"沿河往上走",go:()=>ending("river")},{t:"回去",go:quiet}])}
function forest(){S.day=4;page("森林入口・傍晚","","护栏边倒着几辆自行车。有人拿手机照着草丛。","「你们也来了？」\n\nMio：「谁说旧站在这里？」\n\n「不是你们说的吗？」");choose([{t:"继续往里",go:()=>ending("forest")},{t:"回去",go:quiet}])}
function quiet(){S.day=4;page("镇口・傍晚","","那片草还是那片草。Mio踢开一颗小石子。","「所以那天到底是哪一站？」\n\n「不知道。」\n\n远处传来电车经过的声音。这里没有铁轨。");button("等一会儿",()=>ending("quiet"))}
function ending(r){S.day=5;if(r==="forest")page("森林深处・黄昏","","草下面露出两根生锈的铁条。再往前，是半块歪着的站牌。","Mio擦掉泥。\n\nコトノハ町。\n\n身后的孩子小声说：「……真的有啊。」");else if(r==="river")page("河的上游・黄昏","","铁牌之后，又找到一颗旧螺栓、一截埋在草里的枕木。河道拐弯处，雾里立着一块牌子。","コトノハ町。\n\nMio：「昨天这里有这个吗？」");else page("镇口・黄昏","","一直等到天黑。没有车站，没有铁轨，也没有银色电车。","手机震了一下。\n\nSuica的利用记录里，多出一行。\n\nコトノハ町。");button("结束",end)}
function end(){$("meta").textContent="END";$("app").innerHTML='<div class="place">星期一・早晨</div><div class="chapter">いつもの駅。</div><div class="end">闸机前排着上学的人。<br><br>你把Suica贴上去。<br><br>ピッ。<br><br>身后有人在聊周末的事。你听见自己的名字。<br><br>回头时，他们已经走远了。</div><button class="btn alt" onclick="location.reload()">重新开始</button>'}
prologue();
</script></body></html>

<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>コトノハ町 Demo</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101116;color:#f6f3eb;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;min-height:100vh}.wrap{max-width:920px;margin:auto;padding:24px 18px 70px}.top{display:flex;justify-content:space-between;align-items:end;margin-bottom:14px}.title{font-size:25px;font-weight:900;letter-spacing:.08em}.sub,.muted{color:#a9a9b2;font-size:13px}.day{border:1px solid #3a3b44;border-radius:99px;padding:8px 12px}.card{background:#191a20;border:1px solid #343640;border-radius:20px;padding:22px;margin:12px 0;box-shadow:0 20px 55px #0006}.scene{font-size:22px;font-weight:850;margin:7px 0 8px}.story{color:#d1d1d5;line-height:1.75}.rumor{font-size:26px;font-weight:900;line-height:1.55;padding:18px;border:1px solid #555864;border-radius:15px;background:#111218;margin:15px 0}.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.slot{background:#111218;border:1px solid #343640;border-radius:15px;padding:14px}.slot h3{font-size:13px;margin:0 0 10px;color:#d7bd78}.choices{display:grid;gap:7px}.choice{border:1px solid #3b3d47;background:#202128;color:#eee;border-radius:10px;padding:10px;cursor:pointer;text-align:left}.choice:hover{border-color:#777}.choice.sel{background:#eee;color:#111;border-color:#eee}.hiddenPick{font-size:14px;color:#aaa;padding:8px 0}.btn{width:100%;padding:14px;border:0;border-radius:12px;font-weight:850;font-size:15px;cursor:pointer;background:#eee;color:#111;margin-top:14px}.btn.secondary{background:#292a32;color:#eee;border:1px solid #444}.btn:disabled{opacity:.35}.tag{font-size:12px;color:#d7bd78;font-weight:800;letter-spacing:.12em}.effect{white-space:pre-line;line-height:1.85;border-left:2px solid #777;padding-left:14px}.history{font-size:14px;line-height:1.7;border-bottom:1px dashed #333;padding:8px 0}.talk{background:#121319;border-radius:12px;padding:12px;margin:10px 0;color:#ddd}.warn{color:#f1c97b}.ending{font-size:18px;line-height:1.9}
@media(max-width:680px){.slots{grid-template-columns:1fr}.rumor{font-size:21px}.scene{font-size:19px}}
</style></head><body><div class="wrap"><div class="top"><div><div class="title">コトノハ町</div><div class="sub">三个人只能控制一句传闻的一部分。</div></div><div class="day" id="day"></div></div><div id="app"></div></div>
<script>
const rounds=[
{scene:"放学后的旧车站",story:"你、玩家2、玩家3误入了コトノハ町。Mio说：这里奇怪的传闻，只要被人相信，第二天就可能成为现实。你们决定先试一次。",tpl:"听说，【主语】【谓语】【宾语】。",p1:["校长","学校里的黑猫","数学老师"],p2:["会变成","会偷偷吃掉","会开始寻找"],p3:["一条龙","所有人的作业","藏在学校里的星星"]},
{scene:"第一条传闻成真之后",story:"昨天那句话真的改变了小镇。今天大家已经开始谈论它。你知道：今天拼出来的东西，明天也会留下。",tpl:"听说，【主语】【谓语】【宾语】。",p1:["会说话的黑猫","龙校长","旧车站"],p2:["会带着大家找到","会在午夜出现","会吞掉"],p3:["回家的路","一辆银色列车","所有考试卷"]},
{scene:"关于回家的传闻",story:"你们开始认真利用规则。目标很明确：制造一条能够带你们回家的传闻。但每个人依然只知道自己能出的那一部分。",tpl:"听说，【主语】【谓语】【宾语】。",p1:["午夜列车","旧车站的钟","拿着最重要东西的人"],p2:["会带着","会打开","会回到"],p3:["乘客回到最想去的地方","通往另一个世界的门","自己真正的家"]},
{scene:"午夜",story:"列车真的出现了。你们坐了上去——却没有回到真正的世界。你们看到的是镇民根据传闻想象出来的“家”。只好乘车返回。",tpl:"回到镇上以后，人们都在说：【主语】【谓语】【宾语】。",p1:["森林里的巨人","广场的许愿泉","会飞的面包"],p2:["会实现","会吃掉","会让所有人忘记"],p3:["任何愿望","进入森林的孩子","自己最讨厌的事情"]},
{scene:"失控的コトノハ町",story:"你们回来时，小镇已经乱了套。所有人都学会了制造传闻。现在你们必须用新的传闻修正旧的现实，才能再次尝试回家。",tpl:"为了修复小镇，你们创造：【主语】【谓语】【宾语】。",p1:["森林里的巨人","广场的许愿泉","所有会说话的动物"],p2:["只会帮助","必须归还","会一起保护"],p3:["迷路的人","实现愿望得到的东西","这座小镇"]},
{scene:"第二次来到旧车站",story:"小镇终于安静下来。Mio问：『这一次，你们还要让所有人替你们决定“家”是什么吗？』",tpl:"最后的传闻：【主语】【谓语】【宾语】。",p1:["我们三个人","午夜列车","真正的家"],p2:["只相信","会沿着","存在于"],p3:["自己亲身经历过的记忆","我们自己的记忆前进","不需要别人证明的地方"]}
];
let r=0,pick=null,history=[],revealed=false;
const $=x=>document.getElementById(x); const esc=s=>s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function ai(arr,offset){return arr[(r+offset)%arr.length]}
function render(){
 $("day").textContent="DAY "+(r+1)+" / "+rounds.length;let x=rounds[r];
 $("app").innerHTML='<section class="card"><div class="tag">'+(r<3?"传闻实验":r===3?"转折":r===4?"修复":"最后一次")+'</div><div class="scene">'+x.scene+'</div><div class="story">'+x.story+'</div></section>'+
 '<section class="card"><div class="muted">今天的句型</div><div class="rumor">'+x.tpl+'</div><div class="slots">'+
 '<div class="slot"><h3>玩家1 · 你负责【主语】</h3><div class="choices">'+x.p1.map((v,i)=>'<button class="choice '+(pick===i?"sel":"")+'" data-i="'+i+'">'+v+'</button>').join("")+'</div></div>'+
 '<div class="slot"><h3>玩家2 · 【谓语】</h3><div class="hiddenPick">🔒 已经秘密选择</div><div class="muted">揭晓前你不知道TA选了什么。</div></div>'+
 '<div class="slot"><h3>玩家3 · 【宾语】</h3><div class="hiddenPick">🔒 已经秘密选择</div><div class="muted">揭晓前你不知道TA选了什么。</div></div></div>'+
 '<div class="talk">💬 你可以猜他们会选什么，但这一版 Demo 中不能直接看到答案。先根据当前世界，选你想放进去的词。</div>'+
 '<button class="btn" id="reveal" '+(pick===null?"disabled":"")+'>三人同时揭晓</button></section>'+
 (history.length?'<section class="card"><div class="tag">这个世界已经记住</div>'+history.map(h=>'<div class="history">DAY '+h.day+'　'+esc(h.text)+'</div>').join("")+'</section>':'');
 document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{pick=+b.dataset.i;render()});$("reveal").onclick=reveal;
}
function makeEffect(text){
 if(r===0)return "夜里，镇上的人开始重复这句话。\n\n第二天早上——它真的发生了。\n\nMio看着你们：『所以……传闻真的会改变这里。』";
 if(r===1)return "第二天，这条传闻成为了小镇的一部分。\n\n昨天创造的现实没有消失。新的传闻直接叠在旧世界上。";
 if(r===2)return "午夜十二点，旧铁轨开始震动。\n\n你们拼出来的传闻真的创造了回家的办法。银色列车停在月台前。\n\n三个人决定上车。";
 if(r===3)return "当你们再次返回コトノハ町，这条新传闻也已经开始现实化。\n\n街上到处都是别人的传闻：会飞的房子、倒着流的河、突然消失的道路……\n\n你们终于意识到：这里的每个人都在试图让自己的故事成为现实。";
 if(r===4)return "新的传闻覆盖了部分失控的现实。\n\n但你们没有把小镇恢复成最初的样子——有些奇怪而美好的东西被保留了下来。";
 return "午夜列车再次来到旧车站。\n\n这一次，没有全镇的人替你们描述“家”。\n\n列车沿着三个人真正拥有的记忆前进。";
}
function reveal(){
 let x=rounds[r],a=x.p1[pick],b=ai(x.p2,1),c=ai(x.p3,2),text=a+b+c;history.push({day:r+1,text});
 $("app").innerHTML='<section class="card"><div class="tag">三人同时揭晓</div><div class="slots"><div class="slot"><h3>玩家1</h3>'+a+'</div><div class="slot"><h3>玩家2</h3>'+b+'</div><div class="slot"><h3>玩家3</h3>'+c+'</div></div><div class="rumor">「'+text+'。」</div><div class="muted">没有任何一个人单独写出这句话，但从现在开始，它属于整个小镇。</div></section>'+
 '<section class="card"><div class="tag">第二天 · 现实化</div><div class="effect">'+makeEffect(text)+'</div><button class="btn" id="next">'+(r===rounds.length-1?"查看结局":"进入第二天")+'</button></section>';
 $("next").onclick=next;
}
function next(){if(r===rounds.length-1){$("day").textContent="END";$("app").innerHTML='<section class="card"><div class="tag">DEMO END</div><div class="scene">这一次，列车没有走错。</div><div class="ending">三个孩子回到了真正的世界。<br><br>这一局里，你每次只控制一句话的一部分，但你和另外两个人共同创造的句子，连续六天改变了整个世界。<br><br><b>你控制的是自己的词，却控制不了它最后会和什么组合，也控制不了它成为现实之后会发生什么。</b><br><br><span class="warn">这就是这个 Demo 现在唯一想测试的核心乐趣。</span></div></section><section class="card"><div class="tag">本局生成的传闻</div>'+history.map(h=>'<div class="history">DAY '+h.day+'　'+esc(h.text)+'</div>').join("")+'<button class="btn secondary" onclick="location.reload()">再玩一次</button></section>';return}r++;pick=null;render()}
render();
</script></body></html>

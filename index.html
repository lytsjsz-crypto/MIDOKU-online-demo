<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>未读 MIDOKU｜第一章 demo</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#080909;color:#e8e6df;font-family:"Songti SC","Noto Serif SC",serif;background-image:radial-gradient(circle at 50% -20%,#342d2444,transparent 48%),linear-gradient(#090a09,#11100e)}
.wrap{max-width:760px;margin:auto;padding:30px 18px 80px}.logo{letter-spacing:.28em;font-weight:800;font-size:22px}.sub,.muted{color:#8e8a80;font:13px -apple-system,BlinkMacSystemFont,sans-serif}.card{margin-top:22px;padding:26px;border:1px solid #3c3931;border-radius:3px;background:#11110fdd;box-shadow:0 30px 80px #000a}.line{height:1px;background:#3b372f;margin:22px 0}.title{font-size:29px;letter-spacing:.12em;margin:12px 0}.story{line-height:2;white-space:pre-line}.btn,input{width:100%;border:1px solid #555044;background:#181713;color:#eee9dc;padding:15px 16px;font-size:15px}.btn{cursor:pointer;text-align:left;margin-top:10px}.btn:hover{background:#252119}.primary{text-align:center;background:#ded8c9;color:#171612;font-weight:800}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tag{font:12px -apple-system,sans-serif;letter-spacing:.15em;color:#b9ad91}.secret{border-left:2px solid #75674a;padding:4px 0 4px 17px;margin:22px 0}.status{font-family:-apple-system,sans-serif;padding:14px;border:1px solid #403c33;margin-top:16px;color:#bbb4a4}.glitch{animation:g .09s 5}@keyframes g{25%{transform:translateX(4px)}60%{transform:translateX(-3px);filter:blur(.4px)}}.blood{color:#b16f62}.hide{display:none}@media(max-width:560px){.two{grid-template-columns:1fr}.card{padding:20px}.title{font-size:24px}}
</style></head><body><main class="wrap"><div class="logo">未读 MIDOKU</div><div class="sub">第一章试作 · 黄泉比良坂</div><section id="app" class="card"></section></main>
<script>
const URL="https://ifmhbjrhlecksnyjcczq.supabase.co",KEY="sb_publishable_yeJtFDUCSeUxpfCyWrClgg_TUAUcI5k",sb=supabase.createClient(URL,KEY);
let S=null,room="",slot=0,name="",ch=null;const app=document.querySelector("#app");
const esc=x=>String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function lobby(){app.innerHTML='<div class="tag">SESSION SETUP</div><div class="title">黄泉比良坂</div><div class="story">人数を選び、名を記せ。\n今夜、山を越える者の名を。</div><div class="line"></div><label class="muted">游玩人数</label><div class="two"><button class="btn" onclick="players=2;drawNames()">2 人</button><button class="btn" onclick="players=3;drawNames()">3 人</button></div><div id="names"></div>'}
let players=0;
window.drawNames=()=>{document.querySelector("#names").innerHTML='<div class="line"></div>'+Array.from({length:players},(_,i)=>'<input id="n'+(i+1)+'" maxlength="12" placeholder="玩家 '+(i+1)+' 的 ID">').join('')+'<input id="room" maxlength="12" placeholder="房间码（所有设备相同）"><button class="btn primary" onclick="enter()">刻下名字，进入山道</button>'}
window.enter=async()=>{room=(document.querySelector("#room").value.trim()||"YOMI").toUpperCase();let names=Array.from({length:players},(_,i)=>document.querySelector("#n"+(i+1)).value.trim()||("旅人"+(i+1)));let {data}=await sb.from("midoku_rooms").select("*").eq("room_code",room).maybeSingle();if(!data){let r=await sb.from("midoku_rooms").insert({room_code:room}).select().single();data=r.data}S=data;let used=[S.player1_name,S.player2_name,S.player3_name];slot=used.findIndex(x=>!x)+1;if(slot<1||slot>players)slot=1;name=names[slot-1];await sb.from("midoku_rooms").update({["player"+slot+"_joined"]:true,["player"+slot+"_name"]:name,player_count:players,phase:"arrival"}).eq("room_code",room);subscribe();refresh()}
function subscribe(){ch=sb.channel("yomi-"+room).on("postgres_changes",{event:"UPDATE",schema:"public",table:"midoku_rooms",filter:"room_code=eq."+room},p=>{S=p.new;render()}).subscribe()}
async function refresh(){let r=await sb.from("midoku_rooms").select("*").eq("room_code",room).single();S=r.data;render()}
function names(){return [S.player1_name,S.player2_name,S.player3_name].filter(Boolean)}
function render(){let count=S.player_count||2,joined=[S.player1_joined,S.player2_joined,S.player3_joined].slice(0,count).filter(Boolean).length;
if(joined<count){app.innerHTML='<div class="tag">ROOM '+esc(room)+'</div><div class="title">山门尚未开启</div><div class="story">'+esc(name)+'，你已抵达。\n'+joined+' / '+count+' 人已刻名。</div><div class="status">请让其他玩家使用同一房间码进入。</div>';return}
if(S.phase==="arrival"){app.innerHTML='<div class="tag">第一章 · 黄泉比良坂</div><div class="title">不能回头的山道</div><div class="story">雨停之后，你们在山中醒来。\n\n身后的路已经不见了。前方只有一座腐朽的鸟居，鸟居下摆着 '+count+' 盏纸灯。每一盏灯上，都写着你们刚才输入的名字。\n\n石碑上只有一句话：\n<span class="blood">「过此坂者，不可回首。」</span>\n\n远处传来女人的脚步声。她似乎正从山的另一侧，向这里走来。</div><button class="btn primary" onclick="begin()">提灯，进入山道</button>';return}
let clue=slot===1?"你提起纸灯时，灯底沾着尚未干透的泥。泥里压着一个人的指纹——纹路和你的右手完全一致。可你确定，自己从未到过这里。":slot===2?"鸟居背面刻着一行极浅的字。你凑近后认出那是自己的笔迹：『如果他问起第三十一人，不要回答。』": "风吹过时，你听见身后有人叫出了你的名字。声音与你一模一样。与此同时，其他人的灯火没有任何变化。";
if(S.phase==="choice"){app.innerHTML='<div class="tag">ROOM '+esc(room)+' · '+esc(name)+'</div><div class="title">纸灯</div><div class="story">山道分成两条。左侧通往有灯火的旧社，右侧沿河而下，尽头看不见。\n\n你们可以说话。你可以说真话，也可以隐瞒，甚至撒谎。</div><div class="secret"><div class="tag">灯影里浮出的字</div><div class="story">'+esc(clue)+'</div></div><div class="line"></div><div class="muted">决定前，你可以试着让别人相信你。</div><button class="btn" onclick="vote(0)">沿灯火，去旧社</button><button class="btn" onclick="vote(1)">沿河而下，不进旧社</button>';return}
if(S.phase==="omen"){let v=[S.player1_choice,S.player2_choice,S.player3_choice].slice(0,count),left=v.filter(x=>x===0).length,right=v.filter(x=>x===1).length;let omen=left===right?"你们的意见没有汇成一条路。两边的灯同时熄灭。黑暗里，多出了一串不属于任何人的脚步声。":left>right?"多数人走向旧社。最后一个人跨过鸟居时，所有人的屏幕同时抖了一下。\n\n再亮起时，名册上多了一行：\n\n「第31人　已归还」":"多数人选择沿河而下。河面开始倒映你们的脸。\n\n但倒影比岸上的人数，多了一个。";
app.innerHTML='<div class="tag">异常 01</div><div class="title glitch">记录发生偏移</div><div class="story">'+esc(omen)+'</div><div class="status">没有人获得修改选择的机会。刚才的决定已经成为世界的一部分。</div><button class="btn primary" onclick="finish()">继续</button>';return}
app.innerHTML='<div class="tag">第一章 · END</div><div class="title">身后之人</div><div class="story">你们继续向山里走。\n\n走出很远以后，最前面的人忽然发现：地上一直有 '+(count+1)+' 道影子。\n\n没有人回头。\n\n至少，没有人承认自己回过头。</div><div class="line"></div><div class="story">第一章结束。\n你刚才告诉其他人的话，会在后面的章节里留下痕迹。</div>'}
window.begin=async()=>{await sb.from("midoku_rooms").update({phase:"choice",player1_choice:null,player2_choice:null,player3_choice:null}).eq("room_code",room)}
window.vote=async v=>{await sb.from("midoku_rooms").update({["player"+slot+"_choice"]:v}).eq("room_code",room);let r=await sb.from("midoku_rooms").select("*").eq("room_code",room).single(),d=r.data,c=d.player_count||2,a=[d.player1_choice,d.player2_choice,d.player3_choice].slice(0,c);if(a.every(x=>x!==null))await sb.from("midoku_rooms").update({phase:"omen"}).eq("room_code",room);else{app.innerHTML='<div class="tag">选择已刻下</div><div class="title">等待</div><div class="story">你的纸灯熄灭了一瞬。\n其他人还没有全部作出决定。</div>'}}
window.finish=async()=>await sb.from("midoku_rooms").update({phase:"chapter1_end"}).eq("room_code",room)
lobby();
</script></body></html>

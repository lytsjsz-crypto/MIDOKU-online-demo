<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>URI｜什么都能卖</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f4f1;color:#171717;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans SC",sans-serif}.app{max-width:520px;margin:auto;min-height:100vh;background:#fff;border-left:1px solid #ddd;border-right:1px solid #ddd}.top{position:sticky;top:0;z-index:3;background:#fff;padding:18px 18px 12px;border-bottom:1px solid #eee}.brand{font-size:27px;font-weight:900;letter-spacing:.16em}.brand span{font-size:10px;letter-spacing:.08em;font-weight:500;margin-left:8px;color:#777}.balance{float:right;font-size:14px;margin-top:8px}.main{padding:16px 16px 92px}.search{display:flex;gap:8px}.search input{flex:1;border:1px solid #ccc;border-radius:9px;padding:14px;font-size:16px}.search button,.btn{border:0;border-radius:9px;background:#171717;color:#fff;padding:13px 16px;font-weight:700;cursor:pointer}.hint{font-size:12px;color:#777;margin:10px 2px 18px}.item{border:1px solid #e0e0dc;border-radius:12px;padding:15px;margin:10px 0;background:#fff}.item .name{font-weight:800;font-size:17px}.price{font-size:20px;font-weight:900;margin-top:7px}.meta{font-size:12px;color:#777;margin-top:5px}.tag{display:inline-block;background:#eee;padding:4px 7px;border-radius:5px;font-size:10px;margin-bottom:8px}.danger{background:#171717;color:#fff}.notice{padding:13px;border-radius:9px;background:#f1f1ed;line-height:1.6;margin:12px 0}.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:20px;z-index:5}.box{width:min(440px,100%);background:#fff;border-radius:15px;padding:22px}.box h2{margin:0 0 8px}.row{display:flex;gap:8px;margin-top:15px}.row button{flex:1}.ghost{background:#eee;color:#222}.nav{position:fixed;bottom:0;width:min(518px,100%);display:grid;grid-template-columns:repeat(3,1fr);background:#fff;border-top:1px solid #ddd}.nav button{border:0;background:#fff;padding:15px 5px;font-size:12px;cursor:pointer}.nav .on{font-weight:900}.story{line-height:1.7}.sold{text-decoration:line-through;opacity:.5}.flash{animation:f .45s 2}@keyframes f{50%{opacity:.2}}</style></head><body><div class="app"><header class="top"><span class="brand">URI <span>売ります</span></span><span class="balance" id="bal">¥0</span></header><main class="main" id="main"></main><nav class="nav"><button onclick="page=\'home\';render()">市场</button><button onclick="page=\'bag\';render()">包裹</button><button onclick="page=\'me\';render()">我的</button></nav></div><script>
let page="home",money=0,day=1,tx=[],teacherGone=false,firstSold=false,owned=[{name:"数学の宿題",kind:"物品",desc:"明日提出。まだ半分しか終わっていない。",price:240},{name:"担任教師",kind:"関係",desc:"あなたのクラスの担任。",price:3840},{name:"親友との約束",kind:"約束",desc:"放課後、一緒に帰る約束。",price:1600},{name:"昨日の記憶",kind:"記憶",desc:"昨日一日についての記憶。",price:2600},{name:"自分の名前",kind:"自分",desc:"あなたをあなたとして呼ぶための名前。",price:0}],catalog=[
{name:"明日の数学テストの答え",price:1200,tag:"今日のおすすめ"},
{name:"知らない人の秘密",price:300,tag:"NEW"},
{name:"雨の日",price:80,tag:"残り1"},
{name:"昨日の後悔",price:40,tag:"おすすめ"}
];
const main=document.querySelector("#main");function yen(n){return "¥"+n.toLocaleString()}
function render(){document.querySelector("#bal").textContent=yen(money);document.querySelectorAll(".nav button").forEach((b,i)=>b.classList.toggle("on",["home","bag","me"][i]===page));if(page==="home")home();if(page==="bag")bag();if(page==="me")me()}
function home(){let special=teacherGone?'<div class="item"><span class="tag danger">再出品</span><div class="name">担任教師</div><div class="price">¥7,680</div><div class="meta">誰かが手放したものです · 残り 09:42</div><button class="btn" style="margin-top:12px;width:100%" onclick="buyTeacher()">購入する</button></div>':"";main.innerHTML='<div class="search"><input placeholder="商品を検索"><button>検索</button></div><div class="hint">人、記憶、約束、明日——検索できるものは取引できます。</div>'+special+catalog.map(x=>'<div class="item"><span class="tag">'+x.tag+'</span><div class="name">'+x.name+'</div><div class="price">'+yen(x.price)+'</div><div class="meta">URIマーケット</div><button class="btn ghost" style="margin-top:10px" onclick="buy(\''+x.name+'\','+x.price+')">購入</button></div>').join("")}
function bag(){main.innerHTML='<h2>我的包裹</h2><div class="hint">这里是当前真正属于你的东西。点击物品可以查看URI的估价。</div>'+(owned.length?owned.map((x,i)=>'<div class="item"><span class="tag">'+x.kind+'</span><div class="name">'+x.name+'</div><div class="meta">'+x.desc+'</div><div class="price">'+yen(x.price)+'</div><button class="btn" style="width:100%;margin-top:12px" onclick="sellOwned('+i+')">出售这个</button></div>').join(""):'<div class="notice"><b>包裹是空的。</b><br>你已经没有可以出售的东西了吗？</div>')+'<div class="hint">实验功能：也可以尝试出售包裹里没有列出的东西。</div><button class="btn ghost" style="width:100%" onclick="page=\'sell\';render()">输入其他东西</button>'}
window.sellOwned=i=>{let x=owned[i];modal('<span class="tag">'+x.kind+'</span><h2>'+x.name+'</h2><div class="story">'+x.desc+'<br><br>URI査定：<b>'+yen(x.price)+'</b><br><br>出售后，它会从你的包裹和生活中一起消失。</div><div class="row"><button class="btn ghost" onclick="closeM()">不卖</button><button class="btn" onclick="doSellOwned('+i+')">卖掉</button></div>')}
window.doSellOwned=i=>{let x=owned[i];owned.splice(i,1);closeM();doSell(x.name,x.price)}
function sell(){main.innerHTML='<h2>何を売りますか？</h2><div class="search"><input id="thing" autocomplete="off" placeholder="例：数学の宿題"><button onclick="assess()">査定</button></div><div class="hint">あなたが所有しているものなら、何でも査定できます。</div><div id="quote"></div>'}
window.assess=()=>{let v=document.querySelector("#thing").value.trim();if(!v)return;let p=priceOf(v);document.querySelector("#quote").innerHTML='<div class="item flash"><span class="tag">査定結果</span><div class="name">'+esc(v)+'</div><div class="price">'+yen(p)+'</div><div class="meta">出售后，该商品将从你的生活中移除。</div><button class="btn" style="width:100%;margin-top:14px" onclick="confirmSell(\''+esc(v).replace(/'/g,"\\'")+'\','+p+')">出品する</button></div>'}
function priceOf(v){if(/老师|教師|先生|班主任/.test(v))return 3840;if(/作业|宿題/.test(v))return 240;if(/考试|テスト/.test(v))return 900;if(/名字|名前/.test(v))return 0;if(/朋友|友達/.test(v))return 12000;if(/记忆|記憶/.test(v))return 2600;let sum=[...v].reduce((a,c)=>a+c.charCodeAt(0),0);return (sum%90+10)*10}
window.confirmSell=(v,p)=>modal('<h2>真的要卖掉「'+v+'」吗？</h2><div class="story">成交以后，它会从你的生活中消失。<br><br><b>査定価格 '+yen(p)+'</b></div><div class="row"><button class="btn ghost" onclick="closeM()">取消</button><button class="btn" onclick="doSell(\''+v.replace(/'/g,"\\'")+'\','+p+')">卖掉</button></div>');
window.doSell=(v,p)=>{closeM();money+=p;tx.unshift({type:"出售",name:v,price:p});firstSold=true;if(/老师|教師|先生|班主任/.test(v)){teacherGone=true;page="home";render();setTimeout(()=>modal('<span class="tag">翌日 08:20</span><h2>第一节课开始了。</h2><div class="story">教室里很吵。<br><br>有人问：“今天谁上数学？”<br><br>所有人都愣了一下。<br><br><b>没有人记得你们有过班主任。</b></div><div class="row"><button class="btn" onclick="closeM()">打开URI</button></div>'),200)}else{page="me";render();setTimeout(()=>modal('<h2>成交しました</h2><div class="story">「'+v+'」已经不属于你。<br><br>账户余额：<b>'+yen(money)+'</b></div><div class="row"><button class="btn" onclick="closeM()">知道了</button></div>'),100)}}
function me(){main.innerHTML='<h2>我的</h2><div class="notice">余额 <b>'+yen(money)+'</b><br>交易 '+tx.length+' 件</div>'+(tx.length?tx.map(x=>'<div class="item"><div class="meta">'+x.type+'</div><div class="name">'+x.name+'</div><div class="price">'+(x.type==="出售"?"+":"-")+yen(x.price)+'</div></div>').join(""):'<div class="hint">还没有交易记录。</div>')+(firstSold?'<button class="btn ghost" style="width:100%;margin-top:20px" onclick="mystery()">刷新交易记录</button>':"")}
window.buy=(n,p)=>{if(money<p)return modal('<h2>余额不足</h2><div class="story">还差 <b>'+yen(p-money)+'</b>。<br><br>URI提示：<b>你还拥有很多可以出售的东西。</b></div><div class="row"><button class="btn" onclick="closeM();page=\'bag\';render()">看看包裹</button></div>');money-=p;owned.push({name:n,kind:"購入品",desc:"URIマーケットで購入したもの。",price:p});tx.unshift({type:"购买",name:n,price:p});render()}
window.buyTeacher=()=>buy("担任教師",7680);
window.mystery=()=>{tx.unshift({type:"购买",name:"あなた",price:0});render();setTimeout(()=>modal('<span class="tag danger">取引履歴が更新されました</span><h2>你没有进行过这笔交易。</h2><div class="story">商品：<b>あなた</b><br>価格：<b>¥0</b><br>購入者：<b>非公開</b></div><div class="row"><button class="btn" onclick="closeM()">……</button></div>'),120)}
function modal(h){let d=document.createElement("div");d.className="modal";d.id="modal";d.innerHTML='<div class="box">'+h+'</div>';document.body.appendChild(d)}window.closeM=()=>document.querySelector("#modal")?.remove();function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
render();setTimeout(()=>modal('<span class="tag">招待コード適用済み</span><h2>URIへようこそ。</h2><div class="story">这里什么都可以买。<br>也什么都可以卖。<br><br><b>首次出售免手续费。</b></div><div class="row"><button class="btn" onclick="closeM();page=\'bag\';render()">打开我的包裹</button></div>'),250);
</script></body></html>

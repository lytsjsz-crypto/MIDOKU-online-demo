<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>コトノハ町</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f2e8;color:#24231f;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.wrap{max-width:790px;margin:auto;padding:34px 20px 80px}.head{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid #393832;padding-bottom:10px;margin-bottom:30px}.logo{font:25px Georgia,serif;letter-spacing:.12em}.meta,.eyebrow{font-size:11px;color:#77736a;letter-spacing:.11em}.title{font:25px/1.5 Georgia,"Noto Serif SC",serif;margin:8px 0 14px}.story{font-size:15px;line-height:1.9}.dialogue{font:16px/1.9 Georgia,"Noto Serif SC",serif;margin:18px 0;padding-left:15px;border-left:2px solid #aaa59a}.box{border:1px solid #aaa59a;margin-top:30px;padding:20px}.gamehead{font:20px/1.5 Georgia,"Noto Serif SC",serif;margin-bottom:8px}.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}.slot{border:1px solid #c0bbb0;padding:10px;font-size:12px}.slot b{display:block;font-size:14px;margin-top:4px}.slot.you{border:2px solid #282722}@media(max-width:620px){.slots{grid-template-columns:1fr 1fr}}.choices{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.choice{border:1px solid #99948a;background:transparent;padding:13px;text-align:left;cursor:pointer;font-size:14px;min-height:48px}.choice:hover,.choice.sel{background:#282722;color:#fff}.btn{border:1px solid #282722;background:#282722;color:#fff;padding:12px 19px;margin-top:20px;cursor:pointer}.btn:disabled{opacity:.3}.btn.alt{background:transparent;color:#282722}.note{font-size:12px;color:#817d74;margin-top:12px}.reveal{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:20px 0}.word{border-top:1px solid #817d74;padding-top:8px;font-size:14px}.word small{display:block;color:#88837a;font-size:11px;margin-bottom:5px}.sentence{font:25px/1.65 Georgia,"Noto Serif SC",serif;margin:25px 0}.after{border-top:1px solid #aaa59a;border-bottom:1px solid #aaa59a;padding:18px 0;margin:22px 0;font-size:15px;line-height:1.9}.chapter{font:29px/1.7 Georgia,"Noto Serif SC",serif;margin:35px 0}.end{font-size:16px;line-height:2}@media(max-width:620px){.choices{grid-template-columns:1fr}.reveal{grid-template-columns:1fr}.title{font-size:22px}.sentence{font-size:21px}}
</style></head><body><main class="wrap"><header class="head"><div class="logo">コトノハ町</div><div class="meta" id="meta">PROTOTYPE 08B</div></header><div id="app"></div></main><script>
const scenes=[
{kind:"story",d:0,p:"星期五・放学后",t:"本来只是坐错了一班车。",x:"社团活动结束得太晚。你们冲上站台时，平时坐的电车刚关门。\n\n对面停着一辆银色电车。线路图上有回家的方向，四个人没多想就跑了进去。\n\n前几站都很正常。后来LINE发不出去，地图也一直转圈。再抬头时，车厢里只剩你们四个。\n\n『下一站，终点——コトノハ町。』",dialog:"下车后，银色电车开进雾里。你们原路跑回去。\n\n站台没了，连铁轨都没了。有人摸了摸口袋里的Suica。卡还在，可这里连闸机都没有。"},
{kind:"play",d:1,p:"镇口・傍晚",t:"你们得先告诉别人，自己是怎么来的。",x:"沿着唯一一条路走了十分钟，前面终于出现房子。杂货店老板看见四个穿外地校服的孩子，先递来一杯水。\n\n『迷路了？家里电话呢？』\n\n手机还是没有信号。你们只好说，自己刚从车站下来。老板往你们身后看：『车站？那边只有草地。』",prompt:"老板把杯子放下：『那你们再说清楚——刚才到底发生了什么？』",test:"谓语",slots:{time:["刚才","放学以后","天黑以前","傍晚六点左右"],sub:["那辆银色电车","最后一节车厢","一个没见过的乘务员","我们四个"],verb:["把我们送到了","停在了","开进了","消失在了"],obj:["这个小镇","没有铁轨的草地旁","森林前的空地","雾里面"]},after:["老板把这句话完整地重复了一遍。","旁边买酱油的佐藤太太也听见了。她离开时，只记住了其中最奇怪的几个词。"]},
{kind:"story",d:1,p:"面包店・晚上",t:"一句话比你们先到了面包店。",x:"杂货店老板叫来自己的女儿Mio。她和你们差不多大，答应先带你们找吃的。\n\n推开面包店的门，老板娘抬头就问：『就是你们啊？我刚听说——{{last}}』\n\n你们四个一起愣住。刚才那句话已经被改了一点。\n\nMio小声说：『佐藤太太走得也太快了。』",dialog:"晚上，你们暂时住进Mio家的阁楼。Mio说镇上根本没有车站。桌上的Suica一下显得很没用。"},
{kind:"play",d:2,p:"Mio家・早餐",t:"第二天，“车站”已经有了名字。",x:"Mio妈妈端来牛奶：『你们就是从旧车站来的孩子吧？』\n\nMio差点把杯子碰倒：『什么旧车站？』\n\n『大家都这么说啊。』\n\n你们昨天谁也没说过“旧车站”。",prompt:"Mio看向你们：『先别管别人怎么传。你们下车以后，真正看见过什么？』",test:"宾语",slots:{time:["下车以后","天黑以前","回头找站台时","离开草地以前"],sub:["我们四个","走在最后的人","一只乌鸦","Mio的爸爸"],verb:["看见了","捡到了","发现了","踩到了"],obj:["一张旧车票","半块写着“駅”的纸片","一块生锈的小铁牌","另一张Suica"]},after:["Mio没有马上说话，只把这件事记了下来。","『今天带你们逛镇子。要是真有这种东西，也许会在哪儿再碰见。』"]},
{kind:"play",d:2,p:"镇中心・小广场",t:"你们开始认识这个镇子。",x:"Mio带你们经过修钟店、河岸和小广场。修钟老人的店里挂着十几只时间不同的钟；河边有人卖装在瓶子里的“昨天的雨”。\n\n走到广场时，几个孩子正在画一张根本不存在的“旧车站地图”。一个说入口肯定在森林，另一个坚持只有晚上才看得到。\n\n有人认出你们，立刻围了过来。\n\n『你们真的去过旧车站？』\n『那里有什么？』\n『谁知道入口？』\n\nMio想说“他们根本没说过有旧车站”，但没人听。",prompt:"一个小孩把画到一半的地图递过来：『那至少告诉我们，谁跟旧车站有关系？』",test:"主语",slots:{time:["昨天晚上","今天早上","很久以前","我们来到这里以前"],sub:["Mio","修钟老人","森林里的乌鸦","广场上的猫"],verb:["见过","藏过","捡到过","带回来过"],obj:["一张旧车票","写着“駅”的纸片","一把生锈的钥匙","旧车站的照片"]},after:["孩子们一下安静了，然后同时开始说话。","有人把这句话抄到了地图边上。另一个孩子已经抱着地图跑去给朋友看。"]},
{kind:"story",d:3,p:"Mio家・早晨",t:"昨天的怪话，留下了一个小东西。",x:"第二天出门前，你在笔袋里摸到一张发黄的纸片。\n\n上面只剩半个模糊的『駅』字。\n\nMio盯着它，又想起昨天广场上那群孩子。\n\n『他们昨天说的东西……不会真的开始出现了吧。』",dialog:"没人知道是谁放进去的。你把纸片夹进课本，照常出门。"},
{kind:"play",d:3,p:"河边・下午",t:"河里又出现了一个『駅』字。",x:"钓鱼的大叔从水里捞起一块生锈铁牌，上面同样剩着一个『駅』字。围观的人马上说这是旧车站的东西。\n\n修钟老人却摆摆手：『一个字而已。你们最近什么都往旧车站上扯。』\n\nMio把你课本里的纸片也拿出来。两样东西摆在一起。",prompt:"老人看向你们：『行，那你们说。这些东西到底是怎么跑到镇上来的？』",test:"时间",slots:{time:["昨天下午","昨晚","今天早上","很久以前"],sub:["森林里的乌鸦","河边的钓鱼大叔","广场上的猫","一个没人认识的小孩"],verb:["叼来了","捡到了","从森林带回了","藏起了"],obj:["这块旧站牌","那张旧纸片","一张旧车票","一张绿色的Suica"]},after:["修钟老人哼了一声，没有说信，也没有说不信。","回去的路上，一只乌鸦真的落在电线上。它嘴里叼着一小片绿色的东西，然后朝森林飞了。","Mio抬头看着它：『……明天去森林看看？』"]},
{kind:"story",d:4,p:"森林入口",t:"你们不是来找车站的。至少一开始不是。",x:"Mio说只是去看看那只乌鸦飞去了哪里。她背了汽水和饭团，还特地提醒你们天黑前回来。\n\n森林最初很普通。直到半山腰，一块写着『山顶 →』的路标，在你们喝完汽水以后变成了『今天别去山顶 →』。",dialog:"四个人都记得刚才不是这句话。"},
{kind:"play",d:4,p:"森林・半山腰",t:"路标不可能自己改字。",x:"Mio蹲下来摸了摸墨迹。还是湿的。\n\n树上有东西扑棱了一声。",prompt:"Mio抬头：『刚才我们没看路标的时候，到底发生了什么？』",test:"宾语",slots:{time:["刚才","我们喝汽水的时候","几分钟前","转过弯以后"],sub:["森林里的乌鸦","走在最后的人","一只灰色的猫","一个没见过的小孩"],verb:["叼走了","藏起了","放下了","碰过了"],obj:["Mio的手表","我的便当盒","一支钢笔","这块路标"]},after:["话音刚落，树上传来第二声扑棱。","你们追着声音往前走。第一只乌鸦叫『面包——』，第二只叫『外地孩子——』。","再深一点，一排乌鸦同时叫起来：『旧车站——旧车站——』"]},
{kind:"story",d:5,p:"森林深处",t:"连乌鸦都知道了旧车站。",x:"你们一路追到昨天从没来过的空地。草下面露出两根生锈的铁条，只有十几米长，前后都埋在泥里。\n\nMio蹲下来很久。\n\n『如果大家一直说森林里有旧车站……』\n\n她没有把后半句说完，只拿出一枚硬币压在铁轨旁边。『明天再来。』",dialog:"回镇时，采蘑菇的老人正从另一条小路下来。"},
{kind:"play",d:5,p:"森林出口・黄昏",t:"老人却觉得铁轨没什么奇怪的。",x:"他看见你们满鞋的泥，笑着问是不是跑到森林深处去了。\n\nMio试探着问：『里面以前有铁轨吗？』\n\n老人皱眉：『以前？』",prompt:"他反过来问你们：『你们今天到底看到什么了？』",test:"主语",slots:{time:["今天下午","刚才","太阳落山以前","进森林以后"],sub:["我们四个","Mio","森林里的乌鸦","修钟老人"],verb:["找到了","走到了","看见了","发现了"],obj:["草下面的两根铁轨","森林深处的空地","一块歪掉的站牌","通向雾里的旧路"]},after:["老人听完反而更困惑。","『那不就是旧站那边吗？』他说得太自然，像是在说一间一直都在的杂货店。","Mio没有争辩。她只说：『明天我们再去一次。』"]},
{kind:"story",d:6,p:"森林・黄昏",t:"硬币还在。铁轨却变长了。",x:"第二天，昨天压在旁边的硬币还在原处。\n\n但两根铁轨已经穿过树林。尽头多了一块歪斜站牌，再往前是长椅、封死的售票窗口和褪色的时刻表。\n\n站牌写着：コトノハ町。\n\nMio站了很久：『昨天这里什么都没有。』\n\n身后却有人慢悠悠走过来：『你们怎么跑到旧站来了？』",dialog:"站台尽头没有列车，只有一条钻进雾里的铁轨。长椅旁立着一台锈死的旧闸机。你摸到了口袋里的Suica。"}
];
let i=0,pick=null,lastSentence="";
const $=x=>document.getElementById(x),E=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function fill(s){return String(s||"").replace(/{{last}}/g,lastSentence||"那辆银色电车把几个外地孩子送到了不存在的车站")}
function auto(arr,n){return arr[(i*3+n*2)%arr.length]}
function render(){let s=scenes[i];$("meta").textContent=(s.d?"DAY "+s.d:"PROLOGUE")+" · "+(i+1)+"/"+scenes.length;let base='<div class="eyebrow">'+s.p+'</div><h1 class="title">'+s.t+'</h1><div class="story">'+fill(s.x).replace(/\n/g,"<br>")+'</div><div class="dialogue">'+fill(s.dialog).replace(/\n/g,"<br>")+'</div>';if(s.kind==="story"){$("app").innerHTML=base+'<button class="btn" id="next">翻页</button>';$("next").onclick=next;return}let op=s.slots[s.test];$("app").innerHTML=base+'<section class="box"><div class="dialogue">'+s.prompt+'</div><div class="eyebrow">你负责【'+s.test+'】</div><div class="choices">'+op.map((v,n)=>'<button class="choice '+(pick===n?"sel":"")+'" data-n="'+n+'">'+E(v)+'</button>').join("")+'</div><div class="note">另外三个人已经选好了。翻开前，你看不到他们的词。</div><button class="btn" id="go" '+(pick===null?"disabled":"")+'>四人一起翻开</button></section>';document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{pick=+b.dataset.n;render()});$("go").onclick=()=>reveal(s)}
function reveal(s){let roles=["时间","主语","谓语","宾语"],keys=["time","sub","verb","obj"],v={};for(let n=0;n<4;n++){let role=roles[n],key=keys[n];v[role]=role===s.test?s.slots[key][pick]:auto(s.slots[key],n)}lastSentence=v["时间"]+"，"+v["主语"]+v["谓语"]+v["宾语"];let cards=roles.map(r=>'<div class="word"><small>'+r+'</small>'+E(v[r])+'</div>').join("");$("app").innerHTML='<div class="eyebrow">'+s.p+' · 一起翻开</div><div class="reveal">'+cards+'</div><div class="sentence">「'+E(lastSentence)+'。」</div><div class="after">'+s.after.map(x=>E(x)).join("<br><br>")+'</div><button class="btn" id="next">看看这句话发生了什么</button>';$("next").onclick=next}
function next(){if(i===scenes.length-1)return end();i++;pick=null;render()}
function end(){$("meta").textContent="第一阶段 · END";$("app").innerHTML='<div class="eyebrow">旧车站・黄昏</div><div class="chapter">几天前，这里只有草。<br>现在，所有人都记得这里有一座车站。</div><div class="end">一只乌鸦落到站牌上。<br><br>『旧车站——』<br><br>你看着锈死的闸机，又摸了摸Suica。<br><br><b>如果一座不存在的车站能被大家说出来，那辆送你们来的银色电车，是不是也能回来？</b></div><button class="btn alt" onclick="location.reload()">重新开始</button>'}
render();
</script></body></html>

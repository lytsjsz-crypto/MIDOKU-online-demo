{day:"星期五 · 17:38",place:"原来的车站",title:"差一点就赶上了",story:"部活结束得比平时晚。你们冲上站台时，平时坐的电车刚好关门。\n\n下一班要等二十分钟。有人看了一眼手机：‘我妈说六点前必须到家。’\n\n对面站台，一辆陌生的银色电车正敞着门。车内没有几个人，线路图上有一小段似乎和回家的方向重合。",dialog:"‘要不先坐这趟？中间换一下就好了。’\n\n‘你确定？’\n\n关门铃响了。大家互相看了一眼，跑上了车。",trigger:"电车启动后，熟悉的站名突然从线路图上消失。\n\n‘这辆车……到底要把我们带到哪儿？’",slot:"o",fixed:{s:"那辆银色电车",v:"把我们带到了"},opts:["一个没见过的小镇","平时换乘的车站","陌生的终点站","完全相反的方向"],event:o=>{M.arrive=o;return "窗外熟悉的街道一条条消失。车里只剩下你们。\n\n广播忽然响起：‘下一站，终点——言叶町。’\n\n‘……言叶町？我怎么从没听说过？’\n\n电车停在一座没有工作人员的小站。"},next:"下车，寻找回去的路"},
{day:"星期五 · 18:11",place:"荒草地 / 居民区",title:"刚才的站台去哪儿了？",story:"你们刚下车，银色电车就钻进了薄雾。\n\n大家走过一排矮房子，又沿原路折回来。可刚才的站台已经不见了，只剩下一片及膝高的荒草。\n\n路边居民家的主人正在搬纸箱，奇怪地看着你们。",dialog:"居民：‘你们在这儿找什么？’\n\n‘车站。刚才就在这里。’\n\n居民低头看向草丛：‘这个镇子，从来就没有车站啊。’",trigger:"居民皱起眉头：‘那你们说清楚——那辆银色电车把你们送到了哪里？’",slot:"o",fixed:{s:"那辆银色电车",v:"把我们送到了"},opts:["这里的车站","眼前这片草地","名叫言叶町的站台","地图上没有的地方"],event:o=>{M.station=o;return "‘你们真从这里下车？’居民明显不信，又把这件事讲给刚出门的女儿Mio。\n\nMio盯着你们看了一会儿：‘我在这里长大，真的没见过车站。不过……我们可以去镇上问问。’\n\n父亲叮嘱她：‘天黑前回来。’"},next:"跟着 Mio 去镇上"},
{day:"星期五 · 18:29",place:"市场",title:"一句话有了第一个听众",story:"Mio领着你们穿过市场。卖菜的摊主正收起遮阳布，肉铺开始打扫。\n\n‘我从小住在这里，真的没有火车站。’Mio说。\n\n一位卖可乐饼的阿姨停下关门的动作，看向你们的校服。",dialog:"‘车站？附近可没有。’\n\nMio指了指你们：‘可是他们说自己刚从那里下来。’\n\n‘是吗？’阿姨擦玻璃的手停住了。",trigger:"阿姨追问：‘等等。到底是谁亲眼见过那个车站？’",slot:"s",fixed:{v:"看见过",o:"那个车站"},opts:["居民家的父亲","一个穿校服的孩子","市场里的三花猫","坐过银色电车的人"],event:s=>{M.witness=s;return "‘哦，原来是"+s+"见过。’阿姨点点头。\n\n隔壁收摊的人只听到了后半句，立刻插进来：‘什么？这个镇以前还有车站？’\n\nMio想纠正，却被另一位摊主拉住：‘在哪里啊？’\n\n你们第一次发现，解释远比误会传播得慢。"},next:"去学校附近打听"},
{day:"星期五 · 18:47",place:"学校旁的小路",title:"传闻跑到了你们前面",story:"学校外的路口，两个小学生在等家人。你们还没开口，其中一个孩子就问：‘你们是找车站的人吧？’\n\nMio吓了一跳：‘你怎么知道？’\n\n‘我妈妈刚才打电话说的。’",dialog:"另一个孩子抢着讲：‘听说那个站很奇怪。’\n\n‘哪里奇怪？’\n\n‘你们自己不是去过吗？’\n\n不知从哪里开始，故事里又多了‘森林’两个字。",trigger:"孩子兴奋地问：‘那座本来不存在的车站，到了森林里又会怎么样？’",slot:"v",fixed:{s:"那座不存在的车站",o:"森林深处"},opts:["藏在了","忽然出现在","正在等待于","自己搬到了"],event:v=>{M.move=v;return "孩子眼睛一亮：‘"+v+"森林深处？那一定是在神社后面！’\n\n正好赶来接人的家长只听见最后一句。\n\n‘你们说神社后面真的有个站？’\n\n‘不是，我们只是……’\n\n等你们解释完，那位家长已经把话传给别人了。"},next:"去神社寻找线索"},
{day:"星期五 · 19:06",place:"神社",title:"大家都知道，却没人去过",story:"神社的石阶旁坐着一位老人。他看到Mio便问：‘听说你们在找森林里的车站？’\n\n你们一惊。刚在学校说过的话居然先到了这里。\n\n老人摇头：‘我可没见过。不过有一样东西，我倒是听过。’",dialog:"‘东京。’\n\n‘东京？’\n\n‘很远很远的大地方。镇上的人都这么说。有人觉得那里有永不熄灭的灯，有人说那里什么都能买到。’\n\nMio问：‘您去过？’\n\n老人摇头：‘没有。我们这里没人知道东京究竟是什么样。’",trigger:"他望着正在暗下来的树林：‘可既然那座车站真的存在，你们说，它会在什么时候出现？’",slot:"o",fixed:{s:"森林中的车站",v:"只会在"},opts:["天黑以后","有孩子迷路的时候","银色电车来的时候","乌鸦说话的时候"],event:o=>{M.time=o;return "‘原来是"+o+"。’老人若有所思。\n\n石阶上另一位路人把这句话当成了证据，立刻往镇上跑去。\n\nMio小声说：‘我们根本没看到站台啊……怎么已经有人开始准备买票了？’\n\n头顶的一只乌鸦忽然叫了一声。"},next:"沿河边走向森林"},
{day:"星期五 · 19:24",place:"河边 / 森林",title:"连乌鸦也学会了传话",story:"河水映着天边最后一点光。通往森林的小路上出现了不少手电筒的亮点。\n\n‘他们也在找车站？’\n\n远处有人大喊：‘这边没有！’\n\n树上传来乌鸦叫，一声接一声。",dialog:"‘カァ——’\n\n‘エキ——’\n\n你们停下脚步。\n\n‘刚才那只鸟……是不是说了“车站”？’\n\n没有人回答。",trigger:"一位跟着人群寻路的大叔问：‘所以现在，到底是谁知道车站在哪儿？’",slot:"s",fixed:{v:"知道",o:"车站的位置"},opts:["森林里的乌鸦","那只三花猫","镇上所有的人","还没出现的列车员"],event:s=>{M.knower=s;return "‘"+s+"知道车站的位置。’\n\n话音刚落，树林更深处传来一声清脆的铃声。\n\n‘叮——’\n\n所有手电筒同时转向那边。有人喊：‘听见了吗？就在前面！’"},next:"追着铃声走进森林"},
{day:"星期五 · 19:31",place:"森林中的旧车站",title:"一个传闻，终于长出了铁轨",story:"铃声越来越近。\n\n雾里先亮起几盏灯，接着是白色站牌、长椅，最后，一条铁轨缓缓出现在你们脚下。\n\n你们明明记得，这里只有树。\n\n车站名牌写着：‘言叶町站’。",dialog:"Mio摸了摸长椅：‘是真的。’\n\n一个镇民跑上站台，大叫：‘找到啦！’\n\n越来越多的人涌进森林，可每个人说的终点都不一样。\n\n‘据说那辆车可以去东京。’\n\n‘东京一定到处是大楼。’\n\n‘东京说不定什么愿望都能实现。’",trigger:"站台显示屏上出现一行字：‘午夜 00:00 / 终点：_____’\n\n镇民一起转过头：‘所以午夜电车要带大家去哪里？’",slot:"o",fixed:{s:"午夜的银色电车",v:"会开往"},opts:["真正的东京","到处都是高楼的东京","能让愿望实现的东京","镇民口耳相传的东京"],event:o=>{M.tokyo=o;return "屏幕发出轻轻一声‘滴’。\n\n终点一栏跳出字迹：‘东京’。\n\n刚才还在争论的居民们忽然都笑了，像这件事早已确定。\n\nMio拽住你们：‘可是……这里没有一个人真的去过东京。’\n\n一阵风吹过，时钟停在 23:59。"},next:"等午夜电车"},
];

function roleOrder(){const arr=playerCount===4?["t","s","v","o"]:["s","v","o"];const k=round%playerCount;return arr.map((s,i)=>({slot:s,player:(i+k)%playerCount}));}
function optionsFor(slot){const r=rounds[round];if(slot===r.slot)return r.opts;if(slot==="t")return timePools[round];return pools[round][slot]||[r.fixed[slot]||"",r.fixed[slot]||"",r.fixed[slot]||"",r.fixed[slot]||""];}
function formatted(x){let txt=String(x??"");txt=txt.replaceAll("Mio", "Mio").replaceAll("四个人",players.join("、")).replaceAll("我们四个","我们").replaceAll("一个同伴",players[0]||"同伴").replaceAll("另一个同伴",players[1]||"同伴");return E(txt).replace(/\n/g,"<br>");}
function compose(){const r=rounds[round];const s=chosen.s,v=chosen.v,o=chosen.o;
  let sentence=round===4?s+v+o+"出现":s+v+o;
  return (playerCount===4?chosen.t+"，":"")+sentence+"。";
}
function isOdd(role,index){const r=round;
  if(r===2&&role==="s"&&index===2)return true;
  if(r===5&&role==="s"&&index===3)return true;
  return r>=3&&index>=Math.max(1,5-Math.floor(r/2));
}
function frame(inner){$("meta").textContent=(round+1)+" / "+rounds.length+" · 中文试玩 V17";
  document.body.classList.toggle("darkish",round>=6);
  $("app").innerHTML=inner;
}
function route(){return '<div class="route">'+places.map((p,i)=>'<span class="stop '+(i<round?"done":i===round?"now":"")+'">'+E(p)+'</span>').join("")+'</div>';}
function rumorBox(){if(!records.length)return '<div class="rumor">还没有传闻。第一句话正在等你们说出口。</div>';
  return records.slice(-3).reverse().map((x,i)=>'<div class="rumor"><b>'+E(x.place)+'</b>　'+E(x.sentence)+'</div>').join("");
}
function archive(){return '<div class="archives"><div class="archive-title">镇上的传闻手记 · '+records.length+' 条</div>'+rumorBox()+
  '<div class="status"><span>故事的异化程度</span><span>'+oddness+' 个异常碎片</span></div><div class="meter"><span style="width:'+Math.min(100,oddness*12)+'%"></span></div></div>';}
function scenePanel(){const r=rounds[round];
return '<div class="chapter">CHAPTER 01 / '+E(r.place)+'</div><h2 class="title">'+E(r.title)+'</h2>'+
 '<div class="story">'+formatted(r.story)+'</div><div class="dialogue">'+formatted(r.dialog)+'</div>'+
 '<div class="dialogue">'+formatted(r.trigger)+'</div>'+route()+archive();
}
function render(){const r=rounds[round],roles=roleOrder();
if(phase==="setup")return setup();
if(phase==="handoff"){const item=roles[partIndex];frame('<div class="handoff"><small>轮到下一位玩家</small><h3>'+E(players[item.player])+'</h3><p>请将设备交给这位玩家。<br>之前的选择暂时保密。</p><button class="primary" id="go">我是'+E(players[item.player])+'，开始选择</button></div>');$("go").onclick=()=>{phase="choice";render()};return;}
if(phase==="choice"){
 const item=roles[partIndex],opts=optionsFor(item.slot),label=slotName[item.slot];
 frame('<div class="layout"><section>'+scenePanel()+'</section><aside class="panel"><div class="panel-desc">第 '+(partIndex+1)+' / '+roles.length+' 位玩家 · 仅本人选择</div><div class="role">你的句子碎片 / '+label+'</div><h3>'+E(players[item.player])+'</h3><div class="panel-desc">每人只知道自己选中的片段。拼出的整句话，会被镇上的人当作新的传闻。</div><div class="chips">'+opts.map((o,i)=>'<button class="chip" data-index="'+i+'"><em>'+String(i+1).padStart(2,"0")+' / '+label+'</em>'+E(o)+'</button>').join("")+'</div><button class="aux" id="autofill">快速试玩：随机补全剩余角色</button><div class="smallnote">越往后走，句子里越可能混入奇怪的词。</div></aside></div>');
 document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>pick(item.slot,+b.dataset.index,false));
 $("autofill").onclick=()=>{for(let j=partIndex;j<roles.length;j++){const q=roles[j],idx=j===partIndex?0:Math.floor(Math.random()*4);chosen[q.slot]=optionsFor(q.slot)[idx];if(isOdd(q.slot,idx))oddness++}phase="reveal";render()};return;
}
if(phase==="reveal"){
 const sentence=compose(),result=formatted(r.event(chosen[r.slot])),rolesHtml=roles.map(item=>'<div class="token"><small>'+E(players[item.player])+' · '+slotName[item.slot]+'</small>'+E(chosen[item.slot])+'</div>').join("");
 frame('<div class="layout"><section><div class="chapter">'+E(r.place)+' / '+E(r.day)+'</div><h2 class="title">所有人的话，拼成了一句。</h2><div class="lineup" style="grid-template-columns:repeat('+roles.length+',minmax(0,1fr))">'+rolesHtml+'</div><div class="sentence">'+E(sentence)+'</div><p class="result-intro">镇民听到后，重新转述成了一个“事实”。</p><div class="event">'+result+'</div></section><aside class="panel"><h3>传闻已被记录</h3><p class="panel-desc">刚才没有任何一个人单独说出这句完整的话。但从现在起，小镇里有人会这么说。</p><div class="flag">下一次遇见的人，可能已经听过这个版本。</div><button class="primary" id="next">'+E(r.next)+'</button>'+archive()+'</aside></div>');
 $("next").onclick=advance;return;
}
if(phase==="ending")return ending();
}
function pick(slot,index){chosen[slot]=optionsFor(slot)[index];if(isOdd(slot,index))oddness++;partIndex++;if(partIndex===roleOrder().length){phase="reveal";render()}else{phase="handoff";render()}}
function advance(){records.push({place:rounds[round].place,sentence:compose(),oddness});if(round<rounds.length-1){round++;chosen={};partIndex=0;phase="handoff";render()}else{phase="ending";endStep=0;render()}}
function ending(){ $("meta").textContent="第一阶段 · 完成";
 if(endStep===0){frame('<div class="ending"><div class="chapter">00:00 / 终点 · 东京</div><h2>车门开了。</h2><p>午夜电车开出了言叶町。窗外的灯光迅速褪去。<br>终点广播响起：‘东京，到了。’</p><div class="whitecity">TOKYO / 未被描述的部分</div><p>没有街道，没有高楼，没有站台上的人。<br>连天空和地平线都分不清。</p><p>镇上的人知道“东京”这个名字，知道那里很远，也相信列车能抵达。可他们谁也不知道真正的东京长什么样。<br><br>**传闻让电车拥有了终点，却无法凭空补全一个无人认识的城市。**</p><button class="primary" id="return">坐上返程的银色电车</button></div>'.replaceAll("**",""));$("return").onclick=()=>{endStep=1;ending()};return;}
 frame('<div class="ending"><div class="chapter">第二阶段 · 序幕 / 返回言叶町</div><h2>回去以后，小镇已经变了。</h2><p>银色电车终于回到那片荒草地。<br>可原先的住宅旁多了一条无法解释的铁轨。<br>市场里的人在讨论会说话的乌鸦，学校的孩子们画着不存在的东京。<br>神社的老人相信：只要大家传得够久，任何事都能变成真的。</p><p>你们终于意识到：<br>那些东西不是凭空出现的。<br><strong>它们来自你们一起说过的话。</strong></p><div class="archive-title">本次试玩记录 · '+records.length+' 条传闻 / '+oddness+' 个异常碎片</div>'+rumorBox()+'<div class="flag">第一阶段结束：你们制造了传闻。第二阶段，你们要生活在自己制造的传闻里。</div><button class="primary" id="again">从头重新试玩</button></div>');$("again").onclick=()=>{round=0;records=[];oddness=0;partIndex=0;chosen={};endStep=0;phase="setup";setup()};}
function setup(){document.body.classList.remove("darkish");$("meta").textContent="中文母版 · 第一阶段 V17";
 $("app").innerHTML='<div class="setup"><div class="chapter">MIDOKU / 第一阶段 · 言叶町</div><h1>一个没有人完整说过的故事，最后成了所有人都相信的事实。</h1><p class="sub">三个或四个朋友误乘银色电车，来到一座没有车站的小镇。你们会分别选择词语，被别人拼成句子，再看这些句子怎样变成现实。</p><div class="people"><button id="p3" class="'+(playerCount===3?"on":"")+'">3 人 / 主谓宾</button><button id="p4" class="'+(playerCount===4?"on":"")+'">4 人 / 时间 + 主谓宾</button></div><div class="names" id="names"></div><button class="start" id="start">进入故事</button><p class="setup-note">当前为同一设备轮流操作的可玩测试版；每人各选一句话的一个部分，也可用“快速试玩”跳过其他人的操作。</p></div>';
 const draw=()=>{$("names").innerHTML=Array.from({length:playerCount},(_,i)=>'<input maxlength="12" aria-label="玩家 '+(i+1)+' 昵称" placeholder="玩家 '+(i+1)+' 的昵称">').join("")};
 draw();$("p3").onclick=()=>{playerCount=3;setup()};$("p4").onclick=()=>{playerCount=4;setup()};
 $("start").onclick=()=>{players=[...document.querySelectorAll("#names input")].map((x,i)=>x.value.trim()||("玩家"+(i+1)));round=0;records=[];oddness=0;partIndex=0;chosen={};phase="handoff";render()};}
setup();
</script></body></html>

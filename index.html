<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>コトノハ町</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f2e8;color:#24231f;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC",sans-serif}.wrap{max-width:790px;margin:auto;padding:34px 20px 80px}.head{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid #393832;padding-bottom:10px;margin-bottom:30px}.logo{font:25px Georgia,"Noto Serif SC",serif;letter-spacing:.12em}.meta,.eyebrow{font-size:11px;color:#77736a;letter-spacing:.11em}.title{font:25px/1.5 Georgia,"Noto Serif SC",serif;margin:8px 0 14px}.story{font-size:15px;line-height:1.9;max-width:700px}.dialogue{font:16px/1.9 Georgia,"Noto Serif SC",serif;margin:18px 0;padding-left:15px;border-left:2px solid #aaa59a}.box{border-top:1px solid #aaa59a;margin-top:30px;padding-top:20px}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:12px}.choice{border:1px solid #99948a;background:transparent;padding:13px;text-align:left;cursor:pointer;font-size:14px;min-height:48px}.choice:hover,.choice.sel{background:#282722;color:#fff;border-color:#282722}.btn{border:1px solid #282722;background:#282722;color:#fff;padding:12px 19px;margin-top:20px;cursor:pointer}.btn:disabled{opacity:.3}.btn.alt{background:transparent;color:#282722}.note{font-size:12px;color:#817d74;margin-top:12px}.reveal{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}.word{border-top:1px solid #817d74;padding-top:8px;font-size:14px}.word small{display:block;color:#88837a;font-size:11px;margin-bottom:5px}.sentence{font:25px/1.65 Georgia,"Noto Serif SC",serif;margin:25px 0}.after{border-top:1px solid #aaa59a;border-bottom:1px solid #aaa59a;padding:18px 0;margin:22px 0;font-size:14px;line-height:1.9}.thread{margin-top:28px}.thread div{font-size:12px;color:#6f6b63;padding:6px 0;border-bottom:1px dotted #bbb5aa}.chapter{font:29px/1.7 Georgia,"Noto Serif SC",serif;margin:35px 0}.end{font-size:16px;line-height:2}.tag{display:inline-block;font-size:11px;border:1px solid #aaa59a;padding:4px 7px;margin:2px 3px 2px 0;color:#625f58}@media(max-width:620px){.choices{grid-template-columns:1fr}.reveal{grid-template-columns:1fr}.title{font-size:22px}.sentence{font-size:21px}}
</style></head><body><main class="wrap"><header class="head"><div class="logo">コトノハ町</div><div class="meta" id="meta">PROTOTYPE 02</div></header><div id="app"></div></main><script>
const pools={
sub:["校长","Mio","面包店老板","森林里的乌鸦","广场上的石像","修钟老人","三个外地孩子","一只会骂人的青蛙","镇上最老的树","没有影子的人","公共电话","一只迷路的猫"],
verb:["藏在口袋里","每天晚上偷偷数","当成宠物养","不小心弄丢了","想拿去换面包","一看见就会打喷嚏","坚持说自己没见过","会偷偷跟着","半夜送给别人","会把它画下来","会在下雨时叫醒","会带着它去森林"],
obj:["一颗掉下来的星星","所有人的影子","一张不存在的车票","明天的天气","Mio的一只红袜子","一只会骂人的青蛙","旧车站最后一班列车","一瓶昨天的雨","不会融化的雪人","月亮掉下来的纽扣","一封寄给十年后的信","一块会做梦的面包"]
};
const scenes=[
{d:0,p:"星期五・17:42",t:"你们错过了平时坐的电车。",x:"社团活动拖得太晚，三个人跑到站台时，只看见熟悉的车尾消失在转弯处。下一班还要二十分钟。对面却停着一辆银色电车，车门开着，线路图上有你们回家的方向。",dialog:"“这个也能坐吧？”
关门提示音响了。三个人没来得及多想，跑了进去。",fixed:true,after:"前几站都很正常。有人下车，窗外还有便利店和住宅。后来手机信号只剩一格。再抬头时，车厢里已经没有其他乘客。\n\n广播响起：『下一站，终点——コトノハ町。』"},
{d:0,p:"コトノハ町・傍晚",t:"下车以后，银色电车开进了雾里。",x:"站外只有一条通往小镇的路。你们走了几分钟，觉得不对，又原路跑回去。原本的站台不见了。草地上连铁轨都没有。",dialog:"“……我们刚才到底从哪儿下来的？”",fixed:true,after:"手机地图转了半天，只显示一片空白。天越来越暗。三个人只好先往有灯的地方走。"},
{d:1,p:"镇口・杂货店",t:"镇上的人先注意到了你们。",x:"三个穿着外地校服的孩子站在路边盯手机，想不显眼都难。杂货店老板探出头：『迷路了？』",dialog:"你们七嘴八舌地解释。老板听了半天，只听懂一件事：你们说自己是坐电车来的。",role:"谓语",focus:"银色列车",afterType:"arrival"},
{d:1,p:"面包店",t:"肚子比谜团更先提出意见。",x:"Mio是在杂货店门口认识的。她和你们差不多大，看你们实在不像骗子，带你们去买吃的。老板娘给每人多塞了一块小面包。",dialog:"旁边有人问：『你们说的那个车站，长什么样？』",role:"宾语",focus:"车站",afterType:"bakery"},
{d:1,p:"广场・公共电话",t:"手机没信号，只能试试旧电话。",x:"Mio带你们到广场。电话拨不出去，听筒里却有很轻的车轮声。你把它递给Mio时，声音又没了。",dialog:"一个等电话的大叔探头：『你们几个到底在听什么？』",role:"主语",focus:"电话",afterType:"phone"},
{d:2,p:"Mio家・早餐",t:"煎蛋刚端上桌，Mio妈妈看了你们一眼。",x:"『你们就是昨天从旧车站来的三个孩子吧？』",dialog:"Mio抬头：『妈妈，我没跟你说过啊。』
『面包店的佐藤太太说的。』",role:"谓语",focus:"流言",afterType:"breakfast"},
{d:2,p:"镇中心",t:"今天不用急着找答案。Mio带你们逛镇子。",x:"糖果店卖“吃完会换一种味道”的糖；修钟老人门口挂着十七只时间都不一样的钟；河边有人把昨天的雨装在玻璃瓶里卖。",dialog:"走到广场时，你们听见两个孩子在争论：『旧车站在森林里！』『才不是，是晚上才会出来！』",role:"宾语",focus:"镇上的怪事",afterType:"town"},
{d:3,p:"河边",t:"一块写着「……駅」的铁牌被钓了上来。",x:"钓鱼的大叔嫌它晦气，扔在岸边。Mio翻来覆去看了半天：『我以前没见过。』",dialog:"围观的人倒很兴奋。有人说这肯定就是最近大家讲的那个车站。",role:"主语",focus:"铁牌",afterType:"river"},
{d:3,p:"森林入口",t:"“反正大家都说在森林里。”",x:"Mio背了四瓶汽水。你们决定去看看。刚进森林时还像普通郊游，走深一点以后，路标上的字却变了：『山顶 →』不知什么时候成了『今天别去山顶 →』。",dialog:"Mio盯了两秒：『昨天还不是这么写的。』",role:"谓语",focus:"森林",afterType:"forest"},
{d:4,p:"森林深处",t:"乌鸦在学镇上的人说话。",x:"第一只叫的是『面包——』，第二只叫的是『外地孩子——』。再往前，一整排乌鸦站在电线上，歪着脑袋看你们。",dialog:"其中一只忽然叫：『旧车站——』
远处又有一只答：『旧车站——』",role:"宾语",focus:"乌鸦",afterType:"crow"},
{d:4,p:"森林・空地",t:"草下面露出两根生锈的铁条。",x:"它们只有十几米长，前后都埋进泥里。Mio用鞋底踢了踢：『这个昨天也在吗？』",dialog:"没人知道。你们回去时，一只乌鸦一直跟在后面。",role:"主语",focus:"铁轨",afterType:"rail"},
{d:5,p:"森林・黄昏",t:"铁轨变长了。",x:"昨天只有十几米。今天它穿过树林，尽头多了一块歪斜站牌。再往前走，树后露出长椅、售票窗口和褪色的时刻表。",dialog:"Mio站了很久：『……这里昨天什么都没有。』",role:"谓语",focus:"旧车站",afterType:"station"}
];
let i=0,pick=null,h=[],branch=[];
const $=x=>document.getElementById(x),E=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function seeded(arr,n){return arr[(i*3+n*5+h.length)%arr.length]}
function hand(role){let key=role==="主语"?"sub":role==="谓语"?"verb":"obj",arr=pools[key],start=(i*5+h.length*2)%arr.length,out=[];for(let k=0;k<7;k++)out.push(arr[(start+k)%arr.length]);return out}
function otherParts(role,me){let s=seeded(pools.sub,1),v=seeded(pools.verb,2),o=seeded(pools.obj,3);if(role==="主语")s=me;if(role==="谓语")v=me;if(role==="宾语")o=me;return{s,v,o,q:s+v+o}}
function render(){let s=scenes[i];$("meta").textContent=(s.d?"DAY "+s.d:"PROLOGUE")+" · "+(i+1)+"/"+scenes.length;if(s.fixed){$("app").innerHTML='<div class="eyebrow">'+s.p+'</div><h1 class="title">'+s.t+'</h1><div class="story">'+s.x+'</div><div class="dialogue">'+s.dialog.replace(/\n/g,"<br>")+'</div><button class="btn" id="go">继续</button>'; $("go").onclick=()=>showFixed(s);return}let hd=hand(s.role);$("app").innerHTML='<div class="eyebrow">'+s.p+'</div><h1 class="title">'+s.t+'</h1><div class="story">'+s.x+'</div><div class="dialogue">'+s.dialog.replace(/\n/g,"<br>")+'</div><section class="box"><div class="eyebrow">你负责【'+s.role+'】｜从7张里选1张</div><div class="choices">'+hd.map((v,n)=>'<button class="choice '+(pick===n?"sel":"")+'" data-n="'+n+'">'+E(v)+'</button>').join("")+'</div><div class="note">另外两个人的词盖着。翻开前谁也不知道最后会拼成什么。</div><button class="btn" id="go" '+(pick===null?"disabled":"")+'>一起翻开</button></section>'+threads();document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{pick=+b.dataset.n;render()});$("go").onclick=()=>reveal(s,hd[pick])}
function showFixed(s){$("app").innerHTML='<div class="eyebrow">'+s.p+'</div><h1 class="title">'+s.t+'</h1><div class="after">'+s.after.replace(/\n/g,"<br>")+'</div><button class="btn" id="next">继续</button>';$("next").onclick=next}
function eventFor(type,p){let q=p.q;const map={
arrival:["老板听完，往你们身后的黑路看了看。『那边只有荒地。』","买酱油的阿姨插了一句：『银色的？我怎么没见过这种车。』","你们离开时，老板还在跟她争到底有没有铁路。"],
bakery:["老板娘把面包夹递给你：『你们三个说的版本怎么还不一样？』","隔壁桌的小孩听得入迷，临走前把其中一个词讲给了门口的朋友。","Mio咬着面包：『明天搞不好就会变成另一个故事。』"],
phone:["大叔抢过听筒听了半天，什么也没听到。","他嘴上说你们听错了，走到路口却又跟熟人提起“广场电话里有电车声”。","晚上回Mio家时，已经有人冲你们喊：『喂，电话里的列车小鬼！』"],
breakfast:["Mio妈妈把果酱推过来：『佐藤太太说得可比你们精彩多了。』","她听到的版本里多了森林、午夜，还有一张根本没人提过的旧车票。","Mio差点把牛奶喷出来：『旧车票又是哪来的？』"],
town:["下午经过糖果店，老板冲你们招手：『就是你们吧？旧车站那几个。』","一个小孩坚称他哥哥的朋友见过站牌；另一个说车站只有下雨才出现。","三个人越听越糊涂。你们明明没说过这些。"],
river:["有人把铁牌举起来和你们比划：『这下总不能说是你们编的吧？』","修钟老人却说：『一个“駅”字能证明什么。』说完还是把铁牌借走了。","傍晚，他店门口多挂了一块写着“拾得物”的旧铁牌。"],
forest:["路标下一次再看，又变回了『山顶 →』。","你们谁都没碰它。Mio用粉笔在背面画了个鬼脸：『明天看它还认不认识自己。』","回程时，鬼脸不见了，换成了一只歪歪扭扭的乌鸦。"],
crow:["Mio冲树上喊：『谁教你们的？』乌鸦只会继续叫。","一只乌鸦突然换了个词，正好是你们前几天拼进某句话里的东西。","这次谁都笑不出来太久——森林显然听过镇上的故事。"],
rail:["Mio把一枚硬币压在铁条旁边，免得明天找不到。","回镇以后，你们没跟多少人说。第二天早上，面包店却有人讨论“森林里的铁轨”。","Mio看着你们：『昨晚谁说出去的？』三个人都摇头。"],
station:["站牌上的油漆剥得厉害，像在这里淋了几十年雨。","一个拄拐杖的老人从后面慢慢走来：『你们怎么跑到旧站来了？』","Mio盯着他：『这里昨天还没有。』老人只觉得她在开玩笑。"]
};let a=map[type]||[]; if(q.includes("青蛙"))a=a.concat(["灌木里真的传来一句很难听的蛙叫。Mio笑到蹲在地上。"]);if(q.includes("红袜子"))a=a.concat(["Mio低头看了看自己的袜子：『为什么倒霉的总是我？』"]);if(q.includes("影子"))a=a.concat(["傍晚的路灯下，有人忽然停下来数起地上的影子。"]);if(q.includes("面包"))a=a.concat(["面包店老板听见这句话后沉默两秒：『别把我的面包卷进去。』"]);return a.slice(0,3)}
function reveal(s,me){let p=otherParts(s.role,me);h.push({d:s.d,q:p.q});branch.push(...eventFor(s.afterType,p));$("app").innerHTML='<div class="eyebrow">'+s.p+' · 一起翻开</div><div class="reveal"><div class="word"><small>主语</small>'+E(p.s)+'</div><div class="word"><small>谓语</small>'+E(p.v)+'</div><div class="word"><small>宾语</small>'+E(p.o)+'</div></div><div class="sentence">「'+E(p.q)+'。」</div><div class="after">'+eventFor(s.afterType,p).map(E).join("<br><br>")+'</div><button class="btn" id="next">'+(i===scenes.length-1?"看看森林里出现了什么":"继续")+'</button>'+threads();$("next").onclick=next}
function threads(){if(!h.length)return "";return '<div class="thread"><div class="eyebrow" style="border:0">最近听过的怪话</div>'+h.slice(-4).map(v=>'<div>'+E(v.q)+'</div>').join("")+'</div>'}
function next(){if(i===scenes.length-1)return end();i++;pick=null;render()}
function end(){$("meta").textContent="第一阶段 · END";$("app").innerHTML='<div class="eyebrow">森林・旧车站</div><div class="chapter">五天前，这里只有草。<br>现在，站台尽头的钟停在 00:13。</div><div class="end">镇上的人已经有人说自己小时候来过这里。<br>Mio说他们胡扯。你们三个也知道他们在胡扯。<br><br>站牌上落下一只乌鸦。<br><br>『旧车站——』<br><br>另一只从屋顶答它。<br><br>『旧车站——』<br><br>你看向空荡荡的铁轨。<br><br><b>如果连车站都能变出来，那把你们送来的那辆车呢？</b></div><button class="btn alt" onclick="location.reload()">重新玩</button>'+threads()}
render();
</script></body></html>

<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>未读 MIDOKU｜第一章 空席</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#090b0c;color:#e9e7e0;font-family:"Songti SC","Noto Serif SC",serif;background:radial-gradient(circle at 70% 0,#25313a33,transparent 40%),linear-gradient(#0b0d0e,#101112)}.wrap{max-width:780px;margin:auto;padding:28px 18px 80px}.logo{letter-spacing:.28em;font-weight:800;font-size:22px}.sub,.muted,.tag{font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#8e9495}.sub{font-size:13px}.tag{font-size:11px;letter-spacing:.16em}.card{margin-top:22px;padding:27px;border:1px solid #34393a;background:#111415e8;box-shadow:0 30px 80px #0009}.title{font-size:29px;letter-spacing:.1em;margin:10px 0 18px}.story{white-space:pre-line;line-height:2}.line{height:1px;background:#33393a;margin:22px 0}.btn,input{width:100%;padding:15px;margin-top:10px;border:1px solid #4a5050;background:#171b1c;color:#eee;font-size:15px}.btn{cursor:pointer;text-align:left}.btn:hover{background:#202526}.primary{text-align:center;background:#dedbd1;color:#171819;font-weight:800}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.notice{margin:18px 0;padding:16px;border-left:2px solid #6f7777;background:#15191a}.chat{padding:12px 14px;margin:8px 0;background:#1a1e1f;border-radius:2px}.ghost{opacity:.68}.red{color:#bb7c74}.shake{animation:shake .09s 6}@keyframes shake{25%{transform:translateX(4px)}65%{transform:translateX(-3px)}}@media(max-width:560px){.grid{grid-template-columns:1fr}.card{padding:20px}.title{font-size:24px}}</style></head>
<body><main class="wrap"><div class="logo">未读 MIDOKU</div><div class="sub">CHAPTER 01 · 空席</div><section id="app" class="card"></section></main>
<script>
const app=document.querySelector("#app");let sb=null,S=null,room="",slot=0,name="",players=0,ch=null;
const esc=x=>String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function lobby(){app.innerHTML='<div class="tag">4月11日 · 17:36</div><div class="title">放課後</div><div class="story">雨还没有停。\n请选择今晚留在教室里的人数。</div><div class="grid"><button class="btn" onclick="setup(2)">2 人</button><button class="btn" onclick="setup(3)">3 人</button><button class="btn" onclick="setup(4)">4 人</button></div><div class="line"></div><button class="btn" onclick="soloTest()">开发测试｜单人进入第一章</button>'}
window.soloTest=()=>{players=3;slot=1;name="TESTER";room="SOLO_TEST";S={phase:"classroom",player1_joined:true,player2_joined:true,player3_joined:true,player4_joined:false,player1_choice:null,player2_choice:0,player3_choice:1};window.__solo=true;render()}
window.setup=n=>{players=n;app.innerHTML='<div class="tag">SESSION</div><div class="title">留下名字</div><div class="story">每台设备只填写自己的 ID。\n所有玩家输入相同的房间码。</div><input id="id" maxlength="12" placeholder="你的 ID"><input id="room" maxlength="12" placeholder="房间码"><button class="btn primary" onclick="enter()">进入教室</button>'}
async function enter(){if(!sb){app.innerHTML+='<div class="notice">网络模块仍在加载，请两秒后再试。</div>';return}name=document.querySelector("#id").value.trim()||"UNKNOWN";room=(document.querySelector("#room").value.trim()||"CLASS31").toUpperCase();let q=await sb.from("midoku_rooms").select("*").eq("room_code",room).maybeSingle(),d=q.data;if(!d){let r=await sb.from("midoku_rooms").insert({room_code:room,phase:"classroom"}).select().single();d=r.data}S=d;players=Number(localStorage.getItem("midoku_"+room+"_players"))||players;localStorage.setItem("midoku_"+room+"_players",String(players));let used=[S.player1_joined,S.player2_joined,S.player3_joined,S.player4_joined];let free=used.slice(0,players).findIndex(x=>!x);slot=free<0?1:free+1;let patch={["player"+slot+"_joined"]:true,phase:"classroom"};localStorage.setItem("midoku_"+room+"_slot",String(slot));localStorage.setItem("midoku_"+room+"_id",name);let w=await sb.from("midoku_rooms").update(patch).eq("room_code",room).select().single();if(w.error){app.innerHTML=`<div class="title">进入失败</div><div class="story">${esc(w.error.message)}\n\n请把这段文字截图给我。</div>`;return}S=w.data;subscribe();render()}
window.enter=enter;
function subscribe(){ch=sb.channel("c31-"+room).on("postgres_changes",{event:"UPDATE",schema:"public",table:"midoku_rooms",filter:"room_code=eq."+room},p=>{S=p.new;render()}).subscribe()}
async function refresh(){let r=await sb.from("midoku_rooms").select("*").eq("room_code",room).single();S=r.data;render()}
function joined(){return [S.player1_joined,S.player2_joined,S.player3_joined,S.player4_joined].slice(0,players).filter(Boolean).length}
function render(){if(joined()<players){app.innerHTML='<div class="tag">ROOM '+esc(room)+'</div><div class="title">放課後の教室</div><div class="story">'+esc(name)+' 已经留在教室。\n\n雨点敲着窗户。</div><div class="notice">'+joined()+' / '+players+' 人已进入</div>';return}
if(S.phase==="classroom"){app.innerHTML='<div class="tag">4月11日 · 17:36</div><div class="title">出席记录</div><div class="chat">班主任：今天的出席记录好像有问题。还在学校的人帮我确认一下人数。</div><div class="line"></div><div class="story ghost">28　高橋　出席\n29　佐藤　出席\n30　山本　出席\n<span class="red">31　　　　　出席</span></div>';setTimeout(()=>{if(S&&S.phase==="classroom")checkRoll()},3000);return}
if(S.phase==="roll"){let special=slot===1;app.innerHTML='<div class="tag">17:36</div><div class="title">出席记录</div><div class="story ghost">28　高橋　出席<br>29　佐藤　出席<br>30　山本　出席</div>'+(special?'<div class="notice"><div class="tag">出席记录发生变更</div>31番の記録が更新されました。<br><br>31　________　17:36</div>':'')+'<div class="line"></div><div class="story">教室后面突然传来一声——<br><b>咚。</b></div><button class="btn primary" onclick="nextScene()">继续</button>';return}
if(S.phase==="misaki"){app.innerHTML='<div class="tag">CLASS CHAT</div><div class="title">美咲</div><div class="chat">你们还在学校？</div><div class="chat">我好像把数学作业忘在后面的柜子里了。<br>谁能帮我看一下？</div><div class="line"></div><div class="story">你没有办法知道其他人会怎么选。</div><button class="btn" onclick="choose(1)">去教室后面看看</button><button class="btn" onclick="choose(0)">还是算了</button>';return}
if(S.phase==="wait"){app.innerHTML='<div class="tag">17:42</div><div class="title">雨还没有停。</div><div class="story">你已经作出选择。\n教室里有人站了起来，也有人没有。</div><div class="notice">等待其他人……</div>';return}
if(S.phase==="reveal"){showPersonal();return}
if(S.phase==="talk"){app.innerHTML='<div class="tag">17:48</div><div class="title">雨还没有停。</div><div class="story">教室里重新安静下来。\n\n你可以把刚才看到的事情告诉其他人。\n也可以什么都不说。</div><div class="notice">自由交流 30 秒。游戏不会替你判断谁说了真话。</div><button class="btn primary" onclick="ending()">继续</button>';return}
if(S.phase==="end"){app.innerHTML='<div class="tag">17:59</div><div class="title">下校</div><div class="chat">班主任：找到了，谢谢。今天早点回去吧。</div><div class="story">没有人记得把任何东西交给老师。</div><div class="line"></div><div class="story">班级 App　<b>30人</b>\n\n18:00</div><div class="notice shake"><b>31人</b></div><div class="story">一秒后。\n\n<b>30人</b></div><div class="line"></div><div class="tag">CHAPTER 01 END</div><div class="title">空席</div>';return}}
window.checkRoll=async()=>{if(window.__solo){S.phase="roll";render();return}await sb.from("midoku_rooms").update({phase:"roll"}).eq("room_code",room)}
window.nextScene=async()=>{if(window.__solo){S.phase="misaki";render();return}let r=await sb.from("midoku_rooms").update({phase:"misaki"}).eq("room_code",room).select().single();if(r.error){app.innerHTML='<div class="title">场景载入失败</div><div class="story">'+esc(r.error.message)+'</div>';return}S=r.data;render()}
window.choose=async v=>{if(window.__solo){S["player"+slot+"_choice"]=v;S.phase="reveal";render();return}await sb.from("midoku_rooms").update({["player"+slot+"_choice"]:v,phase:"wait"}).eq("room_code",room);setTimeout(async()=>{let r=await sb.from("midoku_rooms").select("*").eq("room_code",room).single(),d=r.data,a=[d.player1_choice,d.player2_choice,d.player3_choice,d.player4_choice].slice(0,players);if(a.every(x=>x!==null))await sb.from("midoku_rooms").update({phase:"reveal"}).eq("room_code",room)},400)}
function showPersonal(){let chooser=((slot-2+players)%players)+1,affected=((slot%players)+1),mine=S["player"+slot+"_choice"],source=S["player"+chooser+"_choice"];let h="";
if(mine===1)h='<div class="story">你走到教室后面。柜子旁掉着一本数学练习册。<br><br>姓名栏是空白的。<br>最后一道题旁边写着：<b>17:36</b></div>';
else h='<div class="story">你没有过去。你仍然坐在原来的位置。</div>';
if(source===1)h+='<div class="notice"><div class="tag">CLASS CHAT</div>美咲：谢谢你帮我找到练习册！<br><br><span class="ghost">'+esc(name)+'：找到了，在柜子后面。</span><br><br>你不记得自己发过这句话。</div>';
if(slot===players)h+='<div class="notice">手机弹出一条遗失物通知：<br><br>你的课桌内发现遗失物。<br><b>座位：31</b><br><br>三秒后，通知消失。</div>';
app.innerHTML='<div class="tag">17:45</div><div class="title">教室后方</div>'+h+'<button class="btn primary" onclick="talk()">回到座位</button>'}
window.talk=async()=>{if(window.__solo){S.phase="talk";render();return}await sb.from("midoku_rooms").update({phase:"talk"}).eq("room_code",room)}
window.ending=async()=>{if(window.__solo){S.phase="end";render();return}await sb.from("midoku_rooms").update({phase:"end"}).eq("room_code",room)}
lobby();
const sdk=document.createElement("script");sdk.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";sdk.onload=()=>{sb=window.supabase.createClient("https://ifmhbjrhlecksnyjcczq.supabase.co","sb_publishable_yeJtFDUCSeUxpfCyWrClgg_TUAUcI5k")};document.body.appendChild(sdk);
</script></body></html>

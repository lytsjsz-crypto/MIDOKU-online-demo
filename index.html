<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>明日交换所 — 极简试玩 Demo</title>
<style>
:root{--bg:#0b0b0d;--panel:#151519;--line:#34343d;--text:#f4f4f5;--muted:#9b9ba5;--accent:#f0d58a}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#24242b,#0b0b0d 42%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC",sans-serif;min-height:100vh}
.wrap{max-width:900px;margin:auto;padding:28px 18px 70px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:18px}.logo{font-size:23px;font-weight:850;letter-spacing:.12em}.muted{color:var(--muted);font-size:13px}.badge{border:1px solid var(--line);padding:8px 12px;border-radius:999px;background:#111}
.progress{height:5px;background:#202027;border-radius:99px;overflow:hidden;margin-bottom:18px}.progress i{display:block;height:100%;background:#ddd;transition:.4s}
.card{background:rgba(21,21,25,.97);border:1px solid var(--line);border-radius:20px;padding:25px;box-shadow:0 22px 60px #0008;margin-bottom:14px}
.kicker{font-size:12px;letter-spacing:.16em;color:var(--accent);font-weight:800}.tomorrow{font-size:29px;font-weight:850;line-height:1.35;margin:10px 0 8px}.note{line-height:1.75;color:#c7c7cc}.players{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}.p{border:1px solid var(--line);border-radius:14px;padding:14px;background:#101014}.p b{display:block;margin-bottom:7px}.pack{font-size:13px;color:#cfcfd5;line-height:1.65;min-height:64px}
.trade{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}input{width:100%;border:1px solid #41414b;border-radius:11px;background:#101014;color:white;padding:14px;font-size:15px;outline:none}input:focus{border-color:#8b8b96}.help{font-size:12px;color:var(--muted);margin-top:9px;line-height:1.6}.actions{display:flex;gap:10px;margin-top:13px}.btn{flex:1;padding:14px;border-radius:11px;border:1px solid #444;background:#222229;color:white;font-weight:800;cursor:pointer}.btn.primary{background:#eee;color:#111;border-color:#eee}
.log{margin-top:15px;border-top:1px solid #303038;padding-top:12px}.logitem{font-size:14px;line-height:1.65;padding:8px 0;border-bottom:1px dashed #2b2b32}.reveal{display:none}.resultTitle{font-size:26px;font-weight:850;margin:8px 0 14px}.world{white-space:pre-line;line-height:1.9;font-size:16px;border-left:2px solid #555;padding-left:15px}.nextPreview{margin-top:18px;padding:15px;border:1px solid #48484f;border-radius:12px;background:#101014}.end{font-size:18px;line-height:1.9}
@media(max-width:650px){.players{grid-template-columns:1fr}.trade{grid-template-columns:1fr}.tomorrow{font-size:24px}.card{padding:19px}}
</style></head>
<body><div class="wrap">
<div class="top"><div><div class="logo">明日交换所</div><div class="muted">极简机制试玩：知道事件，不知道结果</div></div><div class="badge" id="badge"></div></div>
<div class="progress"><i id="prog"></i></div><div id="game"></div></div>
<script>
const days=[
 {preview:"明天进行数学考试。",event:"数学考试",base:"第一节课，数学考试如期开始。",next:"明天班级要重新排座位。"},
 {preview:"明天班级要重新排座位。",event:"重新排座位",base:"班主任拿着新的座位表走进教室。",next:"明天下午举行班级接力赛。"},
 {preview:"明天下午举行班级接力赛。",event:"班级接力赛",base:"下午，全班来到操场，接力赛准备开始。",next:"明天公布文化祭各班的活动方案。"},
 {preview:"明天公布文化祭各班的活动方案。",event:"文化祭方案公布",base:"午休前，文化祭方案被贴在教室后面的公告栏上。",next:"明天是学期最后一天。"},
 {preview:"明天是学期最后一天。",event:"学期最后一天",base:"放学铃响起，这是这个学期最后一次全班一起离开教室。",next:null}
];
let day=0,trades=[],packs=[["手机","数学笔记","和B的友谊","3000円","周末时间"],["自行车","运动鞋","和A的秘密","5000円","游戏账号"],["相机","学生证","老师的信任","2000円","社团时间"]];
const $=id=>document.getElementById(id);
function esc(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function render(){
 $("badge").textContent="DAY "+(day+1)+" / "+days.length;$("prog").style.width=((day+1)/days.length*100)+"%";let d=days[day];
 $("game").innerHTML='<section class="card" id="tradeCard"><div class="kicker">明日预告</div><div class="tomorrow">'+d.preview+'</div><div class="note">你只知道这件事一定会发生。考试几分、座位在哪、比赛输赢——这些结果现在都不知道。</div><div class="players">'+packs.map((p,i)=>'<div class="p"><b>'+(i===0?"你":"玩家"+(i+1))+'的包裹</b><div class="pack">'+p.map(x=>"· "+esc(x)).join("<br>")+'</div></div>').join("")+'</div><div class="trade"><input id="sell" placeholder="卖掉什么？例如：数学老师"><input id="buy" placeholder="想换来什么？例如：考试答案"></div><div class="help">没有强制次数。你可以连续交易，也可以今天什么都不做。Demo 中你代表玩家1操作；玩家2、3会做简单的独立行动。</div><div class="actions"><button class="btn" id="add">进行一次交易</button><button class="btn primary" id="finish">结束今天</button></div><div class="log">'+(trades.length?trades.map(t=>'<div class="logitem">'+esc(t.who)+'：卖掉「'+esc(t.sell)+'」 → 得到「'+esc(t.buy)+'」</div>').join(""):'<div class="muted">今天还没有发生交易。</div>')+'</div></section><section class="card reveal" id="reveal"></section>';
 $("add").onclick=addTrade;$("finish").onclick=finishDay;
}
function addTrade(){let sell=$("sell").value.trim(),buy=$("buy").value.trim();if(!sell&&!buy)return;trades.push({who:"你",sell:sell||"无",buy:buy||"无"});render()}
function aiTrades(){const opts=[[["午休时间","老师的提示"],["手机","更好的运动鞋"],["和朋友的秘密","优先选择座位"],["零花钱","文化祭需要的材料"]],[["游戏时间","复习时间"],["自行车","更快的跑步速度"],["老师的信任","一次自由选择"],["相机","更多的假期时间"]]];return opts.map((arr,i)=>{let x=arr[(day+i)%arr.length];return {who:"玩家"+(i+2),sell:x[0],buy:x[1]}})}
function consequence(all){let d=days[day],lines=[d.base,""],txt=all.map(t=>t.sell+" "+t.buy).join(" ");if(/数学老师/.test(txt))lines.push("但数学老师没有出现。学校临时安排了代课老师，考试仍然举行。");if(/考试答案/.test(txt))lines.push("你提前得到了一份“考试答案”，但试卷在早上临时换了版本。答案只有一部分还能用。");if(/数学笔记/.test(txt))lines.push("有人已经不再拥有自己的数学笔记。");if(/友谊|朋友/.test(txt))lines.push("有一段关系被交易改变了。今天需要帮助时，对方的反应和以前不一样。");if(/运动鞋|跑步速度/.test(txt))lines.push("有人为了明天的行动能力提前做了交换，这在今天产生了明显效果。");if(/座位/.test(txt))lines.push("座位表公布时，有人的交换改变了原本的安排。");if(/文化祭|材料/.test(txt))lines.push("文化祭准备中，多出来的材料让一个原本做不到的方案成为可能。");if(/假期时间|周末时间|午休时间|游戏时间|复习时间/.test(txt))lines.push("被卖掉的时间真的从生活里消失了；得到的时间则出现在最需要它的地方。");if(lines.length===2)lines.push("昨天的交易没有直接阻止今天的事件，但世界已经记住了这些改变。");lines.push("","昨天买卖的东西不会自动恢复。");return lines.join("\n")}
function finishDay(){let all=[...trades,...aiTrades()],d=days[day];$("tradeCard").style.display="none";let r=$("reveal");r.style.display="block";r.innerHTML='<div class="kicker">DAY '+(day+1)+' · 今天发生了</div><div class="resultTitle">'+d.event+'</div><div class="world">'+esc(consequence(all))+'</div><div class="log"><b>昨天三个人的交易</b>'+all.map(t=>'<div class="logitem">'+esc(t.who)+'：卖掉「'+esc(t.sell)+'」 → 得到「'+esc(t.buy)+'」</div>').join("")+'</div>'+(d.next?'<div class="nextPreview"><div class="kicker">新的明日预告</div><div style="font-size:20px;font-weight:800;margin-top:7px">'+d.next+'</div></div>':'')+'<button class="btn primary" style="width:100%;margin-top:16px" id="next">'+(day===days.length-1?"结束试玩":"进入下一天")+'</button>';$("next").onclick=next}
function next(){if(day===days.length-1){$("game").innerHTML='<section class="card"><div class="kicker">试玩结束</div><div class="resultTitle">你改变了什么？</div><div class="end">这个版本没有积分、没有胜负、没有多数少数，也没有“正确选择”。<br><br>唯一测试的事情是：<b>当你知道明天会发生什么时，你愿意为了它卖掉什么，又想买来什么？</b></div></section>';return}day++;trades=[];render()}
render();
</script></body></html>

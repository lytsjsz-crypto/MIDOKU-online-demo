<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MIDOKU Core Test</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b0d0e;color:#eee;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans SC",sans-serif}.wrap{max-width:720px;margin:auto;padding:28px 18px 70px}.logo{font:800 22px serif;letter-spacing:.22em}.sub,.tag{color:#929899;font-size:12px;letter-spacing:.12em}.card{margin-top:20px;padding:25px;background:#121516;border:1px solid #353a3b}.title{font:700 28px serif;margin:10px 0 18px}.story{line-height:1.8;white-space:pre-line}.btn{width:100%;padding:15px;margin:9px 0;background:#181c1d;color:#eee;border:1px solid #4b5152;text-align:left;cursor:pointer}.primary{text-align:center;background:#e0ddd4;color:#171819;font-weight:800}.secret{margin:17px 0;padding:15px;border-left:2px solid #a98760;background:#191714}.panel{margin:15px 0;padding:15px;border:1px solid #4a5152}.who{font-weight:800}.line{height:1px;background:#34393a;margin:22px 0}.small{font-size:12px;color:#999}.bad{color:#d28f86}.good{color:#a9c59d}.log{font-family:ui-monospace,monospace;font-size:13px;line-height:1.7}</style></head><body><main class="wrap"><div class="logo">未读 MIDOKU</div><div class="sub">CORE TEST 02 · 别人的未来</div><section id="app" class="card"></section></main><script>
const app=document.querySelector("#app");let s={r:1,trust:2,marks:0,goal:"",history:[]};
const rounds=[
{scene:"三个人必须在天黑前穿过峡谷。\n你不知道自己前面的路。",you:"你只能决定：前进，或停下。",see:"你看见：玩家B前面的木桥已经裂开。",b:"B说：『我这里看见C前面有一盏灯。』",c:"C说：『我这里显示你前面很安全。』",truth:false},
{scene:"你们进入一片会改变道路的森林。",you:"你看不见自己的出口。",see:"你看见：玩家C左侧道路通向出口；右侧有一枚银色碎片。",b:"B说：『我看到你右边有出口。』",c:"C说：『别信B。你前面根本不是出口。』",truth:true},
{scene:"只剩最后一道门。三个人都必须做出决定。",you:"门后是什么，你依然看不见。",see:"你看见：如果B选择『打开』，C会失去离开的机会。",b:"B说：『C告诉我，开门对大家都好。』",c:"C说：『别开。相信我。』",truth:null}
];
function start(){s={r:1,trust:2,marks:0,goal:["让三个人一起抵达终点","让自己拿到银色碎片","确保玩家B最后仍能离开"][Math.floor(Math.random()*3)],history:[]};app.innerHTML='<div class="tag">3 PLAYER SIMULATION</div><div class="title">规则只有一句</div><div class="story"><b>你看得见别人的危险，却看不见自己的。</b>\n\n别人也一样。\n\n想活着走到终点，你必须决定相信谁，以及告诉别人多少。</div><div class="secret"><div class="tag">你的私人愿望</div>'+s.goal+'</div><button class="btn primary" onclick="show()">开始测试</button>'}
function show(){let x=rounds[s.r-1];app.innerHTML='<div class="tag">ROUND 0'+s.r+'</div><div class="title">'+["峡谷","森林","门"][s.r-1]+'</div><div class="story">'+x.scene+'</div><div class="secret"><div class="tag">只有你看见</div>'+x.see+'</div><div class="panel"><div class="who">玩家B</div>'+x.b+'</div><div class="panel"><div class="who">玩家C</div>'+x.c+'</div><div class="line"></div><div class="story"><b>你要怎么行动？</b></div><button class="btn" onclick="act(0)">相信B，并按B的信息行动</button><button class="btn" onclick="act(1)">相信C，并按C的信息行动</button><button class="btn" onclick="act(2)">不相信任何人，自己冒险</button><div class="line"></div><div class="story"><b>关于你看到的B/C信息：</b></div><button class="btn" onclick="tell(0)">完整告诉他们</button><button class="btn" onclick="tell(1)">只说一半</button><button class="btn" onclick="tell(2)">故意说成相反的</button>'}
let pending=null;window.act=i=>{pending=i;document.querySelectorAll(".btn").forEach(b=>b.disabled=true);setTimeout(()=>resolve(i,0),250)};window.tell=i=>{resolve(pending??2,i)}
function resolve(a,t){let r=s.r;let outcomes=[
["你选择相信B。脚下的石板突然下沉。\nC刚才说的『安全』并不是真的。","你相信C，停在原地。几秒后，前方道路坍塌。","你自己试探着前进。你躲过了坍塌，但B因此被迫绕路。"],
["你按B的提示走向右侧。那里没有出口——但你找到了银色碎片。","你听C的话走向左侧。出口真的在那里。","你没有听任何人。森林改变了方向，C原本安全的道路被你的行动封住。"],
["你支持B开门。门打开后，C面前的出口消失了。","你支持C阻止开门。B的道路随即出现另一扇门。","你拒绝表态。B自行开门，而改变发生在你的身后。"]
];let text=outcomes[r-1][a];if(t===2){text+="\n\n你把自己看到的信息说反了。另一名玩家据此改变了行动。";s.marks++}else if(t===1)text+="\n\n你隐去了部分信息。没有人知道你还看见了什么。";else text+="\n\n你把自己看到的内容完整说了出来。";s.history.push(text);app.innerHTML='<div class="tag">RESULT</div><div class="title">变化发生在别人那里</div><div class="story">'+text+'</div><div class="line"></div><div class="small">注意：这里没有“正确答案”。你只能从结果判断别人之前告诉你的信息是否值得相信。</div><button class="btn primary" onclick="next()">继续</button>'}
window.next=()=>{if(s.r<3){s.r++;show()}else end()}
function end(){app.innerHTML='<div class="tag">TEST END</div><div class="title">你相信了谁？</div><div class="story">你的私人愿望：<b>'+s.goal+'</b>\n\n这三轮里，你并没有控制其他玩家。\n你控制的是<b>别人用来判断世界的信息</b>。\n\n而别人也一直在这样影响你。</div><div class="line"></div><div class="story">测试重点不是剧情。\n只判断一件事：<b>“看得见别人的未来，却看不见自己的”有没有让你产生怀疑、说服或欺骗的欲望？</b></div><button class="btn primary" onclick="start()">重新测试</button>'}
start();</script></body></html>

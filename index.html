}.names{display:grid;gap:10px}.names input{width:100%;border:0;border-bottom:1px solid #99948a;background:transparent;padding:12px 4px;font-size:16px;outline:none}.start{width:100%;margin-top:28px;border:1px solid #282722;background:#282722;color:#fff;padding:14px;cursor:pointer}.end{font-size:16px;line-height:2}@media(max-width:600px){.choices{grid-template-columns:1fr 1fr}.wordrow{grid-template-columns:1fr}.sentence{font-size:21px}}

const $=x=>document.getElementById(x),E=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]||m));let round=0;const M={};let playerCount=3,players=[];const timePools=[["放課後","さっき","日が暮れる前","誰も見ていない間に"],["さっき","電車が行ったあと","店主が出てくる前","振り返ったとき"],["夕方","店が閉まる前","猫が走り去ったあと","夕飯の前"],["さっき","日が沈む前","みんなが電話していた頃","誰も見ていないとき"],["日が暮れてから","銀色の電車が来たとき","カラスが鳴いたとき","誰かが迷子になったとき"],["さっき","森に入ってから","カラスが鳴いたとき","みんなが探している間"],["今","霧が出てから","次の電車が来る前","明日"]];
const rounds=[
{day:"金曜日・17:38",place:"いつもの駅",story:"部活がいつもより長引いた。駅まで走ったものの、いつもの電車は目の前でドアを閉めた。\n\n{P1}：「あー、あとちょっとだったのに！」\n\n次の電車は二十分後。\n\n{P2}がスマホを見る。「六時までに帰ってこいって。」\n\nそのとき、向かいのホームに見慣れない銀色の電車が停まった。路線図を見ると、途中までは帰る方向と重なっているように見える。",dialog:"{P3}：「これも途中までは同じ方向じゃない？」\n\n{P1}：「何駅か乗って、どこかで乗り換えればいいんじゃない？」\n\n発車ベルが鳴り始めた。\n\nみんなは顔を見合わせ、その電車へ駆け込んだ。",trigger:"電車が動き出してから、{P1}はもう一度、ドアの上の路線図を見上げた。見慣れた駅名は途中で途切れている。\n\n「……で、この電車、結局どこに行くんだろう？」",slot:"o",fixed:{s:"この電車は",v:"向かった。行き先は"},opts:["見たことのない町","いつもの乗換駅","終点","家とはまったく逆の方向"],event:(o)=>{M.arrive=o;if(o==="見たことのない町")return"駅を過ぎるたび、乗客が減っていく。\n\nスマホの電波は一本だけになった。\n\nやがて車内放送が流れる。『次は終点、コトノハ町。』\n\n全員が同時に顔を上げた。\n\n{P3}：「……どこ、ここ？」";if(o==="いつもの乗換駅")return"ところが、車内放送から聞こえてきたのはまったく知らない駅名だった。\n\n{P1}がドアの上の路線図を見つめる。\n\n「おかしい。乗換駅なら、とっくに着いてるはずだよ。」\n\nその直後、『次は終点、コトノハ町』と放送が流れた。";if(o==="終点")return"電車は、知っている駅には一度も停まらなかった。\n\n気づけば、車内に残っているのはみんなだけ。\n\n『次は終点、コトノハ町。』\n\n{P2}：「もしかして、逆に乗った？」";return"窓の外から見慣れた建物がどんどん消えていく。\n\n{P1}がスマホの地図を何度も回す。\n\n「……ほんとに逆だ。」\n\nそのとき、『次は終点、コトノハ町』と車内放送が流れた。"},next:"電車を降りる"},
{day:"金曜日・18:11",place:"コトノハ町",story:"みんなが電車を降りると、銀色の車体はすぐに薄い霧の向こうへ消えていった。\n\n「とりあえず駅員さんを探そう。」\n\n低い家並みを抜けたところで、誰かが足を止める。何かがおかしい。来た道を引き返した。\n\nさっきまであったはずのホームがない。\n\nそこには草むらが広がっているだけだった。\n\n道路の向かいの雑貨屋から、段ボールを抱えた店主が出てきて、しばらくこちらを見ていた。",dialog:"店主：「君たち、そこで何してるんだ？」\n\n{P3}：「さっき、駅から出てきたんです。」\n\n店主：「駅？」\n\n店主は草むらを見る。\n\n「この町に駅なんてないぞ。」",trigger:"店主はまだ腑に落ちない顔で、草むらを指した。\n\n「じゃあ、その銀色の電車は、君たちをどこへ連れてきたんだ？」",slot:"o",fixed:{s:"銀色の電車は",v:"私たちを連れてきた。そこは"},opts:["ここの駅","この草むら","「コトノハ町」という駅","どこか分からない場所"],event:(o)=>{M.station=o;if(o==="ここの駅")return"店主：「ここの駅？」\n\n{P3}：「はい。さっきまで本当に――」\n\n店主が言葉を遮る。「ここには昔から駅なんてない。」\n\n店の奥から足音がする。みんなと同じくらいの年の女の子が、のれんをくぐって出てきた。\n\n「お父さん、誰？」\n\n店主はみんなを指す。「Mio、この子たち、ここに駅があったって言うんだ。」";if(o.includes("コトノハ町"))return"店主：「コトノハ町駅？」\n\n店主は眉をひそめて、その名前を繰り返した。\n\n「町の名前はコトノハ町だけど、そんな駅はないぞ。」\n\n店ののれんが揺れ、女の子が顔を出す。\n\n「お父さん、誰？」\n\n店主が振り返る。「Mio、この子たち、『コトノハ町駅』から降りたらしい。」";if(o==="この草むら")return"店主は足元の草を見る。\n\n「電車が、草むらに？」\n\n{P1}：「違います。さっきまではここがホームだったんです。」\n\n店の中から女の子が出てきた。\n\n「お父さん、誰と話してるの？」\n\n店主は草むらを指す。「Mio、この子たち、ここがさっきまで駅だったって言うんだ。」";return"店主：「どこか分からない場所？」\n\n{P1}：「だから、帰るために駅を探してるんです。」\n\n「だから、この町に駅はないって。」\n\n店の中から女の子が顔を出す。\n\n「お父さん？」\n\n店主：「Mio、町を案内してやってくれ。このままだと、この子たち日が暮れてもここにいそうだ。」"},next:"Mioについていく"},
{day:"金曜日・18:29",place:"商店街",story:"Mioに連れられ、商店街を歩く。まだ完全には日が暮れていない。肉屋は看板をしまい、文房具屋の前には明日の朝に出す段ボールが積まれている。\n\nMio：「私、ずっとここに住んでるけど、本当に駅なんて見たことないよ。」\n\n{P1}：「じゃあ、私たちどうやって来たんだろう。」\n\nMio：「だから、それを聞きに行くの。」\n\n商店街の端では、コロッケ屋のおばさんがガラス戸を閉めようとしていた。",dialog:"Mio：「ねえ、おばさん。この辺に昔、駅ってあった？」\n\n店のおばさん：「駅？　なかったと思うけどねえ。」\n\nおばさんはみんなの制服を見る。\n\n「どうして急にそんなこと聞くの？」",trigger:"話を聞くうちに、おばさんの手が止まった。\n\n「ちょっと待って。その駅を実際に見たのは誰なの？」",slot:"s",fixed:{v:"が見たことがある。",o:"あの駅を。"},opts:["雑貨屋のおじさん","制服を着た子","あの三毛猫","銀色の電車に乗った人"],event:(x)=>{M.witness=x;if(x==="雑貨屋のおじさん")return"おばさん：「雑貨屋のおじさんが見たの？」\n\nMio：「違うよ。さっきは『駅なんてない』って言ってた。」\n\n「じゃあ、昔は見たことがあるってこと？」\n\n隣で店じまいをしていた人が顔を上げる。\n\n「何？　昔、この町に駅があったの？」\n\n否定する前に、話が一つ先へ進んでしまった。";if(x==="制服を着た子")return"おばさんは、みんなの制服をもう一度見る。\n\n「制服の子が見た駅……って、君たちのこと？」\n\n隣の店から誰かが顔を出した。\n\n「どこの学校？　前にも迷子の子が来たって話、なかったっけ。」\n\nMio：「え、そんな話あった？」\n\n今度は、知らない昔話まで混ざり始めた。";if(x==="あの三毛猫")return"おばさんは一瞬、言葉を失った。\n\n「猫が駅を見たの？」\n\nそのとき、足元で「ニャア」と声がする。商店街でよく見かける三毛猫が段ボールの陰から出てきた。\n\n隣の店の人が笑う。「じゃあ、その猫についていけば駅に着くんじゃない？」\n\nMioは笑わず、街の奥へ歩いていく猫を目で追った。";return"おばさん：「銀色の電車に乗った人が見た駅……？」\n\n隣の店の人が『銀色の電車』という言葉に反応する。\n\n「待って。昔、うちのばあちゃんが似たような話をしてた気がする。夕方になると、白っぽい電車が通るって。」\n\nMio：「ここ、線路すらないのに。」\n\nそれでも『昔からあった話』として、噂は形を持ち始めた。"},next:"もう少し町を歩く"},
{day:"金曜日・18:47",place:"小さな公園",story:"商店街の先には、小さな公園があった。二人の小学生がブランコのそばで迎えを待っている。\n\nみんなが何も言わないうちに、一人が先に声をかけてきた。\n\n「駅を探してる人たち？」\n\nMioの足が止まる。\n\n「なんで知ってるの？」\n\n「さっき、お母さんが電話で言ってた。」\n\nさっき商店街で生まれたばかりの話が、もう先回りしていた。",dialog:"もう一人の小学生が割り込む。「なんか、変な駅なんでしょ？」\n\n{P1}：「何が変なの？」\n\n「知らないよ。見たの、そっちでしょ？」",trigger:"小学生がブランコから飛び降りる。どこで付け足されたのか、今度は『森』という言葉まで出てきた。\n\n「じゃあ、その『ないはずの駅』って、森のほうでどうなってるの？」",slot:"v",fixed:{s:"存在しないはずの駅は",o:"、森のほうに。"},opts:["隠れている","突然現れる","誰かを待っている","移ってしまった"],event:(v)=>{M.place=v;if(v==="隠れている")return"小学生：「駅が森に隠れてるの？」\n\nもう一人がすぐに言う。「分かった！　神社の裏の森だ！」\n\n迎えに来た母親がちょうど近づいてくる。\n\n「何の話？」\n\n「この人たち、森に駅が隠れてるって。」\n\nMio：「いや、私たちはそこまで――」\n\n言い終わる前に、母親はスマホを取り出していた。";if(v==="突然現れる")return"小学生：「森に突然現れるの？」\n\n目が一気に輝く。\n\n「いつ？」\n\n{P2}：「時間までは言ってないよ。」\n\n迎えに来た母親は、会話の後半だけを聞いた。\n\n「夜になると現れる駅なの？」\n\nMio：「……今度は『夜』まで増えた。」";if(v==="誰かを待っている")return"二人の小学生がそろって森のほうを見る。\n\n「駅が誰かを待ってるの？」\n\n一人が声を潜める。「さっきの銀色の電車じゃない？」\n\n迎えに来た母親が、その部分だけを聞く。\n\n「銀色の電車？」\n\n十秒後には、電話の向こうへ『森で電車を待つ駅』という話が伝わっていた。";return"小学生：「駅が森に移ったの？」\n\n二人は笑った。\n\nけれど迎えに来た母親が聞いたのは、その最後の一言だけだった。\n\n「森のほうに駅があるの？」\n\n「うん。この人たち、そこから来たんだって！」\n\nMioは口を開いたまま、訂正するタイミングを失った。"},next:"森のほうへ向かう"},
{day:"金曜日・19:06",place:"神社前",story:"森へ向かう道の途中に、小さな神社がある。\n\n公園で交わした話は、みんなより先にここまで来ていたらしい。石段のそばにいた老人が、Mioを見るなり声をかけた。\n\n「本当に、あの駅を探しに行くのか？」\n\nMio：「おじいさんまで知ってるの？」\n\n老人：「さっき聞いたよ。森のほうにあるんだろ？」",dialog:"{P1}：「でも、森って広いですよね。どこにあるんですか？」\n\n老人は首を横に振る。\n\n「そこまでは知らんよ。ただ、普通の駅じゃないらしいな。」",trigger:"老人は暗くなっていく空を見上げた。\n\n「森にあるっていうなら、その駅はいつ姿を見せるんだ？」",slot:"o",fixed:{s:"森の中の駅は",v:"姿を現す。"},opts:["日が暮れてから","子どもが迷子になったとき","銀色の電車が来たとき","カラスが鳴いたとき"],event:(o)=>{M.time=o;if(o==="日が暮れてから")return"老人：「日が暮れてからしか現れないのか。」\n\n青く沈み始めた空を見上げる。\n\n「なら、もうすぐだな。」\n\n石段を上がってきた二人が、その一言を聞いた。\n\n「夜にだけ出る駅だって？」\n\nそのうちの一人は、すぐに山道を引き返していった。";if(o.includes("迷子"))return"老人はみんなを見る。\n\n「子どもが迷子になると現れる駅、か……。」\n\n石段にいた女性がそれを聞き、そばの子どもの手を握り直す。\n\n「森には入っちゃだめよ。」\n\n子どもはみんなを見て首をかしげた。\n\n「でも、この人たち、もう迷子なんじゃないの？」";if(o.includes("銀色"))return"老人：「銀色の電車が来ると現れるのか。」\n\n石段の途中で誰かが立ち止まる。\n\n「銀色の電車？　さっき商店街でもその話を聞いたぞ。」\n\nMioが小さくつぶやく。\n\n「もう、ここまで来てる……。」";return"頭上から「カァ」と声が落ちてきた。\n\n老人が見上げる。\n\n「カラスが鳴くと現れる？」\n\nもう一度、「カァ」。\n\n石段の子どもが笑う。「じゃあ、今もう出てるかもね。」"},next:"森へ入る"},
{day:"金曜日・19:24",place:"森",story:"神社の裏で街灯は途切れた。Mioがスマホのライトをつける。\n\n森にいるのは、みんなだけではない。前方では、ときどき知らない人のライトが揺れている。\n\n{P1}：「あの人たちも駅を探してるのかな。」\n\n遠くから「こっちにはない！」と声がする。\n\n頭上でカラスが鳴いた。",dialog:"「カァ――」\n\n少し離れた木から、もう一羽が応える。\n\n「エキ――」\n\nみんなの足が止まった。\n\n{P2}：「……今の、『駅』って言わなかった？」",trigger:"さらに遠くの木から、もう一度カラスの声が返ってくる。近くを歩いていた人まで足を止めた。\n\n「じゃあ今、駅の場所を知ってるのは誰なんだ？」",slot:"s",fixed:{v:"が知っている。",o:"駅の場所を。"},opts:["森のカラス","あの三毛猫","町のみんな","私たち"],event:(x)=>{M.know=x;if(x==="森のカラス")return"「森のカラスが、駅の場所を知っている。」\n\n言い終わるのとほとんど同時に、前方の木から声がした。\n\n「エキ――」\n\nさらに遠くからも続く。\n\n「エキ、エキ――」\n\nMioがスマホのライトをゆっくり持ち上げる。\n\n森の奥で、ごく小さなベルの音がした。";if(x==="あの三毛猫")return"足元の草むらが動いた。\n\n商店街で見かけた三毛猫が暗がりから現れ、みんなを一度だけ見て森の奥へ歩いていく。\n\n頭上のカラスが鳴く。\n\n「エキ――」\n\n{P1}：「……本当についていく？」\n\nそのとき、遠くから小さなベルの音がした。";if(x==="町のみんな")return"前からも後ろからも、人の声が聞こえる。\n\n「こっちにはない。」\n「もっと奥らしいよ。」\n「暗くなってから出るんだろ？」\n\n誰も同じ話をしていない。それでも全員が、同じ『駅』を探している。\n\n木の上でカラスが一声鳴いた。\n\n「エキ――」\n\n遠くから、ベルの音が返ってきた。";return"誰もすぐには答えなかった。\n\nみんなはここまで、会う人ごとに駅のことを聞いてきた。けれど、本当に場所を知っている人は一人もいない。\n\nそのとき、頭上のカラスが鳴いた。\n\n「エキ――」\n\n続いて、森の奥からベルの音が聞こえた。"},next:"音のするほうへ進む"},
{day:"金曜日・19:31",place:"森の奥",story:"最初は、ほんの小さな音だった。\n\n数歩進むと、今度ははっきり聞こえる。\n\nカン、カン、カン。\n\n踏切の音だ。\n\nでも、ここに線路なんてない。\n\nMioがスマホのライトを消す。それでも暗くはならなかった。木々の向こうから、暖かな黄色い明かりが一列に漏れている。",dialog:"最後の枝をかき分ける。\n\n目の前を線路が横切っていた。\n\n白い駅名標が霧の中に立っている。\n\nコトノハ町駅。\n\n{P1}：「……ここ、さっきまで本当に何もなかったよな。」",trigger:"線路も駅名標も、もう目の前にある。背後で誰かが声を潜めた。\n\n「じゃあ、このコトノハ町駅は……今、何を待ってるんだろう。」",slot:"o",fixed:{s:"コトノハ町駅は",v:"待っている。"},opts:["あの銀色の電車","私たち","明日","次の噂"],event:(o)=>{if(o==="あの銀色の電車")return"霧の向こうに二つの明かりが浮かんだ。\n\n足元のレールが、かすかに震え始める。\n\nMioは駅名標を見て、それからみんなを見る。\n\n「……今度も、乗る？」";if(o==="私たち")return"ホームの灯りが、手前から一つずつ点いていく。\n\n駅員も、ほかの乗客もいない。\n\nベンチの上には、みんなの人数と同じだけの切符が置かれていた。";if(o==="明日")return"ホームの電光時計が一度だけ瞬いた。\n\n「19:31」という表示が消える。\n\n残ったのは、ひとつの日付だけだった。\n\n――明日。";return"木の上で、またカラスが鳴いた。\n\n「エキ――」\n\n森の向こうから誰かが駆けてくる。\n\n「あった！　本当に駅がある！」\n\nその声を追うように、いくつもの足音が近づいてきた。"},next:"→"}
];
function injectPlayers(x){if(!x)return x;const p=i=>players[Math.min(i,players.length-1)]||("プレイヤー"+(i+1));return x.replaceAll("{P1}",p(0)).replaceAll("{P2}",p(1)).replaceAll("{P3}",p(2)).replaceAll("{P4}",p(3));}
function preMio(x){return injectPlayers(x)}
function render(){const r=rounds[round];$("meta").textContent=(round+1)+" / "+rounds.length;$("app").innerHTML='<div class="place">'+r.day+"・"+r.place+'</div><div class="story">'+preMio(r.story).replace(/\n/g,"<br>")+'</div><div class="dialogue">'+preMio(r.dialog).replace(/\n/g,"<br>")+'</div><div class="dialogue">'+preMio(r.trigger).replace(/\n/g,"<br>")+'</div><div class="slotlabel">'+(r.slot==="s"?"主語":r.slot==="v"?"述語":"目的語")+'</div><div class="choices">'+r.opts.map((o,i)=>'<button class="choice" data-i="'+i+'">'+E(o)+'</button>').join("")+'</div>';document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>resolve(r,r.opts[+b.dataset.i]))}
function resolve(r,val){
let s=r.slot==="s"?val:r.fixed.s,v=r.slot==="v"?val:r.fixed.v,o=r.slot==="o"?val:r.fixed.o;
let t=playerCount===4?timePools[round][round%4]:"";
let sentence=(t?t+"，":"")+s+v+o+"。";
let roles=playerCount===4?[t,s,v,o]:[s,v,o];
let offset=round%playerCount;
let names=roles.map((_,i)=>players[(i+offset)%playerCount]||("プレイヤー"+(i+1)));
$("app").innerHTML='<div class="place">'+r.day+"・"+r.place+'</div><div class="wordrow" style="grid-template-columns:repeat('+roles.length+',1fr)">'+roles.map((x,i)=>'<div class="word"><small>'+E(names[i])+'</small>'+E(x)+'</div>').join("")+'</div><div class="sentence">'+E(sentence)+'</div><div class="event">'+preMio(r.event(val)).replace(/\n/g,"<br>")+'</div><button class="next" id="n">'+r.next+'</button>';
if(round<rounds.length-1)$("n").onclick=()=>{round++;render()};else $("n").onclick=end
}
function end(){$("meta").textContent="END";$("app").innerHTML='<div class="place">月曜日・07:46・いつもの駅</div><div class="end">Suicaを改札にかざす。<br><br>ピッ。<br><br>後ろでは、同じ制服の生徒が二人話している。<br><br>「コトノハ町って、駅があるらしいよ。」<br><br>「知ってる。森の中にあるやつでしょ。」<br><br>「夜にしか出ないんだって。」<br><br>電車がホームへ入ってくる。<br><br>ドアが開く直前、屋根の上に一羽のカラスが降りた。<br><br>「エキ――」</div>'}
function setup(){ $("meta").textContent="SETUP"; $("app").innerHTML='<div class="setup"><h1>コトノハ町</h1><div class="people"><button id="p3" class="on">3人</button><button id="p4">4人</button></div><div class="names" id="names"></div><button class="start" id="start">はじめる</button></div>'; function draw(){ $("names").innerHTML=Array.from({length:playerCount},(_,i)=>'<input maxlength="10" placeholder="プレイヤー '+(i+1)+'のニックネーム">').join("") } draw(); $("p3").onclick=()=>{playerCount=3;$("p3").classList.add("on");$("p4").classList.remove("on");draw()}; $("p4").onclick=()=>{playerCount=4;$("p4").classList.add("on");$("p3").classList.remove("on");draw()}; $("start").onclick=()=>{players=[...document.querySelectorAll("#names input")].map((x,i)=>x.value.trim()||("プレイヤー"+(i+1)));round=0;render()}} setup();
</script></body></html>

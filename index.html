<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>コトノハ町</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f2e8;color:#24231f;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.wrap{max-width:800px;margin:auto;padding:34px 20px 80px}.head{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid #393832;padding-bottom:10px;margin-bottom:30px}.logo{font:25px Georgia,serif;letter-spacing:.12em}.meta,.place{font-size:11px;color:#77736a;letter-spacing:.11em}.title{font:24px/1.5 Georgia,"Noto Serif SC",serif;margin:8px 0 14px}.story{font-size:15px;line-height:2}.dialogue{font:16px/2 Georgia,"Noto Serif SC",serif;margin:18px 0;padding-left:15px;border-left:2px solid #aaa59a}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:24px}.choice{border:1px solid #99948a;background:transparent;padding:15px 12px;text-align:center;cursor:pointer;font-size:16px;min-height:56px}.choice:hover{background:#282722;color:#fff}.wordrow{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:24px 0}.word{border-top:1px solid #918c82;padding:12px 5px;text-align:center;font:19px/1.6 Georgia,"Noto Serif SC",serif}.word small{display:block;font:10px sans-serif;color:#888279;margin-bottom:6px}.sentence{font:25px/1.7 Georgia,"Noto Serif SC",serif;text-align:center;padding:20px 0;margin:18px 0;border-top:1px solid #aaa59a;border-bottom:1px solid #aaa59a}.event{font:16px/2 Georgia,"Noto Serif SC",serif;margin-top:20px}.next{display:block;width:100%;border:1px solid #777168;background:transparent;padding:13px 16px;margin-top:28px;cursor:pointer;color:#3b3934;font-size:14px}.next:hover{background:#282722;color:#fff}.end{font-size:16px;line-height:2}@media(max-width:600px){.choices{grid-template-columns:1fr 1fr}.wordrow{grid-template-columns:1fr}.sentence{font-size:21px}}
</style></head><body><main class="wrap"><header class="head"><div class="logo">コトノハ町</div><div class="meta" id="meta">PROTOTYPE 14</div></header><div id="app"></div></main><script>
const $=x=>document.getElementById(x),E=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]||m));let round=0;const memory={};
const rounds=[
{day:"星期五・18:12",place:"镇口",title:"刚才下车的地方，只剩草。",story:"银色电车钻进雾里以后，你们沿着原路跑了回来。\n\n「就是这里吧？」\n\n悠太踩了踩草。没有站台，没有闸机，也没有铁轨。\n\nMio又看了一遍手机地图。地图上只有一条普通的县道。\n\n杂货店老板抱着纸箱出来，看见四个穿校服的陌生孩子站在路边。",dialog:"「喂，你们几个。」\n\n老板把纸箱放到门口。\n\n「这么晚了，在这里干什么？怎么过来的？」",slot:"o",fixed:{s:"那辆银色电车",v:"带走了"},opts:["整个车站","我们的Suica","一个没见过的学生","最后一个饭团"],event:(o)=>{memory.first=o;if(o==="整个车站")return"「……电车把整个车站带走了？」\n\nMio刚抬手：「不是，车站是我们回来以后——」\n\n「佐藤さん！」\n\n老板朝马路对面喊。一个推着自行车的女人停下来。\n\n「这几个孩子说，刚才有辆银色电车把车站带走了。」\n\n「车站？」佐藤太太朝草地看了一眼，「这里以前倒是有个旧站的传闻。」\n\nMio：「等一下，我们没说旧——」\n\n老板：「旧站？」";if(o.includes("Suica"))return"老板低头看向你手里的卡。\n\n「电车把你们的Suica带走了？」\n\n「卡还在我手里。」\n\n「佐藤さん！」老板朝马路对面喊，「这几个孩子说，刚才有辆奇怪的电车，连Suica都——」\n\n「Suica？」佐藤太太停下自行车，「以前那个旧站可没有这种东西。」\n\nMio：「什么旧站？」";if(o.includes("学生"))return"老板脸色变了。\n\n「电车带走了一个学生？」\n\n悠太：「不是，谁说真的少了人——」\n\n「佐藤さん！」老板已经叫住马路对面的女人。\n\n佐藤太太数了数你们：「四个人……你们原来有五个？」\n\n「没有！」\n\n「可旧站那个传闻里，好像也有失踪的孩子。」\n\nMio：「旧站？」";return"老板沉默了两秒。\n\n「……电车把饭团带走了？」\n\n葵摸了摸书包：「我的确少了一个。」\n\n「佐藤さん！」老板忽然认真起来，「这几个孩子坐了辆奇怪的电车，东西还落在那边了。」\n\n佐藤太太停下自行车：「那边？以前旧站那边？」\n\nMio：「什么旧站？」"},next:"第二天早晨"},
{day:"星期六・08:03",place:"Mio家",title:"“旧车站”已经先到了早餐桌。",story:"Mio妈妈把玉子焼き放到桌上。\n\n「昨天折腾到那么晚，今天就别乱跑了。」\n\n她回厨房拿味噌汤，又像想起什么似的回头。\n\n「对了，你们昨天去旧车站了？」\n\n四个人一起抬头。\n\nMio：「……什么旧车站？」",dialog:"「佐藤太太说的呀。还说你们从那边带了什么回来。」\n\nMio皱着眉拉开书包。\n\n「我们到底带回来什么了？」",slot:"s",fixed:{v:"找到了",o:"一张黄色纸片"},opts:["Mio","悠太","那只三花猫","数学老师"],event:(s)=>{memory.second=s;if(s==="Mio")return"「我找到的？」\n\nMio把书包整个倒过来。课本、笔袋、学生手帳掉了一桌。\n\n最后一本数学课本滑到地上。\n\n夹页里露出一小角黄色。\n\nMio没动。\n\n「……昨天有这个吗？」";if(s==="悠太")return"悠太嘴里还咬着吐司。\n\n「我？」\n\n他翻了半天口袋，什么也没有。站起来时，一张黄色纸片却从校服外套内侧掉到地上。\n\n「等等，我真不知道这个哪来的。」";if(s.includes("三花猫"))return"窗外正好传来一声猫叫。\n\n那只三花猫从院墙跳下来，嘴里叼着一张发黄的纸。\n\nMio冲过去拉开窗。\n\n猫把纸丢在窗台上，跑了。\n\n纸角只剩一个模糊的『駅』字。";return"「数学老师？」\n\nMio妈妈看了一眼时间：「老师今天不是来学校值班吗？」\n\n手机同时震了一下。班级群里有人发了张照片：数学教室门口，地上躺着一张黄色纸片。\n\n葵：「……去看看？」"},next:"去学校"},
{day:"星期六・10:26",place:"町立中学校・数学教室",title:"纸片被摆到了讲台上。",story:"黄色纸片被压在一本点名册下面。上面除了『駅』，还有一条像被水泡开的蓝线。\n\n值班的数学老师推了推眼镜。\n\n「所以，这东西到底从哪来的？」\n\n走廊外已经有几个学生在偷听。",dialog:"悠太说了“昨天”。Mio指着纸上的字。葵提到商店街。\n\n老师越听越糊涂。\n\n「停。你们重新说。」",slot:"v",fixed:{s:"修钟老人",o:"这张黄色纸片"},opts:["交给了Mio","藏起了","从河里捞到了","一直在找"],event:(v)=>{memory.third=v;if(v==="交给了Mio")return"老师：「修钟老人把纸交给Mio？」\n\nMio：「我根本没见过他。」\n\n走廊外有人小声说：「修钟店那个爷爷？」\n\n另一个人已经拿出手机。\n\n「我问问田中，他家就在那边。」";if(v==="藏起了")return"老师：「修钟老人藏起了这张纸？」\n\n「不是这个意思。」\n\n走廊外传来鞋底跑远的声音。\n\nMio追到门口，只看见两个学生冲下楼梯。\n\n「他们不会去修钟店吧……」";if(v.includes("河里"))return"老师：「修钟老人从河里捞到了这张纸？」\n\n你刚想纠正，走廊外已经有人喊：「我就说河边有东西！」\n\nMio拉开门。\n\n「谁说过？」\n\n没人回答。";return"老师：「修钟老人一直在找这张纸？」\n\n走廊外安静了一秒。\n\n「所以他知道旧车站？」有人问。\n\nMio：「这两件事为什么连上了？」\n\n但那几个学生已经往楼梯口走。"},next:"放学后"},
{day:"星期六・16:41",place:"修钟店门口",title:"店门口已经堵了六辆自行车。",story:"你们赶到的时候，修钟老人正站在门口发火。\n\n「我没给过谁纸！也没藏过什么！」\n\n田中抱着书包站在最前面。\n\n「可是学校里都这么说。」\n\n老人看到你们，眉头皱得更深。",dialog:"「就是你们几个？」\n\n他指了指那张黄色纸片。\n\n「我只说这种纸以前有人拿来问过。地点？我一个字都没说。」\n\n田中回头看你们。\n\n「那到底在哪里？」",slot:"o",fixed:{s:"修钟老人",v:"把旧车站忘在了"},opts:["河的上游","森林入口","昨天","一盒牛奶里"],event:(o)=>{memory.fourth=o;if(o==="河的上游")return"田中：「河上游？」\n\n「不是，我说的是——」\n\n老人猛地拍了一下门框：「我根本没说河！」\n\n可后面已经有人跨上自行车。\n\n「河上游走！」\n\n六辆车一下散了。Mio看着他们的背影。\n\n「……我们也得去。不然他们还不知道会传成什么。」";if(o==="森林入口")return"「森林入口？」\n\n后面的学生立刻有人接话：「我就说那边有条旧路。」\n\n老人：「我没说！」\n\n自行车铃接连响起来。\n\nMio抓起书包：「快走，他们真去了。」";if(o==="昨天")return"田中愣住。\n\n「老人把旧车站……忘在昨天？」\n\n这次连老人都没马上骂人。\n\n门口安静了几秒。\n\n后面有人小声说：「所以昨天才会突然出现？」\n\nMio转头：「谁说它出现过？」";return"所有人都看向老人门口的牛奶箱。\n\n老人低头，又抬头。\n\n「……你们脑子没问题吧。」\n\n田中却蹲下来，从空奶瓶之间抽出一张褪色的纸。\n\n上面印着半个『駅』字。"},next:"傍晚"},
{day:"星期六・18:07",place:"镇口",title:"人群最后还是回到了那片草地。",story:"不知道是谁先来的。等你们赶到时，杂货店老板、佐藤太太、学校里的学生都已经站在路边。\n\n草地中央多出两根生锈的铁条。\n\n昨天这里明明什么都没有。\n\n有人问：「这算铁轨吗？」\n\n另一个人说：「那站牌呢？」",dialog:"雾从远处慢慢压过来。\n\nMio盯着草地。\n\n「如果这里真的是车站……它现在在等什么？」",slot:"s",fixed:{v:"正在等",o:"明天"},opts:["银色电车","旧车站","数学老师","最后一个饭团"],event:(s)=>{memory.fifth=s;if(s==="银色电车")return"远处传来很轻的金属摩擦声。\n\n所有人一起安静下来。\n\n雾里亮起两盏灯。\n\n佐藤太太往后退了一步。\n\n「……真的有电车？」\n\nMio没有回答。";if(s==="旧车站")return"没有人笑。\n\n雾散开一点。草地尽头立着一块歪斜的木牌。\n\n昨天那里还什么都没有。\n\n上面写着：コトノハ町。\n\n田中小声说：「原来真的叫这个。」";if(s==="数学老师")return"身后突然传来自行车刹车声。\n\n数学老师扶着车把，气喘吁吁。\n\n「你们几个……」\n\n所有人回头。\n\n老师看见草里的铁轨，后半句没说出来。";return"葵低头。\n\n铁轨旁真的放着一个饭团。\n\n包装完好，标签上的日期却是明天。\n\n杂货店老板慢慢看向你们。\n\n「……这也是昨天那一个？」"},next:"→"}
];
function render(){const r=rounds[round];$("meta").textContent=(round+1)+" / "+rounds.length;$("app").innerHTML='<div class="place">'+r.day+"・"+r.place+'</div><h1 class="title">'+r.title+'</h1><div class="story">'+r.story.replace(/\n/g,"<br>")+'</div><div class="dialogue">'+r.dialog.replace(/\n/g,"<br>")+'</div><div class="choices">'+r.opts.map((o,i)=>'<button class="choice" data-i="'+i+'">'+E(o)+'</button>').join("")+'</div>';document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>resolve(r,r.opts[+b.dataset.i]))}
function resolve(r,val){let s=r.slot==="s"?val:r.fixed.s,v=r.slot==="v"?val:r.fixed.v,o=r.slot==="o"?val:r.fixed.o;let sentence=s+v+o+"。";$("app").innerHTML='<div class="place">'+r.day+"・"+r.place+'</div><div class="wordrow"><div class="word"><small>悠太</small>'+E(s)+'</div><div class="word"><small>Mio</small>'+E(v)+'</div><div class="word"><small>你</small>'+E(o)+'</div></div><div class="sentence">'+E(sentence)+'</div><div class="event">'+r.event(val).replace(/\n/g,"<br>")+'</div><button class="next" id="n">'+r.next+'</button>';if(round<rounds.length-1)$("n").onclick=()=>{round++;render()};else $("n").onclick=end}
function end(){$("meta").textContent="END";$("app").innerHTML='<div class="place">星期一・07:46・いつもの駅</div><h1 class="title">月曜日。</h1><div class="end">闸机前和平时一样挤。<br><br>你把Suica贴上去。<br><br>ピッ。<br><br>身后两个穿同校制服的学生正在聊天。<br><br>「听说周末コトノハ町那边出现了一个旧车站。」<br><br>「不是本来就有吗？」<br><br>电车进站。<br><br>你回头的时候，他们已经跟着人群上车了。</div>'}
render();
</script></body></html>

<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>コトノハ町｜第一阶段</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f1e9;color:#222;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC",sans-serif}.wrap{max-width:780px;margin:auto;padding:34px 20px 80px}.head{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid #333;padding-bottom:11px;margin-bottom:28px}.logo{font-family:Georgia,"Noto Serif SC",serif;font-size:24px;letter-spacing:.1em}.meta{font-size:11px;color:#777;letter-spacing:.1em}.place{font-size:11px;color:#777;letter-spacing:.12em;margin-bottom:8px}.title{font-family:Georgia,"Noto Serif SC",serif;font-size:24px;line-height:1.5;margin:0 0 13px}.body{font-size:15px;line-height:1.85;max-width:690px}.quote{margin:18px 0;padding-left:14px;border-left:2px solid #aaa;font-family:Georgia,"Noto Serif SC",serif;line-height:1.8}.box{margin-top:30px;border-top:1px solid #aaa;padding-top:20px}.role{font-size:12px;color:#777;margin-bottom:11px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:9px}.choice{border:1px solid #999;background:transparent;padding:13px;text-align:left;cursor:pointer;font-size:14px}.choice:hover,.choice.sel{background:#222;color:#fff;border-color:#222}.button{margin-top:20px;background:#222;color:white;border:1px solid #222;padding:12px 20px;cursor:pointer}.button:disabled{opacity:.3}.button.alt{background:transparent;color:#222}.reveal{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.word{border-top:1px solid #777;padding-top:9px}.word small{display:block;color:#888;margin-bottom:5px}.sentence{font-family:Georgia,"Noto Serif SC",serif;font-size:24px;line-height:1.65;margin:22px 0}.event{margin:24px 0;padding:18px 0;border-top:1px solid #aaa;border-bottom:1px solid #aaa}.event h3{font-size:12px;letter-spacing:.12em;margin:0 0 11px;color:#666}.event p{font-size:14px;line-height:1.85;margin:0}.echo{font-size:13px;color:#555;line-height:1.8;margin:16px 0}.memory{margin-top:28px}.memory h4{font-size:11px;color:#888;letter-spacing:.12em;margin:0 0 8px}.memory div{font-size:12px;color:#666;border-bottom:1px dotted #bbb;padding:6px 0}.chapter{font-family:Georgia,"Noto Serif SC",serif;font-size:29px;line-height:1.6;margin:35px 0}.end{font-size:16px;line-height:2}.notice{font-size:12px;color:#777;margin-top:10px}@media(max-width:600px){.choices{grid-template-columns:1fr}.reveal{grid-template-columns:1fr}.title{font-size:21px}.sentence{font-size:21px}}
</style></head><body><main class="wrap"><header class="head"><div class="logo">コトノハ町</div><div class="meta" id="meta">第一阶段 DEMO</div></header><div id="app"></div></main><script>
const S=[
{d:1,p:"终点站",t:"你们在一辆陌生的电车里醒来。",x:"车厢里只剩你们三个人。广播报出「终点站，コトノハ町」。下车后，银色电车驶进雾里。手机没有信号。等你们沿小路走了几分钟再回头，身后只剩一片长满草的空地。",q:"镇口的杂货店老板问：『你们从哪里来的？』三个人试着解释刚才发生的事。",role:"谓语",me:["把我们送到了","突然消失在","停靠在","从雾里开向"],sub:"一辆银色的列车",obj:"不存在的车站",event:["老板没有笑，只是朝你们来的方向看了一眼。","旁边买东西的两个客人也听见了。其中一个问：『那边什么时候有车站了？』","你们第一次发现，陌生人开始重复你们刚刚说过的词。"]},
{d:1,p:"镇中心・公共电话",t:"你们想先联系家里。",x:"一个叫Mio的同龄女孩带你们找到广场上的旧电话。电话能拨通，却没有人声。听筒里只有断断续续的车轮声。",q:"旁边等电话的人好奇你们为什么一直不挂。",role:"宾语",me:["刚才那辆列车","我们来的车站","一段听不清的广播","回家的方向"],sub:"公共电话里传来了",obj:"",event:["你把听筒递给旁边的人时，声音已经消失了。","那个人皱着眉试了两次：『现在明明什么都没有。』","傍晚，广场上却开始有人说，三个外地孩子在电话里听见了“车站的声音”。"]},
{d:1,p:"面包店",t:"天黑了，你们还没有吃东西。",x:"Mio带你们去面包店。老板娘听说你们没地方去，先塞给每人一个刚出炉的面包。她一边收拾柜台，一边问起那座你们一直提到的车站。",q:"店里还有几名客人。你们再次尝试描述自己的经历。",role:"主语",me:["我们三个","那辆银色列车","雾里的车站","站台上的广播"],sub:"",obj:"让镇上的人第一次听说了旧车站",event:["老板娘停了一下：『旧车站……这个说法听着倒挺像以前的故事。』","她没继续解释。另一桌客人却把“旧车站”三个字记住了。","离开时，你听见有人问：『他们说的是森林那边吗？』"]},
{d:2,p:"Mio家・早晨",t:"你们暂时住在Mio家的阁楼。",x:"第二天吃早饭时，Mio的母亲随口问：『你们就是从旧车站来的那三个孩子？』你们从没跟她说过。",q:"Mio愣了一下。昨晚的说法已经先你们一步到了这里。",role:"宾语",me:["旧车站","银色列车","三个外地孩子","森林那边的铁轨"],sub:"镇上的人开始谈论",obj:"",event:["去学校的路上，你们又听见两个不认识的人说起“旧车站”。","内容已经不完全一样：有人说在森林边，有人说小时候见过。","Mio小声说：『昨天以前，我从没听过大家这样聊。』"]},
{d:2,p:"学校・放学后",t:"老师允许你们暂时跟着Mio来学校。",x:"一天没发生什么大事。放学时，一个低年级学生突然跑来问：『旧车站真的晚上才看得到吗？』",q:"你们根本没说过这句话。",role:"谓语",me:["只会在晚上出现","藏在森林里面","会发出钟声","会让迷路的人找到路"],sub:"旧车站",obj:"",event:["孩子听完就跑去找朋友了。","十分钟后，你们经过操场，听见版本已经变成：『森林里有一座晚上才出现的旧车站。』","没有人知道“森林”最初是谁加进去的。"]},
{d:3,p:"市场",t:"第三天，Mio带你们真正逛一遍小镇。",x:"卖花的人、修钟的人、糖果摊老板都认识Mio。奇怪的是，他们也开始认识你们——准确地说，是认识“从旧车站来的三个孩子”。",q:"修钟老人说：『最近大家都在讲那个地方。你们到底看见什么了？』",role:"宾语",me:["长满草的站台","银色的车灯","没有名字的站牌","雾里的铁轨"],sub:"我们在旧车站看见了",obj:"",event:["老人没有说信，也没有说不信，只把你选的东西重复了一遍。","下午，这个细节出现在糖果摊老板讲给孩子们的版本里。","传闻开始拥有越来越具体的样子。"]},
{d:3,p:"河边",t:"回程时，你们发现河岸聚着几个人。",x:"一个钓鱼的人捞上来一块生锈的金属牌。上面的字只剩一半，看起来像「……駅」。Mio确定以前从没见过它。",q:"围观的人开始猜它从哪里漂来的。",role:"主语",me:["旧车站的站牌","森林里的铁轨","三十年前的车票","没人记得的东西"],sub:"",obj:"顺着河漂到了镇上",event:["没人能证明那块牌子属于什么地方。","但有人马上把它和你们说的“旧车站”联系起来。","晚上，面包店里第一次有人说：『说不定那座车站真的存在。』"]},
{d:4,p:"森林入口",t:"第四天，Mio提议去森林看看。",x:"不是为了冒险。最近所有人都开始说旧车站在森林方向，你们只是想确认那里到底有什么。越往里走，镇上的声音越远。",q:"半路上，一只乌鸦停在路标上。它模仿人声，断断续续地叫着一个最近常听见的词。",role:"宾语",me:["旧车站","银色列车","三个孩子","午夜"],sub:"森林里的乌鸦学会了说",obj:"",event:["第一只飞走后，远处又有一只重复了同样的词。","Mio停下脚步：『连这里都传到了？』","你们第一次清楚感觉到，这个说法已经走到了你们从未去过的地方。"]},
{d:4,p:"森林深处",t:"树林里出现了不自然的空隙。",x:"草丛下面压着两根平行的生锈铁条。它们只延伸十几米，前后都消失在泥土里。Mio蹲下来摸了很久。",q:"『昨天这里真的有这个吗？』没人能回答。",role:"谓语",me:["正在慢慢出现","一直藏在地下","通向雾里面","会在夜里继续生长"],sub:"旧车站的铁轨",obj:"",event:["回镇以后，你们没有主动告诉很多人。","可第二天早上，已经有人说森林里发现了铁轨。","更奇怪的是，一个老人坚持说：『那里以前本来就有铁路。』"]},
{d:5,p:"森林・同一地点",t:"第五天，你们重新回到那片空地。",x:"昨天只有十几米的铁轨已经穿过树林。尽头立着一块歪斜的站牌，油漆像经历了几十年风雨。上面写着：コトノハ町。",q:"Mio脸色发白。『我昨天明明站在这里。这里没有站牌。』",role:"主语",me:["被所有人谈论的旧车站","森林里不存在的车站","大家记忆里的车站","我们一直寻找的车站"],sub:"",obj:"出现在了森林深处",event:["你们顺着铁轨继续走。树后逐渐露出屋顶、长椅和封死的售票窗口。","它不像刚刚出现。灰尘、锈迹、褪色的时刻表，都像已经在那里几十年。","回到镇上时，有村民听说你们去过那里，只说：『哦，那座旧车站啊。』"]},
{d:5,p:"旧车站・黄昏",t:"你们站在一座昨天还不存在的车站里。",x:"Mio仍然记得森林原来的样子。你们三个也记得。可镇上的人正在越来越自然地接受它，好像这里一直如此。",q:"站台尽头没有列车。只有一条消失在雾里的铁轨。",role:"宾语",me:["一辆能回家的列车","我们来的那个世界","午夜的下一班车","铁轨尽头的地方"],sub:"如果车站能够出现，也许这里还会出现",obj:"",event:["这一次，没人马上回答。","远处的乌鸦落在站牌上，又叫了一声：『旧车站——』","你们第一次产生同一个念头：如果一座车站能被大家一点点说出来，那么列车呢？"]}
];
let i=0,pick=null,h=[];
const $=id=>document.getElementById(id),E=s=>s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function sentence(s,m){return s.sub? s.sub+m+s.obj : m+s.obj}
function render(){const s=S[i];$("meta").textContent="DAY "+s.d+" · "+(i+1)+"/"+S.length;$("app").innerHTML='<div class="place">'+s.p+'</div><h1 class="title">'+s.t+'</h1><div class="body">'+s.x+'</div><div class="quote">'+s.q+'</div><section class="box"><div class="role">这一次，你负责【'+s.role+'】</div><div class="choices">'+s.me.map((v,n)=>'<button class="choice '+(pick===n?"sel":"")+'" data-n="'+n+'">'+v+'</button>').join("")+'</div><div class="notice">另外两名玩家的词不会在翻开前显示。</div><button id="go" class="button" '+(pick===null?"disabled":"")+'>同时翻开</button></section>'+mem();document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{pick=+b.dataset.n;render()});$("go").onclick=reveal}
function reveal(){const s=S[i],m=s.me[pick],q=sentence(s,m);let p2=s.sub||(["Mio","镇上的孩子","面包店老板"][i%3]);let p3=s.obj||(["旧车站","银色列车","森林里的传闻"][i%3]);h.push({d:s.d,q});$("app").innerHTML='<div class="place">'+s.p+'</div><div class="role">同时翻开</div><div class="reveal"><div class="word"><small>玩家 1</small>'+E(m)+'</div><div class="word"><small>玩家 2</small>'+E(p2)+'</div><div class="word"><small>玩家 3</small>'+E(p3)+'</div></div><div class="sentence">「'+E(q)+'。」</div><section class="event"><h3>随后发生的事</h3><p>'+s.event.map(E).join("<br><br>")+'</p></section><button id="next" class="button">'+(i===S.length-1?"结束第一阶段":"继续")+'</button>'+mem();$("next").onclick=next}
function mem(){if(!h.length)return "";return '<div class="memory"><h4>镇上流传过的话</h4>'+h.slice(-5).map(x=>'<div>DAY '+x.d+'　'+E(x.q)+'</div>').join("")+'</div>'}
function next(){if(i===S.length-1)return end();i++;pick=null;render()}
function end(){$("meta").textContent="第一阶段 · END";$("app").innerHTML='<div class="place">旧车站・黄昏</div><div class="chapter">一开始，你们只是在解释自己从哪里来。<br><br>五天后，一座原本不存在的车站站在了森林里。</div><div class="end">没有人宣布传闻已经成真。<br>没有进度条，也没有人知道是哪一句话让它出现。<br><br>你们只知道——镇上的人说过，孩子们说过，面包店的客人说过，最后连森林里的乌鸦都学会了说「旧车站」。<br><br><b>现在，你们想试着把那辆能够回家的列车也说出来。</b></div><button class="button alt" onclick="location.reload()">重新开始</button>'+mem()}
render();
</script></body></html>

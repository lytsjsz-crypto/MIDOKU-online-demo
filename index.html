}.names{display:grid;gap:10px}.names input{width:100%;border:0;border-bottom:1px solid #99948a;background:transparent;padding:12px 4px;font-size:16px;outline:none}.start{width:100%;margin-top:28px;border:1px solid #282722;background:#282722;color:#fff;padding:14px;cursor:pointer}.end{font-size:16px;line-height:2}@media(max-width:600px){.choices{grid-template-columns:1fr 1fr}.wordrow{grid-template-columns:1fr}.sentence{font-size:21px}}

const $=x=>document.getElementById(x),E=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]||m));let round=0;const M={};let playerCount=3,players=[];const timePools=[["放課後","さっき","日が暮れる前","誰も見ていない間に"],["さっき","電車が行ったあと","店主が出てくる前","振り返ったとき"],["夕方","店が閉まる前","猫が走っていったあと","夕飯の前"],["さっき","日が沈む前","みんなが電話していた頃","誰も見ていないとき"],["日が暮れてから","銀色の電車が来るとき","カラスが鳴くとき","誰かが迷ったとき"],["さっき","森に入ってから","カラスが鳴くとき","みんなが探している間"],["今","霧が出てから","次の電車が来る前","明日"]];
const rounds=[
{day:"金曜日・17:38",place:"いつもの駅",title:"差一点。",story:"部活结束得比平时晚。四个人跑上站台时，平时坐的电车刚好关门。\n\n一个同伴：「啊——差一点！」\n\n下一班，二十分钟。\n\n另一个同伴看了一眼手机：「我妈说六点前回去。」\n\n对面站台停着一辆没見たことがある的银色电车。线路图上有一段和回家方向重合。",dialog:"Mio：「这个不是也往那边走吗？」\n\n一个同伴：「坐几站再换也行吧。」\n\n关门铃响了。\n\n四个人跑了过去。",trigger:"一个同伴盯着线路图，又看了一眼已经关门的银色电车。\n\n「所以……这辆车到底会把我们带到哪？」",slot:"o",fixed:{s:"この電車は",v:"向かった"},opts:["見たことのない町へ","いつもの乗換駅へ","終点へ","家とはまったく逆の方向へ"],event:(o)=>{M.arrive=o;if(o==="見たことのない町へ")return"车厢里的乘客越来越少。\n\n手机信号只剩一格。\n\n广播响起：『下一站，终点——コトノハ町。』\n\n四个人一起抬头。\n\nMio：「……这哪？」";if(o==="いつもの乗換駅へ")return"广播报出一个完全陌生的站名。\n\n一个同伴盯着车门上方的线路图。\n\n「不对，我们换乘站早就应该到了。」\n\n『下一站，终点——コトノハ町。』";if(o==="終点へ")return"列车没有在你们认识的任何一站停下。\n\n最后，车厢只剩四个人。\n\n『下一站，终点——コトノハ町。』\n\n另一个同伴：「我们是不是坐反了？」";return"窗外熟悉的楼越来越少。\n\n一个同伴把地图转了两次。\n\n「……方向真的反了。」\n\n这时广播响起：『下一站，终点——コトノハ町。』"},next:"降りる"},
{day:"金曜日・18:11",place:"コトノハ町",title:"电车走了，站台也不见了。",story:"四个人降りる以后，银色电车很快钻进雾里。\n\n「先找工作人员吧。」\n\n你们绕过一排矮房子，又觉得不对，沿原路折回来。\n\nさっき的站台不见了。\n\n原地只有一片草。\n\n路边杂货店的老板抱着纸箱出来，盯着你们看了半天。",dialog:"老板：「你们几个，站在这里干什么？」\n\nMio：「我们さっき从车站出来的。」\n\n老板：「车站？」\n\n他朝草地看了一眼。\n\n「这个镇上没有车站啊。」",trigger:"老板显然还是没听明白。他指着那片草地，又问了一遍。\n\n「那你们说清楚——あの銀色の電車を到底把你们送到了哪里？」",slot:"o",fixed:{s:"あの銀色の電車を",v:"私たちを連れてきた"},opts:["ここの駅に","この草むらに","「コトノハ町」という駅に","どこか分からない場所に"],event:(o)=>{M.station=o;if(o==="ここの駅に")return"老板：「ここの駅に？」\n\n「对，さっき明明——」\n\n老板打断Mio：「这里从来没有车站。」\n\n店里传来拖鞋声。\n\n一个和你们差不多大的女生掀开门帘。\n\n「爸，谁啊？」\n\n老板指着你们：「Mio，这几个孩子说，他们刚从ここの駅に下来。」";if(o.includes("コトノハ町"))return"老板：「コトノハ町站？」\n\n他皱眉重复了一遍。\n\n「我们镇叫コトノハ町没错，可没有什么コトノハ町站。」\n\n店里的门帘被掀开。\n\n「爸，谁啊？」\n\n老板回头：「Mio，他们说自己刚从『コトノハ町站』下来。」";if(o==="この草むらに")return"老板低头看了看草。\n\n「电车把你们送到草地？」\n\n「不是，さっき这里是站台。」\n\n店里有人走出来。\n\n「爸，你在跟谁说话？」\n\n老板指向草地：「Mio，他们说这里さっき还是车站。」";return"老板：「どこか分からない場所に？」\n\n一个同伴：「所以我们才想找车站回去。」\n\n「都说了，这里没有车站。」\n\n店里一个女生掀开门帘。\n\n「爸？」\n\n老板：「Mio，你带他们去镇上看看吧。不然他们今晚要一直站这儿了。」"},next:"Mioについていく"},
{day:"金曜日・18:29",place:"商店街",title:"先问回去的路。",story:"Mio带你们沿商店街往前走。天还没完全黑，肉店在收招牌，文具店门口摆着第二天要回收的纸箱。\n\nMio：「我从小住这里，真的没見たことがある车站。」\n\n一个同伴：「那我们到底怎么来的？」\n\nMio：「所以才要问啊。」\n\n前面的可乐饼店老板娘正在关玻璃门。",dialog:"Mio：「阿姨，这附近以前有过车站吗？」\n\n老板娘：「车站？没有吧。」\n\n她又看向你们。\n\n「怎么突然问这个？」",trigger:"老板娘擦玻璃的手停下来。\n\n「等等。你们一直说あの駅を。到底是谁見たことがある它？」",slot:"s",fixed:{v:"見たことがある",o:"あの駅を"},opts:["雑貨屋のおじさんが","制服を着た子が","あの三毛猫が","銀色の電車に乗った人が"],event:(s)=>{M.witness=s;if(s==="雑貨屋のおじさんが")return"老板娘：「雑貨屋のおじさんが見たことがある？」\n\nMio：「不是，他さっき还说没有——」\n\n「那就是以前見たことがある，今没有了？」\n\n隔壁正在收摊的人抬起头。\n\n「什么？以前这里有站？」";if(s.includes("校服"))return"老板娘看了看你们的制服。\n\n「穿校服的孩子見たことがあるあの駅を？」\n\n「我们就是——」\n\n隔壁店的人探出头：「哪个学校的？是不是以前迷路的那个传闻？」\n\nMio：「什么传闻？」";if(s.includes("三毛猫が"))return"老板娘愣了一下。\n\n「猫見たことがある车站？」\n\n脚边正好传来一声猫叫。\n\n一只三毛猫が从纸箱后钻出来。\n\n隔壁店的人笑了：「那让它带路不就好了。」\n\nMio看着猫跑向街尾，没有笑。";return"老板娘：「銀色の電車に乗った人が見たことがあるあの駅を……」\n\n隔壁店的人听见“银色电车”，停下手。\n\n「等等，我好像听我奶奶说过。以前有人说，夕方会有一辆颜色很淡的电车经过。」\n\nMio：「这里连铁轨都没有啊。」"},next:"もう少し町を歩く"},
{day:"金曜日・18:47",place:"小公园",title:"“没有”はじめる变成“听说有”。",story:"商店街走到头是一座很小的公园。两个小学生在秋千旁等家长。\n\n你们还没开口，其中一个先问：\n\n「你们是在找车站吗？」\n\nMio停下。\n\n「你怎么知っている？」\n\n「さっき妈妈打电话说的。」",dialog:"另一个孩子抢着说：「听说那个站很奇怪。」\n\n一个同伴：「哪里奇怪？」\n\n「不知っている啊。你们不是看见了吗？」",trigger:"小学生从秋千上跳下来，追着问。\n\n「那存在しないはずの駅は，到底怎么会跑到森のほうに？」",slot:"v",fixed:{s:"存在しないはずの駅は",o:"森のほうに"},opts:["隠れている","会出今","待っている","移ってしまった"],event:(v)=>{M.place=v;if(v==="隠れている")return"小学生：「车站隠れている森のほうに？」\n\n另一个孩子立刻说：「我知っている！神社后面那片森林。」\n\n接孩子的母亲正好走过来。\n\n「什么森林？」\n\n「他们说车站隠れている里面。」\n\nMio：「我们没——」\n\n母亲已经拿出手机。";if(v==="会出今")return"「会出今森のほうに？」\n\n小学生眼睛一下亮了。\n\n「什么时候？」\n\n「我们没说时间。」\n\n接孩子的母亲走过来，只听见后半句。\n\n「晚上才出现吗？」\n\nMio：「为什么又多了个晚上？」";if(v==="待っている")return"两个孩子一起看向森林方向。\n\n「车站在等？」\n\n其中一个压低声音：「是不是在等さっき那辆电车？」\n\n来接人的母亲正好听见。\n\n「什么电车？」\n\n十秒后，她已经在电话里说“森の中の駅は”。";return"「车站跑到森のほうに了？」\n\n两个小学生笑起来。\n\n可来接他们的母亲只听到最后一句。\n\n「森のほうに有车站？」\n\n「妈妈，他们就是从那里来的！」\n\nMio张了张嘴，没插进去。"},next:"森のほうへ向かう"},
{day:"金曜日・19:06",place:"神社前",title:"每个人都知っている一点。",story:"通往森林的路经过一座小神社。\n\nさっき公园里的话似乎比你们走得更快。石阶旁的老人看见Mio，直接问：\n\n「你们真要去找那个站？」\n\nMio：「您也知っている了？」\n\n老人：「さっき有人说，在森のほうに。」",dialog:"一个同伴：「可是森林这么大，具体在哪？」\n\n老人摇头。\n\n「我可不知っている。只听说它有个特别的地方。」",trigger:"老人看了看越来越暗的天色。\n\n「既然你们都说它在森林里，那它什么时候才会出现？」",slot:"o",fixed:{s:"森の中の駅は",v:"姿を現す"},opts:["日が暮れてから","子どもが迷子になったとき","銀色の電車が来るとき","カラスが鳴くとき"],event:(o)=>{M.time=o;if(o==="日が暮れてから")return"老人：「只在日が暮れてから出现？」\n\n他抬头看了眼已经发蓝的天空。\n\n「那倒是快了。」\n\n刚走上石阶的两个人听见这句。\n\n「晚上才有的站？」\n\n其中一个立刻回头往山下走。";if(o.includes("迷路"))return"老人看着你们。\n\n「子どもが迷子になったとき才出现……」\n\n石阶上的女人听见了，立刻把身边的小孩拉近一点。\n\n「别往森林里跑。」\n\n小孩却回头问：「那他们不是正好迷路了吗？」";if(o.includes("银色"))return"老人：「銀色の電車が来るとき才出现？」\n\n石阶上有人停住。\n\n「银色电车？我さっき在商店街也听到了。」\n\nMio小声说：「已经传到这里了……」";return"树上传来一声「カァ」。\n\n老人抬头。\n\n「カラスが鳴くとき？」\n\n又一声。\n\n石阶上的孩子笑起来：「那今就会出现啊。」"},next:"森へ入る"},
{day:"金曜日・19:24",place:"森林",title:"连乌鸦都はじめる重复了。",story:"路灯到神社后面就没有了。Mio打开手机手电筒。\n\n林子里不止你们。前面偶尔能看见别人的灯光。\n\n一个同伴：「这些人也是来找车站的？」\n\n远处有人喊：「这边没有！」\n\n树上传来乌鸦叫。",dialog:"「カァ——」\n\n又一只跟着叫。\n\n「エキ——」\n\n四个人同时停住。\n\n另一个同伴：「……さっき那个是不是在说‘駅’？」",trigger:"第二声乌鸦叫从更远的树上传回来。有人停下脚步。\n\n「所以今，到底是谁知っている车站在哪里？」",slot:"s",fixed:{v:"知っている",o:"駅の場所を"},opts:["森のカラスが","三毛猫が","町のみんなが","私たちを"],event:(s)=>{M.know=s;if(s.includes("乌鸦"))return"「森のカラスが知っている駅の場所を。」\n\n话音刚落，前面的树上又传来：\n\n「エキ——」\n\n更远一点的地方也跟着响。\n\n「エキ、エキ——」\n\nMio把手电筒慢慢抬高。\n\n树林深处，忽然传来很轻的一声铃。";if(s.includes("三毛猫が"))return"脚边草丛一动。\n\n商店街あの三毛猫が从黑暗里钻出来，看了你们一眼，继续往林子深处走。\n\n树上的乌鸦跟着叫：\n\n「エキ——」\n\n一个同伴：「……真要跟吗？」\n\n远处忽然传来一声铃。";if(s.includes("整个镇子"))return"前后都是人的声音。\n\n「这边没有。」\n「听说还要往里。」\n「是不是天黑才有？」\n\n每个人说的都不一样，可每个人都在找同一个车站。\n\n树上的乌鸦叫了一声：\n\n「エキ——」\n\n远处传来铃声。";return"没人接这句话。\n\n你们四个一路问到这里，却没有一个人真的知っている车站在哪。\n\n树上的乌鸦忽然叫：\n\n「エキ——」\n\n紧接着，树林深处传来一声铃。"},next:"音のするほうへ進む"},
{day:"金曜日・19:31",place:"森林深处",title:"カン、カン、カン。",story:"一はじめる只是很轻。\n\n再往前几步，声音变得清楚。\n\nカン、カン、カン。\n\n像铁路道口。\n\n可这里没有铁路。\n\nMio关掉手机手电筒。树林前面透出一排暖黄色的灯。",dialog:"几个人拨开最后一层树枝。\n\n铁轨横在面前。\n\n一块白色站牌立在雾里。\n\nコトノハ町駅は。\n\n一个同伴：「……这里さっき真的什么都没有吧。」",trigger:"铁轨和站牌都已经在眼前。身后有人压低声音问。\n\n「那这个刚出现的コトノハ町駅は，今到底在等什么？」",slot:"o",fixed:{s:"コトノハ町駅は",v:"待っている"},opts:["あの銀色の電車を","私たちを","明日","次の噂を"],event:(o)=>{if(o.includes("银色"))return"雾的另一边亮起两盏灯。\n\n轨道はじめる轻轻震动。\n\nMio看着站牌，又看向你们。\n\n「……这次还上吗？」";if(o.includes("我们"))return"站台的灯一盏一盏亮起来。\n\n没有工作人员，也没有其他乘客。\n\n只有长椅上放着四张车票。";if(o==="明日")return"站台上的电子钟跳了一下。\n\n19:31消失了。\n\n屏幕只剩一个日期。\n\n明日。";return"树上的乌鸦又叫了一声。\n\n「エキ——」\n\n远处有人跑过来。\n\n「找到了！真的有车站！」\n\n更多脚步声从森林里靠近。"},next:"→"}
];
function injectPlayers(x){if(!x)return x;const p=i=>players[Math.min(i,players.length-1)]||("玩家"+(i+1));return x.replaceAll("一个同伴",p(0)).replaceAll("另一个同伴",p(1)).replaceAll("四个人",players.join("、")).replaceAll("私たちを",players.join("、"));}
function preMio(x){if(round<=1)return injectPlayers(x).replaceAll("Mio：", (players[2]||"プレイヤー3")+"：").replaceAll("Mio刚", (players[2]||"プレイヤー3")+"刚").replaceAll("Mio：「", (players[2]||"プレイヤー3")+"：「");return injectPlayers(x)}
function render(){const r=rounds[round];$("meta").textContent=(round+1)+" / "+rounds.length;$("app").innerHTML='<div class="place">'+r.day+"・"+r.place+'</div><div class="story">'+preMio(r.story).replace(/\n/g,"<br>")+'</div><div class="dialogue">'+preMio(r.dialog).replace(/\n/g,"<br>")+'</div><div class="dialogue">'+preMio(r.trigger).replace(/\n/g,"<br>")+'</div><div class="slotlabel">'+(r.slot==="s"?"主語":r.slot==="v"?"述語":"目的語")+'</div><div class="choices">'+r.opts.map((o,i)=>'<button class="choice" data-i="'+i+'">'+E(o)+'</button>').join("")+'</div>';document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>resolve(r,r.opts[+b.dataset.i]))}
function resolve(r,val){
let s=r.slot==="s"?val:r.fixed.s,v=r.slot==="v"?val:r.fixed.v,o=r.slot==="o"?val:r.fixed.o;
let t=playerCount===4?timePools[round][round%4]:"";
let sentence=(t?t+"，":"")+s+v+o+"。";
let roles=playerCount===4?[t,s,v,o]:[s,v,o];
let offset=round%playerCount;
let names=roles.map((_,i)=>players[(i+offset)%playerCount]||("玩家"+(i+1)));
$("app").innerHTML='<div class="place">'+r.day+"・"+r.place+'</div><div class="wordrow" style="grid-template-columns:repeat('+roles.length+',1fr)">'+roles.map((x,i)=>'<div class="word"><small>'+E(names[i])+'</small>'+E(x)+'</div>').join("")+'</div><div class="sentence">'+E(sentence)+'</div><div class="event">'+preMio(r.event(val)).replace(/\n/g,"<br>")+'</div><button class="next" id="n">'+r.next+'</button>';
if(round<rounds.length-1)$("n").onclick=()=>{round++;render()};else $("n").onclick=end
}
function end(){$("meta").textContent="END";$("app").innerHTML='<div class="place">月曜日・07:46・いつもの駅</div><h1 class="title">月曜日。</h1><div class="end">你把Suica贴上闸机。<br><br>ピッ。<br><br>身后两个同校学生正在聊天。<br><br>「听说コトノハ町有个车站。」<br><br>「我知っている。森林里面那个吧。」<br><br>「晚上才会出现的。」<br><br>电车进站。<br><br>车门打开以前，站台顶棚上落下一只乌鸦。<br><br>「エキ——」</div>'}
function setup(){ $("meta").textContent="SETUP"; $("app").innerHTML='<div class="setup"><h1>コトノハ町</h1><div class="people"><button id="p3" class="on">3人</button><button id="p4">4人</button></div><div class="names" id="names"></div><button class="start" id="start">はじめる</button></div>'; function draw(){ $("names").innerHTML=Array.from({length:playerCount},(_,i)=>'<input maxlength="10" placeholder="プレイヤー'+(i+1)+'のニックネーム">').join("") } draw(); $("p3").onclick=()=>{playerCount=3;$("p3").classList.add("on");$("p4").classList.remove("on");draw()}; $("p4").onclick=()=>{playerCount=4;$("p4").classList.add("on");$("p3").classList.remove("on");draw()}; $("start").onclick=()=>{players=[...document.querySelectorAll("#names input")].map((x,i)=>x.value.trim()||("玩家"+(i+1)));round=0;render()}} setup();
</script></body></html>

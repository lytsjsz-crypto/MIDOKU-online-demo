<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>未读 MIDOKU｜核心机制原型</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0b0d0e;color:#ece9e1;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans SC",sans-serif}.wrap{max-width:760px;margin:auto;padding:28px 18px 70px}.logo{font-family:serif;font-weight:800;letter-spacing:.25em;font-size:22px}.sub,.tag{color:#8d9495;font-size:12px;letter-spacing:.13em}.card{margin-top:20px;border:1px solid #353a3b;background:#121516;padding:26px;box-shadow:0 25px 70px #0008}.title{font:700 28px serif;letter-spacing:.08em;margin:9px 0 18px}.story{line-height:1.85;white-space:pre-line}.btn{display:block;width:100%;padding:15px;margin:10px 0;background:#181c1d;color:#eee;border:1px solid #495051;text-align:left;font-size:15px;cursor:pointer}.btn:hover{background:#232829}.primary{text-align:center;background:#e2dfd5;color:#171819;font-weight:800}.secret{border-left:2px solid #a07a58;background:#191714;padding:16px;margin:18px 0}.world{border:1px solid #4d5556;padding:18px;margin:18px 0}.unread{opacity:.8;border:1px dashed #697071;padding:13px;margin:8px 0}.reality{border-left:3px solid #d8d1b9;padding:15px;background:#191c1d}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid #505657;padding:7px 10px;font-size:12px}.line{height:1px;background:#34393a;margin:22px 0}.small{font-size:12px;color:#999}.pulse{animation:p .6s 2}@keyframes p{50%{opacity:.25}}@media(max-width:520px){.card{padding:19px}.title{font-size:24px}}</style></head>
<body><main class="wrap"><div class="logo">未读 MIDOKU</div><div class="sub">CORE LOOP PROTOTYPE · SOLO SIMULATION</div><section id="app" class="card"></section></main>
<script>
const app=document.querySelector("#app");let state={round:1,choice:null,unread:[],history:[],goal:null};
const options={
1:[["BRIDGE","造桥","让两岸从此相连。"],["BOAT","乘舟","只让需要的人渡河。"],["SOURCE","寻找源头","离开河岸，追溯这条河从哪里来。"]],
2:[["OPEN","开放城门","让陌生人进入。"],["CLOSE","关闭城门","保护城内现有的一切。"],["MOVE","离开城市","放弃这里，寻找新的土地。"]],
3:[["KEEP","保留现在","接受已经形成的世界。"],["READ","读取未读","让一个曾经被放弃的可能重新回来。"],["BREAK","改写现实","让现在发生过的事重新成为可能。"]]
};
function start(){state={round:1,choice:null,unread:[],history:[],goal:["让分离的人重新相遇","让世界不再依赖旧有规则","找回已经失去的可能"][Math.floor(Math.random()*3)]};app.innerHTML='<div class="tag">5 MINUTE PROTOTYPE</div><div class="title">一条河</div><div class="story">你与另外两个人来到一片尚未完成的世界。\n\n前方只有一条河。\n世界正在等待你们决定它的形状。</div><div class="secret"><div class="tag">只有你知道</div><b>'+state.goal+'</b></div><button class="btn primary" onclick="round()">开始</button>'}
function round(){let r=state.round,info=r===1?"你知道：河水正在缓慢上涨。":r===2?"你知道：城外的人携带着一种城内已经消失的种子。":"你知道：被放弃的选择并没有消失。";let h='<div class="tag">ROUND 0'+r+'</div><div class="title">'+(r===1?"河":r===2?"城":"未读")+'</div><div class="secret">'+info+'</div><div class="story">'+(r===1?"另外两名玩家正在讨论如何越过这条河。":r===2?"第一轮之后，河的另一侧出现了一座城市。": "世界已经记住了你们前两轮的选择。")+'</div><div class="line"></div>';options[r].forEach((o,i)=>h+='<button class="btn" onclick="pick('+i+')"><b>'+o[1]+'</b><br><span class="small">'+o[2]+'</span></button>');if(state.unread.length)h+='<div class="line"></div><div class="tag">UNREAD</div>'+state.unread.map(x=>'<div class="unread">'+x.label+'</div>').join("");app.innerHTML=h}
function pick(i){let r=state.round,o=options[r][i];state.choice=o;let ai1=Math.floor(Math.random()*3),ai2=Math.floor(Math.random()*3);let votes=[i,ai1,ai2],count=[0,0,0];votes.forEach(v=>count[v]++);let win=count.indexOf(Math.max(...count));if(count.filter(x=>x===Math.max(...count)).length>1)win=i;let reality=options[r][win];options[r].forEach((x,j)=>{if(j!==win)state.unread.push({round:r,label:"R"+r+" · "+x[1],id:x[0]})});state.history.push({round:r,you:o,reality});result(ai1,ai2,reality)}
function result(a,b,reality){let r=state.round;let names=options[r];let h='<div class="tag">CHOICES</div><div class="title">世界作出了回答</div><div class="chips"><div class="chip">你 · '+state.choice[1]+'</div><div class="chip">玩家B · '+names[a][1]+'</div><div class="chip">玩家C · '+names[b][1]+'</div></div><div class="line"></div><div class="reality"><div class="tag">REALITY</div><b>'+reality[1]+'</b><br><br>'+worldText(r,reality[0])+'</div><div class="line"></div><div class="tag">UNREAD</div>'+state.unread.slice(-2).map(x=>'<div class="unread">'+x.label+'</div>').join("");if(r<3)h+='<button class="btn primary" onclick="next()">进入下一轮</button>';else h+='<button class="btn primary" onclick="finale()">查看这个世界</button>';app.innerHTML=h}
function worldText(r,id){if(r===1)return id==="BRIDGE"?"桥连接了两岸。第二天，两边的人开始交换货物与消息。":id==="BOAT"?"河上出现了渡船。渡河成为少数人的特权。":"你们找到了源头。那里没有泉眼，只有一道尚未命名的裂隙。";if(r===2)return id==="OPEN"?"城门打开。陌生人的语言第一次进入城市。":id==="CLOSE"?"城门关闭。城里安全了，但那种种子留在了外面。":"你们离开城市。几天后回头时，那里已经从地图上消失。";return id==="KEEP"?"世界维持现在的形状。":"一个旧选择重新浮到现实表面。"}
window.next=()=>{state.round++;round()}
window.finale=()=>{let read=state.unread[0];let h='<div class="tag">FINAL TEST</div><div class="title">读取未读</div><div class="story">结束之前，你获得一次机会。\n\n可以把第一轮被舍弃的一种可能重新放回世界。</div>'+state.unread.slice(0,2).map((x,i)=>'<button class="btn" onclick="readUnread('+i+')">'+x.label+'</button>').join("")+'<button class="btn" onclick="end(false)">不读取</button>';app.innerHTML=h}
window.readUnread=i=>{let x=state.unread[i];app.innerHTML='<div class="tag pulse">UNREAD → REALITY</div><div class="title">'+x.label.replace(/^R\d · /,"")+'</div><div class="story">一个已经被舍弃的选择重新发生。\n\n你们以为过去已经确定。\n但世界并没有忘记它。</div><button class="btn primary" onclick="end(true)">结束测试</button>'}
window.end=read=>{app.innerHTML='<div class="tag">PROTOTYPE END</div><div class="title">未读</div><div class="story">这一局里，你想要：\n<b>'+state.goal+'</b>\n\n你作出了 '+state.history.length+' 次选择，留下了 '+state.unread.length+' 个未读可能。'+(read?"\n\n其中一个被你重新读回了现实。":"")+'</div><div class="line"></div><button class="btn primary" onclick="start()">重新测试</button>'}
start();
</script></body></html>

<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>コトノハ町</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f2e8;color:#24231f;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.wrap{max-width:790px;margin:auto;padding:34px 20px 80px}.head{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid #393832;padding-bottom:10px;margin-bottom:30px}.logo{font:25px Georgia,serif;letter-spacing:.12em}.meta,.eyebrow{font-size:11px;color:#77736a;letter-spacing:.11em}.title{font:25px/1.5 Georgia,"Noto Serif SC",serif;margin:8px 0 14px}.story{font-size:15px;line-height:1.9}.dialogue{font:16px/1.9 Georgia,"Noto Serif SC",serif;margin:18px 0;padding-left:15px;border-left:2px solid #aaa59a}.box{border-top:1px solid #aaa59a;margin-top:30px;padding-top:20px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.choice{border:1px solid #99948a;background:transparent;padding:13px;text-align:left;cursor:pointer;font-size:14px;min-height:48px}.choice:hover,.choice.sel{background:#282722;color:#fff}.btn{border:1px solid #282722;background:#282722;color:#fff;padding:12px 19px;margin-top:20px;cursor:pointer}.btn:disabled{opacity:.3}.btn.alt{background:transparent;color:#282722}.note{font-size:12px;color:#817d74;margin-top:12px}.reveal{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:20px 0}.word{border-top:1px solid #817d74;padding-top:8px;font-size:14px}.word small{display:block;color:#88837a;font-size:11px;margin-bottom:5px}.sentence{font:25px/1.65 Georgia,"Noto Serif SC",serif;margin:25px 0}.after{border-top:1px solid #aaa59a;border-bottom:1px solid #aaa59a;padding:18px 0;margin:22px 0;font-size:15px;line-height:1.9}.chapter{font:29px/1.7 Georgia,"Noto Serif SC",serif;margin:35px 0}.end{font-size:16px;line-height:2}@media(max-width:620px){.choices{grid-template-columns:1fr}.reveal{grid-template-columns:1fr}.title{font-size:22px}.sentence{font-size:21px}}
</style></head><body><main class="wrap"><header class="head"><div class="logo">コトノハ町</div><div class="meta" id="meta">PROTOTYPE 07 SAFE</div></header><div id="app"></div></main><script>
const scenes=[
{kind:"story",d:0,p:"星期五・放学后",t:"本来只是坐错了一班车。",x:"社团活动结束得太晚。你们冲上站台时，平时坐的电车刚关门。下一班还有二十分钟。\n\n对面正好停着一辆银色电车。线路图上有你们回家的方向，关门铃又已经响了。四个人互相看了一眼，跑了进去。\n\n前几站都很正常。窗外有便利店，有住宅，还有背着书包下车的学生。后来手机信号只剩一格。再抬头时，车厢里只剩你们四个。\n\n『下一站，终点——コトノハ町。』",dialog:"下车后，银色电车开进雾里。你们走了几分钟又原路跑回来。\n\n站台没了。连铁轨都没了。"},
{kind:"play",d:1,p:"镇口・傍晚",t:"镇上的人先发现了你们。",x:"四个穿着外地校服的孩子站在路边研究一张加载不出来的地图。杂货店老板探出头：『迷路了？』\n\n你们说自己刚从车站过来。老板往你们身后看了一眼：『那边？那边只有草地啊。』",dialog:"买东西的客人也凑了过来。你们只好再讲一遍。",role:"谓语",opts:["把我们送到了","开进了","落下了","带走了"],others:["那辆银色电车","森林的方向"],after:["老板听完，还是半信半疑。","旁边的阿姨却记住了“银色电车”几个字。她提着酱油离开时，正好碰见两个熟人。"]},
{kind:"story",d:1,p:"面包店・晚上",t:"先解决肚子的问题。",x:"杂货店老板叫来了自己的女儿Mio。她和你们差不多大。听说你们暂时联系不上家里，她带你们去镇上买吃的。\n\n面包店老板娘多塞了四个小面包。隔壁桌有人认出了你们：『就是坐银色电车来的那几个？』\n\nMio看了你们一眼。\n\n『你们才来多久啊。』",dialog:"晚上，你们暂时住进Mio家的阁楼。"},
{kind:"play",d:2,p:"Mio家・早餐",t:"第二天，Mio妈妈已经听说了。",x:"『你们就是从旧车站来的四个孩子吧？』\n\nMio差点把牛奶洒出来：『妈妈，什么旧车站？』\n\n『佐藤太太说的呀。她也是听客人讲的。』\n\n你们昨天明明只说了“车站”。",dialog:"吃完早饭，Mio决定带你们逛逛镇子。",role:"宾语",opts:["旧车站","我的学生证","我的Suica","昨天的便当盒"],others:["镇上的孩子","捡到了"],after:["午后，你们经过小广场。几个孩子正围在一起聊天。","其中一个看到你们，马上跑过来：『喂，你们真的见过旧车站吗？』"]},
{kind:"play",d:2,p:"镇中心・下午",t:"这个镇子比想象中有意思。",x:"修钟老人的店里挂着十几只时间不同的钟。河边有人卖装在玻璃瓶里的“昨天的雨”。糖果店门口趴着一只胖得不想动的猫。\n\n走到广场时，两个孩子还在争论旧车站到底在哪里。",dialog:"『我听说在森林那边。』『胡说，明明是晚上才会出现。』",role:"主语",opts:["Mio","修钟老人","广场上的猫","我的自动铅笔"],others:["藏起了","一张旧车票"],after:["争论突然停了一下。","一个孩子问：『旧车票？谁见过？』另一个已经跑去告诉自己的朋友。"]},
{kind:"story",d:3,p:"Mio家・早晨",t:"昨天那句怪话，只留下了一点小麻烦。",x:"出门前，你翻笔袋找自动铅笔。\n\n里面多了一张发黄的小纸片。\n\nMio凑过来看。\n\n『这是什么？』\n\n纸片上只有半个模糊的“駅”字。\n\n你们看了几秒，把它夹进课本。今天还要去河边。",dialog:"没人提议调查它。"},
{kind:"play",d:3,p:"河边",t:"河里又捞上来一个奇怪东西。",x:"钓鱼的大叔捞起一块生锈铁牌，上面同样剩着一个『駅』字。\n\n围观的人立刻七嘴八舌。修钟老人却摆摆手：『一个字而已，什么也说明不了。』",dialog:"Mio把你课本里的那张小纸片掏出来，两样东西摆在一起。",role:"谓语",opts:["一直跟着","被装进了","忘在了","拿去换了"],others:["森林里的乌鸦","我的Suica"],after:["回去的路上，一只乌鸦落在电线上，盯着你们看了很久。","你摸了摸口袋。交通卡还在。Mio笑：『至少今天没丢。』"]},
{kind:"play",d:4,p:"森林入口",t:"“既然大家都说在森林里，就去看看吧。”",x:"Mio背了几瓶汽水。森林一开始没什么特别，只有路越来越窄。\n\n走到半山腰，一块路标写着『山顶 →』。你们喝完汽水再抬头，上面变成了『今天别去山顶 →』。",dialog:"Mio盯着路标：『……谁改的？』",role:"宾语",opts:["旧车站","我的便当盒","Mio的手表","一支钢笔"],others:["森林里的乌鸦","叼走了"],after:["树上传来扑棱一声。","一只乌鸦飞过头顶，嘴里确实叼着什么。至于是不是你们刚才说的那个东西，谁也没看清。"]},
{kind:"story",d:4,p:"森林深处",t:"乌鸦也会说镇上的话。",x:"第一只叫的是『面包——』。第二只叫的是『外地孩子——』。\n\n再往前，一排乌鸦站在电线上。\n\n『旧车站——』\n\n远处另一只跟着叫：\n\n『旧车站——旧车站——』\n\nMio抬头：『谁教它们的？』",dialog:"乌鸦当然没有回答。"},
{kind:"play",d:5,p:"森林・空地",t:"草下面多了两根生锈的铁条。",x:"昨天经过这里时，你们谁也没看见。铁条只有十几米长，前后都埋在泥里。\n\nMio把一枚硬币压在旁边：『明天再来。要是还在，就不是我们眼花。』",dialog:"回镇的时候，你们遇到一个采蘑菇的老人。他看见你们鞋上的泥。",role:"主语",opts:["采蘑菇的老人","Mio","我们四个","我的学生证"],others:["记得","森林里一直有旧车站"],after:["老人听完愣了愣。","『一直有啊。』他说得很自然。Mio转头看你们，没有接话。"]},
{kind:"story",d:6,p:"森林・黄昏",t:"硬币还在。铁轨却变长了。",x:"它穿过树林，尽头立着一块歪斜的站牌。再往前，树后露出长椅、封死的售票窗口，还有褪色的时刻表。\n\n站牌上写着：コトノハ町。\n\nMio站在原地。\n\n『昨天这里什么都没有。』\n\n身后却有个老人慢悠悠走过来：『你们怎么跑到旧站来了？』",dialog:"站台尽头没有列车。只有一条钻进雾里的铁轨。"}
];
let i=0,pick=null;
const timeWords=["刚才","放学以后","天黑以后","昨天晚上","今天早上","我们来到这里以前"];
function autoTime(){return timeWords[i%timeWords.length]}
const $=x=>document.getElementById(x),E=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function render(){let s=scenes[i];$("meta").textContent=(s.d?"DAY "+s.d:"PROLOGUE")+" · "+(i+1)+"/"+scenes.length;let base='<div class="eyebrow">'+s.p+'</div><h1 class="title">'+s.t+'</h1><div class="story">'+s.x.replace(/\n/g,"<br>")+'</div><div class="dialogue">'+s.dialog.replace(/\n/g,"<br>")+'</div>';if(s.kind==="story"){$("app").innerHTML=base+'<button class="btn" id="next">'+(i===scenes.length-1?"继续":"翻页")+'</button>';$("next").onclick=next;return}$("app").innerHTML=base+'<section class="box"><div class="eyebrow">你负责【'+s.role+'】</div><div class="choices">'+s.opts.map((v,n)=>'<button class="choice '+(pick===n?"sel":"")+'" data-n="'+n+'">'+E(v)+'</button>').join("")+'</div><div class="note">另外两个人已经选好了。翻开前看不到他们的词。</div><button class="btn" id="go" '+(pick===null?"disabled":"")+'>一起翻开</button></section>';document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{pick=+b.dataset.n;render()});$("go").onclick=()=>reveal(s)}
function reveal(s){let me=s.opts[pick],parts;if(s.role==="主语")parts=[me,s.others[0],s.others[1]];else if(s.role==="谓语")parts=[s.others[0],me,s.others[1]];else parts=[s.others[0],s.others[1],me];let q=autoTime()+"，"+parts.join("");$("app").innerHTML='<div class="eyebrow">'+s.p+' · 成句</div><div class="reveal"><div class="word"><small>时间（自动）</small>'+E(autoTime())+'</div><div class="word"><small>主语</small>'+E(parts[0])+'</div><div class="word"><small>谓语</small>'+E(parts[1])+'</div><div class="word"><small>宾语</small>'+E(parts[2])+'</div></div><div class="sentence">「'+E(q)+'。」</div><div class="after">'+s.after.map(E).join("<br><br>")+'</div><button class="btn" id="next">继续</button>';$("next").onclick=next}
function next(){if(i===scenes.length-1)return end();i++;pick=null;render()}
function end(){$("meta").textContent="第一阶段 · END";$("app").innerHTML='<div class="eyebrow">旧车站・黄昏</div><div class="chapter">五天前，这里只有草。<br>现在，站台的钟停在 00:13。</div><div class="end">镇上的人已经有人说自己小时候来过这里。<br><br>一只乌鸦落到站牌上。<br>『旧车站——』<br><br>你看着空荡荡的铁轨。<br><br><b>如果一座不存在的车站都能被大家说出来……那辆送你们来的银色电车呢？</b></div><button class="btn alt" onclick="location.reload()">重新开始</button>'}
render();
</script></body></html>

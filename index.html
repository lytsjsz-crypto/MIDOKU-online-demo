<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>コトノハ町</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f0e9;color:#242424;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans SC","PingFang SC",sans-serif}.wrap{max-width:820px;margin:auto;padding:36px 20px 80px}.head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid #222;padding-bottom:12px;margin-bottom:28px}.logo{font-family:Georgia,"Noto Serif SC",serif;font-size:25px;letter-spacing:.1em}.day{font-size:12px;letter-spacing:.12em}.place{font-size:12px;letter-spacing:.14em;color:#777;margin-bottom:8px}.scene{font-family:Georgia,"Noto Serif SC",serif;font-size:24px;line-height:1.5;margin:0 0 10px}.text{font-size:15px;line-height:1.85;max-width:680px}.memory{margin:24px 0;padding:14px 0;border-top:1px solid #bbb;border-bottom:1px solid #bbb;font-size:13px;line-height:1.8;color:#555}.memory b{color:#222}.box{margin-top:30px}.label{font-size:12px;letter-spacing:.12em;color:#777;margin-bottom:12px}.sentence{font-family:Georgia,"Noto Serif SC",serif;font-size:21px;line-height:1.7;margin:18px 0}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;max-width:650px}.choice{background:transparent;border:1px solid #999;padding:13px 14px;text-align:left;font-size:14px;cursor:pointer}.choice:hover,.choice.sel{border-color:#222;background:#222;color:#fff}.others{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}.part{border-top:1px solid #999;padding-top:9px;font-size:13px}.part span{display:block;color:#888;font-size:11px;margin-bottom:5px}.btn{margin-top:22px;border:1px solid #222;background:#222;color:#fff;padding:12px 20px;font-size:14px;cursor:pointer}.btn.light{background:transparent;color:#222}.result{font-family:Georgia,"Noto Serif SC",serif;font-size:25px;line-height:1.65;margin:22px 0}.reaction{font-size:14px;line-height:1.8;border-left:2px solid #aaa;padding-left:14px;margin:18px 0}.small{font-size:12px;color:#777}.trail{margin-top:28px}.trail div{font-size:12px;color:#666;padding:6px 0;border-bottom:1px dotted #bbb}.end{font-family:Georgia,"Noto Serif SC",serif;font-size:20px;line-height:2}
@media(max-width:600px){.choices{grid-template-columns:1fr}.others{grid-template-columns:1fr}.scene{font-size:21px}}
</style></head><body><main class="wrap"><header class="head"><div class="logo">コトノハ町</div><div class="day" id="day"></div></header><div id="app"></div></main><script>
const scenes=[
{d:1,p:"学校・水池",t:"昨夜，有东西从天空掉进了学校水池。",x:"校长把发光的碎片收进铁盒。围观的孩子都在猜那究竟是什么。",role:"谓语",me:["藏起了","害怕着","正在寻找","想送走"],a:"校长",b:"从天上掉下来的星星",r:"学生：『星星？老师明明说只是石头。』"},
{d:1,p:"面包店",t:"下午，面包店出现了一盘没人记得烤过的银色面包。",x:"老板娘不敢卖。一个孩子却说，面包闻起来像下雨前的天空。",role:"宾语",me:["不存在的地方","明天发生的事","别人的梦","旧车站"],a:"吃下银色面包的人会梦见",b:"",r:"老板娘：『旧车站？那地方三十年前就关了。』"},
{d:1,p:"森林入口",t:"Mio的红围巾被什么东西叼进了森林。",x:"树梢上停着一群乌鸦。它们脚边闪着各种从镇上消失的小东西。",role:"主语",me:["森林里的乌鸦","月亮","迷路的孩子","不会说话的狐狸"],a:"",b:"会把偷来的东西送给月亮",r:"Mio：『……那我的围巾今晚会飞上天吗？』"},
{d:1,p:"旧车站",t:"回家路上，你们经过封死的旧站台。",x:"里面传来一声很轻的铃响。Mio说，这座车站已经很多年没有通电。",role:"主语",me:["停了三十年的站台钟","生锈的铁轨","封死的售票窗","最后一盏站台灯"],a:"",b:"会在午夜自己醒来",r:"Mio：『别看我，我也第一次听见。』"},
{d:2,p:"学校",t:"水池今天开出了几朵蓝色的花。",x:"有人说，这是昨天那颗“星星”留下来的。校长一整天都没有解释。",role:"宾语",me:["会发光的花","第二颗星星","一个秘密","通往天空的路"],a:"校长藏起来的东西会长出",b:"",r:"低年级学生：『我就说那不是普通石头。』"},
{d:2,p:"面包店",t:"昨天偷偷买走银色面包的客人回来了。",x:"他说自己梦见一座没有人的站台，还画下了一张歪歪扭扭的地图。",role:"谓语",me:["会指向","会打开","正在寻找","会忘记"],a:"梦里画出的地图",b:"旧车站",r:"老板娘把地图贴在墙上：『有人认得这里吗？』"},
{d:2,p:"广场",t:"红围巾真的出现在钟楼顶端。",x:"没人知道它怎么过去的。孩子们开始给森林里的乌鸦带亮晶晶的礼物。",role:"谓语",me:["会交换","会偷走","会带来","会记住"],a:"收到礼物的乌鸦",b:"人们想找的东西",r:"孩子：『那我能让它帮我找昨天丢的钥匙吗？』"},
{d:2,p:"图书馆",t:"图书管理员从旧报纸里翻出一张车票照片。",x:"日期被水泡烂，只剩下“0:00”和コトノハ町几个字。",role:"主语",me:["午夜的列车","不存在的乘客","旧车票","被忘掉的站台"],a:"",b:"曾经在这里出现过",r:"图书管理员：『我以前一直以为这只是印刷错误。』"},
{d:3,p:"森林",t:"乌鸦今天把一把生锈的钥匙丢在你们脚边。",x:"钥匙上的编号，与旧车站封死的储物柜一致。",role:"宾语",me:["旧车站的钥匙","一张没有日期的时刻表","回家的方向","某个人留下的信"],a:"森林里的乌鸦找到了",b:"",r:"Mio：『你们第一天说的东西……怎么越来越像真的？』"},
{d:3,p:"旧车站・储物柜",t:"钥匙真的打开了柜子。",x:"里面没有行李，只有一张褪色时刻表。最下面多出一行：00:13，终点空白。",role:"谓语",me:["会在午夜驶向","会等待","会带走","只会停靠"],a:"时刻表上不存在的列车",b:"没人能说清的地方",r:"车站老人：『我小时候，好像真的等过这班车。』"},
{d:3,p:"面包店",t:"“午夜列车”的说法第一次从你们之外的人嘴里出现。",x:"两个客人正在讨论旧车票、地图和昨晚自己响起来的站台钟。",role:"宾语",me:["能回家的列车","通往梦里的车","只在满月出现的列车","不属于这个镇的列车"],a:"大家开始把00:13那班车叫作",b:"",r:"老板娘：『今晚要不要去看看？反正全镇都在说。』"},
{d:3,p:"广场",t:"傍晚，越来越多人准备去旧车站。",x:"有人带相机，有人带旧车票，还有孩子抱着银色面包。",role:"主语",me:["相信午夜列车的人","带着旧车票的人","想离开小镇的人","做过奇怪梦的人"],a:"",b:"会在今晚听见列车进站的声音",r:"人群安静下来。远处，真的传来了一声汽笛。"},
{d:4,p:"旧车站・00:13",t:"铁轨震动。一辆银色列车从黑暗里驶来。",x:"你们真的把不存在的东西一点一点说成了现实。现在只差最后一件事：它究竟把人送去哪里。",role:"宾语",me:["真正的家","大家想象中的家","最想去的地方","所有人都相信存在的地方"],a:"午夜列车会把乘客送往",b:"",r:"Mio没有说话。月台上的所有村民都在等你们上车。"}
];
let i=0,pick=null,trail=[];
const $=x=>document.getElementById(x),esc=s=>s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function render(){let s=scenes[i];$("day").textContent="DAY "+s.d+" · "+(i+1)+"/"+scenes.length;let mem=trail.filter(v=>v.d<s.d).slice(-4);$("app").innerHTML='<div class="place">'+s.p+'</div><h1 class="scene">'+s.t+'</h1><div class="text">'+s.x+'</div>'+(mem.length?'<div class="memory"><b>镇上还记得：</b><br>'+mem.map(v=>"・"+esc(v.q)).join("<br>")+'</div>':'')+'<section class="box"><div class="label">你负责【'+s.role+'】</div><div class="sentence">'+(s.a||"【你】")+' '+(s.a&&s.b?"":"")+(s.a?s.a:"")+'</div><div class="choices">'+s.me.map((v,n)=>'<button class="choice '+(pick===n?"sel":"")+'" data-n="'+n+'">'+v+'</button>').join("")+'</div><div class="small" style="margin-top:12px">另外两个人已经秘密选好各自的部分。</div><button class="btn" id="go" '+(pick===null?"disabled":"")+'>同时翻开</button></section>';document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{pick=+b.dataset.n;render()});$("go").onclick=reveal}
function reveal(){let s=scenes[i],me=s.me[pick],q=s.a? s.a+me+s.b : me+s.b;trail.push({d:s.d,q});$("app").innerHTML='<div class="place">'+s.p+'</div><div class="label">三个人拼出的传闻</div><div class="result">「'+esc(q)+'。」</div><div class="reaction">'+s.r+'</div><div class="small">这句话不会立刻消失。之后的人、地点和事件可能再次提到它。</div><button class="btn" id="next">'+(i===scenes.length-1?"坐上列车":"继续")+'</button><div class="trail">'+trail.slice(-5).map(v=>'<div>DAY '+v.d+'　'+esc(v.q)+'</div>').join("")+'</div>';$("next").onclick=next}
function next(){if(i===scenes.length-1){end();return}i++;pick=null;render()}
function end(){let last=trail[trail.length-1].q,wrong=!last.includes("真正的家");$("day").textContent="DAY 4 · END";$("app").innerHTML='<div class="place">列车到站</div><h1 class="scene">'+(wrong?"这里很像家，但不是你们的世界。":"熟悉的站台出现在窗外。")+'</h1><div class="end">'+(wrong?'学校、街道、电车都像你们描述过的样子。可细节处处不对。<br><br>你们终于意识到：<b>列车忠实实现了镇民共同相信的那句话。</b><br><br>你们只能重新上车，返回コトノハ町。那里，还有你们三天来留下的所有传闻。':'你们第一次真的找到了回去的方向。<br><br>但在完整游戏里，回到真正的家不会只靠抽中一个正确词。这里暂时作为四日原型的终点。')+'</div><div class="memory"><b>这四天，你们留在镇上的东西：</b><br>'+trail.map(v=>"・"+esc(v.q)).join("<br>")+'</div><button class="btn light" onclick="location.reload()">重新试玩</button>'}
render();
</script></body></html>

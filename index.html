<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>コトノハ町</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f2e8;color:#24231f;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.wrap{max-width:790px;margin:auto;padding:34px 20px 80px}.head{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid #393832;padding-bottom:10px;margin-bottom:30px}.logo{font:25px Georgia,serif;letter-spacing:.12em}.meta,.eyebrow{font-size:11px;color:#77736a;letter-spacing:.11em}.title{font:25px/1.5 Georgia,"Noto Serif SC",serif;margin:8px 0 14px}.story{font-size:15px;line-height:1.9}.dialogue{font:16px/1.9 Georgia,"Noto Serif SC",serif;margin:18px 0;padding-left:15px;border-left:2px solid #aaa59a}.box{border-top:1px solid #aaa59a;margin-top:30px;padding-top:20px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.choice{border:1px solid #99948a;background:transparent;padding:13px;text-align:left;cursor:pointer;font-size:14px;min-height:48px}.choice:hover,.choice.sel{background:#282722;color:#fff}.btn{border:1px solid #282722;background:#282722;color:#fff;padding:12px 19px;margin-top:20px;cursor:pointer}.btn:disabled{opacity:.3}.btn.alt{background:transparent;color:#282722}.note{font-size:12px;color:#817d74;margin-top:12px;line-height:1.7}.reveal{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:20px 0}.word{border-top:1px solid #817d74;padding-top:8px;font-size:14px}.word small{display:block;color:#88837a;font-size:11px;margin-bottom:5px}.sentence{font:25px/1.65 Georgia,"Noto Serif SC",serif;margin:25px 0}.after{border-top:1px solid #aaa59a;border-bottom:1px solid #aaa59a;padding:18px 0;margin:22px 0;font-size:15px;line-height:1.9}.speaker{font-size:12px;color:#77736a;margin-bottom:6px}.echo{margin-top:16px;padding:14px 16px;background:#ece7dc;font-size:14px;line-height:1.8}.chapter{font:29px/1.7 Georgia,"Noto Serif SC",serif;margin:35px 0}.end{font-size:16px;line-height:2}@media(max-width:620px){.choices{grid-template-columns:1fr}.reveal{grid-template-columns:1fr}.title{font-size:22px}.sentence{font-size:21px}}
</style></head><body><main class="wrap"><header class="head"><div class="logo">コトノハ町</div><div class="meta" id="meta">PROTOTYPE 08 FRAGMENTS</div></header><div id="app"></div></main><script>
const scenes=[
{kind:"story",d:0,p:"星期五・放学后",t:"本来只是坐错了一班车。",x:"社团活动结束得太晚。你们四个人冲上站台时，平时坐的电车刚关门。下一班还有二十分钟。\n\n对面正好停着一辆银色电车。线路图上似乎有你们回家的方向，关门铃又已经响了。四个人互相看了一眼，跑了进去。\n\n前几站都很正常。后来手机信号只剩一格。再抬头时，车厢里只剩你们四个。\n\n『下一站，终点——コトノハ町。』",dialog:"下车后，银色电车开进雾里。你们走了几分钟又原路跑回来。\n\n站台没了。连铁轨都没了。"},
{kind:"play",d:1,p:"镇口・傍晚",t:"你们第一次解释刚才发生的事。",x:"杂货店老板看见四个穿外地校服的孩子站在路边。\n\n『迷路了？你们从哪儿来的？』\n\n四个人同时开口。有人记得车，有人只记得雾，有人记得下车的动作，还有人一直想着消失的站台。",dialog:"这是第一次【回答】。你们没有商量，只是在回答同一个问题。",prompt:"老板：『所以，你们刚才到底是怎么来的？』",role:"谓语",opts:["把我们送到了这里","突然停了下来","开进了雾里","在我们下车后消失了"],fragments:[{who:"孩子A",label:"时间",text:"刚才"},{who:"孩子B",label:"主语",text:"那辆银色电车"},{who:"你",label:"谓语",pick:true},{who:"孩子D",label:"宾语",text:"我们 / 这里"}],build:m=>m==="把我们送到了这里"?"刚才，那辆银色电车把我们送到了这里。":m==="突然停了下来"?"刚才，那辆银色电车突然停在了这里。":m==="开进了雾里"?"刚才，那辆银色电车开进了这里的雾里。":"刚才，那辆银色电车在我们下车后消失了。",npc:"老板把四个人的话听成了一句完整的话。",after:["老板重复了一遍：『银色电车把你们送到这里，然后消失了？』","你们还没来得及纠正，旁边买酱油的佐藤太太已经听见了。"],carry:"四个外地孩子，是被一辆会消失的银色电车送来的。"},
{kind:"story",d:1,p:"面包店・晚上",t:"一句完整的话，比四句碎片传得更快。",x:"Mio带你们去买晚饭。面包店老板娘一看到你们就问：\n\n『你们就是坐那辆“会消失的电车”来的孩子？』\n\n你们愣了一下。没有人说过“会消失的电车”。你们只说过电车、雾、下车，以及后来找不到站台。",dialog:"但在镇上的人耳中，这些已经是同一个故事。"},
{kind:"play",d:2,p:"Mio家・早餐",t:"第二天，故事里多出了一个“旧车站”。",x:"Mio妈妈把牛奶放到桌上：『听说那辆车是从旧车站来的？』\n\nMio皱眉：『谁说是旧车站？』\n\n『佐藤太太说的。她也是听别人讲的。』\n\n你们昨天谁都没有说过“旧”。",dialog:"Mio转向你们：『等等。你们下车的时候，真的看到站名了吗？』",prompt:"Mio：『你们下车以后，手里还剩下什么？』",role:"宾语",opts:["我的Suica","一张陌生车票","学生证","昨天的便当盒"],fragments:[{who:"孩子A",label:"时间",text:"下车以后"},{who:"孩子B",label:"主语",text:"我们"},{who:"孩子C",label:"谓语",text:"只找到"},{who:"你",label:"宾语",pick:true}],build:o=>"下车以后，我们只找到了"+o+"。",npc:"Mio把四个人断断续续的回答重新整理了一遍。",after:["Mio低声重复了这句话。","中午，一个来找Mio的孩子只听见了后半段。他跑出去时说：『他们从旧车站带回了东西。』"],carry:"那四个孩子从旧车站带回了某样东西。"},
{kind:"play",d:2,p:"镇中心・下午",t:"传闻开始自己寻找证据。",x:"广场上的孩子围着你们：『从旧车站带回来的东西呢？』\n\n你们解释那只是下车以后还在身上的东西。可大家已经开始猜：车票、交通卡、学生证——到底哪一个能证明旧车站存在？",dialog:"离开人群后，Mio自言自语：『要是真有旧车站，总该留下点什么吧……』",prompt:"这是【自言自语】的时机。四个人看着广场，各自注意到了不同的东西。",role:"主语",opts:["修钟老人","广场上的猫","Mio","卖旧货的老板"],fragments:[{who:"你",label:"主语",pick:true},{who:"孩子B",label:"地点",text:"在广场边"},{who:"孩子C",label:"谓语",text:"捡到了"},{who:"孩子D",label:"宾语",text:"一张旧车票"}],build:s=>s+"在广场边捡到了一张旧车票。",npc:"旁边经过的小孩只听到了几个词，却把它们连成了一句话。",after:["『旧车票？！』他停下脚步。","十分钟后，广场另一头已经有人说：『有人捡到旧车站的车票了。』"],carry:"镇上已经有人捡到了旧车站留下的车票。"},
{kind:"story",d:3,p:"Mio家・早晨",t:"第三天，证据真的出现了。",x:"出门前，你翻开昨天一直带着的课本。\n\n里面夹着一张发黄的小纸片。昨天明明没有。\n\n纸片上只剩半个模糊的『駅』字。\n\nMio盯着它看了很久。\n\n『……这算车票吗？』",dialog:"没人能确定。但你们第一次开始怀疑：到底是传闻追上了事实，还是事实正在追上传闻？"},
{kind:"play",d:3,p:"河边・下午",t:"河里又捞上来一个“证据”。",x:"钓鱼的大叔捞起一块生锈铁牌，上面也剩着一个『駅』字。围观的人立刻七嘴八舌。\n\n修钟老人却说：『一个字而已，什么也说明不了。』",dialog:"回去的路上，Mio问：『那张纸片现在在哪？』",prompt:"这是一次普通的【提问与回答】。",role:"谓语",opts:["一直放在","刚刚掉进了","交给了","拿去换了"],fragments:[{who:"孩子A",label:"主语",text:"那张纸片"},{who:"你",label:"谓语",pick:true},{who:"孩子C",label:"宾语",text:"我的课本 / 河边 / 修钟老人"},{who:"孩子D",label:"时间",text:"从早上开始 / 刚刚"}],build:v=>v==="一直放在"?"从早上开始，那张纸片一直放在我的课本里。":v==="刚刚掉进了"?"刚刚，那张纸片掉进了河边的草丛里。":v==="交给了"?"刚刚，那张纸片被交给了修钟老人。":"刚刚，那张纸片被拿去换了别的东西。",npc:"Mio听见的是一条清楚、完整的信息。",after:["可走在后面的两个孩子只听见了“纸片”“河边”“修钟老人”。","傍晚，新的说法变成：『修钟老人知道旧车站的事。』"],carry:"修钟老人知道旧车站在哪里。"},
{kind:"play",d:4,p:"修钟店・上午",t:"你们去问一个本来什么都没承认的人。",x:"因为镇上都在说“修钟老人知道旧车站”，你们也开始觉得，也许应该问问他。\n\n老人听完沉默很久：『我只说过，一个“駅”字什么也证明不了。』\n\n门外却已经有人等着答案。",dialog:"离开店门时，有人问：『老人是不是告诉你们位置了？』",prompt:"这是【被追问】的时机。四个人都想否认，但说出的碎片并不一样。",role:"宾语",opts:["森林入口","河的上游","山顶附近","什么地方都没有"],fragments:[{who:"孩子A",label:"主语",text:"修钟老人"},{who:"孩子B",label:"谓语",text:"提到了"},{who:"你",label:"宾语",pick:true},{who:"孩子D",label:"时间",text:"刚才谈话的时候"}],build:o=>o==="什么地方都没有"?"刚才谈话的时候，修钟老人没有说出任何地点。":"刚才谈话的时候，修钟老人提到了"+o+"。",npc:"提问的人没有听见你们完整的否认，只记住了地点。",after:["他点点头：『原来如此。』","当天傍晚，镇上的孩子已经开始往那个方向找“旧车站”。"],carry:"旧车站就在那个方向。"},
{kind:"story",d:5,p:"森林・黄昏",t:"第五天，本来不存在的地点有了形状。",x:"你们跟着人群走进森林。\n\n昨天还只有草和泥的地方，多了两根生锈的铁轨。再往前，是一块歪斜的站牌。\n\n站牌上写着：コトノハ町。\n\nMio站在原地：『这里昨天真的什么都没有。』\n\n身后的老人却很自然地说：『你们怎么跑到旧站来了？』",dialog:"没有人知道第一句“旧车站”是谁说的。现在，也已经没人觉得它不存在。"}
];
let i=0,pick=null;const $=x=>document.getElementById(x),E=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function render(){let s=scenes[i];$("meta").textContent=(s.d?"DAY "+s.d:"PROLOGUE")+" · "+(i+1)+"/"+scenes.length;let base='<div class="eyebrow">'+s.p+'</div><h1 class="title">'+s.t+'</h1><div class="story">'+s.x.replace(/\n/g,"<br>")+'</div><div class="dialogue">'+s.dialog.replace(/\n/g,"<br>")+'</div>';if(s.kind==="story"){$("app").innerHTML=base+'<button class="btn" id="next">'+(i===scenes.length-1?"继续":"翻页")+'</button>';$("next").onclick=next;return}$("app").innerHTML=base+'<section class="box"><div class="eyebrow">'+E(s.prompt)+'</div><div class="speaker">你负责【'+s.role+'】。另外三个人也在同时回答，但你翻开前看不到他们完整的碎片。</div><div class="choices">'+s.opts.map((v,n)=>'<button class="choice '+(pick===n?"sel":"")+'" data-n="'+n+'">'+E(v)+'</button>').join("")+'</div><div class="note">这里不是四个人合作造句。每个人只说自己注意到、记住或想表达的一部分；听的人会把四份碎片重新理解成一句完整的话。</div><button class="btn" id="go" '+(pick===null?"disabled":"")+'>四个人一起开口</button></section>';document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{pick=+b.dataset.n;render()});$("go").onclick=()=>reveal(s)}
function reveal(s){let me=s.opts[pick],fs=s.fragments.map(f=>({...f,text:f.pick?me:f.text}));let q=s.build(me);$("app").innerHTML='<div class="eyebrow">'+s.p+' · 四个人的碎片</div><div class="reveal">'+fs.map(f=>'<div class="word"><small>'+E(f.who)+' · '+E(f.label)+'</small>'+E(f.text)+'</div>').join("")+'</div><div class="note">四个人实际说出的只是上面的碎片。</div><div class="echo">'+E(s.npc)+'</div><div class="sentence">「'+E(q)+'」</div><div class="after">'+s.after.map(E).join("<br><br>")+'</div><div class="echo"><b>这句话离开现场以后：</b><br>'+E(s.carry)+'</div><button class="btn" id="next">看它接下来变成什么</button>';$("next").onclick=next}
function next(){if(i===scenes.length-1)return end();i++;pick=null;render()}
function end(){$("meta").textContent="第一阶段 · END";$("app").innerHTML='<div class="eyebrow">旧车站・黄昏</div><div class="chapter">五天前，这里只有草。<br>现在，所有人都知道这里有一座旧车站。</div><div class="end">没有一个孩子完整说过“这里有一座旧车站”。<br><br>没有一个大人承认自己编造了它。<br><br>每个人都只是记住了一部分，又把自己理解的那部分告诉了下一个人。<br><br><b>最后，一个没有任何人真正完整说过的故事，成了所有人都知道的“事实”。</b></div><button class="btn alt" onclick="location.reload()">重新开始</button>'}
render();
</script></body></html>

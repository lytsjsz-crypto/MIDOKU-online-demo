}.names{display:grid;gap:10px}.names input{width:100%;border:0;border-bottom:1px solid #99948a;background:transparent;padding:12px 4px;font-size:16px;outline:none}.start{width:100%;margin-top:28px;border:1px solid #282722;background:#282722;color:#fff;padding:14px;cursor:pointer}.end{font-size:16px;line-height:2}@media(max-width:600px){.choices{grid-template-columns:1fr 1fr}.wordrow{grid-template-columns:1fr}.sentence{font-size:21px}}

const $=x=>document.getElementById(x),E=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]||m));let round=0;const M={};let playerCount=3,players=[];const timePools=[["放課後","さっき","日が暮れる前","誰も見ていない間に"],["さっき","電車が行ったあと","店主が出てくる前","振り返ったとき"],["夕方","店が閉まる前","猫が走り去ったあと","夕飯の前"],["さっき","日が沈む前","みんなが電話していた頃","誰も見ていないとき"],["日が暮れてから","銀色の電車が来たとき","カラスが鳴いたとき","誰かが迷子になったとき"],["さっき","森に入ってから","カラスが鳴いたとき","みんなが探している間"],["今","霧が出てから","次の電車が来る前","明日"]];

{day:"金曜日・17:38",place:"いつもの駅",story:"部活が長引いた。駅まで走ったものの、いつもの電車は目の前でドアを閉めた。\n\n仲間の一人：「あー、あとちょっとだったのに！」\n\n次の電車は二十分後。\n\n另仲間の一人がスマホを見る。「六時までに帰ってこいって。」\n\nそのとき、向かいのホームに見慣れない銀色の電車が停まった。路線図を見ると、途中までは帰る方向と重なっているように見える。",dialog:"Mio：「これも途中までは同じ方向じゃない？」\n\n仲間の一人：「何駅か乗って、どこかで乗り換えればいいんじゃない？」\n\n発車ベルが鳴り始めた。\n\n四人は電車へ駆け込んだ。",trigger:"仲間の一人は路線図を見つめ、それから閉まりかけたドアを見る。\n\n「……で、この電車、結局どこに行くんだろう？」",slot:"o",fixed:{s:"この電車は",v:"向かった"},opts:["見たことのない町へ","いつもの乗換駅へ","終点へ","家とはまったく逆の方向へ"],event:(o)=>{M.arrive=o;if(o==="見たことのない町へ")return"駅を過ぎるたび、乗客が減っていく。\n\nスマホの電波は一本だけになった。\n\n車内放送が流れる。『次は終点、コトノハ町。』\n\n四人が同時に顔を上げる。\n\nMio：「……どこ、ここ？」";if(o==="いつもの乗換駅へ")return"車内放送から聞こえてきたのは、まったく知らない駅名だった。\n\n仲間の一人盯着车门上方的线路图。\n\n「不对，私たち换乘站早就应该到了。」\n\n『次は終点、コトノハ町。』";if(o==="終点へ")return"列车没有在みんな认识的任何一站停下。\n\n最后，车厢只剩四人。\n\n『次は終点、コトノハ町。』\n\n另仲間の一人：「私たち是不是坐反了？」";return"窓の外から見慣れた建物がどんどん消えていく。\n\n仲間の一人把地图转了两次。\n\n「……ほんとに逆だ。」\n\nそのとき、車内放送が流れた。『次は終点、コトノハ町。』"},next:"電車を降りる"},
{day:"金曜日・18:11",place:"コトノハ町",story:"四人電車を降りる以后，銀色電車很快钻进雾里。\n\n「先找工作人员吧。」\n\nみんな绕过一排矮房子，又觉得不对，沿原路折回来。\n\nさっき的ホーム不见了。\n\n原地只有一片草。\n\n路边杂货店的店主抱着纸箱出来，盯着みんな看了半天。",dialog:"店主：「みんな几个，站在这里干什么？」\n\nMio：「私たちさっき从駅出来的。」\n\n店主：「駅？」\n\n他朝草むら看了一眼。\n\n「这个镇上没有駅啊。」",trigger:"店主显然还是没听明白。他指着那片草むら，又问了一遍。\n\n「那みんな说清楚——あの銀色の電車を到底把みんな送到了哪里？」",slot:"o",fixed:{s:"あの銀色の電車を",v:"私たちを連れてきた"},opts:["ここの駅に","この草むらに","「コトノハ町」という駅に","どこか分からない場所に"],event:(o)=>{M.station=o;if(o==="ここの駅に")return"店主：「ここの駅に？」\n\n「对，さっき明明——」\n\n店主打断Mio：「这里从来没有駅。」\n\n店の奥から足音がする。\n\n一个和みんな差不多大的女生掀开门帘。\n\n「お父さん、誰？」\n\n店主指着みんな：「Mio，这几个子ども说，他们刚从ここの駅に下来。」";if(o.includes("コトノハ町"))return"店主：「コトノハ町站？」\n\n店主は眉をひそめて繰り返した。\n\n「私たち镇叫コトノハ町没错，可没有什么コトノハ町站。」\n\n店ののれんが揺れる。\n\n「お父さん、誰？」\n\n店主回头：「Mio，他们说自己刚从『コトノハ町站』下来。」";if(o==="この草むらに")return"店主低头看了看草。\n\n「電車把みんな送到草むら？」\n\n「不是，さっき这里是ホーム。」\n\n店の中から女の子が出てきた。\n\n「お父さん、誰と話してるの？」\n\n店主指向草むら：「Mio，他们说这里さっき还是駅。」";return"店主：「どこか分からない場所に？」\n\n仲間の一人：「所以私たち才想找駅回去。」\n\n「都说了，这里没有駅。」\n\n店の中から女の子が顔を出す。\n\n「お父さん？」\n\n店主：「Mio，你带他们去镇上看看吧。不然他们今晚要一直站这儿了。」"},next:"Mioについていく"},
{day:"金曜日・18:29",place:"商店街",story:"Mioに連れられ、商店街を歩く。まだ完全には日が暮れていない。肉屋は看板をしまい、文房具屋の前には明日の朝に出す段ボールが積まれている。\n\nMio：「私、ずっとここに住んでるけど、本当に駅なんて見たことないよ。」\n\n仲間の一人：「じゃあ、俺たちどうやって来たんだよ。」\n\nMio：「だから、それを聞きに行くの。」\n\n商店街の端では、コロッケ屋のおばさんがガラス戸を閉めようとしていた。",dialog:"Mio：「ねえ、おばさん。この辺に昔、駅ってあった？」\n\n店のおばさん：「駅？　なかったと思うけどねえ。」\n\nおばさんはあなたたちを見る。\n\n「どうして急にそんなこと聞くの？」",trigger:"おばさんの手が止まる。\n\n「ちょっと待って。その駅を実際に見たのは誰なの？」",slot:"s",fixed:{v:"見たことがある",o:"あの駅を"},opts:["雑貨屋のおじさんが","制服を着た子が","あの三毛猫が","銀色の電車に乗った人が"],event:(s)=>{M.witness=s;if(s==="雑貨屋のおじさんが")return"店主娘：「雑貨屋のおじさんが見たことがある？」\n\nMio：「不是，他さっき还说没有——」\n\n「那就是以前見たことがある，今没有了？」\n\n隔壁正在收摊的人抬起头。\n\n「什么？以前这里有站？」";if(s.includes("校服"))return"店主娘看了看みんな的制服。\n\n「穿校服的子ども見たことがあるあの駅を？」\n\n「私たち就是——」\n\n隔壁店的人探出头：「哪个学校的？是不是以前迷路的那个噂？」\n\nMio：「什么噂？」";if(s.includes("三毛猫が"))return"店主娘愣了一下。\n\n「猫見たことがある駅？」\n\n脚边正好传来一声猫叫。\n\n一只三毛猫が从纸箱后钻出来。\n\n隔壁店的人笑了：「那让它带路不就好了。」\n\nMio看着猫跑向街尾，没有笑。";return"店主娘：「銀色の電車に乗った人が見たことがあるあの駅を……」\n\n隔壁店的人听见“銀色電車”，停下手。\n\n「等等，我好像听我奶奶说过。以前有人说，夕方会有一辆颜色很淡的電車经过。」\n\nMio：「这里连铁轨都没有啊。」"},next:"もう少し町を歩く"},
{day:"金曜日・18:47",place:"小公园",story:"商店街の先には、小さな公園があった。二人の小学生がブランコのそばで迎えを待っている。\n\nみんな还没开口，其中一个先问：\n\n「みんな是在找駅吗？」\n\nMioの足が止まる。\n\n「你怎么知っている？」\n\n「さっき妈妈打电话说的。」",dialog:"もう一人が割り込む。「なんか、変な駅なんでしょ？」\n\n仲間の一人：「何が変なの？」\n\n「知らないよ。見たの、そっちでしょ？」",trigger:"小学生がブランコから飛び降りる。\n\n「じゃあ、その『ないはずの駅』って、どうして森のほうにあるの？」",slot:"v",fixed:{s:"存在しないはずの駅は",o:"森のほうに"},opts:["隠れている","会出今","待っている","移ってしまった"],event:(v)=>{M.place=v;if(v==="隠れている")return"小学生：「駅隠れている森のほうに？」\n\n另一个子ども立刻说：「我知っている！神社后面那片森。」\n\n接子ども的母亲正好走过来。\n\n「什么森？」\n\n「他们说駅隠れている里面。」\n\nMio：「私たち没——」\n\n母亲已经拿出手机。";if(v==="会出今")return"「会出今森のほうに？」\n\n小学生眼睛一下亮了。\n\n「什么时候？」\n\n「私たち没说时间。」\n\n接子ども的母亲走过来，只听见后半句。\n\n「晚上才出现吗？」\n\nMio：「为什么又多了个晚上？」";if(v==="待っている")return"两个子ども一起看向森方向。\n\n「駅在等？」\n\n其中一个压低声音：「是不是在等さっき那辆電車？」\n\n来接人的母亲正好听见。\n\n「什么電車？」\n\n十秒后，她已经在电话里说“森の中の駅は”。";return"「駅跑到森のほうに了？」\n\n两个小学生笑起来。\n\n可来接他们的母亲只听到最后一句。\n\n「森のほうに有駅？」\n\n「妈妈，他们就是从那里来的！」\n\nMio张了张嘴，没插进去。"},next:"森のほうへ向かう"},
{day:"金曜日・19:06",place:"神社前",story:"通往森的路经过一座小神社。\n\nさっき公园里的话似乎比みんな走得更快。石段のそばの老人がMioを見るなり声をかける。\n\n「みんな真要去找那个站？」\n\nMio：「您也知っている了？」\n\n老人：「さっき有人说，在森のほうに。」",dialog:"仲間の一人：「可是森这么大，具体在哪？」\n\n老人摇头。\n\n「我可不知っている。只听说它有个特别的地方。」",trigger:"老人は暗くなっていく空を見上げた。\n\n「森にあるっていうなら、その駅はいつ姿を見せるんだ？」",slot:"o",fixed:{s:"森の中の駅は",v:"姿を現す"},opts:["日が暮れてから","子どもが迷子になったとき","銀色の電車が来たとき","カラスが鳴いたとき"],event:(o)=>{M.time=o;if(o==="日が暮れてから")return"老人：「只在日が暮れてから出现？」\n\n他抬头看了眼已经发蓝的天空。\n\n「那倒是快了。」\n\n刚走上石阶的两个人听见这句。\n\n「晚上才有的站？」\n\n其中一个立刻回头往山下走。";if(o.includes("迷路"))return"老人看着みんな。\n\n「子どもが迷子になったとき才出现……」\n\n石阶上的女人听见了，立刻把身边的小孩拉近一点。\n\n「别往森里跑。」\n\n小孩却回头问：「那他们不是正好迷路了吗？」";if(o.includes("銀色"))return"老人：「銀色の電車が来たとき才出现？」\n\n石阶上有人停住。\n\n「銀色電車？我さっき在商店街也听到了。」\n\nMio小声说：「已经传到这里了……」";return"树上传来一声「カァ」。\n\n老人抬头。\n\n「カラスが鳴いたとき？」\n\n又一声。\n\n石阶上的子ども笑起来：「那今就会出现啊。」"},next:"森へ入る"},
{day:"金曜日・19:24",place:"森",story:"神社の裏で街灯は途切れた。Mioがスマホのライトをつける。\n\n森にいるのは、あなたたちだけではない。前方では、ときどき知らない人のライトが揺れている。\n\n仲間の一人：「あの人たちも駅を探してるのかな。」\n\n遠くから「こっちにはない！」と声がする。\n\n頭上でカラスが鳴いた。",dialog:"「カァ——」\n\n又一只跟着叫。\n\n「エキ——」\n\n四人同时停住。\n\n另仲間の一人：「……さっき那个是不是在说‘駅’？」",trigger:"第二声カラス叫从更远的树上传回来。有人停下脚步。\n\n「所以今，到底是谁知っている駅在哪里？」",slot:"s",fixed:{v:"知っている",o:"駅の場所を"},opts:["森のカラスが","三毛猫が","町のみんなが","私たちが"],event:(s)=>{M.know=s;if(s.includes("カラス"))return"「森のカラスが知っている駅の場所を。」\n\n言い終わるのとほとんど同時に、前方の木から声がした。\n\n「エキ——」\n\nさらに遠くからも続く。\n\n「エキ、エキ——」\n\nMio把手电筒慢慢抬高。\n\n森の奥で、ごく小さなベルの音がした。";if(s.includes("三毛猫が"))return"脚边草丛一动。\n\n商店街あの三毛猫が从黑暗里钻出来，看了みんな一眼，继续往林子深处走。\n\n树上的カラス跟着叫：\n\n「エキ——」\n\n仲間の一人：「……真要跟吗？」\n\n远处忽然传来一声铃。";if(s.includes("整个镇子"))return"前后都是人的声音。\n\n「这边没有。」\n「听说还要往里。」\n「是不是天黑才有？」\n\n每个人说的都不一样，可每个人都在找同一个駅。\n\n树上的カラス叫了一声：\n\n「エキ——」\n\n远处传来铃声。";return"誰も答えなかった。\n\nみんな四个一路问到这里，却没有一个人真的知っている駅在哪。\n\nそのとき、頭上のカラスが鳴いた。\n\n「エキ——」\n\n続いて、森の奥からベルの音が聞こえた。"},next:"音のするほうへ進む"},
{day:"金曜日・19:31",place:"森深处",story:"一はじめる只是很轻。\n\n数歩進むと、今度ははっきり聞こえる。\n\nカン、カン、カン。\n\n踏切の音だ。\n\nでも、ここに線路なんてない。\n\nMioがスマホのライトを消す。それでも暗くはならなかった。木々の向こうから、暖かな黄色い明かりが一列に漏れている。",dialog:"最後の枝をかき分ける。\n\n目の前を線路が横切っていた。\n\n白い駅名標が霧の中に立っている。\n\nコトノハ町駅。\n\n仲間の一人：「……这里さっき真的什么都没有吧。」",trigger:"線路も駅名標も、もう目の前にある。背後で誰かが声を潜めた。 \n\n「那这个刚出现的コトノハ町駅，今到底在等什么？」",slot:"o",fixed:{s:"コトノハ町駅",v:"正在等"},opts:["あの銀色の電車を","私たちが","明日","次の噂を"],event:(o)=>{if(o.includes("銀色"))return"霧の向こうに二つの明かりが浮かんだ。\n\n轨道はじめる轻轻震动。\n\nMio看着站牌，又看向みんな。\n\n「…………今度も、乗る？」";if(o.includes("私たち"))return"ホームの灯りが、手前から一つずつ点いていく。\n\n駅員も、ほかの乗客もいない。\n\nベンチの上には、人数分の切符だけが置かれていた。";if(o==="明日")return"ホームの電光時計が一度だけ瞬いた。\n\n19:31が消える。\n\n残ったのは、ひとつの日付だけだった。\n\n明日。";return"木の上で、またカラスが鳴いた。\n\n「エキ——」\n\n森の向こうから誰かが駆けてくる。\n\n「あった！　本当に駅がある！」\n\nその声を追うように、いくつもの足音が近づいてきた。"},next:"→"}
];
function injectPlayers(x){if(!x)return x;const p=i=>players[Math.min(i,players.length-1)]||("プレイヤー"+(i+1));return x.replaceAll("一个同伴",p(0)).replaceAll("另一个同伴",p(1)).replaceAll("四个人",players.join("、")).replaceAll("私たちが",players.join("、"));}
function preMio(x){if(round<=1)return injectPlayers(x).replaceAll("Mio：", (players[2]||"プレイヤー3")+"：").replaceAll("Mio刚", (players[2]||"プレイヤー3")+"刚").replaceAll("Mio：「", (players[2]||"プレイヤー3")+"：「");return injectPlayers(x)}
function render(){const r=rounds[round];$("meta").textContent=(round+1)+" / "+rounds.length;$("app").innerHTML='<div class="place">'+r.day+"・"+r.place+'</div><div class="story">'+preMio(r.story).replace(/\n/g,"<br>")+'</div><div class="dialogue">'+preMio(r.dialog).replace(/\n/g,"<br>")+'</div><div class="dialogue">'+preMio(r.trigger).replace(/\n/g,"<br>")+'</div><div class="slotlabel">'+(r.slot==="s"?"主語":r.slot==="v"?"述語":"目的語")+'</div><div class="choices">'+r.opts.map((o,i)=>'<button class="choice" data-i="'+i+'">'+E(o)+'</button>').join("")+'</div>';document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>resolve(r,r.opts[+b.dataset.i]))}
function resolve(r,val){
let s=r.slot==="s"?val:r.fixed.s,v=r.slot==="v"?val:r.fixed.v,o=r.slot==="o"?val:r.fixed.o;
let t=playerCount===4?timePools[round][round%4]:"";
let sentence=(t?t+"，":"")+s+v+o+"。";
let roles=playerCount===4?[t,s,v,o]:[s,v,o];
let offset=round%playerCount;
let names=roles.map((_,i)=>players[(i+offset)%playerCount]||("プレイヤー"+(i+1)));
$("app").innerHTML='<div class="place">'+r.day+"・"+r.place+'</div><div class="wordrow" style="grid-template-columns:repeat('+roles.length+',1fr)">'+roles.map((x,i)=>'<div class="word"><small>'+E(names[i])+'</small>'+E(x)+'</div>').join("")+'</div><div class="sentence">'+E(sentence)+'</div><div class="event">'+preMio(r.event(val)).replace(/\n/g,"<br>")+'</div><button class="next" id="n">'+r.next+'</button>';
if(round<rounds.length-1)$("n").onclick=()=>{round++;render()};else $("n").onclick=end
}
function end(){$("meta").textContent="END";$("app").innerHTML='<div class="place">月曜日・07:46・いつもの駅</div><h1 class="title">月曜日。</h1><div class="end">你把Suica贴上闸机。<br><br>ピッ。<br><br>身后两个同校学生正在聊天。<br><br>「听说コトノハ町有个车站。」<br><br>「我知っている。森林里面那个吧。」<br><br>「晚上才会出现的。」<br><br>电车进站。<br><br>车门打开以前，站台顶棚上落下一只乌鸦。<br><br>「エキ——」</div>'}
function setup(){ $("meta").textContent="SETUP"; $("app").innerHTML='<div class="setup"><h1>コトノハ町</h1><div class="people"><button id="p3" class="on">3人</button><button id="p4">4人</button></div><div class="names" id="names"></div><button class="start" id="start">はじめる</button></div>'; function draw(){ $("names").innerHTML=Array.from({length:playerCount},(_,i)=>'<input maxlength="10" placeholder="プレイヤー '+(i+1)+'のニックネーム">').join("") } draw(); $("p3").onclick=()=>{playerCount=3;$("p3").classList.add("on");$("p4").classList.remove("on");draw()}; $("p4").onclick=()=>{playerCount=4;$("p4").classList.add("on");$("p3").classList.remove("on");draw()}; $("start").onclick=()=>{players=[...document.querySelectorAll("#names input")].map((x,i)=>x.value.trim()||("プレイヤー"+(i+1)));round=0;render()}} setup();
</script></body></html>

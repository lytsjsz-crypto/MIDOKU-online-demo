<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>コトノハ町</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f2e8;color:#24231f;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.wrap{max-width:820px;margin:auto;padding:34px 20px 80px}.head{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid #393832;padding-bottom:10px;margin-bottom:30px}.logo{font:25px Georgia,serif;letter-spacing:.12em}.meta,.place{font-size:11px;color:#77736a;letter-spacing:.11em}.title{font:25px/1.5 Georgia,"Noto Serif SC",serif;margin:8px 0 14px}.story{font-size:15px;line-height:2}.dialogue{font:16px/2 Georgia,"Noto Serif SC",serif;margin:18px 0;padding-left:15px;border-left:2px solid #aaa59a}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:20px}.choice{border:1px solid #99948a;background:transparent;padding:14px;text-align:center;cursor:pointer;font-size:15px;line-height:1.5;min-height:54px}.choice:hover{background:#282722;color:#fff}.btn{border:1px solid #282722;background:#282722;color:#fff;padding:12px 19px;margin-top:22px;cursor:pointer}.btn.alt{background:transparent;color:#282722}.wordrow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:25px 0}.word{border-top:1px solid #8f8a80;padding:12px 5px;font:18px/1.6 Georgia,"Noto Serif SC",serif;text-align:center}.word small{display:block;font:10px sans-serif;color:#8a857c;margin-bottom:7px}.sentence{font:25px/1.7 Georgia,"Noto Serif SC",serif;padding:22px 0;margin:20px 0;border-top:1px solid #aaa59a;border-bottom:1px solid #aaa59a;text-align:center}.reaction{font:16px/2 Georgia,"Noto Serif SC",serif;margin:18px 0}.end{font-size:16px;line-height:2}.chapter{font:28px/1.7 Georgia,"Noto Serif SC",serif;margin:30px 0}@media(max-width:620px){.choices{grid-template-columns:1fr 1fr}.wordrow{grid-template-columns:1fr}.title{font-size:22px}.sentence{font-size:21px}}
</style></head><body><main class="wrap"><header class="head"><div class="logo">コトノハ町</div><div class="meta" id="meta">PROTOTYPE 12</div></header><div id="app"></div></main><script>
const S={day:0,tags:new Set(),round:0};const $=x=>document.getElementById(x),E=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]||m));
function page(place,title,body,dialogue){$("meta").textContent="DAY "+S.day;$("app").innerHTML='<div class="place">'+place+'</div>'+(title?'<h1 class="title">'+title+'</h1>':'')+'<div class="story">'+body.replace(/\n/g,"<br>")+'</div>'+(dialogue?'<div class="dialogue">'+dialogue.replace(/\n/g,"<br>")+'</div>':'')}
function button(t,fn){$("app").innerHTML+='<button class="btn" id="n">'+t+'</button>';$("n").onclick=fn}
function choose(opts,cb){$("app").innerHTML+='<div class="choices">'+opts.map((o,i)=>'<button class="choice" data-i="'+i+'">'+E(o)+'</button>').join("")+'</div>';document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>cb(opts[+b.dataset.i]))}
const pools=[
{subjects:["银色电车","Mio","杂货店老板","那只三花猫","数学老师","一个没人认识的学生","便利店的饭团","昨天的我们"],verbs:["带走了","藏起了","忘在了","捡到了","一直等着","偷偷换掉了","弄丢了","吃掉了"],objects:["Suica","旧车站","黄色纸片","一个学生","数学试卷","体育馆钥匙","最后一个饭团","明天"]},
{subjects:["三花猫","修钟老人","Mio","班主任","银色电车","河里的铁牌","隔壁班的田中","你的书包"],verbs:["叼走了","知道","埋着","拿错了","一直看着","交给了","藏在了","忘记了"],objects:["Suica","旧车票","河边","森林入口","学生手帳","一张零分试卷","一盒牛奶","昨天"]},
{subjects:["班主任","佐藤太太","修钟老人","Mio","那只猫","一辆自行车","旧车站","午休时的广播"],verbs:["找到了","说出了","带来了","偷走了","指向了","弄坏了","正在等","记住了"],objects:["旧车站的位置","Suica","黄色纸片","河的上游","森林","体育馆钥匙","你的名字","星期五"]}
];
function grammar(s,v,o){if(v==="知道")return s+"知道"+o+"。";if(v==="埋着")return s+"下面埋着"+o+"。";if(v==="一直等着")return s+"一直在等"+o+"。";if(v==="一直看着")return s+"一直看着"+o+"。";if(v==="正在等")return s+"正在等"+o+"。";return s+v+o+"。"}
function tagsFrom(s,v,o){let all=s+v+o;["Suica","旧车站","黄色纸片","旧车票","河边","河的上游","森林","修钟老人","三花猫","体育馆钥匙","数学老师","班主任","饭团"].forEach(x=>{if(all.includes(x))S.tags.add(x)});return all}
function game(place,prompt,slot,next){let p=pools[Math.min(S.round,pools.length-1)],opts=slot==="s"?p.subjects:slot==="v"?p.verbs:p.objects;page(place,"","",prompt);choose(opts,val=>{let s,v,o;if(slot==="s"){s=val;v=p.verbs[(S.round*3+2)%p.verbs.length];o=p.objects[(S.round*5+3)%p.objects.length]}else if(slot==="v"){s=p.subjects[(S.round*2+1)%p.subjects.length];v=val;o=p.objects[(S.round*5+2)%p.objects.length]}else{s=p.subjects[(S.round*3+4)%p.subjects.length];v=p.verbs[(S.round*2+3)%p.verbs.length];o=val}let sentence=grammar(s,v,o);tagsFrom(s,v,o);S.round++;$("app").innerHTML='<div class="place">'+place+'</div><div class="wordrow"><div class="word"><small>悠太</small>'+E(s)+'</div><div class="word"><small>Mio</small>'+E(v)+'</div><div class="word"><small>你</small>'+E(o)+'</div></div><div class="sentence">'+E(sentence)+'</div><div class="reaction" id="r"></div>';next(sentence,s,v,o)})}
function prologue(){S.day=0;page("星期五・放学后","差一点就赶上了。","部活结束得比平时晚。你们跑上站台时，平时坐的电车正好关门。\n\n「啊——差一点。」\n\n你摸出Suica。下一班，二十分钟。","对面站台停着一辆没见过的银色电车。\n\n「坐这个不也一样？」\n\n几个人跑了进去。\n\n后来手机信号只剩一格。\n\n『下一站，终点——コトノハ町。』");button("下车",town)}
function town(){S.day=1;page("镇口・傍晚","站台不见了。","银色电车开进雾里。沿原路跑回来，刚才下车的地方只剩一片草。","杂货店老板：「你们几个从哪来的？」\n\n悠太刚指向身后，Mio也同时开口。\n\n老板皱起眉：「……一个一个来。」");button("回答",()=>game("杂货店门口","老板还在等。","o",firstAfter))}
function firstAfter(sentence,s,v,o){$("r").innerHTML='老板重复了一遍。<br><br>「'+E(sentence.replace("。","？"))+'」<br><br>「……是这个意思吧？」';button("还没来得及说完",bakery)}
function bakery(){page("面包店・晚上","","门铃响了一声。老板娘一看见你们就笑了。","「啊，你们就是刚才那几个孩子。」\n\n她把纸袋折好。\n\n「佐藤さん已经说了——『"+latestRumor()+"』」");button("……",breakfast)}
function latestRumor(){if(S.tags.has("体育馆钥匙"))return"他们跟体育馆钥匙有关系";if(S.tags.has("Suica"))return"他们带着一张奇怪的Suica";if(S.tags.has("黄色纸片"))return"他们拿着旧车站的黄色纸片";if(S.tags.has("旧车站"))return"他们是从旧车站来的";if(S.tags.has("饭团"))return"他们连饭团都落在那边了";return"他们是坐那辆银色电车来的"}
function breakfast(){S.day=2;page("Mio家・早晨","","桌上是吐司、玉子焼き和牛奶。Mio妈妈把果酱推过来。","「昨晚睡得好吗？」\n\nMio还没回答，她又说：\n\n「对了，昨天那件事，现在学校里也有人知道了。」\n\nMio：「这么快？」");button("出门",school)}
function school(){page("町立中学校・午休","","鞋柜旁贴着文化祭海报。午休时，几个学生堵在走廊口。","「喂，昨天那个到底是真的？」\n「哪个？」\n「就是电车那个啊。」\n\n三个人的问题挤在一起。");button("回答",()=>game("学校走廊","他们盯着你们。","v",secondAfter))}
function secondAfter(sentence,s,v,o){$("r").innerHTML='田中愣了两秒。<br><br>「'+E(sentence.replace("。","？"))+'」<br><br>后面有人「诶？」了一声。';button("上课铃响了",branch2)}
function branch2(){if(S.tags.has("三花猫"))cat();else if(S.tags.has("修钟老人"))clock();else if(S.tags.has("河边")||S.tags.has("河的上游"))river();else if(S.tags.has("森林"))forest();else if(S.tags.has("体育馆钥匙"))gym();else afterSchool()}
function cat(){S.day=2;page("自行车棚・放学后","","一只三花猫从车棚底下钻出来。嘴里叼着什么。","悠太：「……不会吧。」\n\n猫看了你们一眼，转身就跑。");button("追过去",afterSchool)}
function clock(){S.day=2;page("商店街・放学后","","路过修钟店时，Mio忽然停下。老人正在门口收招牌。","老人抬头：「你们找我？」\n\nMio：「……没有吧？」");button("继续走",afterSchool)}
function river(){S.day=2;page("河堤・放学后","","回去的路经过河边。几个学生正蹲在桥下翻东西。","「就是这里吧？」\n\n「什么这里？」\n\n「你们中午不是说了吗？」");button("过去看看",afterSchool)}
function forest(){S.day=2;page("森林入口・放学后","","护栏边多了两辆自行车。有人拿着手机往林子里照。","Mio：「他们来这里干什么？」\n\n前面的人回头：「不是你们说的吗？」");button("先回去",afterSchool)}
function gym(){S.day=2;page("体育馆・放学后","","体育老师正在翻口袋。旁边几个篮球部学生也在找。","「奇怪，备用钥匙呢？」\n\n田中从你们身后探出头。\n\n「……不会真是那个吧。」");button("别看我",afterSchool)}
function afterSchool(){S.day=3;page("商店街・下午","","第三天，关于你们的说法已经有好几个版本。\n\n有人说是银色电车。有人说是旧车站。还有人坚持跟一只猫有关。","Mio在自动贩卖机前停下。\n\n「到底最开始是谁说的？」\n\n悠太：「……不是我们吗？」");button("这时有人叫住你们",()=>game("商店街","佐藤太太推着自行车停下来。\n\n「你们昨天说的那个，到底是谁？」","s",thirdAfter))}
function thirdAfter(sentence,s,v,o){$("r").innerHTML='佐藤太太重复了一遍。<br><br>「'+E(sentence.replace("。","？"))+'」<br><br>自行车后座上的小孩抬起了头。';button("她骑走了",finalBranch)}
function finalBranch(){if(S.tags.has("河边")||S.tags.has("河的上游"))riverEnd();else if(S.tags.has("森林"))forestEnd();else if(S.tags.has("旧车站")||S.tags.has("旧车票")||S.tags.has("黄色纸片"))stationEnd();else oddEnd()}
function riverEnd(){S.day=4;page("河的上游・傍晚","","放学后，河边比平时多了很多人。泥里拖出一块生锈的铁牌。","上面只剩一个字。\n\n『駅』\n\nMio没说话。");button("结束",end)}
function forestEnd(){S.day=4;page("森林・傍晚","","护栏里面被踩出了一条新路。再往里，草下面露出两根生锈的铁条。","有人在前面喊：\n\n「这里有牌子！」\n\nコトノハ町。");button("结束",end)}
function stationEnd(){S.day=4;page("镇口・傍晚","","原来只有草的地方，多了一块歪斜的木牌。","Mio走近。\n\n上面写着：コトノハ町。\n\n「……昨天有这个吗？」");button("结束",end)}
function oddEnd(){S.day=4;let x=S.tags.has("体育馆钥匙")?"体育馆备用钥匙":S.tags.has("饭团")?"一个压扁的饭团":"一张你没见过的纸片";page("镇口・傍晚","","那片草还是空的。没有车站，也没有铁轨。","回去之前，你在草里看见了"+x+"。\n\nMio：「……这个也是我们说过的吗？」");button("结束",end)}
function end(){$("meta").textContent="END";$("app").innerHTML='<div class="place">星期一・早晨</div><div class="chapter">いつもの駅。</div><div class="end">你把Suica贴上闸机。<br><br>ピッ。<br><br>身后有人在说周末的事。<br><br>你听见了自己的名字。</div><button class="btn alt" onclick="location.reload()">重新开始</button>'}
prologue();
</script></body></html>

<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MIDOKU 三人协作原型</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b0d0e;color:#eee;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans SC",sans-serif}.wrap{max-width:760px;margin:auto;padding:26px 18px 70px}.logo{font:800 22px serif;letter-spacing:.2em}.sub,.tag{font-size:12px;color:#929899;letter-spacing:.12em}.card{margin-top:20px;padding:24px;border:1px solid #373d3e;background:#121516}.title{font:700 28px serif;margin:10px 0 17px}.story{line-height:1.8;white-space:pre-line}.btn{width:100%;padding:15px;margin:9px 0;border:1px solid #4b5253;background:#191d1e;color:#eee;text-align:left;cursor:pointer}.primary{text-align:center;background:#e1ded5;color:#151718;font-weight:800}.role{padding:16px;margin:16px 0;border-left:3px solid #a98861;background:#191714}.machine{margin:18px 0;border:1px solid #555d5e;padding:18px;background:#0e1112}.orb{display:flex;justify-content:center;gap:15px;margin:25px 0}.o{width:72px;height:72px;border-radius:50%;border:2px solid #777;display:grid;place-items:center;font-size:26px}.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.slot{padding:15px 8px;text-align:center;border:1px solid #4e5556}.line{height:1px;background:#353a3b;margin:22px 0}.small{font-size:12px;color:#999}.log{padding:13px;margin:8px 0;background:#171a1b;line-height:1.6}.good{color:#afd0a6}.bad{color:#d6958b}@media(max-width:520px){.card{padding:18px}.title{font-size:24px}}</style></head><body><main class="wrap"><div class="logo">未读 MIDOKU</div><div class="sub">3-PLAYER CO-OP CORE TEST</div><section id="app" class="card"></section></main><script>
const app=document.querySelector("#app");let role=0,round=1,rule=0,action=null;
const roles=[
{name:"观测者",icon:"◉",desc:"你能看见机关真正需要的顺序。\n但是你不能碰机关。"},
{name:"行动者",icon:"✦",desc:"只有你能按下机关。\n但是你看不到符号真正代表什么。"},
{name:"改写者",icon:"⌁",desc:"你能改变一条世界规则。\n但是你不知道正确答案。"}
];
const puzzles=[
{answer:["月","鸟","火"],shown:["△","○","□"],rules:["第一格与第二格会交换","最后一个符号会被机关吞掉"],change:["交换第一、第二格","保护最后一个符号"]},
{answer:["水","树","月"],shown:["◇","△","○"],rules:["中间的符号无法被按下","第一格会复制一次"],change:["允许按下中间格","取消第一格复制"]},
{answer:["鸟","火","树"],shown:["○","□","◇"],rules:["第二次操作会作用到下一位玩家","第三格被锁住"],change:["第二次操作留在自己这里","解除第三格锁定"]}
];
function home(){app.innerHTML='<div class="tag">测试目标</div><div class="title">三个人，缺一不可</div><div class="story">目标很简单：<b>一起启动机关。</b>\n\n每个人只能做一种事。先选一个角色，用单人模拟感受流程。</div>'+roles.map((r,i)=>'<button class="btn" onclick="pickRole('+i+')"><b>'+r.icon+' '+r.name+'</b><br><span class="small">'+r.desc.replace("\n"," ")+'</span></button>').join("")}
window.pickRole=i=>{role=i;round=1;rule=0;action=null;intro()}
function intro(){let r=roles[role];app.innerHTML='<div class="tag">YOUR ROLE</div><div class="title">'+r.icon+' '+r.name+'</div><div class="role">'+r.desc+'</div><div class="story">另外两名玩家由原型自动模拟。\n\n<b>你不需要理解整个机关，只需要做好自己的那一件事。</b></div><button class="btn primary" onclick="play()">开始</button>'}
function play(){let p=puzzles[round-1];let h='<div class="tag">ROUND 0'+round+'</div><div class="title">启动机关</div><div class="machine"><div class="small">机关表面</div><div class="orb">'+p.shown.map(x=>'<div class="o">'+x+'</div>').join("")+'</div></div>';
if(role===0)h+='<div class="role"><div class="tag">只有你看得见</div>正确顺序：<b>'+p.answer.join(" → ")+'</b><br><br>当前规则：'+p.rules[rule]+'</div><div class="story">行动者正在等你的指示。你准备告诉他什么？</div>'+p.answer.map((x,i)=>'<button class="btn" onclick="observe('+i+')">告诉他：第 '+(i+1)+' 个应该是「'+x+'」</button>').join("");
if(role===1)h+='<div class="role"><div class="tag">你看到的只有</div>'+p.shown.join("　　")+'</div><div class="story">观测者说：<b>“先按第 '+((round%3)+1)+' 个。”</b>\n改写者说：<b>“规则已经处理好了。”</b>\n\n你来实际操作。</div>'+p.shown.map((x,i)=>'<button class="btn" onclick="operate('+i+')">按下 '+x+'</button>').join("");
if(role===2)h+='<div class="role"><div class="tag">只有你能改变</div>规则A：'+p.rules[0]+'<br>规则B：'+p.rules[1]+'</div><div class="story">观测者知道正确顺序，行动者负责按。\n你只能修改其中一条规则。</div><button class="btn" onclick="rewrite(0)">'+p.change[0]+'</button><button class="btn" onclick="rewrite(1)">'+p.change[1]+'</button>';
app.innerHTML=h}
window.observe=i=>resolve("你把关键信息交给了行动者。","如果你说错，真正承担后果的是行动者。");
window.operate=i=>resolve("你按下了机关。","你无法确认这个选择正确与否，只能相信另外两个人。");
window.rewrite=i=>{rule=i;resolve("世界规则被你改写了。","观测者看到的答案没有变，但行动者接下来面对的机关已经不同。")}
function resolve(a,b){let ok=Math.random()>.32;app.innerHTML='<div class="tag">RESULT</div><div class="title">'+(ok?"机关回应了":"哪里出了问题")+'</div><div class="log">'+a+'</div><div class="log">'+b+'</div><div class="machine"><div class="'+(ok?"good":"bad")+'">'+(ok?"✓ 第一层结构亮起。":"× 符号熄灭。你们需要重新判断是谁的信息出了问题。")+'</div></div>'+(round<3?'<button class="btn primary" onclick="next()">下一层</button>':'<button class="btn primary" onclick="end()">结束测试</button>')}
window.next=()=>{round++;play()};window.end=()=>{app.innerHTML='<div class="tag">CORE TEST END</div><div class="title">先只判断这一件事</div><div class="story">如果是真正的三人模式：\n\n<b>观测者</b>知道答案，却不能操作。\n<b>行动者</b>能操作，却不知道答案。\n<b>改写者</b>能改变规则，却不知道两人的完整信息。\n\n三个人必须说话，任何一个人都无法单独完成。</div><div class="line"></div><div class="story">现在先不加入秘密身份、欺骗、31号、神话和剧情。\n\n只测试：<b>这种“能力被拆开”的合作本身有没有意思。</b></div><button class="btn primary" onclick="home()">换角色再试</button>'}
home();</script></body></html>

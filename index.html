<div class="rumor"><b>最近听见的话</b><div id="rumorText" style="margin-top:8px;color:#d7cbaa">还没有什么值得记下的。</div></div>

<div class="book-overlay" id="bookOverlay" hidden role="dialog" aria-modal="true" aria-label="手记"><div class="book-sheet"><div class="sheet-head"><span id="sheetTitle">手记</span><button type="button" onclick="UI.close()" aria-label="关闭">×</button></div><div id="sheetContent"></div></div></div>
<script>
let step=0, selected={}, rumorDone=false;
const logs=[];
function setStory(t,x,buttons){title.textContent=t;text.innerHTML=x;choices.innerHTML=buttons||"";progress()}
function addLog(x){logs.push(x);log.innerHTML='17:38　电车抵达陌生站台。<br>'+logs.join("<br>");log.scrollTop=999}
function progress(){let n=Math.min(step,8);progressEl=document.getElementById("progress");progressEl.innerHTML="";for(let i=0;i<8;i++){let d=document.createElement("div");d.className="p"+(i<n?" on":"");progressEl.appendChild(d)}}
function arrive(){step=1;train.classList.add("hide");setStory("陌生的小镇","你们刚踏上荒草地，电车就关上门离开了。<br><br>“……先看看站牌吧。”",'<button onclick="lookBack()">回头看车站</button>');addLog("你们在陌生站台下车。")}
function lookBack(){step=2;station.classList.add("hide");setTimeout(()=>{station.style.display="none";track.style?.setProperty("opacity","0")},900);setStory("车站消失了","刚才还在身后的站台像从来没有存在过一样消失了。铁轨尽头只剩荒草。<br><br>远处似乎站着一个人。",'<button onclick="openMap()">打开地图</button>');addLog("车站与铁轨消失。");}
function openMap(){step=3;map.classList.add("show");setStory("地图解锁：荒草地","现在唯一能够确认的位置只有这里。其他区域仍然被迷雾覆盖。<br><br>荒草地上有一个当地人。",'<button onclick="showNpc()">调查荒草地</button>');addLog("解锁地图板块【荒草地】。")}
function showNpc(){map.classList.remove("show");npc.classList.add("show");setStory("荒草地","一个提着篮子的女人正奇怪地看着你们。点击她进行对话。","");}
function npcClick(){npc.onclick=null;step=4;setStory("陌生女人","“你们几个……从哪儿来的？我以前没见过你们。”<br><br>你们正准备解释刚才发生的事情，但每个人记住的细节似乎不太一样。",'<button onclick="startWords()">试着说明刚才发生的事</button>');addLog("遇到第一名当地居民。她还不知道你们经历了什么。")}
const sets={subject:["我们","其他同学","站台上的乘客","一位同行的朋友"],verb:["坐过","看见过","正在寻找","错过了"],object:["电车","车站","回东京的路","同车的乘客"],time:["刚才","下车之前","电车停下时","天色变暗之前"]};
function startWords(){step=5;setStory("第一次 · 主谓宾游戏","四个人回忆刚才发生的事。每个人记住的东西并不完全一样。<br><br><b>从每一组里选一个词，把大家的碎片重新拼成一句话。</b>","");renderWords()}
function renderWords(){wordArea.innerHTML='<h3 style="margin-top:18px">信息碎片</h3>';for(const [k,arr] of Object.entries(sets)){let box=document.createElement("div");box.innerHTML='<div style="font-size:11px;color:#888;margin:8px 0">'+({subject:"主语",verb:"谓语",object:"宾语",time:"时间"}[k])+'</div>';let grid=document.createElement("div");grid.className="cardpick";arr.forEach(w=>{let d=document.createElement("div");d.className="word";d.textContent=w;d.onclick=()=>{selected[k]=w;[...grid.children].forEach(e=>e.classList.remove("sel"));d.classList.add("sel");checkWords()};grid.appendChild(d)});box.appendChild(grid);wordArea.appendChild(box)}}
function checkWords(){if(Object.keys(selected).length===4&&!document.getElementById("makeBtn")){let b=document.createElement("button");b.id="makeBtn";b.style.marginTop="12px";b.textContent="组成这句话";b.onclick=makeRumor;wordArea.appendChild(b)}}
function makeRumor(){
 step=6;
 let sentence=`${selected.time}，${selected.subject}${selected.verb}${selected.object}。`;
 rumorText.textContent="“"+sentence+"”";
 wordArea.innerHTML="";
 window.firstRumor={...selected,sentence};

 // NPC only reacts to words the players actually selected.
 let reactions=[];
 if(selected.object==="电车") reactions.push("“电车？这里可没有那种东西。”");
 if(selected.object==="车站") reactions.push("“车站？这附近从来没有车站。”");
 if(selected.object==="回东京的路") reactions.push("“东京……我只听过这个名字。你们是从那里来的吗？”");
 if(selected.object==="奇怪的乘客") reactions.push("“奇怪的乘客？可我刚才只看见了你们几个。”");
 if(selected.subject==="没人") reactions.push("“没人？那这句话又是谁看到的呢……”");
 if(selected.subject==="陌生人"||selected.subject==="站台上的人") reactions.push("“你们说的那个人，现在在哪里？”");
 if(selected.verb==="弄丢了") reactions.push("“弄丢了？你们确定原来真的有吗？”");
 if(selected.verb==="等着") reactions.push("“在这种荒草地里等什么呢……”");
 if(selected.time==="午夜") reactions.push("“午夜？现在明明还是白天。是谁这么说的？”");
 if(selected.time==="昨天") reactions.push("“昨天？可你们不是刚刚才到这里吗？”");
 if(selected.time==="很久以前") reactions.push("“很久以前的事，你们怎么会知道？”");
 if(!reactions.length) reactions.push("女人把这句话低声重复了一遍，似乎仍然没有完全听懂。");

 setStory("一句话诞生了",
 `你们七嘴八舌地解释刚才发生的事情，最后留下了这样一句话：<br><br><b>“${sentence}”</b><br><br>${reactions.slice(0,2).join("<br>")}<br><br>女人想了想。<br>“总之，先别一直站在这里。跟我来吧。”`,
 '<button onclick="shop()">跟她去杂货店</button>');
 addLog("第一句话被当地人记住：【"+sentence+"】");
}

function shop(){
 step=7;
 let r=window.firstRumor;
 let daughter="";
 // Daughter repeats ONLY the rumor she actually receives.
 if(r.object==="电车"){
   daughter=`女儿听完后立刻抬起头：<br>“<b>电车</b>？那是什么？你们刚才真的坐过吗？”`;
 } else if(r.object==="车站"){
   daughter=`女儿听完后有些惊讶：<br>“<b>车站</b>？妈妈不是说镇上没有车站吗？”`;
 } else if(r.object==="回东京的路"){
   daughter=`女儿一下凑了过来：<br>“<b>东京</b>？我听过这个名字！那里是什么样的？”`;
 } else if(r.object==="奇怪的乘客"){
   daughter=`女儿压低声音问：<br>“你们说的那个<b>奇怪的乘客</b>，后来去哪儿了？”`;
 }
 setStory("小镇杂货店",
 `女人原来是市场里杂货店的老板。店里还有她的女儿。<br><br>老板把刚才听到的话复述给女儿：<br><b>“${r.sentence}”</b><br><br>${daughter}<br><br>老板看了看天色：<br>“不管怎样，你们今晚暂时回不去了。先听听你们怎么打算吧。”`,
 '<button onclick="townInfo()">询问这个小镇</button>');
 addLog("杂货店老板把第一句话转述给女儿，没有加入新的信息。");
}

let lodging="";
function townInfo(){
 let r=window.firstRumor;
 let tail=r.object==="回东京的路"?'女儿轻声问：“东京……是地方的名字吗？”':r.object==="电车"?'女儿问：“你们说的电车，究竟是什么？”':r.object==="车站"?'女儿问：“车站是什么地方？”':'女儿又问了一遍：“你们刚才说的那件事，是真的吗？”';
 setStory("今晚住在哪里？",`老板没有马上替你们决定住处。<br><br>“天快黑了。店里可以挤出一间空房；我也能去问问学校宿舍能不能收留你们。”<br><br>${tail}<br><br>你们几个人意见不同，决定再用一次<b>主语＋谓语＋宾语＋时间</b>把今晚的打算说清楚。`,'<button onclick="startLodgingWords()">开始第二次主谓宾游戏</button>');
}
function startLodgingWords(){
 step=7; selected={};wordArea.innerHTML='';
 setStory("第二次 · 今晚的去处","这次每个人提出不同的说法。请依次选择主语、谓语、宾语和时间。<br><br><b>句子中的地点决定今晚住在哪里，也决定最先开放的探索区域。</b>","");
 const opts={subject:["我们","几个外来孩子","大家","老板的客人"],verb:["借住在","暂时留在","决定去","请求住进"],object:["杂货店老板家","学校宿舍"],time:["今晚","天黑之前","从今天开始","这一夜"]};
 for(const [key,words] of Object.entries(opts)){
  const h=document.createElement('div');h.style.marginTop='12px';h.textContent=({subject:'主语',verb:'谓语',object:'宾语',time:'时间'})[key];wordArea.appendChild(h);
  const grid=document.createElement('div');grid.className='cardpick';wordArea.appendChild(grid);
  words.forEach(w=>{const el=document.createElement('button');el.className='word';el.textContent=w;el.onclick=()=>{selected[key]=w;[...grid.children].forEach(x=>x.classList.remove('sel'));el.classList.add('sel');const done=Object.keys(selected).length===4;let btn=document.getElementById('lodgingConfirm');if(done&&!btn){btn=document.createElement('button');btn.id='lodgingConfirm';btn.style.marginTop='14px';btn.textContent='确认这句话';btn.onclick=confirmLodging;wordArea.appendChild(btn)}};grid.appendChild(el)});
 }
}
function confirmLodging(){
 lodging=selected.object==='学校宿舍'?'school':'market';
 const sentence=`${selected.time}，${selected.subject}${selected.verb}${selected.object}。`;
 wordArea.innerHTML='';addLog('今晚的决定：【'+sentence+'】');
 const response=lodging==='school'?'老板点点头：“好，我去跟学校的老师说一声。”':'老板笑了：“那就来我家吧。楼上还有间空房。”';
 setStory('今晚的决定',`你们最终说出了：<br><br><b>“${sentence}”</b><br><br>${response}<br><br>夜色渐深，大家跟着老板动身。`,'<button onclick="unlockTown()">前往住处</button>');
}
function unlockTown(){
 step=8;map.classList.add('show');
 const id=lodging==='school'?'schoolZone':'marketZone';const zone=document.getElementById(id);
 zone.classList.remove('lock');zone.classList.add('new');zone.textContent=lodging==='school'?'学校':'市场';
 const place=lodging==='school'?'学校宿舍':'杂货店老板家';
 setStory('新区域已解锁',`你们来到<b>${place}</b>。<br><br>地图现在只开放了【荒草地】和【${lodging==='school'?'学校':'市场'}】。另一处仍被迷雾覆盖，需要后续探索才能发现。`,'<button onclick="finishPrologue()">开始探索</button>');
 addLog('解锁【'+(lodging==='school'?'学校':'市场')+'】；另一地点仍未开放。');
}
function finishPrologue(){
 document.querySelectorAll('.zone.new').forEach(x=>x.classList.remove('new'));
 setStory('序章结束 · 自由探索开始',`你们今晚住在<b>${lodging==='school'?'学校宿舍':'杂货店老板家'}</b>。<br><br>从已开放区域开始探索，寻找更多居民与线索。未探索的地点依然保持未知。<br><br>小镇居民目前只听到了你们实际说出的传闻，不会自动知道“东京”或“电车”。`,'');
 addLog('进入自由探索，起点：'+(lodging==='school'?'学校':'市场'));
}
function mapClick(id){
 if(step<8)return;
 if(id==='school'&&lodging==='school')setStory('学校','你们住进了学校宿舍。其他地方还要靠调查才能找到。','');
 else if(id==='market'&&lodging==='market')setStory('市场','杂货店老板让你们住在店铺楼上的空房间。','');
 else if(id==='grass')setStory('荒草地','你们最初抵达的地方。车站已经消失了。','');
}
progress();
// ===== 第一阶段：沿用上传的 V3 序章，再接回可自由探索的地图。 =====
// 序章不放异端；只在真正展开探索、传闻被居民听到后，异常逐步出现。
const EXP={
 started:false,mode:'prologue',current:'grass',active:null,chosen:{},unlocked:new Set(['grass']),
 visited:new Set(),completed:new Set(),rumors:[],effects:[],lastOdd:[],lastOutcome:'',finalStatement:'',total:0,
 names:{grass:'荒草地',school:'学校',market:'市场',home:'居民家',river:'河边',shrine:'神社',forest:'森林'},
 graph:{grass:[],school:['river','home'],market:['home','river'],home:['market','school','shrine'],river:['forest','shrine'],shrine:['forest'],forest:['shrine']},
 quests:{
  school:{npc:'值班老师',intro:'学校已经放学。值班老师正在锁教室门，黑板上有一条没擦干净的粉笔线，像一段没画完的铁轨。\n\n“你们几个不是本校的吧？今晚要借住的话，先别乱跑。”',clue:'老师告诉你们：河边那条小路能绕到镇子的另一头。',
   options:{subject:['黑板上的粉笔字','傍晚的铃声','那位值班老师','课桌上留下的纸条'],verb:['指向了','记下了','提起了','藏着'],object:['一条没画完的路','教室外的脚步声','一张车票','放学的时间'],time:['放学以后','教室关门之前','刚才','天黑以前']},
   odd:[{slot:'object',text:'明天才会响起的铃声',level:1,effect:'楼道里突然响起了明天的下课铃。老师看看挂钟，又看看空空的教室。'},{slot:'subject',text:'写着明天日期的黑板',level:3,effect:'黑板上的日期变了，甚至写出了还没发生的课表。'}]},
  market:{npc:'市场摊主',intro:'市场正在收摊。一个卖可乐饼的摊主把纸袋递给三花猫，猫却丢下一张皱巴巴的纸。\n\n摊主说：“奇怪，刚才怎么没人看见这张纸是哪来的？”',clue:'摊主告诉你们：沿着摊位后的居民家，能找到通往河边的小巷。',
   options:{subject:['市场里的三花猫','收摊的老板','路过的孩子','一张被捡起的纸'],verb:['发现了','叼走了','藏起了','带来了'],object:['一张旧纸片','奇怪的脚印','没见过的站牌图','一只遗失的手套'],time:['刚才','打烊之前','人群散去时','晚饭以前']},
   odd:[{slot:'object',text:'自己会收钱的影子',level:1,effect:'摊位底下的影子伸出手，准确接住了一枚硬币；摊主却不敢低头。'},{slot:'subject',text:'还没开门的明天的摊位',level:3,effect:'空地上忽然摆出了明天的价签和新鲜蔬菜。'}]},
  home:{npc:'独居的老奶奶',intro:'居民区里有一户窗户亮着灯。老奶奶正在往门上贴纸条。\n\n“这里最近总有人敲错门。说出来你们可能不信，他们连自己敲的是哪一天的门都记不清。”',clue:'老奶奶说神社后面有条小径，以前孩子们常去那儿玩。',
   options:{subject:['门口的纸条','隔壁家的孩子','走廊上的脚步声','老奶奶的旧挂钟'],verb:['记录了','听见了','指向了','找到了'],object:['一扇紧闭的门','陌生人的名字','旧时的约定','走错路的孩子'],time:['傍晚','敲门以后','太阳落下时','今晚']},
   odd:[{slot:'object',text:'通往昨天的房门',level:1,effect:'房门打开的一瞬间，门后是白天的阳光。关上再开，才变回夜晚的走廊。'},{slot:'subject',text:'还没出生的邻居',level:3,effect:'门外有人道谢，老奶奶却说那户人家根本还没人搬进来。'}]},
  river:{npc:'河边的钓鱼人',intro:'河边的水面上飘着细小的纸屑。一个钓鱼人把它们捞上岸，却发现每一张都只有半句话。\n\n“我今天一直捡到这种纸。像是谁把说过的话丢进河里了。”',clue:'钓鱼人指向河对岸的小径：顺着那条路，可以去神社或森林。',
   options:{subject:['河水里的纸片','桥下的回声','岸边的钓鱼人','水面上的倒影'],verb:['重复着','藏着','带来了','指向了'],object:['半句没有说完的话','一条看不清的河道','陌生的站名','一片飘来的树叶'],time:['刚才','太阳落下时','今晚','桥上有人经过时']},
   odd:[{slot:'object',text:'倒着流的时间',level:1,effect:'水里的落叶逆流漂回了树上，钓鱼人吓得松开了鱼竿。'},{slot:'subject',text:'学会替人回答的河水',level:3,effect:'你们还没开口，河面已经传来一句回答。'}]},
  shrine:{npc:'守神社的老人',intro:'神社门口挂着一排写着愿望的木牌。有人写“去东京”，有人写“看一眼真正的大城市”。\n\n老人说：“这里的人都听过东京。可是我认识的人里，没有谁亲眼看过它。每个人说的样子都不一样。”',clue:'老人指出：神社后方就是森林。传闻中的午夜电车，有人说要从那儿经过。',
   options:{subject:['石阶上的老人','神社里的铃铛','木牌上的愿望','屋檐下的乌鸦'],verb:['听见了','记下了','等待着','提起了'],object:['远方城市的名字','没有答案的愿望','森林传来的铃声','大家没见过的风景'],time:['暮色里','刚才','有人许愿时','太阳完全落下前']},
   odd:[{slot:'object',text:'能回答问题的神社铃',level:1,effect:'神社的铃没有人碰，却一声一声回答了你们刚才问的问题。'},{slot:'subject',text:'写着未来的木牌',level:3,effect:'一块空白木牌上浮出明天的日期，其他人争着把它当成预言。'}]},
  forest:{npc:'跟着传闻寻路的居民',intro:'森林里没有路灯。几束手电筒在树影间晃动。\n\n一个居民说：“有人说深处会出现车站，可大家都只听过别人说，根本没人找到过。”\n\n你们脚边的乌鸦忽然叫了一声，听起来像是“エキ”。',clue:'林子最深处有片平整的空地，像在等待某个还没人说出口的东西。',
   options:{subject:['森林里的乌鸦','寻找车站的居民','那片没有树的空地','远处传来的铃声'],verb:['等待着','听见了','指向了','藏着'],object:['一块白色站牌','不存在的车站','很轻的列车铃声','通向别处的小路'],time:['天黑以后','刚才','有人提起时','下一声乌鸦叫起时']},
   odd:[{slot:'object',text:'会替乘客检票的乌鸦',level:1,effect:'一只乌鸦站上石头，叼走居民手里并不存在的车票。'},{slot:'subject',text:'从未铺设的铁轨',level:3,effect:'泥土地上出现两道发亮的钢轨，却没有人记得它们是何时出现的。'}]}
 }
};
function expGet(id){return document.getElementById(id)}
function expEsc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function expBr(x){return expEsc(x).replace(/\n{2,}/g,'<br><br>').replace(/\n/g,'<br>')}
const origUnlockTown=unlockTown;
unlockTown=function(){origUnlockTown();EXP.mode='new-area';EXP.unlocked.add(lodging);EXP.syncMap();};
finishPrologue=function(){
  document.querySelectorAll('.zone.new').forEach(x=>x.classList.remove('new'));
  document.querySelector('.phase').textContent='ACT 01 · 第一阶段 / 自由探索';
  EXP.started=true;EXP.mode='explore';EXP.current=lodging;EXP.syncMap();EXP.goal();
  addLog('自由探索开始：从'+EXP.names[lodging]+'出发。');
  EXP.visit(lodging);
};
mapClick=function(id){

 for(const id of Object.keys(EXP.names)){

  }

 expGet('mapHud').textContent=EXP.started?'已发现 '+EXP.unlocked.size+' / 7 · 传闻 '+EXP.rumors.length+' 条':'已发现：荒草地';

EXP.goal=function(){
 let goal=expGet('exploreGoal');if(!goal){goal=document.createElement('div');goal.id='exploreGoal';goal.className='goal';expGet('wordArea').before(goal)}

 const count=EXP.rumors.length;
 const parts=[];
 if(!EXP.completed.has('shrine'))parts.push('寻找神社里有关远方的传闻');

 const late=EXP.canPrepare();
 const suffix=EXP.mode==='tokyo'?'已经抵达“东京”。':EXP.mode==='returned'?'第一阶段结束。':late?'线索汇聚：返回森林深处。':parts.length?parts.join('；'):'返回森林深处，决定要不要利用传闻回家。';

};
EXP.visit=function(loc){

 if(loc==='grass'){

 if(loc==='forest'&&EXP.canPrepare())return EXP.prepareStation();

  '<button onclick="EXP.startWords(\''+loc+'\')">听完线索，一起造句</button><button class="ghost" onclick="EXP.showOverview()">先去别处看看</button>';

EXP.showOverview=function(){EXP.active=null;wordArea.innerHTML='';map.classList.add('show');EXP.syncMap();EXP.goal();

EXP.unlockMore=function(loc){

EXP.effectCoordinates={school:[21,19],market:[76,23],home:[80,71],river:[22,75],shrine:[45,11],forest:[81,10]};
EXP.complete=function(){
 const loc=EXP.active;if(!loc||EXP.completed.has(loc))return;
 if(Object.keys(EXP.chosen).length<4)return;

 let response=q.npc+'把你们拼出来的话重复了一遍。\n“'+s+'”\n\n“原来是这么回事……”\n\n她没接着问，只是把那几个词在嘴里轻声念了一遍。';
 if(anomalies.length){

  response+='\n\n第二天有人在路边看见了怪事：\n'+anomalies.map(x=>x.detail).join('\n');

  response+='\n\n附近的人一边听一边补上自己理解的细节。这句话开始有了第二个版本。';
 }
 response+='\n\n'+q.clue;
 if(unlocks.length)response+='\n\n新发现的地点：'+unlocks.join('、')+'。';
 if(EXP.canPrepare())response+='\n\n已有足够多的故事在镇子里传开。森林深处现在可能会听见新的声音。';
 EXP.active=null;EXP.chosen={};EXP.syncMap();EXP.goal();
 wordArea.innerHTML='<div class="sentence-card">'+expEsc(s)+'</div><div class="choice-help">这句话已经留在镇上的人之间。你下次遇到他们时，他们可能会再讲一遍。</div>';
 const last=EXP.rumors.slice(-3).reverse();
 wordArea.innerHTML+='<div class="sentences">'+last.map(r=>'<div class="sentence-log"><b>'+EXP.names[r.loc]+'</b> · '+expEsc(r.sentence)+'</div>').join('')+'</div>';

};
EXP.revisit=function(loc){

 });

EXP.questionRail=function(){

 wordArea.innerHTML='<h3 style="margin-top:16px">拼出一趟不存在的列车</h3><div class="choice-help">这些词并不是镇民亲眼见过的证据。你们在决定怎样把一条传闻说得可信。</div>';
 for(const [key,label] of Object.entries({subject:'主语',verb:'谓语',object:'宾语',time:'时间'})){
  const h=document.createElement('div');h.style.cssText='font-size:12px;color:#ddd0b4;margin:12px 0 7px';h.textContent=label;wordArea.appendChild(h);

  opt[key].forEach((val,i)=>{const b=document.createElement('button');b.className='word'+(key==='time'&&i===3?' odd':'');b.innerHTML=expEsc(val);

};
EXP.boardTrain=function(){

 setStory('终点：东京？','电车终于停下。<br><br>广播说：“终点站，东京。”<br><br>可车门外什么也没有。没有街道、没有人群，也没有人们传说中的高楼。<br><br>这里甚至没有能让你确认方向的地平线。<br><br>小镇的人知道有一个叫“东京”的地方，却不知道真正的东京究竟是什么样。<br><br><strong>传闻可以为列车创造一个目的地，却无法创造人们从未认识过的具体世界。</strong>','<button onclick="EXP.returnTown()">返回言叶町</button>');

  for(const [i,r] of EXP.rumors.entries())content+='<div class="note-entry"><small>'+String(i+1).padStart(2,'0')+'　·　'+expEsc(EXP.names[r.loc]||'森林')+'</small>'+expEsc(r.sentence)+'</div>';
  if(!EXP.rumors.length&&!window.firstRumor)content+='<p>还没有写进笔记的话。</p>';
  if(EXP.effects.length)content+='<h3 style="margin-top:24px;font-size:14px">翻回去看时</h3>'+EXP.effects.map(e=>'<div class="note-entry"><small>'+expEsc(EXP.names[e.loc])+'</small>'+expEsc(e.detail||e.caption)+'</div>').join('');

 help(){this.open('游戏方法',`<div class="sheet-help">

  <p>听完居民的话，选择<strong>时间、主语、谓语和宾语</strong>，把彼此记下的片段拼成一句。句子的每一部分都可以由不同的朋友决定。单人试玩时，也可以依次替他们选择。</p>

// Repurpose decorative right-hand bookmark as a functional atlas index.

arrive=function(){step=1;train.classList.add('hide');setStory('下错站了','车门刚开，外面的风就灌了进来。<br><br>“怎么连一个人都没有？”<br><br>大家走下站台，脚下的碎石踩起来咔咔作响。银色电车在身后关上了门。','<button onclick="lookBack()">回头找站牌</button>');addLog('银色电车开走了。')};

openMap=function(){step=3;map.classList.add('show');EXP.syncMap();setStory('荒草地','“我们刚才是从这里下来的吧？”<br><br>没有人接话。附近看不到路牌，也没有能问路的站务员。<br><br>草地尽头，一个提着篮子的人正慢慢走过。','<button onclick="showNpc()">过去问问</button>');addLog('草地旁有人经过。')};

npcClick=function(){npc.onclick=null;step=4;setStory('“坐电车来的？”','“电车？”她直起腰，又朝你们身后看看。<br><br>“这儿连铁轨都没有，哪来的电车？”<br><br>大家一下子都说起话来。有的记得车厢里很冷，有的只顾着说站名，还有人说自己下车时看见了一只猫。<br><br>“哎哎，等会儿，一个一个说。”','<button onclick="startWords()">想想刚才到底发生了什么</button>');addLog('遇见提着菜篮的女人。')};
startWords=function(){step=5;setStory('你记得的是哪一段？','她把篮子放在脚边，等着你们开口。<br><br>四个人说的并不是同一件事。把各自记住的那一小段挑出来，听听凑在一起会是什么样。','');renderWords()};

EXP.syncMap=function(){v4Sync();
 map.classList.toggle('has-station',EXP.mode==='station-found'||EXP.mode==='returned');
 const tab=document.getElementById('folioPage');if(tab)tab.textContent=(EXP.started?'0'+Math.min(7,EXP.unlocked.size):'01')+' — 07';

 expGet('mapEffects').innerHTML=EXP.effects.reduce((html,e,i)=>html+'<span class="map-effect" aria-hidden="true" style="left:'+e.x+'%;top:'+e.y+'%">'+(marker[e.loc]||'〰')+'</span>','');
 const art=map.querySelector('.town-art');if(!art)return;
 let rail=art.querySelector('#midnightTrack');
 if(!rail){rail=document.createElementNS('http://www.w3.org/2000/svg','g');rail.setAttribute('id','midnightTrack');rail.innerHTML='<path d="M774 84L938 248" stroke="#594f44" stroke-width="10" fill="none"/><path d="M774 84L938 248" stroke="#e9dfc8" stroke-width="6" fill="none"/><path d="M774 84L938 248" stroke="#5b5145" stroke-width="2" stroke-dasharray="4 12" fill="none"/><g transform="translate(868 182)"><rect x="-18" y="-14" width="36" height="20" fill="#eee5d0" stroke="#665744"/><path d="M-16 -14L0 -26L18 -14Z" fill="#8d7868" stroke="#665744"/></g>';
 art.appendChild(rail)}rail.style.display=EXP.mode==='station-found'||EXP.mode==='returned'?'block':'none';
};
EXP.goal=function(){
 let el=expGet('exploreGoal');if(!el){el=document.createElement('div');el.id='exploreGoal';el.className='goal';expGet('wordArea').before(el)}
 if(!EXP.started){el.style.display='none';return}el.style.display='block';
 let n=EXP.rumors.length,msg='到别处走走，问问有没有人见过电车。';
 if(EXP.mode==='tokyo')msg='车门开着。外面安静得出奇。';
 else if(EXP.mode==='returned')msg='天还没亮。镇上却有人已经开始出门。';
 else if(EXP.canPrepare())msg='森林里的铃声越来越清楚。也许该回去看看。';
 else if(!EXP.completed.has('shrine'))msg='听说神社那边有人提起过“东京”。';
 else if(!EXP.completed.has('forest'))msg='去森林找找，看看有没有人真的见过那座车站。';
 el.innerHTML='<b>下一步</b><br>'+expEsc(msg);
};
EXP.adjRumor=function(loc){
 const r=EXP.rumors.filter(x=>(EXP.graph[x.loc]||[]).includes(loc)).at(-1);if(!r)return '';
 return '\n\n不远处两个人正聊着天。一个说：“刚刚有人在'+EXP.names[r.loc]+'提起'+r.sentence.replace(/[。]+$/,'')+'……”\n\n另一个听得直点头：“我好像也听过。”';
};
EXP.visit=function(loc){
 EXP.started=true;EXP.mode='explore';EXP.current=loc;EXP.active=null;EXP.chosen={};EXP.visited.add(loc);
 EXP.syncMap();EXP.goal();map.classList.add('show');visual.classList.remove('white-tokyo','return-town');wordArea.innerHTML='';
 if(loc==='grass'){setStory('荒草地','草长得跟刚才一样高。有人蹲下翻了翻泥土，手指上全是湿泥。<br><br>“还是没有铁轨。”<br><br>你们在风里站了一会儿，听见远处市场那边有收摊的声音。','');return}
 if(loc==='forest'&&EXP.canPrepare())return EXP.prepareStation();
 const q=EXP.quests[loc],completed=EXP.completed.has(loc);
 const actions=completed?'<button onclick="EXP.revisit(\''+loc+'\')">再仔细看看</button><button class="ghost" onclick="EXP.showOverview()">先去别处</button>':'<button onclick="EXP.startWords(\''+loc+'\')">接着问问</button><button class="ghost" onclick="EXP.showOverview()">先去别处</button>';
 setStory(EXP.names[loc]+' · '+q.npc,expBr(q.intro.replaceAll(/<br>/g,'\n')+EXP.adjRumor(loc)),actions);
};

EXP.wordUI=function(){

 const labels={subject:'主语',verb:'谓语',object:'宾语',time:'时间'};
 wordArea.innerHTML='<h3>每个人记住的一小段</h3><p class="choice-help">可以让朋友分别负责不同部分。选好以后，看看合起来会变成什么。</p>';
 for(const [key,label] of Object.entries(labels)){

  }
 }

};

const characterReactions={
 school:(a)=>'老师停住脚：“'+a.object.text+'？”\n\n他把钥匙从锁孔里抽出来，朝走廊那头看了一眼。',
 market:(a)=>'摊主把纸袋往柜台上一放：“'+a.object.text+'？你们从哪儿听来的？”\n\n旁边卖菜的大叔也探过头来。',
 home:(a)=>'老奶奶听到“'+a.object.text+'”，扶了扶眼镜。\n\n“你们等等，我好像在哪里听过……”',
 river:(a)=>'钓鱼人捏着那张湿纸，嘴里念了一遍“'+a.object.text+'”。\n\n“有点意思。”他又把钓线扔进河里。',
 shrine:(a)=>'老人一边听，一边低声重复：“'+a.object.text+'……”\n\n石阶下路过的人停了一下脚步。',
 forest:(a)=>'打手电的男人重复了一遍“'+a.object.text+'”。\n\n“你们确定？我刚才还没听谁这么讲。”'
};
EXP.complete=function(){
 const loc=EXP.active;if(!loc||EXP.completed.has(loc)||Object.keys(EXP.chosen).length<4)return;
 const q=EXP.quests[loc],a=EXP.chosen,s=EXP.sentence(),anomalies=Object.values(a).filter(v=>v.odd);
 EXP.rumors.push({loc,sentence:s,odd:anomalies.length>0,at:EXP.rumors.length+1});EXP.completed.add(loc);EXP.total++;
 const unlocks=EXP.unlockMore(loc);
 const npcResponse=characterReactions[loc](a);
 let response='“'+s+'”\n\n'+npcResponse;
 if(anomalies.length){
  for(let i=0;i<anomalies.length;i++){
   const coord=EXP.effectCoordinates[loc],v=anomalies[i];EXP.effects.push({loc,x:coord[0]+i*3,y:coord[1]+i*6,caption:v.text,detail:v.detail});
   response+='\n\n'+v.detail.replace(/<br\s*\/?\s*>/g,'\n');
  }
  response+='\n\nMio扯了扯你们的衣角。“……先别说了。再看看。”';
 }else{
  response+='\n\n一个路过的居民听到后，回头问：“刚才你们说的是'+a.object.text+'吗？”\n\n'+q.npc+'点点头：“他们自己说的。”';
 }
 response+='\n\n'+q.clue;
 if(unlocks.length){const hint=loc==='school'?'出了校门，河边那条小路还亮着路灯。':loc==='market'?'摊位后面的巷子通向别处，Mio走在前面认路。':'Mio在地图上画了一条浅浅的铅笔线。';response+='\n\n'+hint}
 if(EXP.canPrepare())response+='\n\n树林那边传来了短短一声铃。人群有人停了下来，似乎都听见了。';
 EXP.active=null;EXP.chosen={};EXP.syncMap();EXP.goal();
 wordArea.innerHTML='<div class="sentence-card">'+expEsc(s)+'</div>';
 rumorText.textContent='“'+s+'”';
 addLog(EXP.names[loc]+'：“'+s+'”');
 setStory(EXP.names[loc]+' · '+q.npc,expBr(response),'<button onclick="EXP.showOverview()">继续走走</button>'+(EXP.canPrepare()?'<button onclick="EXP.visit(\'forest\')">回森林看看</button>':''));
};
EXP.revisit=function(loc){
 const r=EXP.rumors.find(t=>t.loc===loc),changes=EXP.effects.filter(e=>e.loc===loc);
 let msg='你们又走到'+EXP.names[loc]+'。\n\n'+EXP.quests[loc].npc+'还认得你们。\n\n“又来啦？上回你们说的那个……'+r.sentence+'”';
 if(changes.length){msg+='\n\n'+changes.map(e=>e.detail.replace(/<br\s*\/?\s*>/g,'\n')).join('\n\n');msg+='\n\nMio没说话，只把笔记翻到先前的那一页。'}
 else msg+='\n\n说话间又有人经过，听见那句话就跟着重复了一遍。意思已经跟你们最初说的不太一样。';
 setStory('再走一遍 · '+EXP.names[loc],expBr(msg),'<button onclick="EXP.showOverview()">翻回地图</button>');
};
EXP.prepareStation=function(){EXP.mode='station-decision';EXP.syncMap();EXP.goal();wordArea.innerHTML='';
 setStory('树林里的空地','森林里聚了不少人，手电光全照向同一片空地。可那里还是只有泥土和树根。<br><br>“我听说这儿晚上有站台。”<br><br>“什么站台？不是说列车能到东京吗？”<br><br>“谁说的？”<br><br>大家互相看着，谁也答不上来。<br><br>Mio握紧了手电：“要是真想回家……我们是不是也可以告诉他们，午夜有趟车？”<br><br>她说完又摇了摇头：“可是没人真的见过。”','<button onclick="EXP.questionRail()">先在树林里找找铁轨</button><button onclick="EXP.finalWords()">把午夜电车的事说出去</button><button class="ghost" onclick="EXP.showOverview()">先离开</button>');
};
EXP.questionRail=function(){
 setStory('找不到的铁轨','你们拿着手电，在空地边缘仔细走了一圈。<br><br>鞋底沾满了湿泥。一个同行的朋友把树叶拨开，下面还是泥土。<br><br>“什么都没有。”<br><br>Mio回头看着那些还在等车的居民：“那我们还要跟他们说吗？”','<button onclick="EXP.finalWords()">还是告诉大家午夜有车</button><button class="ghost" onclick="EXP.showOverview()">先不说</button>');
};
EXP.finalWords=function(){EXP.mode='final-words';EXP.finalChosen={};
 setStory('午夜前','有个居民拿来一块木板和一支笔：“如果真的有车，终点该写哪里？”<br><br>“东京！”人群里立刻有人说。<br><br>“你去过？”<br><br>“没有。可谁不知道东京啊。”<br><br>Mio看着你们：“……怎么办？总得有人写。”','<button class="ghost" onclick="EXP.prepareStation()">再想想</button>');
 const opts={subject:['那辆银色电车','大家说的末班车','森林里的小站','没有司机的列车'],verb:['会开往','可以抵达','将带我们去','就停在了'],object:['镇民想象的东京','谁也没亲眼见过的东京','传闻里灯火通明的东京','只有名字的东京'],time:['午夜','钟声响起的时候','所有人都等在这里时','不存在的第十三个小时']};
 wordArea.innerHTML='<h3>木板上要写什么？</h3><p class="choice-help">大家等着你们把这趟车的事说清楚。</p>';
 for(const [key,label] of Object.entries({subject:'主语',verb:'谓语',object:'宾语',time:'时间'})){
  const h=document.createElement('div');h.style.cssText='font-size:11px;letter-spacing:.12em;color:#cfcbb9;margin:16px 0 8px';h.textContent=label;wordArea.appendChild(h);
  const div=document.createElement('div');div.className='cardpick';wordArea.appendChild(div);
  for(const val of opts[key]){const b=document.createElement('button');b.type='button';b.className='word';b.textContent=val;
   b.onclick=()=>{EXP.finalChosen[key]=val;[...div.children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');expGet('finalSay').disabled=Object.keys(EXP.finalChosen).length<4};div.appendChild(b)}
 }
 const btn=document.createElement('button');btn.id='finalSay';btn.disabled=true;btn.textContent='把木板交给居民';btn.onclick=EXP.sayFinal;wordArea.appendChild(btn);
};
EXP.sayFinal=function(){if(Object.keys(EXP.finalChosen).length!==4)return;
 const c=EXP.finalChosen;EXP.finalStatement=c.time+'，'+c.subject+c.verb+c.object+'。';
 EXP.rumors.push({loc:'forest',sentence:EXP.finalStatement,odd:c.time.includes('第十三'),at:EXP.rumors.length+1});
 if(c.time.includes('第十三'))EXP.effects.push({loc:'forest',x:71,y:18,caption:'第十三个小时',detail:'站台上的钟多出了一格。秒针绕了一圈，却没回到原来的地方。'});
 EXP.mode='station-found';EXP.syncMap();EXP.goal();wordArea.innerHTML='<div class="sentence-card">'+expEsc(EXP.finalStatement)+'</div>';rumorText.textContent='“'+EXP.finalStatement+'”';
 addLog('木板上写着：“'+EXP.finalStatement+'”');
 setStory('午夜车站','写好的木板被钉在两棵树之间。<br><br>有人凑上来看：“哦，原来十二点有车。”<br><br>“我就说嘛，我奶奶以前也讲过。”<br><br>“快！让后面的人也过来！”<br><br>林子里一下热闹起来。<br><br>你们挤出人群时，脚下多了一条不知从哪儿伸来的铁轨。那两棵树之间，不知什么时候竖起了站牌。<br><br>车头灯在雾里亮了。<br><br>Mio的声音很小：“……真的来了。”','<button onclick="EXP.boardTrain()">上车</button>');
};
EXP.boardTrain=function(){EXP.mode='tokyo';document.querySelector('.phase').textContent='ACT 01　·　终点';EXP.syncMap();EXP.goal();wordArea.innerHTML='';map.classList.remove('show');visual.classList.add('white-tokyo');
 setStory('东京','“终点，东京。终点，东京。”<br><br>车门打开了。<br><br>没人下车。<br><br>眼前是白色的。没有街道，没有广告牌，甚至连影子都看不见。<br><br>“……东京呢？”<br><br>Mio往前探出半只脚，又收回来。<br><br>“不是说有好多大楼吗？”<br><br>车厢里的人面面相觑。有人拿出手机，对着门外拍了一张。照片里什么也没有。<br><br>车门还开着。','<button onclick="EXP.returnTown()">坐回去</button>');
};
EXP.returnTown=function(){EXP.mode='returned';document.querySelector('.phase').textContent='ACT 02　·　返程';EXP.current='grass';map.classList.add('show');visual.classList.remove('white-tokyo');visual.classList.add('return-town');EXP.syncMap();EXP.goal();
 const details=EXP.effects.slice(0,2);let seen='';if(details.length){seen='你们走过'+details.map(e=>EXP.names[e.loc]).join('和')+'时，发现那里留下了先前见过的变化。'}else{seen='路边的几个居民正在谈论你们最先说过的话，连语气都学得一模一样。'}
 setStory('还是那个小镇吗？','返程电车停下时，天刚蒙蒙亮。<br><br>草地边多了一段铁轨。市场口有人排队，神社的铃声从远处断断续续传来。<br><br>'+expEsc(seen)+'<br><br>Mio在路口停住。<br><br>“你们看那边。”<br><br>几个人沿着她指的方向望过去。<br><br>原本空荡荡的街口，多了一块写着“言叶町站”的路牌。<br><br>“……这下怎么办？”','<button onclick="UI.journal()">翻开手记</button><button class="ghost" onclick="location.reload()">重新开始</button>');
 addLog('回到言叶町。')
};
// Keep explanatory copy out of the HUD, and refresh layout only after overrides.
EXP.syncMap();EXP.goal();

</script><script>
renderWords=function(){
 wordArea.innerHTML='<h3 style="margin-top:18px">每个人记住的碎片</h3><p class="choice-help">不同的朋友可以分别选一部分。先别商量答案，选完再看看整句话。</p>';
 for(const [key,arr] of Object.entries(sets)){
  const label=document.createElement('div');label.style.cssText='font-size:11px;letter-spacing:.1em;color:#c9c7b7;margin:15px 0 8px';label.textContent=({subject:'主语',verb:'谓语',object:'宾语',time:'时间'})[key];
  const grid=document.createElement('div');grid.className='cardpick';wordArea.append(label,grid);
  for(const item of arr){const b=document.createElement('button');b.type='button';b.className='word';b.textContent=item;
   b.onclick=()=>{selected[key]=item;[...grid.children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');checkWords()};grid.appendChild(b)}
 }
};
const v5Sync=EXP.syncMap;
EXP.syncMap=function(){v5Sync();for(const id of ['school','market','home','river','shrine','forest']){
 const fog=document.getElementById('fog-'+id);if(fog)fog.style.opacity=EXP.unlocked.has(id)?'0':'.9';
 }};
const v5Visit=EXP.visit;
EXP.visit=function(loc){npc.classList.remove('show');v5Visit(loc)};
const v5FinishPrologue=finishPrologue;
finishPrologue=function(){npc.classList.remove('show');v5FinishPrologue()};
const v5UnlockTown=unlockTown;
unlockTown=function(){npc.classList.remove('show');v5UnlockTown()};
UI.map=function(){
 this.close();
 if(EXP.started && EXP.mode!=='tokyo' && EXP.mode!=='returned'){EXP.showOverview();return}
 if(step===3){map.classList.add('show');return}
 this.open('地图册','<p class="sheet-help">这本小册子暂时只画得出荒草地。等找到今晚落脚的地方，再仔细看看镇上还有什么路。</p>');
};
const v5Journal=UI.journal;
UI.journal=function(){v5Journal.call(UI);const target=document.getElementById('sheetContent');if(target)target.querySelectorAll('.note-entry').forEach(el=>{el.innerHTML=el.innerHTML.replace(/&lt;br\s*\/?&gt;/g,'　')})};
EXP.syncMap();

/* Subtle new strokes appear directly in the map illustration after an impossible rumor. */
const inkGlyphs={
 school:`<svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="30" r="21" fill="#e3ddca" stroke="#705d4e" stroke-width="2"/><path d="M32 14v16l-11 8m-7-20 5 7m-7 4-2 7m16 13-5 3" fill="none" stroke="#746555" stroke-width="2.5" stroke-linecap="round"/><path d="M45 18q-10-9-20-4M27 10l-4 4 5 4" fill="none" stroke="#866a59" stroke-width="2"/></svg>`,
 market:`<svg viewBox="0 0 64 64" aria-hidden="true"><rect x="9" y="17" width="48" height="30" rx="2" fill="#e7dac2" stroke="#685943" stroke-width="2"/><path d="M13 17V9h38v8M16 27h34M16 36h34" stroke="#80705b" stroke-width="1.5" fill="none"/><circle cx="31" cy="32" r="11" fill="#dfccaa" stroke="#846b51" stroke-width="2"/><path d="m27 29 5 5 5-5m-5 5v7m-6-4h12" fill="none" stroke="#7b654d" stroke-width="2"/></svg>`,
 home:`<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M13 56V11h38v45M22 56V20h20v36" fill="#d5c6ac" stroke="#796550" stroke-width="2"/><path d="M42 20 56 13v39L42 56M51 33v8" fill="#ece1ce" stroke="#796550" stroke-width="2"/><path d="M17 55h43" stroke="#796550" stroke-width="2"/></svg>`,
 river:`<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M4 43q12-11 24 0t32 0M4 51q12-11 24 0t32 0M9 59q10-7 22 0" fill="none" stroke="#6d8a85" stroke-width="2.5"/><path d="M37 16Q20 15 15 29q13 2 22-13ZM37 16q5 9-3 19" fill="#bf9e75" stroke="#74634c" stroke-width="1.6"/><path d="M51 34q-7-12-20-6m0 0 7-6m-7 6 8 5" stroke="#8e6f5b" fill="none" stroke-width="1.6"/></svg>`,
 shrine:`<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M22 10h20l5 9v24H17V19Z" fill="#e4d4b5" stroke="#78614c" stroke-width="2"/><path d="M17 20h30M31 15v-7M28 42l4 10 5-10" stroke="#78614c" stroke-width="2" fill="none"/><path d="M10 20q-6 11 0 23m44-23q6 11 0 23" fill="none" stroke="#8d7562" stroke-width="1.5"/></svg>`,
 forest:`<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M6 57 20 7M58 57 44 7M10 47h44M13 37h39M16 27h31M19 17h25" stroke="#6f6858" stroke-width="2.8" fill="none"/><path d="M32 6q8 0 9 5-5 5-11 3-7 5-12 1 4-8 14-9Z" fill="#8e977b" stroke="#5d6655" stroke-width="1.6"/></svg>`
};
const inkPos={school:[27,26],market:[70,45],home:[69,67],river:[20,66],shrine:[56,34],forest:[82,30]};
const atlasSync=EXP.syncMap;
EXP.syncMap=function(){
 atlasSync();
 const paper=document.getElementById('mapInkChanges');if(!paper)return;
 const locations=[...new Set(EXP.effects.map(e=>e.loc))].filter(loc=>inkGlyphs[loc]);
 paper.innerHTML=locations.map(loc=>`<div class="ink-mutation" style="left:${inkPos[loc][0]}%;top:${inkPos[loc][1]}%" title="${expEsc(EXP.names[loc])}的地图悄悄发生了变化">${inkGlyphs[loc]}</div>`).join('');
};
EXP.syncMap();
</script></body></html>

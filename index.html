<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>コトノハ町</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f2e8;color:#24231f;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.wrap{max-width:800px;margin:auto;padding:34px 20px 80px}.head{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid #393832;padding-bottom:10px;margin-bottom:30px}.logo{font:25px Georgia,serif;letter-spacing:.12em}.meta,.place{font-size:11px;color:#77736a;letter-spacing:.11em}.title{font:24px/1.5 Georgia,"Noto Serif SC",serif;margin:8px 0 14px}.story{font-size:15px;line-height:2}.dialogue{font:16px/2 Georgia,"Noto Serif SC",serif;margin:18px 0;padding-left:15px;border-left:2px solid #aaa59a}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:24px}.choice{border:1px solid #99948a;background:transparent;padding:15px 12px;text-align:center;cursor:pointer;font-size:16px;min-height:56px}.choice:hover{background:#282722;color:#fff}.wordrow{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:24px 0}.word{border-top:1px solid #918c82;padding:12px 5px;text-align:center;font:19px/1.6 Georgia,"Noto Serif SC",serif}.word small{display:block;font:10px sans-serif;color:#888279;margin-bottom:6px}.sentence{font:25px/1.7 Georgia,"Noto Serif SC",serif;text-align:center;padding:20px 0;margin:18px 0;border-top:1px solid #aaa59a;border-bottom:1px solid #aaa59a}.event{font:16px/2 Georgia,"Noto Serif SC",serif;margin-top:20px}.next{border:0;border-bottom:1px solid #555;background:transparent;padding:7px 0;margin-top:24px;cursor:pointer;color:#555}.end{font-size:16px;line-height:2}@media(max-width:600px){.choices{grid-template-columns:1fr 1fr}.wordrow{grid-template-columns:1fr}.sentence{font-size:21px}}
</style></head><body><main class="wrap"><header class="head"><div class="logo">コトノハ町</div><div class="meta" id="meta">PROTOTYPE 13</div></header><div id="app"></div></main><script>
const $=x=>document.getElementById(x),E=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]||m));let round=0,state={};
const rounds=[
{day:"星期五・傍晚",place:"镇口",title:"站台不见了。",story:"银色电车开进雾里。你们沿原路跑回来，刚才下车的地方只剩一片草。\n\n杂货店老板从门里探出头。",dialog:"「你们几个，从哪儿来的？」\n\n悠太指着身后。Mio说了句什么。葵还在翻自己的口袋。\n\n老板皱着眉看你们。",slot:"o",fixed:{s:"那辆银色电车",v:"带走了"},opts:["我们的Suica","一个没见过的学生","最后一个饭团","整个车站"],event:(o)=>o.includes("Suica")?"老板低头看了一眼你手里的Suica。\n\n「电车把你们的Suica带走了？」\n\n「不是——」\n\n街对面的佐藤太太已经停下脚步。":o.includes("学生")?"老板愣了一下。\n\n「电车带走了一个学生？」\n\n悠太：「谁说有人被带走了？」\n\n佐藤太太正好从街对面经过。":o.includes("饭团")?"老板看着你们。\n\n「……电车把饭团带走了？」\n\n葵摸了摸书包：「我的确少了一个。」\n\n老板的表情反而认真起来。":"老板回头看了一眼空荡荡的草地。\n\n「电车把整个车站带走了？」\n\nMio：「不，车站是——」\n\n「佐藤さん！」老板已经叫住了街对面的人。"},
{day:"星期六・早晨",place:"Mio家",title:"早餐桌上。",story:"桌上是吐司、玉子焼き和牛奶。Mio妈妈把果酱推过来。\n\n「昨晚睡得好吗？」\n\n她看了你们一圈。",dialog:"「对了，商店街现在都在说昨天的事。」\n\nMio放下杯子。\n\n「他们到底传成什么了？」",slot:"s",fixed:{v:"藏起了",o:"一张黄色纸片"},opts:["Mio","修钟老人","那只三花猫","数学老师"],event:(s)=>s==="Mio"?"Mio差点把牛奶碰倒。\n\n「我什么时候藏纸了？」\n\n她妈妈看向她的书包。\n\n拉链缝里，真的露出一小角黄色。":s==="修钟老人"?"Mio妈妈「啊」了一声。\n\n「修钟店那位？」\n\n窗外正好传来店铺卷帘门拉开的声音。":s.includes("三花猫")?"窗台下面传来一声猫叫。\n\n那只三花猫从院墙上跳下来，嘴里叼着一小片黄色的东西。\n\n四个人都没动。": "Mio咬着吐司停了两秒。\n\n「数学老师为什么要藏黄色纸片？」\n\n手机正好震了一下。班级群里有人发：『老师今天也来学校。』"},
{day:"星期六・中午",place:"商店街",title:"人比平时多。",story:"你们刚走到商店街，就听见身后有人叫。\n\n隔壁班的田中骑着自行车追上来。",dialog:"「喂！刚才听说找到东西了。」\n\n「找到什么？」\n\n「我哪知道，所以来问你们啊。」",slot:"v",fixed:{s:"那只三花猫",o:"体育馆钥匙"},opts:["捡到了","吃掉了","偷偷换掉了","一直在等"],event:(v)=>v==="捡到了"?"田中猛地刹车。\n\n「猫捡到体育馆钥匙？」\n\n远处体育馆方向忽然传来哨声。\n\n一个篮球部学生冲出校门：「备用钥匙谁拿了？」":v==="吃掉了"?"田中盯着你。\n\n「……猫把体育馆钥匙吃了？」\n\n话音刚落，那只三花猫从自动贩卖机后面钻出来，嘴里咬着一串金属东西。":v==="偷偷换掉了"?"「换掉了？」田中低头看自己的自行车钥匙。\n\n三秒后，他猛地抬头。\n\n「等等，这不是我的。」":"田中：「猫在等体育馆钥匙？」\n\n你们一起看向路口。\n\n那只三花猫真的蹲在那里。面前放着一把钥匙。"},
{day:"星期六・下午",place:"河堤",title:"消息比你们先到了。",story:"河边已经有几个学生。有人说在找旧车站的东西，也有人只是来看热闹。\n\n修钟老人站在桥上，像是被谁硬拉来的。",dialog:"Mio：「你知道他们为什么来这里吗？」\n\n老人看着河水。\n\n「我只说以前这里捞上来过铁牌。」",slot:"o",fixed:{s:"修钟老人",v:"忘在了"},opts:["河的上游","一张旧车票","昨天","一盒牛奶"],event:(o)=>o==="河的上游"?"旁边的男生立刻抬头。\n\n「老人把东西忘在河上游？」\n\n他朝同伴挥手。几辆自行车同时掉头。":o.includes("车票")?"老人皱眉。\n\n「我没说我有车票。」\n\n桥下却有人喊：「这里！真的有纸！」":o==="昨天"?"老人第一次转过头。\n\n「……把昨天忘在这里？」\n\n河面吹来一阵风。Mio没有笑。":"老人沉默了一会儿。\n\n「为什么会是牛奶？」\n\n桥下有人举起一个褪色的玻璃奶瓶。\n\n「这个算吗？」"},
{day:"星期日・傍晚",place:"镇口",title:"草地上多了东西。",story:"昨天这里还什么都没有。\n\n今天，草里露出两根生锈的铁条。已经有人围在旁边拍照。",dialog:"「以前这里真的有站吗？」\n\n「不知道。」\n\n「那这个又是什么？」\n\nMio蹲下来，摸了摸铁轨边缘。",slot:"s",fixed:{v:"正在等",o:"明天"},opts:["银色电车","旧车站","数学老师","最后一个饭团"],event:(s)=>s==="银色电车"?"远处传来很轻的金属摩擦声。\n\n雾里亮起两盏灯。\n\nMio站起来。\n\n「……来了。」":s==="旧车站"?"没有人说话。\n\n草地尽头立着一块昨天还不存在的站牌。\n\nコトノハ町。":s==="数学老师"?"身后传来自行车刹车声。\n\n数学老师扶着车把，气喘吁吁。\n\n「你们几个……明天的小测别忘了。」":"葵低头看着草地。\n\n那里真的放着一个被包装纸包好的饭团。\n\n包装上的日期，是明天。"}
];
function render(){let r=rounds[round];$("meta").textContent=(round+1)+" / "+rounds.length;$("app").innerHTML='<div class="place">'+r.day+"・"+r.place+'</div><h1 class="title">'+r.title+'</h1><div class="story">'+r.story.replace(/\n/g,"<br>")+'</div><div class="dialogue">'+r.dialog.replace(/\n/g,"<br>")+'</div>';let opts=r.opts;$("app").innerHTML+='<div class="choices">'+opts.map((o,i)=>'<button class="choice" data-i="'+i+'">'+E(o)+'</button>').join("")+'</div>';document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>resolve(r,opts[+b.dataset.i]))}
function resolve(r,val){let s=r.slot==="s"?val:r.fixed.s,v=r.slot==="v"?val:r.fixed.v,o=r.slot==="o"?val:r.fixed.o;let sentence=s+v+o+"。";$("app").innerHTML='<div class="place">'+r.day+"・"+r.place+'</div><div class="wordrow"><div class="word"><small>悠太</small>'+E(s)+'</div><div class="word"><small>Mio</small>'+E(v)+'</div><div class="word"><small>你</small>'+E(o)+'</div></div><div class="sentence">'+E(sentence)+'</div><div class="event">'+r.event(val).replace(/\n/g,"<br>")+'</div>';if(round<rounds.length-1){$("app").innerHTML+='<button class="next" id="n">→</button>';$("n").onclick=()=>{round++;render()}}else{$("app").innerHTML+='<button class="next" id="n">→</button>';$("n").onclick=end}}
function end(){$("meta").textContent="END";$("app").innerHTML='<div class="place">星期一・早晨</div><div class="title">いつもの駅。</div><div class="end">你把Suica贴上闸机。<br><br>ピッ。<br><br>身后两个学生正在说周末的事。<br><br>「听说コトノハ町那边——」<br><br>电车进站，后半句被盖住了。</div>'}
render();
</script></body></html>

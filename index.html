<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>未读 MIDOKU｜第一章 空席</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#090b0c;color:#e9e7e0;font-family:"Songti SC","Noto Serif SC",serif;background:radial-gradient(circle at 70% 0,#25313a33,transparent 40%),linear-gradient(#0b0d0e,#101112)}.wrap{max-width:780px;margin:auto;padding:28px 18px 80px}.logo{letter-spacing:.28em;font-weight:800;font-size:22px}.sub,.muted,.tag{font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#8e9495}.sub{font-size:13px}.tag{font-size:11px;letter-spacing:.16em}.card{margin-top:22px;padding:27px;border:1px solid #34393a;background:#111415e8;box-shadow:0 30px 80px #0009}.title{font-size:29px;letter-spacing:.1em;margin:10px 0 18px}.story{white-space:pre-line;line-height:2}.line{height:1px;background:#33393a;margin:22px 0}.btn,input{width:100%;padding:15px;margin-top:10px;border:1px solid #4a5050;background:#171b1c;color:#eee;font-size:15px}.btn{cursor:pointer;text-align:left}.btn:hover{background:#202526}.primary{text-align:center;background:#dedbd1;color:#171819;font-weight:800}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.notice{margin:18px 0;padding:16px;border-left:2px solid #6f7777;background:#15191a}.ghost{opacity:.68}.red{color:#bb7c74}.shake{animation:shake .09s 7}@keyframes shake{25%{transform:translateX(4px)}65%{transform:translateX(-3px)}}.phone{width:min(100%,390px);margin:18px auto;border:1px solid #4a5050;border-radius:28px;background:#080a0b;padding:10px;box-shadow:0 18px 50px #0008}.phone-screen{overflow:hidden;border-radius:20px;background:#f2f2ef;color:#17191a;min-height:340px;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}.phone-status{display:flex;justify-content:space-between;padding:10px 16px 6px;font-size:12px;font-weight:700}.phone-head{text-align:center;padding:10px 14px 12px;border-bottom:1px solid #d8d8d4;font-weight:700}.phone-head small{display:block;color:#888;font-weight:400;margin-top:2px}.messages{padding:18px 12px 26px}.bubble{max-width:78%;padding:10px 13px;margin:7px 0;border-radius:17px;line-height:1.45;font-size:14px;background:#fff;border:1px solid #e1e1dd}.bubble.me{margin-left:auto;background:#d9f5c8;border-color:#cbe8bb}.msgtime{text-align:center;color:#999;font-size:11px;margin:5px 0 12px}.board{margin:18px 0;padding:24px;background:#1a2821;border:7px solid #4b3b2d;color:#e8e5d5;min-height:190px;box-shadow:inset 0 0 40px #0006;font-family:"Klee","Songti SC",serif}.seats{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin:18px 0}.seat{border:1px solid #596062;padding:8px 4px;text-align:center;font:12px -apple-system,sans-serif}.seat.extra{border-color:#8e5f59;color:#c98b83}.photo{background:#d8d7d1;color:#222;padding:10px 10px 26px;transform:rotate(-1deg);margin:18px auto;max-width:420px}.photo-inner{height:180px;background:linear-gradient(#9ca3a2 0 45%,#656c68 45% 48%,#77716a 48%);position:relative;overflow:hidden}.desk{position:absolute;width:48px;height:27px;background:#514a42;border:2px solid #302c28;bottom:24px}.desk:after{content:"";position:absolute;left:6px;right:6px;top:25px;height:30px;border-left:3px solid #333;border-right:3px solid #333}.photo-cap{text-align:center;font:12px -apple-system,sans-serif;margin-top:8px;color:#666}@media(max-width:560px){.grid{grid-template-columns:1fr}.card{padding:20px}.title{font-size:24px}.seats{grid-template-columns:repeat(5,1fr)}}
</style></head><body><main class="wrap"><div class="logo">未读 MIDOKU</div><div class="sub">CHAPTER 01 · 空席</div><section id="app" class="card"></section></main>
<script>
const app=document.querySelector("#app");let sb=null,S=null,room="",slot=0,name="",players=0,ch=null;const esc=x=>String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const phone=(body,t="17:36")=>'<div class="phone"><div class="phone-screen"><div class="phone-status"><span>'+t+'</span><span>●●●　▰</span></div><div class="phone-head">2年3組<small>クラスチャット</small></div><div class="messages">'+body+'</div></div></div>';
function lobby(){app.innerHTML='<div class="tag">4月11日 · 17:36</div><div class="title">放課後</div><div class="story">雨还没有停。\n请选择今晚留在教室里的人数。</div><div class="grid"><button class="btn" onclick="setup(2)">2 人</button><button class="btn" onclick="setup(3)">3 人</button><button class="btn" onclick="setup(4)">4 人</button></div><div class="line"></div><button class="btn" onclick="soloTest()">开发测试｜单人进入第一章</button>'}
window.soloTest=()=>{players=3;slot=1;name="TESTER";room="SOLO_TEST";window.__solo=true;S={phase:"roll31",player1_joined:true,player2_joined:true,player3_joined:true,player1_choice:null,player2_choice:1,player3_choice:2};render()}
window.setup=n=>{players=n;app.innerHTML='<div class="tag">SESSION</div><div class="title">留下名字</div><div class="story">每台设备填写自己的 ID。\n所有玩家输入相同房间码。</div><input id="id" maxlength="12" placeholder="你的 ID"><input id="room" maxlength="12" placeholder="房间码"><button class="btn primary" onclick="enter()">进入教室</button>'}
window.enter=async()=>{if(!sb){app.innerHTML+='<div class="notice">网络连接中……</div>';return}name=document.querySelector("#id").value.trim()||"UNKNOWN";room=(document.querySelector("#room").value.trim()||"CLASS31").toUpperCase();let q=await sb.from("midoku_rooms").select("*").eq("room_code",room).maybeSingle(),d=q.data;if(!d){let r=await sb.from("midoku_rooms").insert({room_code:room,phase:"roll31"}).select().single();if(r.error){app.innerHTML='<div class="title">进入失败</div><div class="story">'+esc(r.error.message)+'</div>';return}d=r.data}S=d;let used=[S.player1_joined,S.player2_joined,S.player3_joined,S.player4_joined],free=used.slice(0,players).findIndex(x=>!x);slot=free<0?1:free+1;let w=await sb.from("midoku_rooms").update({["player"+slot+"_joined"]:true,phase:"roll31"}).eq("room_code",room).select().single();if(w.error){app.innerHTML='<div class="title">进入失败</div><div class="story">'+esc(w.error.message)+'</div>';return}S=w.data;subscribe();render()}
function subscribe(){ch=sb.channel("c31-"+room).on("postgres_changes",{event:"UPDATE",schema:"public",table:"midoku_rooms",filter:"room_code=eq."+room},p=>{S=p.new;render()}).subscribe()}
function render(){if(S.phase==="roll31"){app.innerHTML='<div class="tag">4月11日 · 17:36</div><div class="title">出席记录</div>'+phone('<div class="bubble">今天的出席记录好像有问题。<br>还在学校的人帮我确认一下人数。<br><small>班主任</small></div>')+'<div class="story ghost">28　高橋　出席<br>29　佐藤　出席<br>30　山本　出席<br><span class="red">31　　　　　出席</span></div>';setTimeout(()=>{if(S.phase==="roll31"){S.phase="roll30";if(window.__solo)render();else sb.from("midoku_rooms").update({phase:"roll30"}).eq("room_code",room)}},3000);return}
if(S.phase==="roll30"){app.innerHTML='<div class="tag">17:36</div><div class="title">出席记录</div><div class="story ghost">28　高橋　出席<br>29　佐藤　出席<br>30　山本　出席</div><button class="btn primary" onclick="blackboard()">返回教室</button>';return}
if(S.phase==="blackboard"){let extra=slot===2?'<br><br><b>欠席　1</b>':'<br><br><b>欠席　0</b>';app.innerHTML='<div class="tag">17:40</div>'+phone('<div class="bubble">对了，谁还在教室？<br>能帮我拍一下今天黑板上的作业吗？<br><small>美咲</small></div>',"17:40")+'<div class="board">数学　P.42–45<br>国語　プリント提出'+extra+'</div><button class="btn primary" onclick="seatmap()">拍下黑板</button>';return}
if(S.phase==="seatmap"){let seats='';for(let i=1;i<=30;i++)seats+='<div class="seat">'+i+'</div>';if(slot===3)seats+='<div class="seat extra">31</div>';app.innerHTML='<div class="tag">17:42</div><div class="title">座席表</div><div class="seats">'+seats+'</div><button class="btn primary" onclick="photoScene()">继续</button>';return}
if(S.phase==="photo"){let extraDesk=slot===1?'<div class="desk" style="left:76%;bottom:34px"></div>':'';app.innerHTML='<div class="tag">17:43</div>'+phone('<div class="bubble">谢谢！<br><small>美咲</small></div><div class="bubble me">[照片]<br><small>'+esc(name)+'</small></div>',"17:43")+'<div class="photo"><div class="photo-inner"><div class="desk" style="left:12%"></div><div class="desk" style="left:31%"></div><div class="desk" style="left:50%"></div><div class="desk" style="left:69%"></div>'+extraDesk+'</div><div class="photo-cap">17:43</div></div><div class="line"></div><button class="btn" onclick="decision(0)">把照片留在聊天记录里</button><button class="btn" onclick="decision(1)">删除照片</button><button class="btn" onclick="decision(2)">去最后一排看看</button>';return}
if(S.phase==="result"){let v=S["player"+slot+"_choice"];let h=v===0?phone('<div class="bubble">为什么要把我的座位拍进去？<br><small>unknown</small></div>',"17:47"):v===1?'<div class="story">照片从聊天记录里消失了。<br><br>座席表右下角留下了一块浅色的胶痕。</div>':'<div class="story">最后一排没有人。<br><br>但地板上有四道桌脚留下的灰印。<br>灰印还很新。</div>';app.innerHTML='<div class="tag">17:47</div>'+h+'<button class="btn primary" onclick="finish()">继续</button>';return}
if(S.phase==="end"){app.innerHTML='<div class="tag">18:00</div>'+phone('<div class="msgtime">メンバー　30</div><div class="msgtime shake red">メンバー　31</div><div class="bubble">参加しました。<br><small>'+esc(name)+'</small></div>',"18:00")+'<div class="line"></div><div class="tag">CHAPTER 01 END</div><div class="title">空席</div>';return}}
window.blackboard=()=>go("blackboard");window.seatmap=()=>go("seatmap");window.photoScene=()=>go("photo");window.decision=v=>{S["player"+slot+"_choice"]=v;go("result")};window.finish=()=>go("end");
function go(p){if(window.__solo){S.phase=p;render();return}sb.from("midoku_rooms").update({phase:p}).eq("room_code",room).then(()=>{})}
lobby();const sdk=document.createElement("script");sdk.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";sdk.onload=()=>{sb=window.supabase.createClient("https://ifmhbjrhlecksnyjcczq.supabase.co","sb_publishable_yeJtFDUCSeUxpfCyWrClgg_TUAUcI5k")};document.body.appendChild(sdk);
</script></body></html>

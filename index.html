}.names{display:grid;gap:10px}.names input{width:100%;border:0;border-bottom:1px solid #99948a;background:transparent;padding:12px 4px;font-size:16px;outline:none}.start{width:100%;margin-top:28px;border:1px solid #282722;background:#282722;color:#fff;padding:14px;cursor:pointer}.end{font-size:16px;line-height:2}@media(max-width:600px){.choices{grid-template-columns:1fr 1fr}.wordrow{grid-template-columns:1fr}.sentence{font-size:21px}}

const $=x=>document.getElementById(x),E=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]||m));let round=0;const M={};let playerCount=3,players=[];const timePools=[["放学以后","刚才","天黑以前","谁也没注意的时候"],["刚才","电车离开以后","老板出来以前","我们回头的时候"],["傍晚","店铺关门以前","猫跑过去以后","晚饭以前"],["刚才","太阳下山以前","大家打电话的时候","没人看见的时候"],["天黑以后","银色电车来的时候","乌鸦叫的时候","有人迷路的时候"],["刚才","进森林以后","乌鸦叫的时候","所有人都在找的时候"],["现在","雾起来以后","下一班电车来以前","明天"]];
const rounds=[
{day:"星期五・17:38",place:"いつもの駅",title:"差一点。",story:"部活结束得比平时晚。四个人跑上站台时，平时坐的电车刚好关门。\n\n一个同伴：「啊——差一点！」\n\n下一班，二十分钟。\n\n另一个同伴看了一眼手机：「我妈说六点前回去。」\n\n对面站台停着一辆没见过的银色电车。线路图上有一段和回家方向重合。",dialog:"Mio：「这个不是也往那边走吗？」\n\n一个同伴：「坐几站再换也行吧。」\n\n关门铃响了。\n\n四个人跑了过去。",trigger:"一个同伴盯着线路图，又看了一眼已经关门的银色电车。\n\n「所以……这辆车到底会把我们带到哪？」",slot:"o",fixed:{s:"这辆电车",v:"开到了"},opts:["一个没见过的小镇","我们平时换乘的车站","终点站","完全相反的方向"],event:(o)=>{M.arrive=o;if(o==="一个没见过的小镇")return"车厢里的乘客越来越少。\n\n手机信号只剩一格。\n\n广播响起：『下一站，终点——コトノハ町。』\n\n四个人一起抬头。\n\nMio：「……这哪？」";if(o==="我们平时换乘的车站")return"广播报出一个完全陌生的站名。\n\n一个同伴盯着车门上方的线路图。\n\n「不对，我们换乘站早就应该到了。」\n\n『下一站，终点——コトノハ町。』";if(o==="终点站")return"列车没有在你们认识的任何一站停下。\n\n最后，车厢只剩四个人。\n\n『下一站，终点——コトノハ町。』\n\n另一个同伴：「我们是不是坐反了？」";return"窗外熟悉的楼越来越少。\n\n一个同伴把地图转了两次。\n\n「……方向真的反了。」\n\n这时广播响起：『下一站，终点——コトノハ町。』"},next:"下车"},
{day:"星期五・18:11",place:"コトノハ町",title:"电车走了，站台也不见了。",story:"四个人下车以后，银色电车很快钻进雾里。\n\n「先找工作人员吧。」\n\n你们绕过一排矮房子，又觉得不对，沿原路折回来。\n\n刚才的站台不见了。\n\n原地只有一片草。\n\n路边杂货店的老板抱着纸箱出来，盯着你们看了半天。",dialog:"老板：「你们几个，站在这里干什么？」\n\nMio：「我们刚才从车站出来的。」\n\n老板：「车站？」\n\n他朝草地看了一眼。\n\n「这个镇上没有车站啊。」",trigger:"老板显然还是没听明白。他指着那片草地，又问了一遍。\n\n「那你们说清楚——那辆银色电车到底把你们送到了哪里？」",slot:"o",fixed:{s:"那辆银色电车",v:"把我们送到了"},opts:["这里的车站","这片草地","一个叫コトノハ町的站","不知道什么地方"],event:(o)=>{M.station=o;if(o==="这里的车站")return"老板：「这里的车站？」\n\n「对，刚才明明——」\n\n老板打断Mio：「这里从来没有车站。」\n\n店里传来拖鞋声。\n\n一个和你们差不多大的女生掀开门帘。\n\n「爸，谁啊？」\n\n老板指着你们：「Mio，这几个孩子说，他们刚从这里的车站下来。」";if(o.includes("コトノハ町"))return"老板：「コトノハ町站？」\n\n他皱眉重复了一遍。\n\n「我们镇叫コトノハ町没错，可没有什么コトノハ町站。」\n\n店里的门帘被掀开。\n\n「爸，谁啊？」\n\n老板回头：「Mio，他们说自己刚从『コトノハ町站』下来。」";if(o==="这片草地")return"老板低头看了看草。\n\n「电车把你们送到草地？」\n\n「不是，刚才这里是站台。」\n\n店里有人走出来。\n\n「爸，你在跟谁说话？」\n\n老板指向草地：「Mio，他们说这里刚才还是车站。」";return"老板：「不知道什么地方？」\n\n一个同伴：「所以我们才想找车站回去。」\n\n「都说了，这里没有车站。」\n\n店里一个女生掀开门帘。\n\n「爸？」\n\n老板：「Mio，你带他们去镇上看看吧。不然他们今晚要一直站这儿了。」"},next:"跟Mio走"},
{day:"星期五・18:29",place:"商店街",title:"先问回去的路。",story:"Mio带你们沿商店街往前走。天还没完全黑，肉店在收招牌，文具店门口摆着第二天要回收的纸箱。\n\nMio：「我从小住这里，真的没见过车站。」\n\n一个同伴：「那我们到底怎么来的？」\n\nMio：「所以才要问啊。」\n\n前面的可乐饼店老板娘正在关玻璃门。",dialog:"Mio：「阿姨，这附近以前有过车站吗？」\n\n老板娘：「车站？没有吧。」\n\n她又看向你们。\n\n「怎么突然问这个？」",trigger:"老板娘擦玻璃的手停下来。\n\n「等等。你们一直说那个车站。到底是谁见过它？」",slot:"s",fixed:{v:"见过",o:"那个车站"},opts:["杂货店老板","一个穿校服的孩子","那只三花猫","坐银色电车的人"],event:(s)=>{M.witness=s;if(s==="杂货店老板")return"老板娘：「杂货店老板见过？」\n\nMio：「不是，他刚才还说没有——」\n\n「那就是以前见过，现在没有了？」\n\n隔壁正在收摊的人抬起头。\n\n「什么？以前这里有站？」";if(s.includes("校服"))return"老板娘看了看你们的制服。\n\n「穿校服的孩子见过那个车站？」\n\n「我们就是——」\n\n隔壁店的人探出头：「哪个学校的？是不是以前迷路的那个传闻？」\n\nMio：「什么传闻？」";if(s.includes("三花猫"))return"老板娘愣了一下。\n\n「猫见过车站？」\n\n脚边正好传来一声猫叫。\n\n一只三花猫从纸箱后钻出来。\n\n隔壁店的人笑了：「那让它带路不就好了。」\n\nMio看着猫跑向街尾，没有笑。";return"老板娘：「坐银色电车的人见过那个车站……」\n\n隔壁店的人听见“银色电车”，停下手。\n\n「等等，我好像听我奶奶说过。以前有人说，傍晚会有一辆颜色很淡的电车经过。」\n\nMio：「这里连铁轨都没有啊。」"},next:"继续往前问"},
{day:"星期五・18:47",place:"小公园",title:"“没有”开始变成“听说有”。",story:"商店街走到头是一座很小的公园。两个小学生在秋千旁等家长。\n\n你们还没开口，其中一个先问：\n\n「你们是在找车站吗？」\n\nMio停下。\n\n「你怎么知道？」\n\n「刚才妈妈打电话说的。」",dialog:"另一个孩子抢着说：「听说那个站很奇怪。」\n\n一个同伴：「哪里奇怪？」\n\n「不知道啊。你们不是看见了吗？」",trigger:"小学生从秋千上跳下来，追着问。\n\n「那那个不存在的车站，到底怎么会跑到森林那边？」",slot:"v",fixed:{s:"那个不存在的车站",o:"森林那边"},opts:["藏在","会出现在","正在等在","跑到了"],event:(v)=>{M.place=v;if(v==="藏在")return"小学生：「车站藏在森林那边？」\n\n另一个孩子立刻说：「我知道！神社后面那片森林。」\n\n接孩子的母亲正好走过来。\n\n「什么森林？」\n\n「他们说车站藏在里面。」\n\nMio：「我们没——」\n\n母亲已经拿出手机。";if(v==="会出现在")return"「会出现在森林那边？」\n\n小学生眼睛一下亮了。\n\n「什么时候？」\n\n「我们没说时间。」\n\n接孩子的母亲走过来，只听见后半句。\n\n「晚上才出现吗？」\n\nMio：「为什么又多了个晚上？」";if(v==="正在等在")return"两个孩子一起看向森林方向。\n\n「车站在等？」\n\n其中一个压低声音：「是不是在等刚才那辆电车？」\n\n来接人的母亲正好听见。\n\n「什么电车？」\n\n十秒后，她已经在电话里说“森林里的车站”。";return"「车站跑到森林那边了？」\n\n两个小学生笑起来。\n\n可来接他们的母亲只听到最后一句。\n\n「森林那边有车站？」\n\n「妈妈，他们就是从那里来的！」\n\nMio张了张嘴，没插进去。"},next:"往森林方向走"},
{day:"星期五・19:06",place:"神社前",title:"每个人都知道一点。",story:"通往森林的路经过一座小神社。\n\n刚才公园里的话似乎比你们走得更快。石阶旁的老人看见Mio，直接问：\n\n「你们真要去找那个站？」\n\nMio：「您也知道了？」\n\n老人：「刚才有人说，在森林那边。」",dialog:"一个同伴：「可是森林这么大，具体在哪？」\n\n老人摇头。\n\n「我可不知道。只听说它有个特别的地方。」",trigger:"老人看了看越来越暗的天色。\n\n「既然你们都说它在森林里，那它什么时候才会出现？」",slot:"o",fixed:{s:"森林里的车站",v:"只会出现"},opts:["天黑以后","有孩子迷路的时候","银色电车来的时候","乌鸦叫的时候"],event:(o)=>{M.time=o;if(o==="天黑以后")return"老人：「只在天黑以后出现？」\n\n他抬头看了眼已经发蓝的天空。\n\n「那倒是快了。」\n\n刚走上石阶的两个人听见这句。\n\n「晚上才有的站？」\n\n其中一个立刻回头往山下走。";if(o.includes("迷路"))return"老人看着你们。\n\n「有孩子迷路的时候才出现……」\n\n石阶上的女人听见了，立刻把身边的小孩拉近一点。\n\n「别往森林里跑。」\n\n小孩却回头问：「那他们不是正好迷路了吗？」";if(o.includes("银色"))return"老人：「银色电车来的时候才出现？」\n\n石阶上有人停住。\n\n「银色电车？我刚才在商店街也听到了。」\n\nMio小声说：「已经传到这里了……」";return"树上传来一声「カァ」。\n\n老人抬头。\n\n「乌鸦叫的时候？」\n\n又一声。\n\n石阶上的孩子笑起来：「那现在就会出现啊。」"},next:"进入森林"},
{day:"星期五・19:24",place:"森林",title:"连乌鸦都开始重复了。",story:"路灯到神社后面就没有了。Mio打开手机手电筒。\n\n林子里不止你们。前面偶尔能看见别人的灯光。\n\n一个同伴：「这些人也是来找车站的？」\n\n远处有人喊：「这边没有！」\n\n树上传来乌鸦叫。",dialog:"「カァ——」\n\n又一只跟着叫。\n\n「エキ——」\n\n四个人同时停住。\n\n另一个同伴：「……刚才那个是不是在说‘駅’？」",trigger:"第二声乌鸦叫从更远的树上传回来。有人停下脚步。\n\n「所以现在，到底是谁知道车站在哪里？」",slot:"s",fixed:{v:"知道",o:"车站的位置"},opts:["森林里的乌鸦","三花猫","整个镇子的人","我们四个"],event:(s)=>{M.know=s;if(s.includes("乌鸦"))return"「森林里的乌鸦知道车站的位置。」\n\n话音刚落，前面的树上又传来：\n\n「エキ——」\n\n更远一点的地方也跟着响。\n\n「エキ、エキ——」\n\nMio把手电筒慢慢抬高。\n\n树林深处，忽然传来很轻的一声铃。";if(s.includes("三花猫"))return"脚边草丛一动。\n\n商店街那只三花猫从黑暗里钻出来，看了你们一眼，继续往林子深处走。\n\n树上的乌鸦跟着叫：\n\n「エキ——」\n\n一个同伴：「……真要跟吗？」\n\n远处忽然传来一声铃。";if(s.includes("整个镇子"))return"前后都是人的声音。\n\n「这边没有。」\n「听说还要往里。」\n「是不是天黑才有？」\n\n每个人说的都不一样，可每个人都在找同一个车站。\n\n树上的乌鸦叫了一声：\n\n「エキ——」\n\n远处传来铃声。";return"没人接这句话。\n\n你们四个一路问到这里，却没有一个人真的知道车站在哪。\n\n树上的乌鸦忽然叫：\n\n「エキ——」\n\n紧接着，树林深处传来一声铃。"},next:"往声音那边走"},
{day:"星期五・19:31",place:"森林深处",title:"カン、カン、カン。",story:"一开始只是很轻。\n\n再往前几步，声音变得清楚。\n\nカン、カン、カン。\n\n像铁路道口。\n\n可这里没有铁路。\n\nMio关掉手机手电筒。树林前面透出一排暖黄色的灯。",dialog:"几个人拨开最后一层树枝。\n\n铁轨横在面前。\n\n一块白色站牌立在雾里。\n\nコトノハ町駅。\n\n一个同伴：「……这里刚才真的什么都没有吧。」",trigger:"铁轨和站牌都已经在眼前。身后有人压低声音问。\n\n「那这个刚出现的コトノハ町駅，现在到底在等什么？」",slot:"o",fixed:{s:"コトノハ町駅",v:"正在等"},opts:["那辆银色电车","我们四个","明天","下一句传闻"],event:(o)=>{if(o.includes("银色"))return"雾的另一边亮起两盏灯。\n\n轨道开始轻轻震动。\n\nMio看着站牌，又看向你们。\n\n「……这次还上吗？」";if(o.includes("我们"))return"站台的灯一盏一盏亮起来。\n\n没有工作人员，也没有其他乘客。\n\n只有长椅上放着四张车票。";if(o==="明天")return"站台上的电子钟跳了一下。\n\n19:31消失了。\n\n屏幕只剩一个日期。\n\n明天。";return"树上的乌鸦又叫了一声。\n\n「エキ——」\n\n远处有人跑过来。\n\n「找到了！真的有车站！」\n\n更多脚步声从森林里靠近。"},next:"→"}
];
function injectPlayers(x){if(!x)return x;const p=i=>players[Math.min(i,players.length-1)]||("玩家"+(i+1));return x.replaceAll("一个同伴",p(0)).replaceAll("另一个同伴",p(1)).replaceAll("四个人",players.join("、")).replaceAll("我们四个",players.join("、"));}
function preMio(x){if(round<=1)return injectPlayers(x).replaceAll("Mio：", (players[2]||"玩家3")+"：").replaceAll("Mio刚", (players[2]||"玩家3")+"刚").replaceAll("Mio：「", (players[2]||"玩家3")+"：「");return injectPlayers(x)}
function render(){const r=rounds[round];$("meta").textContent=(round+1)+" / "+rounds.length;$("app").innerHTML='<div class="place">'+r.day+"・"+r.place+'</div><div class="story">'+preMio(r.story).replace(/\n/g,"<br>")+'</div><div class="dialogue">'+preMio(r.dialog).replace(/\n/g,"<br>")+'</div><div class="dialogue">'+preMio(r.trigger).replace(/\n/g,"<br>")+'</div><div class="slotlabel">'+(r.slot==="s"?"主语":r.slot==="v"?"谓语":"宾语")+'</div><div class="choices">'+r.opts.map((o,i)=>'<button class="choice" data-i="'+i+'">'+E(o)+'</button>').join("")+'</div>';document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>resolve(r,r.opts[+b.dataset.i]))}
function resolve(r,val){
let s=r.slot==="s"?val:r.fixed.s,v=r.slot==="v"?val:r.fixed.v,o=r.slot==="o"?val:r.fixed.o;
let t=playerCount===4?timePools[round][round%4]:"";
let sentence=(t?t+"，":"")+s+v+o+"。";
let roles=playerCount===4?[t,s,v,o]:[s,v,o];
let offset=round%playerCount;
let names=roles.map((_,i)=>players[(i+offset)%playerCount]||("玩家"+(i+1)));
$("app").innerHTML='<div class="place">'+r.day+"・"+r.place+'</div><div class="wordrow" style="grid-template-columns:repeat('+roles.length+',1fr)">'+roles.map((x,i)=>'<div class="word"><small>'+E(names[i])+'</small>'+E(x)+'</div>').join("")+'</div><div class="sentence">'+E(sentence)+'</div><div class="event">'+preMio(r.event(val)).replace(/\n/g,"<br>")+'</div><button class="next" id="n">'+r.next+'</button>';
if(round<rounds.length-1)$("n").onclick=()=>{round++;render()};else $("n").onclick=end
}
function end(){$("meta").textContent="END";$("app").innerHTML='<div class="place">星期一・07:46・いつもの駅</div><h1 class="title">月曜日。</h1><div class="end">你把Suica贴上闸机。<br><br>ピッ。<br><br>身后两个同校学生正在聊天。<br><br>「听说コトノハ町有个车站。」<br><br>「我知道。森林里面那个吧。」<br><br>「晚上才会出现的。」<br><br>电车进站。<br><br>车门打开以前，站台顶棚上落下一只乌鸦。<br><br>「エキ——」</div>'}
function setup(){ $("meta").textContent="SETUP"; $("app").innerHTML='<div class="setup"><h1>コトノハ町</h1><div class="people"><button id="p3" class="on">3人</button><button id="p4">4人</button></div><div class="names" id="names"></div><button class="start" id="start">开始</button></div>'; function draw(){ $("names").innerHTML=Array.from({length:playerCount},(_,i)=>'<input maxlength="10" placeholder="玩家 '+(i+1)+' 的昵称">').join("") } draw(); $("p3").onclick=()=>{playerCount=3;$("p3").classList.add("on");$("p4").classList.remove("on");draw()}; $("p4").onclick=()=>{playerCount=4;$("p4").classList.add("on");$("p3").classList.remove("on");draw()}; $("start").onclick=()=>{players=[...document.querySelectorAll("#names input")].map((x,i)=>x.value.trim()||("玩家"+(i+1)));round=0;render()}} setup();
</script></body></html>

<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>未读 MIDOKU 双人原型</title><script src="/socket.io/socket.io.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#09090b;color:#f4f4f5;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.wrap{max-width:720px;margin:auto;padding:28px 18px 70px}.logo{font-weight:900;letter-spacing:.18em;font-size:24px}.muted{color:#96969f}.card{margin-top:22px;background:#151518;border:1px solid #303036;border-radius:20px;padding:24px}.private{margin:20px 0;padding:17px;border:1px solid #665d46;background:#211f19;border-radius:13px}.story{line-height:1.85;white-space:pre-line}.options{display:grid;gap:11px;margin-top:18px}.opt,.btn{padding:16px;border-radius:12px;border:1px solid #444;background:#202025;color:#fff;font-size:15px;text-align:left;cursor:pointer}.opt:hover{border-color:#aaa}.sel{outline:2px solid #eee}.status{padding:13px;background:#101013;border-radius:11px;margin-top:15px}.top{display:flex;justify-content:space-between;gap:10px}.dots{letter-spacing:5px}.off{opacity:.2}.join input{width:100%;padding:14px;background:#111;border:1px solid #444;border-radius:10px;color:#fff;margin:8px 0}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{text-align:center;font-weight:800}.primary{background:#eee;color:#111}.warn{animation:flicker .16s 3}@keyframes flicker{50%{opacity:.2;transform:translateX(2px)}}@media(max-width:560px){.two{grid-template-columns:1fr}}
</style></head><body><div class=wrap><div class=top><div><div class=logo>未读 MIDOKU</div><div class=muted>双人联网原型</div></div><div id=who></div></div>
<div id=app class=card></div></div>
<script>
const socket=io(), q=new URLSearchParams(location.search); let room=q.get("room")||"", player=q.get("player")||"", S=null, pick=null;
const app=document.getElementById("app"),who=document.getElementById("who");
function joinScreen(){app.innerHTML=`<div class=join><h2>进入同一局游戏</h2><p class=muted>两台设备输入同一个房间码，并分别选择玩家1、玩家2。</p><input id=r placeholder="房间码，例如 DRAGON" value="${room}"><div class=two><button class="btn primary" onclick="join('1')">我是玩家1</button><button class="btn primary" onclick="join('2')">我是玩家2</button></div></div>`}
window.join=p=>{room=document.getElementById("r").value.trim()||"MIDOKU";player=p;history.replaceState(null,"",`?room=${encodeURIComponent(room)}&player=${p}`);socket.emit("join",{room,player})}
socket.on("state",s=>{S=s;pick=null;render()});
function tokens(n){return [0,1,2].map(i=>`<span class="${i<n?'':'off'}">●</span>`).join("")}
function render(){
 who.textContent=`${S.room} · 玩家${S.player}`; let h=`<div class=top><span>第 ${S.chapter+1}/10 章</span><span>改变机会 <span class=dots>${tokens(S.changes)}</span></span></div><h1>${S.title}</h1><div class=story>${S.public}</div><div class=private><b>只有你看到的信息</b><div class=story>${S.private}</div></div>`;
 if(S.connected<2){app.innerHTML=h+`<div class=status>等待另一名玩家进入房间……</div>`;return}
 if(S.phase==="first"){
  h+=`<p><b>先独立作出第一次决定。</b></p><div class=options>${S.options.map((x,i)=>`<button class=opt onclick="choose(${i},this)">${x}</button>`).join("")}</div><div id=st></div>`;
 } else if(S.phase==="discuss"){
  h+=`<div class="status warn"><b>现在请抬头和对方说话。</b><br>你们看到的信息可能并不相同。不要把屏幕交给对方，直接用语言交流。</div>
  <p>你的第一次决定：<b>${S.options[S.myChoice]}</b></p>
  <div class=two><button class="btn primary" onclick="finalize(false)">保持原决定</button><button class=btn ${S.changes<=0?'disabled':''} onclick="finalize(true)" ${S.changes<=0?'disabled':''}>改变决定（剩余${S.changes}次）</button></div>
  ${S.myFinal?`<div class=status>你已提交最终决定，等待对方……</div>`:""}`;
 } else {
  h+=`<div class=status><b>本章结束</b><div class=story style="margin-top:8px">${S.result}</div></div>`;
  if(!S.finished)h+=`<button class="btn primary" style="width:100%;margin-top:14px" onclick="socket.emit('next')">进入下一章</button>`;
  else h+=`<div class=private><b>连接已结束。</b><br>现在回想一下：从哪一章开始，你不再完全相信屏幕？</div>`;
 }
 app.innerHTML=h;
}
window.choose=(i,el)=>{document.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));el.classList.add("sel");document.getElementById("st").innerHTML=`<button class="btn primary" style="width:100%;margin-top:12px" onclick="submit(${i})">确认第一次决定</button>`}
window.submit=i=>socket.emit("choose",i);
window.finalize=changed=>{if(S.myFinal!==undefined&&S.myFinal!==null)return; let choice=changed?(S.myChoice===0?1:0):S.myChoice;socket.emit("final",{choice,changed})}
if(room&&player)socket.emit("join",{room,player});else joinScreen();
</script></body></html>

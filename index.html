<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MIDOKU 地图测试</title><style>
*{box-sizing:border-box}body{margin:0;background:#0d1110;color:#eee;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans SC",sans-serif}.wrap{max-width:760px;margin:auto;padding:25px 16px 70px}.logo{font:800 22px serif;letter-spacing:.2em}.sub,.tag{font-size:12px;color:#929997;letter-spacing:.11em}.card{margin-top:18px;background:#141817;border:1px solid #38403d;padding:23px}.title{font:700 28px serif;margin:9px 0 15px}.story{line-height:1.75;white-space:pre-line}.map{position:relative;height:340px;margin:20px 0;background:linear-gradient(#263d35,#17251f);border:1px solid #55635c;overflow:hidden}.mount{position:absolute;left:42%;top:22px;font-size:44px}.you{position:absolute;left:45%;bottom:25px;font-size:30px}.path{position:absolute;border:2px dashed #aeb8aa88;height:155px;width:2px;bottom:60px;transform-origin:bottom}.p1{left:46%;transform:rotate(-38deg)}.p2{left:50%;transform:rotate(0)}.p3{left:54%;transform:rotate(38deg)}.place{position:absolute;font-size:32px;text-align:center}.forest{left:9%;top:105px}.river{left:43%;top:80px}.shrine{right:8%;top:105px}.label{display:block;font-size:12px;margin-top:3px}.info{padding:14px;margin:10px 0;border-left:3px solid #9e835e;background:#1d1b16}.friend{padding:14px;margin:9px 0;border:1px solid #48514d}.btn{width:100%;padding:15px;margin:9px 0;background:#1b201e;color:#eee;border:1px solid #515b56;text-align:left;cursor:pointer}.primary{text-align:center;background:#deddd4;color:#171918;font-weight:800}.line{height:1px;background:#38403d;margin:21px 0}.gone{opacity:.18;filter:grayscale(1)}.small{font-size:12px;color:#9ca29f}.shock{font-size:20px;line-height:1.7}.good{color:#b7d2ac}.bad{color:#d79a90}@media(max-width:520px){.card{padding:18px}.map{height:300px}.title{font-size:24px}}</style></head><body><main class="wrap"><div class="logo">未读 MIDOKU</div><div class="sub">CORE TEST 04 · 三个人看到不同的东西</div><section id="app" class="card"></section></main><script>
const app=document.querySelector("#app");let role=0,r=1,last=null;
const roles=[
{name:"地图",icon:"🗺️",one:"你知道路通向哪里。",detail:"你能看到森林、河流和神社的位置，但看不到哪里危险。"},
{name:"危险",icon:"⚠️",one:"你知道哪里有危险。",detail:"你知道哪些地点安全，但看不到这些地点分别在哪条路上。"},
{name:"后果",icon:"🔮",one:"你知道选择之后会发生什么。",detail:"你能看到三个选择的未来结果，但不知道它们对应森林、河流还是神社。"}
];
function mapHtml(gone){return '<div class="map"><div class="mount">⛰️<span class="label">山顶</span></div><div class="path p1"></div><div class="path p2"></div><div class="path p3"></div><div class="place forest '+(gone==="forest"?"gone":"")+'">🌲<span class="label">森林</span></div><div class="place river '+(gone==="river"?"gone":"")+'">🌊<span class="label">河流</span></div><div class="place shrine '+(gone==="shrine"?"gone":"")+'">⛩️<span class="label">神社</span></div><div class="you">🧍<span class="label">你们</span></div></div>'}
function home(){app.innerHTML='<div class="tag">目标</div><div class="title">天黑前，一起到山顶</div>'+mapHtml()+'<div class="story">三个人看到的东西不同。\n<b>任何一个人都没有完整答案。</b>\n\n先选你想体验的视角：</div>'+roles.map((x,i)=>'<button class="btn" onclick="choose('+i+')"><b>'+x.icon+' '+x.name+'玩家</b>　'+x.one+'</button>').join("")}
window.choose=i=>{role=i;r=1;last=null;intro()}
function intro(){let x=roles[role];app.innerHTML='<div class="tag">你负责的只有这一件事</div><div class="title">'+x.icon+' '+x.name+'</div><div class="info"><b>'+x.one+'</b><br><span class="small">'+x.detail+'</span></div><div class="story">另外两个人会告诉你他们看到的内容。\n你们一起决定走哪条路。</div><button class="btn primary" onclick="play()">懂了，出发</button>'}
function play(){if(r===1)round1();else if(r===2)round2();else round3()}
function commonFriends(){
if(role===0)return '<div class="friend"><b>⚠️ 危险玩家：</b>“河流安全，森林今天会起火。”</div><div class="friend"><b>🔮 后果玩家：</b>“选②会得到一个同行者。”</div>';
if(role===1)return '<div class="friend"><b>🗺️ 地图玩家：</b>“左边森林，中间河流，右边神社。”</div><div class="friend"><b>🔮 后果玩家：</b>“选②会得到一个同行者。”</div>';
return '<div class="friend"><b>🗺️ 地图玩家：</b>“左边森林，中间河流，右边神社。”</div><div class="friend"><b>⚠️ 危险玩家：</b>“河流安全，森林今天会起火。”</div>'}
function round1(){let own=role===0?"左边→森林　中间→河流　右边→神社":role===1?"森林：🔥危险　河流：✓安全　神社：？未知":"①：失去一条路　②：得到同行者　③：天气改变";app.innerHTML='<div class="tag">ROUND 01</div><div class="title">走哪条路？</div>'+mapHtml()+'<div class="info"><b>你看到：</b><br>'+own+'</div>'+commonFriends()+'<div class="story"><b>现在信息拼起来了。你投哪一条？</b></div><button class="btn" onclick="pick(0)">① 左边</button><button class="btn" onclick="pick(1)">② 中间</button><button class="btn" onclick="pick(2)">③ 右边</button>'}
window.pick=i=>{last=i;let names=["森林","河流","神社"];let text=i===1?"你们选择了河流。河水平静，三个人安全通过。":"你们选择了"+names[i]+"。这条路没有立刻结束旅程，但付出了代价。";app.innerHTML='<div class="tag">RESULT</div><div class="title">'+names[i]+'</div><div class="story">'+text+'</div><div class="small">你们没有选择的道路，也被这个世界记住了。</div><button class="btn primary" onclick="go2()">继续</button>'}
window.go2=()=>{r=2;round2()}
function round2(){let gone=last===1?"forest":"river";let extra=role===0?'<div class="info"><b>你最先发现：</b>昨天明明存在的'+(gone==="forest"?"森林":"河流")+'，今天从你的地图上消失了。</div>':'<div class="friend"><b>🗺️ 地图玩家：</b>“等一下……昨天那条路不见了。”</div>';app.innerHTML='<div class="tag">ROUND 02</div><div class="title">地图少了一块</div>'+mapHtml(gone)+extra+'<div class="story">没有人删除地图。\n\n🔮 后果玩家重新查看昨天的信息，发现原本被遮住的一行：</div><div class="info"><b>“选择②后，一条没有被选择的道路，将从另一名玩家的世界消失。”</b></div><div class="shock">你们第一次发现：<br><b>一个人的选择，会改变另一个人接下来所处的世界。</b></div><button class="btn primary" onclick="go3()">看看能不能利用它</button>'}
window.go3=()=>{r=3;round3()}
function round3(){app.innerHTML='<div class="tag">ROUND 03</div><div class="title">这一次，你们知道规则了</div>'+mapHtml("forest")+'<div class="story">前方道路被巨石堵住。\n\n你们知道：<b>这一次选择某条路，会让另一名玩家世界里的另一条路发生变化。</b>\n\n现在已经不是“哪条路最安全”的问题。\n你们可以故意利用这个规则，为别人创造一条路。</div><div class="line"></div><button class="btn" onclick="finish(0)">让地图玩家决定：改变危险玩家的道路</button><button class="btn" onclick="finish(1)">让危险玩家决定：改变后果玩家的道路</button><button class="btn" onclick="finish(2)">让后果玩家决定：改变地图玩家的道路</button>'}
window.finish=i=>{app.innerHTML='<div class="tag">TEST END</div><div class="title">这才是我们要测的东西</div><div class="story">第一轮：<b>我需要别人，因为我看不全。</b>\n\n第二轮：<b>我发现自己的选择改变了别人。</b>\n\n第三轮：<b>我开始主动利用这种影响。</b>\n\n没有31号，没有秘密身份，没有神话解释。\n如果这三步本身能玩懂，我们再往上加真正的竞争、欺骗和剧情。</div><button class="btn primary" onclick="home()">换一个视角再玩</button>'}
home();</script></body></html>

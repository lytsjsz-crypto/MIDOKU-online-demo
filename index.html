<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>URI DAY1</title><style>
*{box-sizing:border-box}body{margin:0;background:#ececea;color:#171717;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans SC",sans-serif}.app{max-width:620px;margin:auto;min-height:100vh;background:#fff}.top{padding:18px 20px;border-bottom:1px solid #ddd}.logo{font-size:28px;font-weight:950;letter-spacing:.18em}.cash{float:right;font-weight:900}.sub{font-size:11px;color:#777;margin-top:4px}.main{padding:18px 18px 100px}.card{border:1px solid #ddd;border-radius:14px;padding:16px;margin:11px 0}.black{background:#171717;color:#fff}.tag{display:inline-block;font-size:10px;padding:4px 7px;border-radius:5px;background:#eee;margin-bottom:8px}.black .tag{background:#333}.name{font-weight:850;font-size:18px}.price{font-size:21px;font-weight:900;margin-top:7px}.meta{font-size:12px;color:#777;line-height:1.6;margin-top:5px}.black .meta{color:#bbb}.btn{border:0;border-radius:9px;padding:12px 14px;background:#171717;color:#fff;font-weight:800;cursor:pointer}.ghost{background:#eee;color:#222}.wide{width:100%;margin-top:12px}.tabs{display:flex;gap:7px;margin-bottom:14px}.tabs button{flex:1}.active{outline:2px solid #171717}.nav{position:fixed;bottom:0;width:min(620px,100%);display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid #ddd}.nav button{border:0;background:#fff;padding:15px 4px}.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:20px;z-index:10}.box{width:min(500px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:16px;padding:22px}.row{display:flex;gap:8px;margin-top:14px}.row>*{flex:1}.timeline{border-left:2px solid #222;padding-left:15px;margin:14px 0}.event{margin:14px 0;line-height:1.65}.score{font-size:30px;font-weight:950}.pill{padding:5px 8px;border-radius:20px;background:#eee;font-size:11px;display:inline-block;margin:3px}.warn{border-color:#222;background:#faf9f5}.disabled{opacity:.35}.secret{letter-spacing:.12em}.tiny{font-size:11px;color:#777}
</style></head><body><div class="app"><header class="top"><span class="logo">URI</span><span class="cash" id="cash">¥0</span><div class="sub" id="status"></div></header><main class="main" id="main"></main><nav class="nav"><button onclick="go('forecast')">明日</button><button onclick="go('market')">市场</button><button onclick="go('bag')">包裹</button><button onclick="go('result')">今日</button></nav></div><script>
const P={
A:{goal:"数学小测至少80分",money:1800,bag:[["和B一起复习的记忆","记忆",1800],["妈妈给的雨伞","物品",700],["自己的紧张","感情",1100],["C对我的信任","关系",2600]]},
B:{goal:"数学成绩超过A",money:1800,bag:[["自己的数学能力","能力",2800],["数学老师对我的期待","关系",1600],["和A的竞争心","感情",1200],["昨天的作业","物品",500]]},
C:{goal:"数学小测拿到班级第一名",money:1800,bag:[["自己的好运","能力",1900],["B对我的信任","关系",2200],["放学后的30分钟","时间",1700],["一次作弊不被发现的机会","机会",2600]]}
};
const goods=[
["明天数学考试的答案",2200,"答案会进入购买者的记忆。","answer"],
["B的数学能力",3000,"购买后，B明天会暂时失去这项能力。","bmath"],
["数学老师",2600,"买下的是‘老师明天出现在学校’这件事。","teacher"],
["考试前的30分钟",1500,"你可以决定这30分钟怎么使用。","time"],
["一次停电",1200,"发生时间未知。","blackout"],
["A的紧张",1000,"购买者会得到它，A则失去它。","anxiety"],
["一次额外加分",2400,"只对购买者自己的成绩有效。","bonus"]
];
let player="A",page="forecast",sold={A:[],B:[],C:[]},bought={A:[],B:[],C:[]},phase="night",revealed=false;
function state(){return P[player]}function y(n){return"¥"+n.toLocaleString()}function go(p){page=p;render()}
function render(){cash.textContent=y(state().money);status.textContent="DAY 1 · 单人测试模式 · 当前操作 "+player+" · "+"已卖 "+sold[player].length+" · 已买 "+bought[player].length;if(page==="forecast")forecast();else if(page==="market")market();else if(page==="bag")bag();else today()}
function switchP(p){player=p;render()}function tabs(){return '<div class="tabs">'+["A","B","C"].map(x=>'<button class="btn '+(player===x?"active":"ghost")+'" onclick="switchP(\''+x+'\')">'+x+' 玩家</button>').join("")+'</div>'}
function forecast(){main.innerHTML=tabs()+'<div class="card black"><span class="tag">明日予報</span><div class="name">明天是数学小测。</div><div class="meta" style="font-size:14px;line-height:1.9">・A原本会考 42 分。<br>・B原本会考 86 分。<br>・C原本会考 61 分。<br>・数学老师会正常到校。<br>・考试结束后，成绩排名会公开。</div></div><div class="card warn"><span class="tag">你的秘密目标</span><div class="name">'+state().goal+'</div><div class="meta">A、B、C的目标不同。你可以依次切换三名玩家，替他们进行秘密交易。</div></div><div class="tiny">测试模式里你能操作三个人；正式多人版每个人只会看到自己的目标、包裹与交易。</div>'+readyButton()}
function readyButton(){let ok=true;return ok?'<button class="btn wide" onclick="playTomorrow()">三人交易完成 → 进入明天</button>':'<div class="card"><div class="meta">完成条件：A、B、C各出售1件、购买1件。<br>当前：'+["A","B","C"].map(x=>x+" "+(sold[x]?"✓卖":"○卖")+" "+(bought[x]?"✓买":"○买")).join("　")+'</div></div>'}
function market(){main.innerHTML=tabs()+'<h2>今晚市场</h2><div class="tiny">交易是秘密的。可以买任意数量，也可以一件都不买；唯一限制是你的余额。</div>'+goods.map((g,i)=>'<div class="card '+'"><span class="tag">MARKET</span><div class="name">'+g[0]+'</div><div class="price">'+y(g[1])+'</div><div class="meta">'+g[2]+'</div><button class="btn wide" '+' onclick="buy('+i+')">秘密购买</button></div>').join("")}
function bag(){main.innerHTML=tabs()+'<h2>'+player+' 的包裹</h2><div class="tiny">卖掉的东西会真实地从你的生活里消失。</div>'+state().bag.map((g,i)=>'<div class="card '+'"><span class="tag">'+g[1]+'</span><div class="name">'+g[0]+'</div><div class="price">'+y(g[2])+'</div><button class="btn wide" '+' onclick="sell('+i+')">秘密出售</button></div>').join("")}
function sell(i){let g=state().bag[i];state().bag.splice(i,1);state().money+=g[2];sold[player].push({name:g[0],price:g[2]});pop("出售完成","你卖掉了「"+g[0]+"」。<br><br><b>"+player+" 从现在开始失去它。</b><br><br>这笔交易暂时不会向另外两名玩家公开。")}
function buy(i){let g=goods[i];if(state().money<g[1])return pop("余额不足","你需要先卖掉一样东西，或者换一个商品。");state().money-=g[1];bought[player].push({name:g[0],price:g[1],effect:g[3]});pop("购买完成","你秘密买下了「"+g[0]+"」。<br><br>它会在明天真实生效。")}
function playTomorrow(){phase="day";page="result";render();setTimeout(()=>pop("08:10｜教室",buildMorning()+'<br><br><button class="btn wide" onclick="closeM();revealNoon()">继续</button>'),100)}
function has(p,e){return bought[p].some(x=>x.effect===e)}function soldName(p,s){return sold[p].some(x=>x.name.includes(s))}
function buildMorning(){let t="三个人陆续到教室。";if(has("A","bmath")||has("C","bmath"))t+="<br><br>B盯着一道昨天还会做的方程，突然发现自己完全不会了。<br><b>B：‘……等等，我怎么不会了？’</b>";if(soldName("B","数学能力"))t+="<br><br>B同样发现自己的数学能力消失了。";if(soldName("A","复习"))t+="<br><br>B提起昨晚一起复习的事，A却完全没有印象。";return t}
function revealNoon(){pop("09:00｜数学小测",buildExam()+'<br><br><button class="btn wide" onclick="closeM();revealAfter()">继续</button>')}
function buildExam(){let a=42,b=86;if(has("A","answer"))a=96;if(has("B","answer"))b=96;if(has("C","answer")){}if(has("A","bmath")){a=Math.max(a,88);b=35}if(has("C","bmath"))b=35;if(soldName("B","数学能力"))b=28;if(has("A","anxiety"))a+=10;if(has("B","anxiety"))a+=10;if(has("A","blackout")||has("B","blackout")||has("C","blackout"))return "考试进行到一半，教室突然停电。老师宣布剩余题目取消。<br><br><b>这是谁买的？没人承认。</b>";return "成绩公布：<br><br><span class='pill'>A "+Math.min(a,100)+"分</span><span class='pill'>B "+Math.min(b,100)+"分</span><span class='pill'>C 61分</span><br><br>有人明显得到了不属于自己的优势。"}
function revealAfter(){pop("16:10｜放学",buildAfter()+'<br><br><button class="btn wide" onclick="closeM();finish()">公开交易</button>')}
function buildAfter(){let t="成绩排名贴在教室后面。三个人第一时间看的不是自己的分数，而是另外两个人。";if(has("C","bonus"))t+="<br><br>C买下的额外加分生效，排名被重新改写。";if(has("A","bmath")||has("C","bmath"))t+="<br><br>B终于意识到：自己的失常可能不是偶然。";return t}
function finish(){revealed=true;render();pop("今日交易公开",["A","B","C"].map(p=>"<b>"+p+"</b><br>SELL｜"+(sold[p].length?sold[p].map(x=>x.name).join(" / "):"なし")+"<br>BUY｜"+(bought[p].length?bought[p].map(x=>x.name).join(" / "):"なし")).join("<hr>")+'<br><br><button class="btn wide" onclick="closeM()">查看结算</button>')}
function today(){if(phase==="night")return main.innerHTML='<h2>今天还没有开始</h2>'+readyButton();let goals=calcGoals(),relation=calcRelation(),cost=calcCost(),avg=Math.round((goals+relation+cost)/3),rank=avg>=85?"S":avg>=70?"A":avg>=55?"B":"C",reward=rank==="S"?3000:rank==="A"?1800:rank==="B"?900:300,exp=rank==="S"?160:rank==="A"?110:rank==="B"?65:30;main.innerHTML='<h2>DAY 1 RESULT</h2><div class="card black"><div class="score">'+rank+' RANK</div><div class="meta">不是“改变越多越好”。系统同时评价收益、关系和你付出的代价。</div></div><div class="card"><div class="name">💴 收益 '+goals+'</div><div class="meta">三个人各自的秘密目标完成程度。</div></div><div class="card"><div class="name">👥 关系 '+relation+'</div><div class="meta">交易有没有破坏三个人原本的关系。</div></div><div class="card"><div class="name">📦 保有 '+cost+'</div><div class="meta">为了明天，你们失去了多少重要的东西。</div></div><div class="card"><span class="tag">三层奖励</span><div class="name">'+y(reward)+' · EXP +'+exp+'</div><div class="meta">📦 新经历资产：<b>「三个人争夺数学排名的那一天」</b><br>这段经历从今天开始属于三个人，下一轮也可以被出售。</div></div>'+(revealed?'<div class="tiny">Demo END｜正式版下一晚会出现新的“明日予報”。</div>':'<div class="tiny">先经历完整的一天，最后会公开三个人的秘密交易。</div>')}
function calcGoals(){let n=0;if(has("A","answer")||has("A","bmath")||has("A","anxiety"))n++;if(has("B","answer")||(!soldName("B","数学能力")&&!has("A","bmath")&&!has("C","bmath")))n++;if(has("C","answer")||has("C","bmath")||has("C","bonus"))n++;return 45+n*18}
function calcRelation(){let v=92;if(has("A","bmath")||has("C","bmath"))v-=28;if(soldName("A","复习"))v-=18;if(has("A","bmath")||has("C","bmath"))v-=12;return Math.max(25,v)}
function calcCost(){let v=95;["A","B","C"].forEach(p=>{if(sold[p].some(x=>x.name.includes("记忆")||x.name.includes("信任")||x.name.includes("约定")||x.name.includes("能力")))v-=18});return Math.max(35,v)}
function pop(t,b){let m=document.createElement("div");m.id="modal";m.className="modal";m.innerHTML='<div class="box"><h2>'+t+'</h2><div class="event">'+b+'</div><div class="row"><button class="btn ghost" onclick="closeM()">关闭</button></div></div>';document.body.appendChild(m)}function closeM(){document.querySelector("#modal")?.remove();render()}
render();setTimeout(()=>pop("DAY 1｜单人测试模式","你将依次操作A、B、C三名同学。<br><br>三个人是朋友，但明天的目标并不相同。今晚每个人都可以<b>自由决定买卖多少，也可以什么都不做</b>。<br><br>第二天才会知道，彼此到底做了什么。"),200);
</script></body></html>
